  return !!(G && G.cfg && G.cfg.extraDie && side != null && G.cfg.extraDie[side]);
}

/* Returns the faces that count, and the one thrown away, so the cut-in and
   the field report can show what the rule actually did. */
function rollDice(n, side, hitFace) {
  /* Test seam. A total panic on a full base happens once in 1296
     attacks, so the cascade cannot be reached by simulation alone. */
  if (HARNESS.forceFaces) {
    const forced = HARNESS.forceFaces.splice(0, n);
    if (forced.length === n) return { kept: forced, gone: null };
  }
  const extra = hasExtraDie(side);
  const rolled = [];
  for (let i = 0, k = extra ? n + 1 : n; i < k; i++) rolled.push(DIE_FACES[rint(6)]);
  if (!extra) return { kept: rolled, gone: null };
  return dropWorstDie(rolled, hitFace);
}

/* Last-man rule: a single Infantry or Archer attacking a target that
   needs two hits rolls one die, and on a hit rolls that die again. A PANIC
   either time panics the attacker. Peasants do not get it -- they are
   peasants. A lone one rolls its single die against armour and cannot score
   the two hits it needs. */
function needsLastManDuel(atk, def) {
  if (atk.figs !== 1 || defOf(atk).dicePerFig !== 1 || defOf(def).htk !== 2) return false;
  return atk.type !== "peasant";
}

function resolveAttack(P, grid, atk, def) {
  const ad = defOf(atk);
  const res = { atkUid: atk.uid, defUid: def.uid, faces: [], hits: 0, removed: 0,
                /* What was standing on the base when the dice were thrown.
                   `removed` is the uncapped floor(hits / htk) and the rules
                   want it that way -- four axes on a King is two hits' worth
                   whether or not there are two figures to take them -- but a
                   report saying "2 lost" off a one-figure base is a lie. */
                defFigs: def.figs,
                /* Faces the extra-die house rule threw away, in the order
                   they were discarded. Empty when the rule is off. */
                dropped: [],
                panicSteps: 0, duel: false, victimRetreat: 0, killed: false,
                /* An ordered record of the cascade, so the presentation can
                   replay it as a chain rather than a single jump. Pure data:
                   it serialises with the rest of G. */
                retreats: [] };

  if (needsLastManDuel(atk, def)) {
    res.duel = true;
    const isHit = f => f === ad.hitFace;
    const t1 = rollDice(1, atk.side, ad.hitFace);
    if (t1.gone !== null) res.dropped.push(t1.gone);
    const f1 = t1.kept[0];
    res.faces.push(f1);

    if (isHit(f1)) {

      if (t2.gone !== null) res.dropped.push(t2.gone);
      const f2 = t2.kept[0];

    const arrows = res.faces.filter(f => f === ARROW).length;
    const panics = res.faces.filter(f => f === PANIC).length;
    res.hits = hitsFrom(ad, axes, arrows, panics);
    res.panicSteps = panicsFrom(ad, panics, n);

       PANIC they rolled, unless it is an enemy King or Mercenary. */
    if (ad.panicsVictim && panics) {
      const dd = defOf(def);
      if (dd.panics) res.victimRetreat = panics;
    }
  }

  /* Short of a total panic, PANICs are ignored. A TOTAL panic takes the
     hits with it -- which is vacuous for most units, since every die must
     read PANIC for it to happen, so there are no hits to lose. Peasants are
     the exception: they panic per die and KEEP their hits. Two axes, an
     arrow and a PANIC is two hits AND a one-square retreat. */
  if (res.panicSteps && !ad.panicPerDie) { res.hits = 0; return res; }

  /* One figure lost per hit; a Knight, King or Heavy Infantry figure
     needs two hits in the same attack. */
  res.removed = Math.floor(res.hits / defOf(def).htk);
  return res;
}

function applyRemoval(P, def, count) {
  if (count <= 0) return false;
  def.figs -= count;
  if (def.figs <= 0) { def.figs = 0; def.alive = false; return true; }
  return false;
}

/* PANIC. Blocked retreats ELIMINATE rather than fizzle, so every case
   resolves and there is no invalid chain to roll back:
     - off the board            -> the retreating unit is eliminated
     - into an enemy            -> the retreating unit is eliminated
     - into your own King       -> the retreating unit is eliminated
     - into a Mercenary         -> the retreating unit is eliminated
     - into your own other unit -> that unit also panics, and the chain
                                   continues. */
function panicRetreat(P, u, steps, depth, trace) {
  if (!u.alive || !defOf(u).panics) return;
  if ((depth || 0) > 64) return;                 /* cycles are impossible, but never trust that */
  const rec = dead => { if (trace) trace.push({ uid: u.uid, c: u.c, r: u.r, dead: !!dead, depth: depth || 0 }); };
  u.face = (u.face + 2) % 4;                     /* about-face */
  for (let i = 0; i < steps; i++) {
    if (!u.alive) return;
    const grid = buildGrid(P);
    const s = stepFrom(u.c, u.r, u.face, 1);
    if (!inBoard(s.c, s.r)) { u.alive = false; u.figs = 0; rec(true); return; }
    const occ = unitAt(P, grid, s.c, s.r);
    if (occ) {
      const blocked = occ.side !== u.side || occ.type === "king" || occ.type === "mercenary";
      if (blocked) { u.alive = false; u.figs = 0; rec(true); return; }
      const fromC = u.c, fromR = u.r;
      panicRetreat(P, occ, 1, (depth || 0) + 1, trace);
      /* The ally about-faces, so it can run straight back into this unit and
         panic it again -- moving it or killing it. Either way its own retreat
         is over: stepping on from a square it has already left put it two
         squares away, through the ally, and walked the dead. */
      if (!u.alive || u.c !== fromC || u.r !== fromR) return;
      if (occ.alive && occ.c === s.c && occ.r === s.r) return;   /* ally could not clear */
    }
    u.c = s.c; u.r = s.r;
    rec(false);
  }
}

/* King vs. Mercenary: a King next to and facing an enemy Mercenary bribes
   it, and it changes sides. No dice are rolled. The bribe replaces the
   King's attack rather than being an extra action. A Mercenary that is
   adjacent to AND faced by its own King cannot be bribed -- the King is
   watching -- and is attacked normally instead. */
function kingWatches(P, grid, merc) {
  const own = kingOf(P, merc.side);
  if (!own) return false;
  const ahead = stepFrom(own.c, own.r, own.face, 1);
  return ahead.c === merc.c && ahead.r === merc.r;
}

function canBribe(P, grid, king, merc) {
  return king.type === "king" && merc.type === "mercenary" &&
         merc.side !== king.side && merc.alive && !kingWatches(P, grid, merc);
}

function applyBribe(P, king, merc) {
  merc.side = king.side;                 /* the pennant changes, nothing else */
  /* It has not attacked for its new side, whatever it did for the old one.
     The flag is only reset for the side about to move, so left alone it
     carried over from the previous owner's turn: a Mercenary that had
     attacked then could not attack now, and one that had not, could. It
     may act at once. */
  merc.attackedThisTurn = false;
  return merc;
}

/* Win by eliminating the King, OR by leaving the rival's King
   standing ALONE on the field -- not by wiping the whole army.

   One attack can do both at once: Peasants kill the enemy King and then
   panic off the board, leaving their own King alone. A dead King is the
   harder fact, so both sides are checked for one before either is checked
   for the other -- checking side by side once gave the game to Gold with
   its King dead. Where both Kings are left alone together, the side whose
   action did it wins. */
function checkVictory(P) {
  for (const side of [0, 1]) {
    if (!kingOf(P, side)) return { winner: 1 - side, reason: "king" };
  }
  const alone = [0, 1].filter(side => livingOf(P, side).length === 1);
  if (alone.length === 2) return { winner: P.turn, reason: "alone" };
  if (alone.length === 1) return { winner: 1 - alone[0], reason: "alone" };
  return null;
}

/* ============================================================
   ACTIONS — legalActions() drives BOTH the UI's highlighting and
   the AI, so there is exactly one definition of what is legal.
   ============================================================ */
function legalActions(P, grid, side) {
  const out = [];
  for (const u of P.units) {
    if (!u.alive || u.side !== side) continue;
    if (actionCost(u, "move") <= P.actionsLeft) {
      for (const m of moveSquares(P, grid, u)) {
        out.push({ kind: "move", uid: u.uid, c: m.c, r: m.r, dist: m.dist });
      }
    }
    if (actionCost(u, "turn") <= P.actionsLeft) {
      for (let f = 0; f < 4; f++) if (f !== u.face) out.push({ kind: "turn", uid: u.uid, face: f });
    }
    /* "An individual unit may not attack more than once per turn." */
    if (!u.attackedThisTurn && actionCost(u, "attack") <= P.actionsLeft) {
      for (const t of attackTargets(P, grid, u)) {
        out.push(canBribe(P, grid, u, t)
          ? { kind: "bribe", uid: u.uid, defUid: t.uid }
          : { kind: "attack", uid: u.uid, defUid: t.uid });
      }
    }
  }
  return out;
}

function applyAction(P, a) {
  const u = byUid(P, a.uid);
  P.actionsLeft -= actionCost(u, a.kind);
  if (a.kind === "move") { u.c = a.c; u.r = a.r; return; }
  if (a.kind === "turn") { u.face = a.face; return; }
  if (a.kind === "bribe") {
    u.attackedThisTurn = true;
    applyBribe(P, u, byUid(P, a.defUid));
    P.dice = null;                       /* no dice are rolled for a bribe */
    return;
  }

  const grid = buildGrid(P);
  const def = byUid(P, a.defUid);
  const res = resolveAttack(P, grid, u, def);
  u.attackedThisTurn = true;
  P.dice = res;
  if (res.removed) res.killed = applyRemoval(P, def, res.removed);
  if (res.panicSteps) panicRetreat(P, u, res.panicSteps, 0, res.retreats);
  if (res.victimRetreat && def.alive) panicRetreat(P, def, res.victimRetreat, 0, res.retreats);
}

function endTurn(P) {
  P.turn = 1 - P.turn;
  if (P.turn === P.first) P.round++;
  P.actionsLeft = 2;
  for (const u of P.units) if (u.side === P.turn) u.attackedThisTurn = false;
}

/* ============================================================
   INVARIANTS — conservation laws, not per-feature unit tests,
   which is why they can run on every single step with no
   fixtures. Each throw carries the phase and round so a failing
   seed is reproducible. Every one of these has been watched
   going red; a check nobody has seen fail is indistinguishable
   from one that cannot fail.
   ============================================================ */
const HARNESS = {
  watermark: {}, expectedUnits: 0, tally: null,
  forceFaces: null,
  resetTally() {
    this.tally = { attacks: 0, hits: 0, figsRemoved: 0, panics: 0,
                   victimRetreats: 0, duels: 0, actions: {} };
  },
};

function assertInvariants() {
  const where = `at ${G.phase}.${G.step} round ${G.round} turn ${G.turn}`;

  if (G.units.length !== HARNESS.expectedUnits) {
    throw new Error(`Unit conservation broken: ${G.units.length} vs ${HARNESS.expectedUnits} ${where}`);
  }

  const seen = new Set();
  const occupied = new Set();
  for (const u of G.units) {
    if (seen.has(u.uid)) throw new Error(`Duplicate uid ${u.uid} ${where}`);
    seen.add(u.uid);

    if (!Number.isInteger(u.face) || u.face < 0 || u.face > 3) {
      throw new Error(`Bad facing ${u.face} on uid ${u.uid} ${where}`);
    }
    if (!Number.isInteger(u.figs) || u.figs < 0) {
      throw new Error(`Bad figure count ${u.figs} on uid ${u.uid} ${where}`);
    }

    /* Figures are removed, never added. */
    const wm = HARNESS.watermark[u.uid];
    if (wm !== undefined && u.figs > wm) {
      throw new Error(`Figures increased on uid ${u.uid}: ${wm} -> ${u.figs} ${where}`);
    }
    HARNESS.watermark[u.uid] = u.figs;

    if (u.alive) {
      if (u.figs < 1 || u.figs > perBaseOf(u.type)) {
        throw new Error(`Living ${u.type} has ${u.figs} figures ${where}`);
      }
      if (!inBoard(u.c, u.r) || !Number.isInteger(u.c) || !Number.isInteger(u.r)) {
        throw new Error(`uid ${u.uid} off-board at ${u.c},${u.r} ${where}`);
      }
      const k = idx(u.c, u.r);
      if (occupied.has(k)) throw new Error(`Two living units on ${u.c},${u.r} ${where}`);
      occupied.add(k);

      /* Nothing may roll more than 4 dice. */
      const n = diceFor(u);
      if (n < 1 || n > MAX_DICE) throw new Error(`${u.type} would roll ${n} dice ${where}`);
    } else if (u.figs !== 0) {
      throw new Error(`Dead uid ${u.uid} still has ${u.figs} figures ${where}`);
    }
  }

  for (const side of [0, 1]) {
    const kings = G.units.filter(u => u.side === side && u.type === "king").length;
    if (kings !== 1) throw new Error(`Side ${side} has ${kings} kings ${where}`);
  }

  /* Dead units must be invisible to both the grid and the action list. */
  const grid = buildGrid(G);
  for (const u of G.units) {
    if (!u.alive && grid[idx(u.c, u.r)] === u.uid) {
      throw new Error(`Dead uid ${u.uid} still occupies the grid ${where}`);
    }
  }
  if (!G.gameOver) {
    for (const a of legalActions(G, grid, G.turn)) {
      if (!byUid(G, a.uid).alive) throw new Error(`Dead uid ${a.uid} has a legal action ${where}`);
    }
  }

  if (!G.gameOver && checkVictory(G)) {
    throw new Error(`Victory reached but the game kept playing ${where}`);
  }

  if (!Number.isInteger(G.actionsLeft) || G.actionsLeft < 0 || G.actionsLeft > 2) {
    throw new Error(`actionsLeft = ${G.actionsLeft} ${where}`);
  }
  if (G.turn !== 0 && G.turn !== 1) throw new Error(`turn = ${G.turn} ${where}`);
}

function assertSerialisable() {
  const round = JSON.parse(JSON.stringify(G));
  if (JSON.stringify(round) !== JSON.stringify(G)) throw new Error("G does not round-trip through JSON");
}

/* ============================================================
   HEADLESS SIM — random legal moves, both sides. This is a
   crash-and-termination harness, NOT a balance harness: the
   numbers are fixed by the rules and are not ours to tune. What
   it can legitimately reveal is a MISREAD rule.
   ============================================================ */
function playRandomGame(seed) {
  newGame(seed);
  G.cfg.roundCap = 60;                    /* sims end sooner than the 200-round backstop */
  HARNESS.watermark = {};
  HARNESS.expectedUnits = G.units.length;
  if (!HARNESS.tally) HARNESS.resetTally();
  let steps = 0;

  while (!G.gameOver) {
    if (++steps > 20000) throw new Error(`Runaway at round ${G.round} seed ${seed}`);

    const v = checkVictory(G);
    if (v) { G.result = v; G.gameOver = true; break; }
    if (G.cfg.roundCap && G.round > G.cfg.roundCap) {
      G.result = { winner: null, reason: "cap" }; G.gameOver = true; break;
    }

    const grid = buildGrid(G);
    const acts = legalActions(G, grid, G.turn);
    if (!acts.length || G.actionsLeft <= 0) { endTurn(G); assertInvariants(); continue; }

    const chosen = pickWeighted(acts);
    HARNESS.tally.actions[chosen.kind] = (HARNESS.tally.actions[chosen.kind] || 0) + 1;
    applyAction(G, chosen);

    if (chosen.kind === "attack") {
      const d = G.dice;
      HARNESS.tally.attacks++;
      HARNESS.tally.hits += d.hits;
      HARNESS.tally.figsRemoved += d.removed;
      if (d.panicSteps) HARNESS.tally.panics++;
      if (d.victimRetreat) HARNESS.tally.victimRetreats++;
      if (d.duel) HARNESS.tally.duels++;
    }

    /* Victory must be recorded BEFORE the invariants run: an action can end
       the game, and "gameOver === (checkVictory() !== null)" is one of them. */
    const won = checkVictory(G);
    if (won) { G.result = won; G.gameOver = true; }

    assertInvariants();
    if (steps % 20 === 0) assertSerialisable();
  }
  assertInvariants();
  return { seed, steps, rounds: G.round, result: G.result,
           survivors: [livingOf(G, 0).length, livingOf(G, 1).length] };
}

/* Uniform-random selection is a terrible driver: every unit always offers
   three Turn options and rarely an Attack, so 85% of actions are spent
   turning in place and the engine is barely exercised. This still picks
   at random -- it is not an AI and makes no positional judgement -- but it
   prefers acting over fidgeting, which is what makes the sim reach combat,
   panic and victory at all. */
function pickWeighted(acts) {
  const attacks = acts.filter(a => a.kind === "attack");
  if (attacks.length && rnd() < 0.75) return pickOne(attacks);
  const moves = acts.filter(a => a.kind === "move");
  if (moves.length && rnd() < 0.80) return pickOne(moves);
  return pickOne(acts);
}

/* Bot-vs-bot. Sides are swapped halfway so a first-move edge cannot be
   mistaken for a skill edge. */
function playBotGame(seed, skillLo, skillHi, swap) {
  newGame(seed);
  G.cfg.roundCap = 60;
  const s0 = swap ? skillHi : skillLo, s1 = swap ? skillLo : skillHi;
  G.players[0].isBot = true; G.players[0].skill = s0;
  G.players[1].isBot = true; G.players[1].skill = s1;
  HARNESS.watermark = {};
  HARNESS.expectedUnits = G.units.length;

  let steps = 0;
  while (!G.gameOver) {
    if (++steps > 20000) throw new Error(`Runaway at round ${G.round} seed ${seed}`);
    const v = checkVictory(G);
    if (v) { G.result = v; G.gameOver = true; break; }
    if (G.round > G.cfg.roundCap) { G.result = { winner: null, reason: "cap" }; G.gameOver = true; break; }
    const grid = buildGrid(G);
    if (G.actionsLeft <= 0 || !legalActions(G, grid, G.turn).length) { endTurn(G); assertInvariants(); continue; }
    const plan = botChooseTurnChecked(G, G.turn, G.players[G.turn].skill);
    if (!plan.length) { endTurn(G); assertInvariants(); continue; }
    for (const a of plan) {
      const g2 = buildGrid(G);
      if (!legalActions(G, g2, G.turn).some(x => sameAction(x, a))) break;
      applyAction(G, a);
      const won = checkVictory(G);
      if (won) { G.result = won; G.gameOver = true; }
      assertInvariants();
      if (G.gameOver) break;
    }
  }
  /* Which SKILL won, independent of which side it played. */
  const winnerSkill = G.result.winner === null ? null : G.players[G.result.winner].skill;
  return { winnerSkill, reason: G.result.reason, rounds: G.round };
}

function runMatch(skillLo, skillHi, games, startSeed) {
  HARNESS.resetTally();
  HARNESS.maxPlanMs = 0;
  const t0 = Date.now();
  const out = { lo: SKILL[skillLo].name, hi: SKILL[skillHi].name,
                loWins: 0, hiWins: 0, draws: 0, crashes: [], rounds: [] };
  for (let i = 0; i < games; i++) {
    const seed = (startSeed || 1) + i;
    try {
      const r = playBotGame(seed, skillLo, skillHi, i % 2 === 1);
      out.rounds.push(r.rounds);
      if (r.winnerSkill === null) out.draws++;
      else if (r.winnerSkill === skillHi) out.hiWins++;
      else out.loWins++;
    } catch (e) { out.crashes.push({ seed, error: e.message }); }
  }
  const played = out.loWins + out.hiWins;
  return {
    matchup: `${out.hi} vs ${out.lo}`, games, crashes: out.crashes,
    hiWins: out.hiWins, loWins: out.loWins, draws: out.draws,
    hiWinRate: played ? +(out.hiWins / played).toFixed(3) : 0,
    avgRounds: out.rounds.length ? +(out.rounds.reduce((a, b) => a + b, 0) / out.rounds.length).toFixed(1) : 0,
    maxPlanMs: +(HARNESS.maxPlanMs || 0).toFixed(1),
    ms: Date.now() - t0,
  };
}

function runSim(n, startSeed) {
  const t0 = Date.now();
  HARNESS.resetTally();
  const out = { games: 0, crashes: [], byReason: {}, winsBySide: { 0: 0, 1: 0 },
                rounds: [], firstStrikeWins: 0, steps: [] };
  for (let i = 0; i < n; i++) {
    const seed = (startSeed || 1) + i;
    try {
      const r = playRandomGame(seed);
      out.games++;
      out.rounds.push(r.rounds);
      out.steps.push(r.steps);
      out.byReason[r.result.reason] = (out.byReason[r.result.reason] || 0) + 1;
      if (r.result.winner !== null) {
        out.winsBySide[r.result.winner]++;
        if (r.result.winner === G.first) out.firstStrikeWins++;
      }
    } catch (e) {
      out.crashes.push({ seed, error: e.message });
    }
  }
  const avg = a => a.length ? +(a.reduce((s, v) => s + v, 0) / a.length).toFixed(1) : 0;
  return {
    games: out.games, crashes: out.crashes, byReason: out.byReason,
    winsBySide: out.winsBySide,
    firstStrikeWinRate: out.games ? +(out.firstStrikeWins / out.games).toFixed(3) : 0,
    avgRounds: avg(out.rounds), minRounds: Math.min(...out.rounds), maxRounds: Math.max(...out.rounds),
    avgSteps: avg(out.steps),
    combat: HARNESS.tally,
    ms: Date.now() - t0,
  };
}


/* ============================================================
   SAVE / LOAD
   G is pure JSON, so the save is the game. Every localStorage
   touch is wrapped: quota and private mode must not break play,
   they may only cost you the resume.
   ============================================================ */
const SAVE_KEY = "pumaheart_save_v1";
const COACH_KEY = "pumaheart_coach_v1";
const MUTED_KEY = "pumaheart_muted_v1";
const SPEED_KEY = "pumaheart_speed_v1";

/* `pending` is an animation queue about to play. Its field-report lines are
   written into the save now, because a reload part-way through would
   otherwise come back without them -- the dice of the attack it was showing,
   gone from the record. */
function saveGame(pending) {
  if (!G || UI.headless) return;
  /* A finished game is not a position to come back to. Left in place, a
     reload brought the battle back to just before the deciding blow. */
  if (G.gameOver) { clearSave(); return; }
  let snap = G;
  if (pending) {
    snap = clone(G);
    for (const e of pending) {
      if (e.type === "log") pushLog(snap, e.text);
      else if (e.type === "logAttack") pushLog(snap, attackEntry(e.res, e.say));
    }
  }
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, G: snap })); }
  catch (e) { /* quota or private mode -- the game still plays, it just won't resume */ }
}
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    return s && s.G && !s.G.gameOver ? s.G : null;
  } catch (e) { return null; }
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
/* Settings' "Forget everything" (games-meta STANDARD.md): every key PumaHeart
   owns, found by its prefix so a key added later is not one this misses, and
   only those -- every game on greykit.com shares one origin, so one storage. */
function forgetEverything() {
  for (const area of ["localStorage", "sessionStorage"]) {
    try {
      const s = window[area];
      for (let i = s.length - 1; i >= 0; i--) {
        const k = s.key(i);
        if (k && k.startsWith("pumaheart")) s.removeItem(k);
      }
    } catch (e) { /* no storage */ }
  }
  location.reload();
}

/* Picks up exactly where the tab left off, mid-deploy or mid-turn. advance()
   sorts out whose move it is: a human WAITs, a bot plays on. */
function resumeGame(saved) {
  if (!saved.units || !saved.players || !saved.phase) throw new Error("save is not a position");
  G = saved;
  closeTitle();
  UI.live = true;
  UI.entering = false; UI.sel = null; UI.undo = []; UI.rects = null; UI.trails = null;
  UI.cur = idx(4, H - 1);
  /* Once, however often the tab is reloaded. */
  if (G.log[G.log.length - 1] !== "Battle resumed.") log("Battle resumed.");
  updateAll();
  advance();
}

/* ============================================================
   PHASE MACHINE
   STEP[phase][step]() mutates G, sets the next phase/step and
   returns WAIT (human input needed), ANIM (presentation queued)
   or NEXT (keep going). Bots never WAIT, so hot-seat, AI and the
   headless sims all fall out of the single isHuman() branch.
   ============================================================ */
const WAIT = "wait", ANIM = "anim", NEXT = "next";
/* Long enough to see one base land before the next sets off. */
const BOT_BEAT_MS = 420;

function go(phase, step) { G.phase = phase; G.step = step; }
function isHuman(side) { return !G.players[side].isBot && !UI.autoHuman; }

function animate(events) {
  if (UI.headless) return NEXT;
  /* Reduced motion skips the MOTION, not the content. Returning here without
     playing the queue left the field report with every move and turn in it
     and not one attack -- the whole combat record, and the casualty sounds
     with it, dropped for exactly the players least able to follow the board.
     The timed events (the call-out, the cut-in, the waits) are what get
     skipped; log and sound land at once. */
  if (UI.reducedMotion) {
    for (const e of events) {
      if (e.type === "log") log(e.text);
      else if (e.type === "logAttack") logAttack(e.res, e.say);
      else if (e.type === "sfx") sfx(e.name, e.n);
    }
    return NEXT;
  }
  /* G is already final here: whatever is about to play out over the board
     has happened. Saving waited for advance() to finish, which never happens
     mid-animation -- so a reload during the AI's turn, or during your own
     dice, came back to before the action, and let you see a roll and then
     choose something else. */
  saveGame(events);
  UI.eventQueue = events.concat([{ type: "callback", fn: advance }]);
  UI.animating = true;
  processEventQueue();
  return ANIM;
}

const STEP = {
  deploy: {
    /* Humans lay their battle plan; bots keep the template formation. */
    place() { return WAIT; },
  },

  play: {
    begin() {
      for (const u of G.units) if (u.side === G.turn) u.attackedThisTurn = false;
      if (!UI.headless) resetTrail(G.turn);
      G.actionsLeft = 2;
      const v = checkVictory(G);
      if (v) { G.result = v; G.gameOver = true; go("gameover", "done"); return NEXT; }
      if (G.cfg.roundCap && G.round > G.cfg.roundCap) {
        G.result = { winner: null, reason: "cap" }; G.gameOver = true;
        go("gameover", "done"); return NEXT;
      }
      go("play", "act"); return NEXT;
    },

    act() {
      const grid = buildGrid(G);
      const acts = legalActions(G, grid, G.turn);
      if (!acts.length || G.actionsLeft <= 0) { go("play", "endTurn"); return NEXT; }
      if (isHuman(G.turn)) return WAIT;              /* the only human WAIT in play */
      if (!G.botPlan || !G.botPlan.length) {
        G.botPlan = botChooseTurnChecked(G, G.turn, G.players[G.turn].skill);
      }
      if (!G.botPlan.length) { go("play", "endTurn"); return NEXT; }
      go("play", "botAct"); return NEXT;
    },

    botAct() {
      const a = G.botPlan.shift();
      const grid = buildGrid(G);
      const still = legalActions(G, grid, G.turn).some(x => sameAction(x, a));
      if (!still) { go("play", "act"); return NEXT; }
      const r = doAction(a);
      /* A beat after each of the machine's moves and turns. Without one its
         whole turn landed in a single render: two bases slid at once, and a
         unit that moved twice simply arrived. Attacks have their own beat. */
      if (r === NEXT && a.kind !== "attack" && G.phase === "play") {
        return animate([{ type: "render" }, { type: "wait", delay: BOT_BEAT_MS }]);
      }
      return r;
    },

    /* Entered by doAction for an attack. The state is already final here:
       this step is presentation and bookkeeping only -- including when the
       attack ended the game, which is why the destination is read off
       G.gameOver rather than assumed. */
    resolve() {
      if (G.gameOver) go("gameover", "done"); else go("play", "act");
      return animate(attackEvents(G.dice));
    },

    endTurn() {
      const v = checkVictory(G);
      if (v) { G.result = v; G.gameOver = true; go("gameover", "done"); return NEXT; }
      if (G.cfg.roundCap && G.round > G.cfg.roundCap) {
        G.result = { winner: null, reason: "cap" }; G.gameOver = true;
        go("gameover", "done"); return NEXT;
      }
      endTurn(G);
      G.botPlan = [];
      /* Whatever ended the turn -- the button, or the last action spent --
         nothing before it can be taken back. Only the button cleared this,
         so a turn that simply ran out left its orders on the stack, and Z
         on the next one rewound the whole of the other side's turn. */
      UI.undo = []; UI.lastTurn = null;
      if (G.cfg.opponent === "hotseat" && isHuman(G.turn)) { go("play", "handoff"); return NEXT; }
      go("play", "begin"); return NEXT;
    },

    handoff() {
      UI.curtain = true;
      go("play", "begin");
      return WAIT;                                   /* the curtain's Ready button calls advance() */
    },
  },

  gameover: {
    done() { UI.curtain = false; return WAIT; },
  },
};

function sameAction(a, b) {
  return a.kind === b.kind && a.uid === b.uid &&
         a.c === b.c && a.r === b.r && a.face === b.face && a.defUid === b.defUid;
}

/* The single mutation entry point used by BOTH the human input layer and
   the bot, so there is one path through which the game can change. */
function doAction(a) {
  /* Logged here rather than in the human input path, so the field report
     records BOTH sides. Attacks are logged by attackEvents() instead, which
     also reports the dice. */
  const actor = byUid(G, a.uid);
  const who = `${G.players[actor.side].name} ${defOf(actor).name}`;
  if (a.kind === "move") { log(`${who} advances to ${squareName(a.c, a.r)}.`); sfx("move"); }
  if (a.kind === "turn") { log(`${who} faces ${FACE_NAMES[a.face]}.`); sfx("turn"); }
  if (a.kind === "bribe") {
    const m = byUid(G, a.defUid);
    log(`${who} bribes the ${G.players[m.side].name} Mercenary \u2014 it changes sides.`);
    sfx("select");
  }

  /* G is final the instant applyAction returns -- the casualty is already
     off it. The presentation has to show the board as it stood when the dice
     were thrown, so it keeps a copy of that board to render from. */
  if (a.kind === "attack" && !UI.headless && !UI.reducedMotion) UI.preAttack = clone(G);

  noteTrail(a, actor);
  applyAction(G, a);
  const v = checkVictory(G);
  if (v) { G.result = v; G.gameOver = true; }
  /* Including the killing blow. Routing straight to gameover skipped the
     cut-in entirely, so the one attack that decides the game was the one
     nobody got to watch. */
  if (a.kind === "attack") { go("play", "resolve"); return NEXT; }
  if (a.kind === "bribe" && !G.gameOver) { updateAll(); }
  if (G.gameOver) { go("gameover", "done"); return NEXT; }
  go("play", "act");
  return NEXT;
}

/* Trampoline. The runaway guard is not paranoia: a step that forgets to
   call go() loops for ever, and a silent hang is far worse than a throw. */
function advance() {
  if (!G) return;
  if (UI.animating || UI.advancing) { UI.needAdvance = true; return; }
  UI.advancing = true;
  let guard = 0;
  try {
    for (;;) {
      if (++guard > 2000) { console.error("Phase machine runaway at", G.phase, G.step); break; }
      const fn = STEP[G.phase] && STEP[G.phase][G.step];
      if (!fn) { console.error("Unknown step", G.phase, G.step); break; }
      const r = fn();
      if (r === WAIT) { if (UI.autoHuman && !G.gameOver) { continue; } break; }
      if (r === ANIM) { UI.advancing = false; return; }
    }
  } finally { UI.advancing = false; }
  commit();
}

function commit() {
  saveGame();
  if (UI.headless) { assertInvariants(); return; }
  updateAll();
  if (UI.needAdvance) { UI.needAdvance = false; advance(); }
}

/* ============================================================
   GLYPHS — one silhouette path per unit type on a 24x24 box.
   Drawn as paths, never as text: no web fonts are loaded and a
   glyph must not depend on one being present.
   ============================================================ */
const UNIT_GLYPH = {
  king: "M3 17l1.6-9 4 4.4L12 4l3.4 8.4 4-4.4L21 17zM4 18.4h16V21H4z",
  /* The chess knight's horse head, the one silhouette everyone already
     reads as "knight": ear, muzzle, an eye knocked out, a plinth under it.
     The old head had no ear or muzzle and read as a boxing glove. */
  knight: "M7.4 21V19.4C7.4 16.6 8.6 15 10.4 13.6L7.6 13.2 5.6 14.2C4.6 14.6 3.6 14.2 3.2 13.4L2.8 12.4C2.6 11.8 2.8 11.2 3.2 10.8L8.2 5.6 9.6 3.8 10.2 1.8 11.6 3.4C14.6 3.6 17.2 5.2 18.4 8.2 19.6 11.2 19.4 15 18.6 19.4V21ZM9.6 7.6a1.1 1.1 0 1 0 0 .01ZM5.4 22h14v1.4h-14z",
  heavy: "M12 2.6l8.4 3v6.2c0 5.4-4.2 8.8-8.4 9.8-4.2-1-8.4-4.4-8.4-9.8V5.6zM12 6v12",
  infantry: "M11 2.4h2l1.6 4.2v9.2h-5.2V6.6zM7.4 15h9.2v2.2H7.4zM11 17.8h2V22h-2z",
  /* A drawn bow on the diagonal, string pulled back and an arrow nocked
     through it. The old arc-and-chevron had no string and no shaft, and
     read as a boomerang; the diagonal is what gives the arrow room to be
     an arrow at 18px. Set low in its box: centred, the arrowhead crowded
     the base's shaved front corner. */
  archer: "M5.2 7.8Q18.6 7 17.8 20.4M5.2 7.8L8.4 17.2 17.8 20.4M3.4 22.2L20.4 5.2M14.2 5.2H20.4V11.4",
  mercenary: "M12 2l2.4 5.2L12 9.6 9.6 7.2zM11 9.6h2V22h-2zM13 10.6h6.4v4.4H13z",
  peasant: "M5.4 2.6v6.2M9.6 2.6v6.2M13.8 2.6v6.2M4 8.8h11.2M9.2 8.8V22",
};
const GLYPH_STROKE = { archer: true, peasant: true, heavy: true };

/* A short arc with a solid head -- a gesture, not an icon. Drawn rather than
   typed because no font is loaded and a glyph like U+21BA cannot be relied on
   to exist. Roughly a quarter turn of arc, which is exactly what the button
   does. */
const ROT_ARC = {
  left:  "M18.5 15.5A8 8 0 0 0 7.5 7.2",
  right: "M5.5 15.5A8 8 0 0 1 16.5 7.2",
};
const ROT_HEAD = {
  left:  "M3.6 6.2l8.2-1.4-4.7 6.9z",
  right: "M20.4 6.2l-8.2-1.4 4.7 6.9z",
};

/* Facing is carried by the outline of the base itself: the two corners at the
   FRONT are shaved off, so a unit points the way a ship's prow does. A small
   chevron was the previous channel and it was too fine to read at a glance
   across ten bases -- the silhouette reads instantly and survives being
   scaled to 32px.

   ONE shape, rotated, rather than four baked paths. Swapping paths made a
   turn snap; rotating a single plate lets it swing. Drawn pointing north in
   a 100x100 box, stretched to the base. */
const BASE_SHAPE = "M36 0H64L100 42V100H0V42Z";

/* Rotation is accumulated per unit rather than derived from the facing, so a
   turn always takes the SHORT way round: west to north is +90, never -270.
   Presentation only -- it lives in UI, never in G. */
function baseAngle(u) {
  if (!UI.angles) UI.angles = {};
  const want = u.face * 90;
  const prev = UI.angles[u.uid];
  if (prev == null) { UI.angles[u.uid] = want; return want; }
  let delta = ((want - (prev % 360)) % 360 + 540) % 360 - 180;
  UI.angles[u.uid] = prev + delta;
  return UI.angles[u.uid];
}

/* ============================================================
   RENDERING
   updateAll() is the ONLY render entry point; sub-renderers
   build strings. Every interpolated value goes through esc().
   ============================================================ */
function squareName(c, r) {
  /* Files a-i, ranks counted from side 0's back row, so side 0's King
     starts on e1 and side 1's on e8. */
  return "abcdefghi"[c] + (H - r);
}

function unitAria(u) {
  const d = defOf(u);
  return `${G.players[u.side].name} ${d.name} at ${squareName(u.c, u.r)}, facing ${FACE_NAMES[u.face]}, `
       + `${u.figs} of ${d.perBase} ${u.figs === 1 ? "figure" : "figures"}`;
}

function renderUnit(u) {
  const d = defOf(u);
  const stroke = GLYPH_STROKE[u.type];
  const maxPer = perBaseOf(u.type);
  const pips = maxPer > 6
    ? `<b class="pipnum">${u.figs}</b>`          /* ten pips are a smear at 32px */
    : Array.from({ length: maxPer }, (_, i) =>
        `<i class="${i < u.figs ? "on" : "off"}"></i>`).join("");
  const sel = UI.sel === u.uid ? " is-sel" : "";
  return `<div class="u s${u.side}${sel}" data-uid="${u.uid}" data-face="${u.face}"
    role="button" tabindex="-1" aria-label="${esc(unitAria(u))}">
    <svg class="base" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"
      style="transform:rotate(${baseAngle(u)}deg)">
      <path d="${BASE_SHAPE}"/>
    </svg>
    <svg viewBox="0 0 24 24" aria-hidden="true" class="${stroke ? "ln" : "fl"}">
      <path d="${UNIT_GLYPH[u.type]}"/>
    </svg>
    <span class="pips" aria-hidden="true">${pips}</span>
    ${UI.sel === u.uid ? rotateHandles(u) : ""}
  </div>`;
}

/* Turning is legal while deploying (free) or on your own turn with an action
   left -- Heavy Infantry costs two, so it may be affordable for one unit and
   not another on the same turn. */
function canTurnNow(u) {
  if (!u || !u.alive) return false;
  if (G.phase === "deploy") return u.side === G.deploySide && !UI.curtain;
  if (G.gameOver || !isHuman(G.turn) || u.side !== G.turn) return false;
  if (UI.animating || UI.curtain || UI.menuOpen || UI.helpOpen || UI.musterOpen) return false;
  return actionCost(u, "turn") <= G.actionsLeft;
}

/* The handles live in a frame carrying the base's own angle, so they stay in
   the two shaved corners whichever way the unit faces instead of sliding onto
   its flat rear edge. Rotation preserves handedness -- an arc curving
   anticlockwise still curves anticlockwise at 180 degrees -- so the mark goes
   on meaning the same turn; only which corner holds it changes. */
function rotateHandles(u) {
  if (!canTurnNow(u)) return "";
  const arms = ["left", "right"].map(dir => `<span class="rot rot-${dir}" data-act="rot${dir === "left" ? "L" : "R"}"
    role="button" tabindex="0" aria-label="Turn ${esc(defOf(u).name)} ${dir}">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="arc" d="${ROT_ARC[dir]}"/><path class="head" d="${ROT_HEAD[dir]}"/>
    </svg></span>`).join("");
  return `<span class="rots${rotLocked() ? " is-locked" : ""}"
    style="transform:rotate(${baseAngle(u)}deg)">${arms}</span>`;
}

/* THE TRAIL is presentation only, so it lives in UI and never in G. Each
   side's record is wiped as its turn begins and filled as it acts; the
   board shows the OTHER side's record until the side to move spends an
   action. Undo puts the actions back, and with them the trail. */
function resetTrail(side) {
  if (!UI.trails) UI.trails = {};
  UI.trailSeq = (UI.trailSeq || 0) + 1;
  UI.trails[side] = { side, units: {}, seq: UI.trailSeq };
}
function noteTrail(a, actor) {
  if (UI.headless) return;
  if (!UI.trails || !UI.trails[actor.side]) resetTrail(actor.side);
  const units = UI.trails[actor.side].units;
  /* The first place the unit was seen this turn is where it started. */
  if (!(actor.uid in units)) units[actor.uid] = { c: actor.c, r: actor.r };
}
function shownTrail() {
  if (!UI.trails || !G || G.phase !== "play" || G.gameOver || G.actionsLeft < 2) return null;
  const t = UI.trails[1 - G.turn];
  return t && Object.keys(t.units).length ? t : null;
}

function renderBoard() {
  const grid = buildGrid(G);
  const sel = UI.sel ? byUid(G, UI.sel) : null;
  /* During a call-out the attacker leads the highlights in the selection's
     place -- its reach, but never its moves: rings saying "it could have
     gone there" are noise at the moment it is swinging. */
  const aimAtk = UI.aim ? byUid(G, UI.aim.atk) : null;
  const aimDef = UI.aim ? byUid(G, UI.aim.def) : null;
  const lead = sel && sel.alive ? sel : (aimAtk && aimAtk.alive ? aimAtk : null);
  const moves = new Set(), targets = new Set(), zone = new Set();
  /* THE SCREEN. Battle plans are laid in secret. Both
     armies are on the board from the first frame of startGame, so laying a
     plan against the AI meant laying it against a line you could see -- and
     could answer. Hot-seat had the curtain; the AI game had nothing.

     Two leaks, not one. The bases were drawn, and selecting a rider drew its
     charge lane, which runs until it is blocked and so maps the enemy front
     rank square by square even with the bases hidden. The lane was wrong as
     UI anyway: while deploying you place a base in your own two ranks, you
     do not ride it anywhere. */
  const screened = G.phase === "deploy";
  /* The other side's last turn, until you act -- see noteTrail(). Keyed by
     square: where each unit started, and where it stands now. */
  const trailFrom = new Map(), trailTo = new Map();
  const trail = shownTrail();
  if (trail) {
    const hue = trail.side === 0 ? "var(--army-green)" : "var(--army-gold)";
    for (const [uid, from] of Object.entries(trail.units)) {
      const u = byUid(G, +uid);
      if (!u || !u.alive) continue;
      if (from && (from.c !== u.c || from.r !== u.r)) trailFrom.set(idx(from.c, from.r), hue);
      trailTo.set(idx(u.c, u.r), hue);
    }
  }
  if (lead && !screened) {
    if (lead === sel) for (const m of moveSquares(G, grid, lead)) moves.add(idx(m.c, m.r));
    for (const t of attackTargets(G, grid, lead)) targets.add(idx(t.c, t.r));
    if (lead.type === "archer" || defOf(lead).allAdjacent) {
      for (const s of attackZone(lead)) zone.add(idx(s.c, s.r));
    }
  }

  let html = "";
  for (let r = 0; r < H; r++) {
    for (let c = 0; c < W; c++) {
      const k = idx(c, r);
      const u = byUid(G, grid[k]);
      const cls = ["sq"];
      if ((c + r) % 2 === 0) cls.push("lt");
      if (r <= 1) cls.push("dz1");
      if (r >= H - 2) cls.push("dz0");
      if (G.phase === "deploy" && inDeployZone(G.deploySide, c, r)) cls.push("dzone");
      if (zone.has(k)) cls.push("zone");
      if (moves.has(k)) cls.push("mv");
      if (targets.has(k)) cls.push("tg");
      if (aimAtk && aimAtk.alive && aimAtk.c === c && aimAtk.r === r) {
        cls.push("aim-atk", "aim-s" + aimAtk.side);
      }
      if (aimDef && aimDef.alive && aimDef.c === c && aimDef.r === r) cls.push("aim-def");
      const tr = trailTo.get(k) || trailFrom.get(k);
      if (trailFrom.has(k)) cls.push("tr-from");
      if (trailTo.has(k)) cls.push("tr-to");
      /* The screen covers the whole of their zone, not the squares that
         happen to be occupied: hatching only the filled ones would let you
         count ten bases and read the shape off the gaps, which is most of
         what a battle plan is. */
      const veiled = screened && inDeployZone(1 - G.deploySide, c, r);
      const hidden = screened && u && u.side !== G.deploySide;
      if (veiled) cls.push("screened");
      const label = veiled ? `${squareName(c, r)}, behind the screen`
                  : u ? esc(unitAria(u)) : `${squareName(c, r)}, empty`;
      /* Distance from the selected unit, so the highlight blooms OUTWARD from
         it rather than appearing all at once. For a rider that draws the lane
         as far as it reaches; for an Archer the block opens out of the bow.
         The player has never read the rules -- this is where the reach of
         a unit gets explained. */
      const d = lead ? Math.max(Math.abs(c - lead.c), Math.abs(r - lead.r)) : 0;
      html += `<div class="${cls.join(" ")}" role="gridcell" data-c="${c}" data-r="${r}"
        style="--d:${d}${tr ? `;--tr:${tr}` : ""}" tabindex="${UI.cur === k ? 0 : -1}" aria-label="${label}">${u && !hidden ? renderUnit(u) : ""}</div>`;
    }
  }
  for (let c = 0; c < W; c++) {
    html += `<span class="coord file" aria-hidden="true" style="left:calc(${c} * var(--sq))">${"abcdefghi"[c]}</span>`;
  }
  for (let r = 0; r < H; r++) {
    html += `<span class="coord rank" aria-hidden="true" style="top:calc(${r} * var(--sq))">${H - r}</span>`;
  }
  const g = document.getElementById("grid");
  g.style.gridTemplateColumns = `repeat(${W}, var(--sq))`;
  g.style.setProperty("--aim-ms",
    Math.round(AIM_MS * (UI.speedFactor == null ? 1 : UI.speedFactor)) + "ms");
  g.innerHTML = html;

  /* Bloom only when the selection actually changed. Re-blooming on every
     render would make the board restless during play. */
  /* Keyed on whatever is leading the highlights, so a call-out blooms its
     reach outward the way a selection does. */
  const leadKey = UI.sel != null ? "s" + UI.sel : (UI.aim ? "a" + UI.aim.atk : null);
  if (leadKey !== UI.lastSel) { UI.bloom = true; UI.lastSel = leadKey; }
  g.classList.toggle("is-blooming", !!UI.bloom && !UI.reducedMotion);
  UI.bloom = false;
  /* The trail fades in once, when it first shows, not on every re-render. */
  const trailKey = trail ? trail.seq : null;
  g.classList.toggle("is-trailing", trailKey !== UI.trailShown && trailKey != null && !UI.reducedMotion);
  UI.trailShown = trailKey;

  /* The armies march on once, when a game begins. */
  if (UI.entering && !UI.reducedMotion) {
    g.classList.add("is-entering");
    [...g.querySelectorAll(".u")].forEach(el => {
      const uu = byUid(G, +el.dataset.uid);
      if (!uu) return;
      /* Stagger from each army's own back row forward, so the two lines
         arrive from opposite edges and the gap between them reads. */
      const rank = uu.side === 0 ? (H - 1 - uu.r) : uu.r;
      el.style.setProperty("--e", rank * 2 + Math.abs(uu.c - 4));
    });
    setTimeout(() => g.classList.remove("is-entering"), 1400);
    UI.entering = false;
  }
}

function setCmdEnabled(id, on) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle("is-off", !on);
  el.setAttribute("aria-disabled", on ? "false" : "true");
  el.setAttribute("tabindex", on ? "0" : "-1");
}

function syncPrefsChrome() {
  const sp = document.getElementById("hud-speed");
  if (sp) sp.textContent = "Speed: " + SPEED_NAME[UI.speed];
  const mu = document.getElementById("hud-mute");
  if (mu) { mu.textContent = UI.muted ? "Sound off" : "Sound on"; mu.setAttribute("aria-pressed", UI.muted ? "false" : "true"); }
  if (UI.titleOpen && UI.titleSwitches) UI.titleSwitches.refresh();
}

function renderHUD() {
  /* The board behind the muster is a placeholder game, and its status line
     said "Gold to act" under a card headed "Muster -- Green". */
  if (UI.musterOpen) {
    const name = G.players ? G.players[UI.musterSide].name : (UI.musterSide === 0 ? "Green" : "Gold");
    document.getElementById("hud-state").innerHTML =
      `<span class="side s${UI.musterSide}">${esc(name)}</span> <span class="rnd">mustering</span>`;
    document.getElementById("hud-turn").textContent = `${name} is mustering`;
    syncPrefsChrome();
    setCmdEnabled("hud-undo", false);
    setCmdEnabled("hud-end", false);
    return;
  }
  if (G.phase === "deploy") {
    const el = document.getElementById("hud-state");
    if (el) el.innerHTML = `<span class="side s${G.deploySide}">${esc(G.players[G.deploySide].name)}</span>
      <span class="rnd">laying the battle plan</span>`;
    const t = document.getElementById("hud-turn");
    if (t) t.textContent = `${G.players[G.deploySide].name} is deploying`;
  }
  syncPrefsChrome();
  /* Undo and End turn stand down when they cannot act -- at game over, while
     the machine is animating, and before the first action of a turn. Undo in
     particular looked live at every moment and swallowed the click. */
  setCmdEnabled("hud-undo", canUndo() && myTurn());
  setCmdEnabled("hud-end", G.phase === "play" && myTurn());
  const armed = !!UI.endArmed && G.phase === "play" && myTurn();
  const end = document.getElementById("hud-end");
  if (end) {
    end.textContent = armed ? "Confirm end" : "End turn";
    end.classList.toggle("is-armed", armed);
    if (armed) end.title = `${G.actionsLeft} unspent ${G.actionsLeft === 1 ? "action" : "actions"} will be lost`;
    else end.removeAttribute("title");
  }
  if (G.phase === "deploy") return;
  const p = G.players[G.turn];
  const pips = `<span class="acts${armed ? " is-armed" : ""}" aria-hidden="true">${
    "●".repeat(G.actionsLeft)}${"○".repeat(Math.max(0, 2 - G.actionsLeft))}</span>`;
  const who = G.gameOver
    ? (G.result.winner === null ? "Stalemate" : `${esc(G.players[G.result.winner].name)} wins`)
    : `${esc(p.name)} to act`;
  document.getElementById("hud-turn").textContent = who;
  document.getElementById("hud-state").innerHTML =
    `<span class="side s${G.turn}">${who}</span> ${G.gameOver ? "" : pips}
     <span class="rnd">Round ${G.round}</span>`;
}

/* Said once per turn, over the board, then gone. */
function announceTurn() {
  const wrap = document.getElementById("board-wrap");
  if (!wrap) return;
  const key = G.phase === "play" && !G.gameOver ? `${G.turn}:${G.round}` : null;
  if (key === UI.lastTurnKey) return;
  UI.lastTurnKey = key;
  const old = document.getElementById("turnbar");
  if (old) old.remove();
  if (!key || UI.reducedMotion) return;
  const el = document.createElement("div");
  el.id = "turnbar";
  el.className = `side s${G.turn}`;
  el.textContent = `${G.players[G.turn].name} to act`;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

function renderStatus() {
  /* The call-out puts the attacker in the panel too: how many dice are about
     to be thrown is the thing the player most wants before they land. */
  const u = UI.sel ? byUid(G, UI.sel) : (UI.aim ? byUid(G, UI.aim.atk) : null);
  const el = document.getElementById("status-body");
  if (!u || !u.alive) { el.innerHTML = `<p class="dim">No unit selected.</p>`; return; }
  const d = defOf(u);
  el.innerHTML = `
    <p class="unit-name side s${u.side}">${esc(d.name)}</p>
    <dl class="stats">
      <dt>Square</dt><dd>${squareName(u.c, u.r)}</dd>
      <dt>Facing</dt><dd>${FACE_NAMES[u.face]}</dd>
      <dt>Figures</dt><dd>${u.figs} of ${perBaseOf(u.type)}</dd>
      <dt>Dice</dt><dd>${diceFor(u)}</dd>
      <dt>Hits to kill each</dt><dd>${d.htk}</dd>
    </dl>
    ${d.note ? `<p class="note">${esc(d.note)}</p>` : ""}`;
}

/* Hot-seat handoff. Without a dismissible curtain the machine parks on a
   WAIT that nothing resumes, and the next action skips the step that checks
   for victory. */
function renderCurtain() {
  const el = document.getElementById("curtain");
  if (!UI.curtain || G.gameOver) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<div class="box curtain-card">
    <span class="box-label">Handover</span>
    <p>Pass the field to <span class="side s${G.turn}">${esc(G.players[G.turn].name)}</span>.</p>
    <button class="btn" data-act="ready" autofocus>Ready</button>
  </div>`;
}

/* "Green Archer advances to e4" reads far faster when the army is coloured.
   Built from the army and unit names rather than hard-coded, so it follows a
   rename, and applied at RENDER time -- a log entry stays plain data and
   keeps round-tripping through JSON. */
function colourNames(escaped) {
  const armies = G.players.map(p => p.name).join("|");
  /* Longest unit name first, so "Heavy Infantry" wins over "Infantry". */
  const units = Object.keys(UNIT_DEFS).map(t => UNIT_DEFS[t].name)
    .sort((a, b) => b.length - a.length).join("|");
  const re = new RegExp("\\b(" + armies + ") (" + units + ")\\b", "g");
  return escaped.replace(re, (m, army, unit) => {
    const side = G.players.findIndex(p => p.name === army);
    return `<span class="side s${side}">${army} ${unit}</span>`;
  });
}

/* An attack is the one entry that is not a sentence. It is a roll, and a
   roll reads far faster as four faces than as the words "arrows, battle-axe,
   battle-axe, PANIC" -- so it is stored as data and drawn as dice.

   Only the attacker carries its army. Naming the defender's side as well was
   redundant twice over: there are two armies, and the attacker's colour
   already says which one is swinging. */
function attackEntryHTML(e) {
  const atk = byUid(G, e.atk), def = byUid(G, e.def);
  if (!atk || !def) return esc(e.say || "");
  /* Scoring faces go green exactly as they do in the cut-in, so the summary
     can be traced back to the dice that produced it. A total panic scores
     nothing, whatever the other faces say. */
  /* Only the face that scored: for a Peasant, the pile it counted. */
  const sf = scoringFaceOf(defOf(atk), e.faces);
  const dice = e.faces.map(f => {
    const scores = f === sf;
    return `<span class="logdie ${DIE_CLASS[f]}${scores ? " scores" : ""}"
      role="img" aria-label="${DIE_NAME[f]}" title="${DIE_NAME[f]}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="${DIE_GLYPH[f]}"/></svg></span>`;
  }).join("")
  + (e.dropped || []).map(f =>
    `<span class="logdie discarded ${DIE_CLASS[f]}" role="img"
      aria-label="${DIE_NAME[f]}, discarded" title="${DIE_NAME[f]}, set aside">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="${DIE_GLYPH[f]}"/></svg></span>`).join("");

  /* Red is the token for harm and nothing else, so it marks the figures that
     came off -- whichever side they came off. A Peasant can lose figures for
     its target AND panic itself on the same roll, which is why this is built
     from parts rather than picked from a list. */
  const bits = [];
  if (e.lost) bits.push(`<span class="sum-bad">\u2212${e.lost}</span>`);
  if (e.killed) bits.push(`<span class="sum-note">destroyed</span>`);
  if (e.panic) bits.push(`<span class="sum-bad">PANIC</span>`);
  if (!bits.length) bits.push(`<span class="sum-note">\u2014</span>`);

  /* A last-man duel throws ONE die twice, so the row shows two faces from a
     base that should roll one. The cut-in explains that as it happens; the
     record carries it on the row itself, for anyone reading back. */
  const duel = e.duel ? ` title="A single figure against armour: one die, thrown twice."` : "";

  return `<p class="log-who"><span class="side s${atk.side}">${esc(G.players[atk.side].name)} ${esc(defOf(atk).name)}</span>`
       + ` <span class="dim">attacks</span> ${esc(defOf(def).name)}</p>`
       + `<p class="log-roll"${duel}>${dice}<span class="log-sum" role="img"`
       + ` aria-label="${esc(summaryAria(e))}">${bits.join(" ")}</span></p>`;
}

function summaryAria(e) {
  const out = [];
  if (e.duel) out.push("single figure, two hits needed");
  if (e.lost) out.push(`${e.lost} ${e.lost === 1 ? "figure" : "figures"} lost`);
  if (e.killed) out.push("base destroyed");
  if (e.panic) out.push("PANIC");
  return out.length ? out.join(", ") : "no effect";
}

function renderLog() {
  document.getElementById("log-list").innerHTML =
    G.log.slice(-40).reverse().map(l =>
      typeof l === "string" ? `<li>${colourNames(esc(l))}</li>`
                            : `<li class="log-attack">${attackEntryHTML(l)}</li>`).join("");
}

function pushLog(P, entry) {
  P.log.push(entry);
  if (P.log.length > 200) P.log.shift();
}
function log(msg) {
  pushLog(G, msg);
  announce(msg);
}

/* The structured entry. `say` is the same line in words, for the screen
   reader and for any entry whose units have since left G. */
function attackEntry(res, say) {
  return {
    atk: res.atkUid, def: res.defUid, faces: res.faces.slice(),
    lost: figuresLost(res), killed: !!res.killed,
    panic: !!res.panicSteps, duel: !!res.duel,
    dropped: (res.dropped || []).slice(), say: say,
  };
}
function logAttack(res, say) {
  pushLog(G, attackEntry(res, say));
  announce(say);
}

/* Screen-reader commentary only. Action counts and cursor feedback matter
   to someone who cannot see the pips, but they are noise in the visible
   field report, which is a record of what happened on the field. */
function announce(msg) {
  const a = document.getElementById("announcements");
  if (a) a.textContent = msg;
}

function updateAll() {
  if (UI.headless || !G) return;
  const app = document.getElementById("app");
  if (app) app.classList.toggle("is-deploying", G.phase === "deploy");
  snapshotRects();
  renderBoard();
  playFlip();
  announceTurn();
  renderHUD();
  renderStatus();
  renderDeployBar();
  renderCurtain();
  renderMuster();
  renderMenu();
  renderHelp();
  renderSheet();
  renderTouchbar();
  renderCoach();
  renderOver();
  renderLog();
  restoreFocus();
  placeFrame();
}

/* THE FRAME HOLDS STILL. The stage pads the frame down to where it would sit
   centred WITHOUT a coach line, so a hint arriving, changing length or
   leaving grows or shrinks the frame at its foot and nothing above moves.
   Flex-centring both ways shifted the HUD, the board and the rail by half
   the hint's height every time. Re-run whenever #app changes size. */
const PHONE = window.matchMedia("(max-width: 760px)");
function placeFrame() {
  const stage = document.querySelector(".stage");
  const app = document.getElementById("app");
  if (!stage || !app) return;
  if (PHONE.matches) { stage.style.paddingTop = ""; return; }
  const coach = document.getElementById("coach");
  const hint = coach && !coach.hidden ? coach.offsetHeight + 12 : 0;   /* + its margin-top */
  const rest = app.offsetHeight - hint;
  stage.style.paddingTop = Math.max(24, Math.floor((window.innerHeight - rest) / 2)) + "px";
}

/* On a phone End turn and Undo leave the HUD for a row under the board,
   where a thumb reaches; anywhere wider they go back where they were. The
   nodes move rather than being copied, so their ids, listeners and state
   go with them. Undo first, so End turn lands under the right thumb. */
function placeThumbCmds() {
  const thumb = document.getElementById("thumb");
  const row = document.querySelector("#hud .hud-new");
  const end = document.getElementById("hud-end"), undo = document.getElementById("hud-undo");
  if (!thumb || !row || !end || !undo) return;
  if (PHONE.matches) {
    if (end.parentNode !== thumb) { thumb.append(undo, end); }
  } else if (end.parentNode !== row) {
    row.prepend(end, undo);
  }
}

/* updateAll() replaces #grid.innerHTML wholesale, which destroys the focused
   cell. Without this, keyboard play breaks silently after the first action. */
function restoreFocus() {
  const g = document.getElementById("grid");
  if (!g || UI.cur == null) return;
  const cell = g.querySelector(`[data-c="${UI.cur % W}"][data-r="${Math.floor(UI.cur / W)}"]`);
  if (!cell) return;
  cell.setAttribute("tabindex", "0");
  if (UI.focusInGrid) cell.focus();
}

/* ============================================================
   EVENT QUEUE — presentation only: the state is already final
   by the time these run. Reduced motion skips the queue
   entirely rather than merely disabling CSS transitions.
   ============================================================ */
/* Long enough to find the two squares, short enough that a game against the
   AI does not turn into a slideshow. The pulse is told the same number so it
   gets one full cycle whatever the speed setting. */
const AIM_MS = 520;

/* The gap between the cut-in closing and the board catching up. Without it
   the card and the casualty leave in the same frame, and the player never
   sees the board with the base still on it -- which is the half of "it was
   there, then it was not" that makes the removal read as a consequence
   rather than an edit. */
const SETTLE_MS = 260;

/* Renders the board as it stood when the dice were thrown. G is final by the
   time any of this runs, so the only honest way to hold the pre-attack
   position on screen is to render a copy of it. Restored in a finally: an
   exception mid-render must not leave the game pointing at a snapshot. */
function renderAs(snapshot) {
  if (!snapshot) { updateAll(); return; }
  const live = G;
  G = snapshot;
  try { updateAll(); } finally { G = live; }
}

/* The attack in words. The field report draws dice instead, but a screen
   reader cannot read a glyph, so this is what gets announced -- and it names
   BOTH armies, because without colour there is nothing else to tell them
   apart. */
function attackSentence(res) {
  const atk = byUid(G, res.atkUid), def = byUid(G, res.defUid);
  const parts = [`${G.players[atk.side].name} ${defOf(atk).name} attacks`,
                 `${G.players[def.side].name} ${defOf(def).name}`,
                 `\u2014 ${res.faces.map(f => DIE_NAME[f]).join(", ")}`];
  if (res.panicSteps && (!defOf(atk).panicPerDie || !res.hits)) parts.push("\u2014 PANIC!");
  else if (res.removed) parts.push(`\u2014 ${figuresLost(res)} lost`);
  else parts.push("\u2014 no effect");
  return parts.join(" ");
}

function attackEvents(res) {
  const atk = byUid(G, res.atkUid);
  /* The cut-in runs FIRST, while the board still shows the position as it was
     when the dice were thrown. Only once the outcome has been read does the
     board re-render and take the casualty off. */
  const ev = [];
  /* An attack the player ordered needs no announcement -- they just clicked
     the target. One the AI ordered does: without it the dice arrive over a
     board that gives no clue which of ten bases threw them. */
  if (!isHuman(atk.side)) ev.push({ type: "aim", atk: res.atkUid, def: res.defUid });
  ev.push(
    { type: "sfx", name: "dice", n: res.faces.length + ((res.dropped && res.dropped.length) || 0) },
    { type: "combat", res },
    { type: "wait", delay: SETTLE_MS },
    { type: "render" },
    { type: "logAttack", res: res, say: attackSentence(res) });
  if (res.removed) ev.push({ type: "sfx", name: res.killed ? "kill" : "hit" });
  if (res.retreats && res.retreats.length) {
    ev.push({ type: "sfx", name: "panic" });
    /* A unit shoved off the board, into an enemy or into its own King is
       eliminated. Without this the casualty is invisible: the base simply
       disappears and the log says only that someone panicked. */
    for (const step of res.retreats) {
      if (!step.dead) continue;
      const u = byUid(G, step.uid);
      ev.push({ type: "log",
        text: `${G.players[u.side].name} ${defOf(u).name} is broken and lost at ${squareName(step.c, step.r)}.` });
      ev.push({ type: "sfx", name: "broken" });
    }
  }
  /* One beat per link of the cascade, so a chain reaction reads as a chain. */
  ev.push({ type: "wait", delay: 220 + 70 * ((res.retreats && res.retreats.length) || 0) });
  return ev;
}

function processEventQueue() {
  const q = UI.eventQueue;
  const nextEvent = () => {
    if (!q.length) { UI.animating = false; return; }
    const e = q.shift();
    if (e.type === "log") { log(e.text); nextEvent(); return; }
    if (e.type === "logAttack") { logAttack(e.res, e.say); nextEvent(); return; }
    if (e.type === "sfx") { sfx(e.name, e.n); nextEvent(); return; }
    if (e.type === "combat") { showCombat(e.res, nextEvent); return; }
    /* The one render that is allowed to take the casualty off, and the only
       one in the sequence that draws the live G. */
    if (e.type === "render") {
      UI.aim = null; UI.preAttack = null;
      updateAll(); nextEvent(); return;
    }
    if (e.type === "aim") {
      /* Held through the dice as well, so the board behind the cut-in still
         shows who is fighting whom -- both of them, at full strength.
         Cleared by the render that follows. */
      UI.aim = { atk: e.atk, def: e.def };
      renderAs(UI.preAttack);
      setTimeout(nextEvent, AIM_MS * (UI.speedFactor == null ? 1 : UI.speedFactor));
      return;
    }
    if (e.type === "callback") { UI.animating = false; e.fn(); return; }
    if (e.type === "wait") {
      setTimeout(nextEvent, e.delay * (UI.speedFactor == null ? 1 : UI.speedFactor));
      return;
    }
    nextEvent();
  };
  nextEvent();
}

/* DRAG TO MOVE. Picking a base up and putting it down is what a hand does
   to a piece on a board, and it is what people tried. Click-then-click still
   works exactly as before -- this is the same two decisions with the mouse
   held down in between, and it ends in the same activateSquare().

   Fine pointers only. A drag on a touchscreen is how you scroll the page,
   and turning rotation into a press-and-hold was ruled out for the same
   reason: the hold would fire in the middle of someone trying to drag.

   A drag that ends where it started is just a click, and falls through to
   the click handler. One that ends anywhere else suppresses that click, so
   a base dropped on a square is not also "clicked" onto it twice. */
const DRAG_SLOP = 6;

function squareFromPoint(x, y) {
  const el = document.elementFromPoint(x, y);
  const sq = el && el.closest ? el.closest("#grid .sq") : null;
  return sq ? { c: +sq.dataset.c, r: +sq.dataset.r, el: sq } : null;
}

function setupDrag() {
  const grid = document.getElementById("grid");
  if (!grid || !window.matchMedia("(pointer: fine)").matches) return;

  grid.addEventListener("pointerdown", ev => {
    if (ev.button !== 0 || ev.target.closest("[data-act]")) return;   /* the turn arrows keep their click */
    const from = squareFromPoint(ev.clientX, ev.clientY);
    if (!from) return;
    const u = unitAt(G, buildGrid(G), from.c, from.r);
    const mine = G.phase === "deploy" ? (u && u.side === G.deploySide && deployTurn())
                                      : (u && u.side === G.turn && myTurn());
    if (!mine) return;
    UI.drag = { uid: u.uid, from, x: ev.clientX, y: ev.clientY, live: false };
  });

  grid.addEventListener("pointermove", ev => {
    const d = UI.drag;
    if (!d) return;
    if (!d.live) {
      if (Math.abs(ev.clientX - d.x) + Math.abs(ev.clientY - d.y) < DRAG_SLOP) return;
      d.live = true;
      /* Selecting on the way makes the legal squares light up under the
         hand, so the drag is guided rather than guessed. */
      if (UI.sel !== d.uid) { UI.sel = d.uid; updateAll(); }
      grid.classList.add("is-dragging");
    }
    const over = squareFromPoint(ev.clientX, ev.clientY);
    const key = over ? over.c + "," + over.r : null;
    if (key !== d.overKey) {
      d.overKey = key;
      for (const el of grid.querySelectorAll(".sq.drag-over")) el.classList.remove("drag-over");
      if (over) over.el.classList.add("drag-over");
    }
  });

  const finish = ev => {
    const d = UI.drag;
    UI.drag = null;
    if (!d) return;
    grid.classList.remove("is-dragging");
    for (const el of grid.querySelectorAll(".sq.drag-over")) el.classList.remove("drag-over");
    if (!d.live) return;                       /* never moved: let it be a click */
    /* A timestamp, not a flag. A drop that lands on a different element than
       the press sometimes produces no click at all, and a flag left standing
       would then eat the next real one. This expires on its own. */
    UI.draggedAt = Date.now();
    const to = ev ? squareFromPoint(ev.clientX, ev.clientY) : null;
    if (!to || (to.c === d.from.c && to.r === d.from.r)) return;
    UI.cur = idx(to.c, to.r);
    UI.focusInGrid = true;
    activateSquare(to.c, to.r);
  };
  grid.addEventListener("pointerup", finish);
  grid.addEventListener("pointercancel", () => finish(null));
}

/* ============================================================
   HUMAN INPUT
   One click listener and one keydown listener on document, routed by
   data-act, plus contextual activation on the grid. Selection is
   the only mode: clicking a legal destination moves, clicking a
   legal target attacks, so ordinary play never needs a mode
   switch. Everything reachable by mouse is reachable by key.
   ============================================================ */

function clone(o) { return JSON.parse(JSON.stringify(o)); }

function pushUndo() {
  if (!UI.undo) UI.undo = [];
  UI.undo.push(clone(G));
  if (UI.undo.length > 40) UI.undo.shift();
}
function canUndo() { return !!(UI.undo && UI.undo.length && !G.gameOver); }
function doUndo() {
  if (!canUndo()) return;
  G = UI.undo.pop();
  UI.sel = null;
  log("Order withdrawn.");
  updateAll();
}

function selUnit() {
  const u = UI.sel ? byUid(G, UI.sel) : null;
  return u && u.alive ? u : null;
}
function deployTurn() {
  return G.phase === "deploy" && !UI.curtain && !UI.menuOpen && !UI.helpOpen &&
         !UI.musterOpen;
}
function myTurn() {
  return !G.gameOver && isHuman(G.turn) && !UI.animating && !UI.curtain && !UI.musterOpen && !UI.menuOpen && !UI.helpOpen;
}

function selectUnit(uid) {
  const u = byUid(G, uid);
  if (!u || !u.alive) return;
  UI.sel = UI.sel === uid ? null : uid;
  if (UI.sel) sfx("select");
  if (UI.sel) UI.cur = idx(u.c, u.r);
  updateAll();
}

/* An attack reveals information, so it seals everything before it: you may
   take a move back, never a dice roll. */
function tryAction(a) {
  if (!myTurn()) return false;
  disarmEnd();
  const grid = buildGrid(G);
  if (!legalActions(G, grid, G.turn).some(x => sameAction(x, a))) return false;

  if (a.kind === "attack") { UI.undo = []; } else { pushUndo(); }

  doAction(a);
  if (a.kind === "move" || a.kind === "turn") UI.cur = idx(byUid(G, a.uid).c, byUid(G, a.uid).r);
  if (!byUid(G, a.uid).alive) UI.sel = null;
  advance();
  announceActions();
  return true;
}

function announceActions() {
  if (G.gameOver) return;
  const n = G.actionsLeft;
  announce(n === 0 ? "No actions left." : n === 1 ? "One action left." : "Two actions left.");
}

/* Contextual activation: the square under the cursor decides what happens,
   which is what keeps play to two clicks with no mode switching. */
function activateSquare(c, r) {
  if (G.phase === "deploy") { deployActivate(c, r); return; }
  if (!myTurn()) return;
  const grid = buildGrid(G);
  const u = unitAt(G, grid, c, r);
  const sel = selUnit();

  if (sel) {
    const target = u && u.side !== sel.side
      ? legalActions(G, grid, G.turn).find(a => a.kind === "attack" && a.uid === sel.uid && a.defUid === u.uid)
      : null;
    if (target) { tryAction(target); return; }
    const move = legalActions(G, grid, G.turn)
      .find(a => a.kind === "move" && a.uid === sel.uid && a.c === c && a.r === r);
    if (move) { tryAction(move); return; }
  }
  if (u && u.side === G.turn) { selectUnit(u.uid); return; }
  if (sel) { UI.sel = null; updateAll(); }
}

/* During deployment a click either picks a base up or puts it down. There is
   no separate "held" mode: the selected base is the held one. */
function deployActivate(c, r) {
  if (UI.curtain || UI.menuOpen || UI.helpOpen) return;
  const side = G.deploySide;
  const u = unitAt(G, buildGrid(G), c, r);
  const sel = UI.sel ? byUid(G, UI.sel) : null;

  if (sel && sel.side === side && !isAnchored(sel)) {
    if (deployPlace(sel, c, r)) { UI.cur = idx(sel.c, sel.r); updateAll(); return; }
  }
  if (u && u.side === side) {
    UI.sel = UI.sel === u.uid ? null : u.uid;
    if (UI.sel) sfx("select");
    UI.cur = idx(c, r);
    updateAll();
    return;
  }
  UI.sel = null;
  updateAll();
}

/* The handles are the primary way to turn; the keyboard mirrors them. */
/* Because the handles now swing with the base, the corner under the pointer
   holds the OTHER arrow a moment after a turn -- so a second click landing in
   the same place would undo the first. The handles go inert until the swing
   has settled, which is the length of the base's own rotation plus a little.
   Presentation only: the keys are not gated, since nothing moves under a
   finger on the keyboard. */
function rotLockMs() {
  const sf = UI.speedFactor == null ? 1 : UI.speedFactor;
  if (UI.reducedMotion || sf === 0) return 0;
  return Math.round(240 * sf * 1.25) + 90;
}

function rotLocked() { return UI.rotLock != null && Date.now() < UI.rotLock; }

function armRotLock() {
  const ms = rotLockMs();
  if (!ms) return;
  UI.rotLock = Date.now() + ms;
  clearTimeout(UI.rotLockTimer);
  UI.rotLockTimer = setTimeout(() => {
    UI.rotLock = null;
    const el = document.querySelector(".rots.is-locked");
    if (el) el.classList.remove("is-locked");
  }, ms);
}

function turnSelected(dir, viaHandle) {
  const u = selUnit();
  if (!u || !canTurnNow(u)) return;
  if (viaHandle && rotLocked()) return;
  /* Armed BEFORE the render, or the handles that come back would not know
     they are inert. */
  armRotLock();
  faceSelected(((u.face + dir) % 4 + 4) % 4);
}

function faceSelected(face) {
  const sel = selUnit();
  if (!sel || sel.face === face) return;
  if (G.phase === "deploy") {
    if (deployFace(sel, face)) updateAll();
    return;
  }
  /* A turn in any direction, an about-face included, is one action. The
     handles and the touch bar turn a quarter at a time, which
     made an about-face cost two by mouse and put it out of a Heavy
     Infantry's reach altogether. So a second quarter on the same unit,
     before anything else has happened, revises the first turn rather than
     paying for another -- and turning back to where it started withdraws
     the order. */
  const lt = UI.lastTurn;
  if (lt && myTurn() && lt.uid === sel.uid && lt.turn === G.turn && lt.round === G.round &&
      lt.depth === (UI.undo || []).length && lt.left === G.actionsLeft) {
    const was = byUid(UI.undo[UI.undo.length - 1], sel.uid).face;
    G = UI.undo.pop();
    UI.lastTurn = null;
    if (face === was) { updateAll(); return; }
  }
  if (tryAction({ kind: "turn", uid: sel.uid, face })) {
    UI.lastTurn = { uid: sel.uid, turn: G.turn, round: G.round, depth: UI.undo.length, left: G.actionsLeft };
  }
}

/* Attack ahead: fires when exactly one target is legal, otherwise parks the
   cursor on the first so the choice is visible rather than guessed. */
function attackAhead() {
  const sel = selUnit();
  if (!sel) return;
  const grid = buildGrid(G);
  const acts = legalActions(G, grid, G.turn).filter(a => a.kind === "attack" && a.uid === sel.uid);
  if (!acts.length) return;
  if (acts.length === 1) { tryAction(acts[0]); return; }
  const t = byUid(G, acts[0].defUid);
  UI.cur = idx(t.c, t.r);
  updateAll();
}

function cycleUnit(dir) {
  const grid = buildGrid(G);
  const acts = legalActions(G, grid, G.turn);
  const uids = [...new Set(acts.map(a => a.uid))]
    .map(id => byUid(G, id))
    .sort((a, b) => (a.r - b.r) || (a.c - b.c))
    .map(u => u.uid);
  if (!uids.length) return;
  const at = uids.indexOf(UI.sel);
  const next = uids[(at + (dir > 0 ? 1 : uids.length - 1) + uids.length) % uids.length];
  UI.sel = next;
  const u = byUid(G, next);
  UI.cur = idx(u.c, u.r);
  updateAll();
}

function moveCursor(dc, dr) {
  if (UI.cur == null) UI.cur = idx(4, H - 1);
  let c = (UI.cur % W) + dc, r = Math.floor(UI.cur / W) + dr;
  c = Math.max(0, Math.min(W - 1, c));
  r = Math.max(0, Math.min(H - 1, r));
  UI.cur = idx(c, r);
  UI.focusInGrid = true;
  updateAll();
}

/* END TURN ASKS TWICE. The turn ends by itself when the last action is
   spent, so the button only ever does one thing: throw away an action or
   two, for good -- nothing after it can be undone, and it sat right beside
   Undo. The first press arms it and blinks the pips it would discard; a
   second press, a double-click or "." twice, confirms. Anything else, or
   four seconds, stands it down. */
const END_ARM_MS = 4000;
function armEnd() {
  UI.endArmed = true;
  clearTimeout(UI.endArmTimer);
  UI.endArmTimer = setTimeout(disarmEnd, END_ARM_MS);
  const n = G.actionsLeft;
  announce(`${n === 1 ? "One action" : "Two actions"} unspent. End turn again to give ${n === 1 ? "it" : "them"} up.`);
  renderHUD();
}
function disarmEnd() {
  clearTimeout(UI.endArmTimer);
  if (!UI.endArmed) return;
  UI.endArmed = false;
  if (G) renderHUD();
}

function passTurn() {
  if (!myTurn()) return;
  if (G.actionsLeft > 0 && !UI.endArmed) { armEnd(); return; }
  disarmEnd();
  UI.undo = [];
  UI.sel = null;
  log(`${G.players[G.turn].name} stands fast.`);
  go("play", "endTurn");
  advance();
}

const ACTS = {
  turnLeft: () => turnSelected(-1),
  turnRight: () => turnSelected(1),
  undo: doUndo,
  endTurn: passTurn,
  help: () => toggleHelp(),
  ready: () => {
    UI.curtain = false;
    const then = UI.curtainThen;
    UI.curtainThen = null;
    if (then === "muster" || then === "deploy") { updateAll(); return; }
    updateAll();
    advance();
  },
  deployAuto: deployAuto,
  deployReady: deployReady,
  musterBases: el => musterAdjust(el.dataset.type, "bases", +el.dataset.delta),
  musterFigs: el => musterAdjust(el.dataset.type, "figs", +el.dataset.delta),
  musterPreset: () => { UI.muster = basicSpec(); updateAll(); },
  musterConfirm: musterConfirm,
  rotL: () => turnSelected(-1, true),
  rotR: () => turnSelected(1, true),
  speed: cycleSpeed,
  mute: toggleMute,
  menuOpen: openMenu,
  menuClose: closeMenu,
  menuBegin: menuBegin,
  menuPick: el => { UI.menu[el.dataset.group] = el.dataset.value; updateAll(); },
  menuHouse: el => { UI.menu.house[el.dataset.key] = !UI.menu.house[el.dataset.key]; updateAll(); },
  /* renderMenu replaces the card wholesale, so a <details> left to its own
     devices snapped shut on every toggle -- you could set one house rule and
     then had to reopen the section to set the next. The open state lives in
     UI and is re-applied on render; only this closes it. */
  menuAdvanced: el => {
    const d = el.closest("details");
    UI.menuAdvanced = d ? !d.open : !UI.menuAdvanced;   /* pre-default-action */
    updateAll();
  },
  helpClose: () => { UI.helpOpen = false; updateAll(); },
  helpTab: el => { UI.helpTab = el.dataset.tab; UI.helpFocusTab = true; updateAll(); },
  titleOpen: () => { openTitle(); revealTitle(); },
  titleResume: resumeFromTitle,
  titleQuick: () => { if (loadSave()) { UI.sheet = "confirmQuick"; updateAll(); } else quickGame(); },
  titleCustom: openMenu,
  titleSettings: () => { UI.sheet = "settings"; updateAll(); },
  titleAbout: () => { UI.sheet = "about"; updateAll(); },
  quickConfirm: () => { UI.sheet = null; quickGame(); },
  sheetForget: () => { UI.sheet = "confirmForget"; updateAll(); },
  forgetConfirm: () => forgetEverything(),
  sheetClose: () => { UI.sheet = null; updateAll(); },
  sheetSpeed: el => { UI.speed = +el.dataset.n; applySpeed(); try { localStorage.setItem(SPEED_KEY, String(UI.speed)); } catch (e) {} updateAll(); },
  sheetSound: el => { if ((el.dataset.on === "1") === UI.muted) toggleMute(); },
  coachGot: el => coachDismiss(el.dataset.id),
  /* Same opponent, same difficulty, same house rules -- a rematch, not a
     trip back through the setup screen. */
  again: () => { clearSave(); UI.humanSide = humanSideOf(); openMuster(UI.humanSide); },
  /* The same game from the other side of the table: same opponent, same
     difficulty, same house rules, the other army. It used to open the New
     game menu, which has no side to choose. */
  changeSides: () => { clearSave(); UI.humanSide = 1 - humanSideOf(); openMuster(UI.humanSide); },
};

function dispatchAct(name, el) {
  const fn = ACTS[name];
  if (fn) fn(el);
}

const KEYS = {
  ArrowLeft: () => moveCursor(-1, 0), a: () => moveCursor(-1, 0),
  ArrowRight: () => moveCursor(1, 0), d: () => moveCursor(1, 0),
  ArrowUp: () => moveCursor(0, -1), w: () => moveCursor(0, -1),
  ArrowDown: () => moveCursor(0, 1), s: () => moveCursor(0, 1),
  n: () => cycleUnit(1), p: () => cycleUnit(-1),
  1: () => faceSelected(N), 2: () => faceSelected(E), 3: () => faceSelected(S), 4: () => faceSelected(WEST),
  q: () => dispatchAct("turnLeft"), e: () => dispatchAct("turnRight"),
  f: attackAhead, z: doUndo, ".": passTurn, m: toggleMute,
  /* Escape dismisses the topmost overlay, then falls back to clearing the
     selection. It deliberately does NOT clear the handover curtain: that has
     to go through Ready, which calls advance(), or the phase machine is left
     parked on a WAIT nothing resumes. The muster is not escapable either --
     you cannot take the field without an army. */
  Escape: () => {
    if (UI.sheet) { UI.sheet = null; updateAll(); return; }
    if (UI.helpOpen) { UI.helpOpen = false; updateAll(); return; }
    if (UI.menuOpen) { UI.menuOpen = false; updateAll(); return; }
    if (UI.musterOpen || UI.curtain) return;
    UI.sel = null;
    updateAll();
  },
  h: () => toggleHelp(), "?": () => toggleHelp(),
};

function setupInput() {
  const app = document.getElementById("app");

  /* Delegation lives on document, not #app: overlays such as the handover
     curtain are siblings of #app, so an #app-scoped listener cannot see
     their buttons at all -- they look inert by both mouse and keyboard. */
  document.addEventListener("click", ev => {
    /* The click the browser fires at the end of a drag would replay the drop
       as a second decision. */
    if (UI.draggedAt && Date.now() - UI.draggedAt < 300) { UI.draggedAt = 0; return; }
    const act = ev.target.closest("[data-act]");
    if (!act || act.dataset.act !== "endTurn") disarmEnd();
    if (act) { dispatchAct(act.dataset.act, act); return; }
    const cell = ev.target.closest(".sq");
    if (cell) {
