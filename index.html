/* Fortune is a difficulty knob rather than a rule override, so it rides in
   beside the skill rather than in the house-rule list. */
function fortuneToCfg(idx) {
  return { fortune: idx == null ? FORTUNE_EVEN : +idx };
}

/* ============================================================
   MENU — the one place a game is configured. Difficulty lives
   here because the AI had no selector at all until now.
   ============================================================ */
function openMenu() { UI.menuOpen = true; UI.helpOpen = false; updateAll(); }
function closeMenu() { UI.menuOpen = false; updateAll(); }

function menuBegin() {
  const m = UI.menu;
  UI.menuOpen = false;
  UI.pendingOpponent = m.opponent;
  UI.pendingSkill = m.skill;
  UI.pendingFortune = m.fortune;
  UI.houseRules = Object.assign(defaultHouseRules(), m.house);
  UI.musterSpecs = null;
  openMuster(0);
}

function renderMenu() {
  const el = document.getElementById("menu");
  if (!UI.menuOpen) { el.hidden = true; return; }
  el.hidden = false;
  const m = UI.menu;
  const pick = (group, value, label, sub) =>
    `<span class="opt ${m[group] === value ? "on" : ""}" data-act="menuPick" data-group="${group}"
      data-value="${value}" role="button" tabindex="0" aria-pressed="${m[group] === value}">
      ${esc(label)}${sub ? `<span class="dim"> ${esc(sub)}</span>` : ""}</span>`;

  const skills = SKILL.map((sk, i) => pick("skill", String(i), sk.name)).join("");
  /* Whose dice it tilts is the whole question, so the label says so. */
  const fortunes = FORTUNE.map((f, i) =>
    pick("fortune", String(i), f.name, i === FORTUNE_EVEN ? "the printed die" : "")).join("")
    + `<p class="dim fortune-note">Tilts the opponent's dice toward hitting or toward PANIC. Yours stay the printed die.</p>`;
  const house = HOUSE_RULES.map(h => `
    <li>
      <span class="opt ${m.house[h.key] ? "on" : ""}" data-act="menuHouse" data-key="${h.key}"
        role="button" tabindex="0" aria-pressed="${!!m.house[h.key]}">${m.house[h.key] ? "■" : "□"} ${esc(h.name)}</span>
      <span class="prov">${esc(h.source)}</span>
      <p class="dim">${esc(h.note)}</p>
    </li>`).join("");

  el.innerHTML = `<div class="box menu-card">
    <span class="box-label">New Game</span>
    <dl class="menu-rows">
      <dt>Opponent</dt><dd>${pick("opponent", "ai", "Versus AI")}${pick("opponent", "hotseat", "Hot-seat", "two players, one screen")}</dd>
      ${m.opponent === "ai" ? `<dt>Difficulty</dt><dd>${skills}</dd>` : ""}
      ${m.opponent === "ai" ? `<dt>Fortune</dt><dd>${fortunes}</dd>` : ""}
    </dl>
    <details class="disclose"${UI.menuAdvanced ? " open" : ""}>
      <summary data-act="menuAdvanced">House rules
        <span class="dim">&mdash; all off, so this is the printed game</span></summary>
      <p class="prov-head">Off is Larry Harris's game as written. Each switch is an override:
        three of ours, and one the rulebook offers itself.</p>
      <ul class="house">${house}</ul>
    </details>
    <div class="muster-actions">
      <button class="btn" data-act="menuClose">Cancel</button>
      <button class="btn btn-go" data-act="menuBegin">Begin</button>
    </div>
  </div>`;
}

/* ============================================================
   HELP — rendered FROM the rule tables, never transcribed
   beside them, so a change to a printed number reaches the help
   with no edit here. That is the B10 gate.
   ============================================================ */
function renderHelp() {
  const el = document.getElementById("help");
  if (!UI.helpOpen) { el.hidden = true; return; }
  el.hidden = false;

  const order = ["king", "knight", "archer", "infantry", "heavy", "peasant", "mercenary"];
  const rows = order.map(t => {
    const d = UNIT_DEFS[t];
    const per = perBaseOf(t);
    return `<tr>
      <th scope="row">${esc(d.name)}</th>
      <td>${d.perPlayer}</td>
      <td>${per}</td>
      <td>${d.dicePerFig}</td>
      <td>${d.hitFace === null ? "axe or arrow" : d.hitFace === AXE ? "battle-axe" : "arrows"}</td>
      <td>${d.htk}</td>
      <td>${d.panics ? (d.panicPerDie ? "per die" : "yes") : "never"}</td>
      <td class="note">${esc(d.note || "—")}</td>
    </tr>`;
  }).join("");

  const keys = RAIL.map(([k, label]) => `<tr><th scope="row"><kbd>${esc(k)}</kbd></th><td>${esc(label)}</td></tr>`).join("")
    + `<tr><th scope="row"><kbd>arrows</kbd> / <kbd>WASD</kbd></th><td>Move the cursor</td></tr>`
    + `<tr><th scope="row"><kbd>Enter</kbd></th><td>Select, move or attack, by what is under the cursor</td></tr>`
    + `<tr><th scope="row"><kbd>1</kbd>&ndash;<kbd>4</kbd></th><td>Face north, east, south, west</td></tr>`
    + `<tr><th scope="row"><kbd>M</kbd></th><td>Mute</td></tr>`;

  el.innerHTML = `<div class="box help-card">
    <span class="box-label">How to Play</span>
    <p><b>${W} files by ${H} ranks.</b> Two actions a turn, taken from Move, Turn and Attack &mdash;
       the same action twice is allowed, and the two may be split between different units, but
       no unit attacks twice in a turn.</p>
    <p><b>A unit is a base of identical figures, and the figure count is everything.</b> It is the
       unit's strength and its dice pool at once: a four-man Infantry base rolls four dice, and
       worn to two men it rolls two.</p>
    <p><b>Facing matters.</b> Foot moves one square forward; Kings and Knights ride as far as they
       like in a straight line until something blocks them. You must be next to and facing what you
       attack &mdash; though you may strike its side or rear. Archers are the exception: they hit any
       single enemy in the block of nine squares ahead, firing over intervening heads.</p>
    <p><b>Dice.</b> Three battle-axes, two arrows, one PANIC. Most units hit on axes; Archers hit
       on arrows. Knights, Kings and Heavy Infantry take two hits in the <i>same</i> attack to lose
       a figure.</p>
    <p><b>PANIC.</b> If every die comes up PANIC the unit turns about and retreats a square, shoving
       whoever is behind it into panicking too. A retreat blocked by the board edge, an enemy, your
       own King or a Mercenary <i>kills the retreating unit</i>. Watch for chain reactions.</p>
    <p><b>Winning.</b> Kill the enemy King, or leave it standing alone on the field.</p>
    <p><b>Your battle plan.</b> A customised army is placed by you, in secret, before a shot is
       fired: your King holds the royal emblem in the centre of the back row, and every other
       base goes anywhere on that rank or the one in front, facing wherever you like. Pick a base, then a
       square to move it, or another base to swap them. <b>Re-form the line</b> steps through
       the openings the AI draws from &mdash; eight shapes, named as they land &mdash; so you can
       start from one and adjust. Bunch in the middle, or send the riders
       wide to turn a flank &mdash; the rulebook's own words are &ldquo;You&rsquo;re in
       command!&rdquo; Leaving the muster and the line exactly as they stand gives you the
       printed Basic Game, square for square.</p>

    <h3>The warriors</h3>
    <div class="scrollx"><table class="ref">
      <thead><tr><th scope="col">Warrior</th><th scope="col">You own</th><th scope="col">Per base</th>
        <th scope="col">Dice each</th><th scope="col">Hits with</th><th scope="col">Hits to kill each</th>
        <th scope="col">Panics</th><th scope="col">Notes</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>

    <h3>Playing with the mouse</h3>
    <p>Click one of your bases to select it. Its legal moves ring in green and anything it can
       attack rings in red &mdash; click a ring to act. The two curved arrows in a selected base's
       front corners turn it a quarter turn each way, and turning costs an action like the rest.
       Everything below is a shortcut for something you can click.</p>

    <h3>Keys</h3>
    <table class="ref keys">${keys}</table>

    <h3>Where these rules come from</h3>
    <p class="dim">Everything above is transcribed from the official Parker Brothers rulebook for
      <i>Lionheart</i> (1997), product 40742-I, which Hasbro still serves at
      <code>hasbro.com/common/instruct/Lionheart.PDF</code>. The board is nine files by eight ranks;
      the widely repeated “9 by 10” traces to a single hedged line in a 1998 magazine review and is
      wrong. The rules are silent on five points &mdash; what you give up when customising, whether a
      base may be under-filled, how a turn-order tie is broken, whether a rider may move zero
      squares, and whether a lone Peasant gets the two-hit re-roll that a lone Infantryman or
      Archer gets &mdash; and those readings are ours.</p>
    <div class="muster-actions"><button class="btn" data-act="helpClose">Close</button></div>
  </div>`;
}

/* ============================================================
   THE COACH — one line at a time, each shown once.
   ============================================================ */
/* THE COACH. The player has never seen the box, and the board teaches most
   of itself -- but two or three things no amount of highlighting conveys.
   One line at a time, under the board, at the moment it becomes true.

   This replaces an eight-step modal that opened over a dimmed board before
   the first click, describing rules the player could not see because the
   thing describing them was covering them up. Each line shows once, ever. */
const COACH = [
  { id: "actions", text: "Two actions a turn, from Move, Turn and Attack. Spend both on one unit or split them between two.",
    when: () => G.phase === "play" && !G.gameOver && UI.sel == null },
  { id: "figures", text: "The pips under a base are its figures \u2014 its strength and its dice pool at once. Four men roll four dice; worn to two, it rolls two.",
    when: () => G.phase === "play" && !G.gameOver && UI.sel != null },
  { id: "reach", text: "You must face what you attack, though its side and rear count. Archers are the exception: they shoot over their own line.",
    when: () => G.phase === "play" && !G.gameOver && G.round >= 2 },
  { id: "panic", text: "Every die came up PANIC: the unit turns and runs, shoving your own line back. Off the board, into an enemy, or into your own King \u2014 it dies.",
    when: () => !!(G.dice && G.dice.panicSteps) },
];

function coachSeen() {
  if (UI.coach) return UI.coach;
  try { UI.coach = JSON.parse(localStorage.getItem(COACH_KEY) || "{}"); }
  catch (e) { UI.coach = {}; }
  return UI.coach;
}

function coachDismiss(id) {
  const seen = coachSeen();
  seen[id] = 1;
  try { localStorage.setItem(COACH_KEY, JSON.stringify(seen)); } catch (e) {}
  updateAll();
}

/* THE ENDING. Ten minutes of play used to resolve into two words in the HUD
   corner -- "Gold wins" where it had said "Gold to act" -- with every command
   still live and nothing offering another game. The board stays visible
   behind this: the final position is worth looking at. */
function renderOver() {
  const el = document.getElementById("over");
  if (!el) return;
  if (!G.gameOver || UI.menuOpen || UI.helpOpen || UI.musterOpen || UI.animating) {
    el.hidden = true; el.innerHTML = ""; return;
  }
  const w = G.result.winner;
  const REASON = {
    king: w === null ? "" : "the enemy King is down",
    alone: w === null ? "" : "the enemy King stands alone on the field",
    cap: "the round limit ran out",
  };
  /* Figures still standing, which is the game's own measure of a margin. */
  const left = [0, 1].map(sd =>
    G.units.filter(u => u.alive && u.side === sd).reduce((n, u) => n + u.figs, 0));
  const rows = [0, 1].map(sd =>
    `<dt><span class="side s${sd}">${esc(G.players[sd].name)}</span></dt>
     <dd>${left[sd]} ${left[sd] === 1 ? "figure" : "figures"} standing</dd>`).join("");

  el.hidden = false;
  el.innerHTML = `<div class="box over-card" role="alertdialog" aria-labelledby="over-title">
    <span class="box-label">Field Cleared</span>
    <p class="over-who" id="over-title">${w === null
      ? `<span class="dim">Stalemate</span>`
      : `<span class="side s${w}">${esc(G.players[w].name)}</span> <span class="dim">wins</span>`}</p>
    <p class="over-why">${esc(REASON[G.result.reason] || "")}${
      REASON[G.result.reason] ? ` &mdash; round ${G.round}` : `round ${G.round}`}</p>
    <dl class="over-count">${rows}</dl>
    <div class="muster-actions">
      <button class="btn btn-go" data-act="again" autofocus>Play again</button>
      <button class="btn" data-act="menuOpen">Change sides</button>
    </div>
  </div>`;
}

/* TURNING ON TOUCH. Two 44px targets will not fit on a 28px base: on a phone
   the pair overlapped by about two thirds of their width, so tapping the left
   arrow turned right as often as not. On a coarse pointer the handles come
   off the base and become a real pair of controls under the board, with the
   unit they act on named beside them. The mouse keeps the handles, where
   they are precise and where a corner is a 21px target you can actually
   hit. */
function renderTouchbar() {
  const el = document.getElementById("touchbar");
  if (!el) return;
  const u = UI.sel ? byUid(G, UI.sel) : null;
  if (!u || !canTurnNow(u)) { el.hidden = true; el.innerHTML = ""; return; }
  const arm = dir => `<button class="turnbtn" data-act="rot${dir === "left" ? "L" : "R"}"
    aria-label="Turn ${esc(defOf(u).name)} ${dir}">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="arc" d="${ROT_ARC[dir]}"/><path class="head" d="${ROT_HEAD[dir]}"/>
    </svg></button>`;
  el.hidden = false;
  el.innerHTML = `${arm("left")}
    <span class="turn-who"><span class="side s${u.side}">${esc(defOf(u).name)}</span>
      <span class="dim">facing ${esc(FACE_NAMES[u.face])}</span></span>
    ${arm("right")}`;
}

function renderCoach() {
  const el = document.getElementById("coach");
  if (!el) return;
  const seen = coachSeen();
  /* Nothing over an overlay, and nothing while the machine is mid-sentence. */
  const busy = UI.curtain || UI.menuOpen || UI.helpOpen || UI.musterOpen || UI.animating;
  const hit = busy ? null : COACH.find(c => !seen[c.id] && c.when());
  if (!hit) { el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  el.innerHTML = `<p>${esc(hit.text)}</p>
    <button class="coach-x" data-act="coachGot" data-id="${hit.id}"
      aria-label="Got it, hide this hint">Got it</button>`;
}

/* ============================================================
   SCREENSHOT STATES
   #shot=<name> drives the page to a fixed, reproducible board
   so the README images can be regenerated from a seed instead
   of being caught by hand. Motion and sound are off, and the
   the coach is suppressed, or its line lands in every frame.
   ============================================================ */
function botStep(side, skill) {
  const grid = buildGrid(G);
  const acts = legalActions(G, grid, side);
  if (!acts.length || G.actionsLeft <= 0) { endTurn(G); return false; }
  const plan = botChooseTurn(G, side, skill == null ? 2 : skill);
  if (!plan.length) { endTurn(G); return false; }
  for (const a of plan) {
    const g2 = buildGrid(G);
    if (!legalActions(G, g2, G.turn).some(x => sameAction(x, a))) break;
    applyAction(G, a);
    /* The shot harness bypasses doAction, so nothing else would record the
       fighting -- which left #shot=midgame with an empty field report. */
    if (a.kind === "attack" && G.dice) logAttack(G.dice, attackSentence(G.dice));
    const v = checkVictory(G);
    if (v) { G.result = v; G.gameOver = true; return true; }
  }
  return false;
}

function fastForward(actions) {
  for (let i = 0; i < actions && !G.gameOver; i++) botStep(G.turn, 2);
}

const SHOTS = {
  basic() {
    newGame(7, { setup: "basic" });
    log("The armies take the field.");
  },

  muster() {
    newGame(7, { setup: "basic" });
    UI.houseRules = defaultHouseRules();
    UI.musterOpen = true; UI.musterSide = 0; UI.muster = basicSpec();
    UI.muster.infantry = { bases: 2, figs: 4 };
    UI.muster.heavy = { bases: 2, figs: 1 };
    UI.muster.peasant = { bases: 1, figs: 4 };
  },

  midgame() {
    newGame(21, { setup: "custom" });
    /* Stop once the lines have actually met but well before the result is
       settled -- a screenshot of an empty board or a finished one shows
       nothing about the game. */
    const start = G.units.reduce((n, u) => n + u.figs, 0);
    for (let i = 0; i < 120 && !G.gameOver; i++) {
      botStep(G.turn, 2);
      if (start - G.units.reduce((n, u) => n + u.figs, 0) >= 8) break;
    }
    const kn = G.units.find(u => u.alive && u.side === 0 && u.type === "knight")
           || G.units.find(u => u.alive && u.side === 0 && u.type !== "king");
    if (kn) { UI.sel = kn.uid; UI.cur = idx(kn.c, kn.r); }
  },

  /* Laying the battle plan -- the part of the game the player actually
     commands, per "You're in command!" on p.6. */
  deploy() {
    UI.pendingOpponent = "ai"; UI.pendingSkill = 2;
    UI.houseRules = defaultHouseRules();
    startGame(77, { setup: "custom", opponent: "ai" });
    const kn = G.units.filter(u => u.side === 0 && u.type === "knight");
    if (kn[0]) deployPlace(kn[0], 0, H - 1);          /* a rider on each flank */
    if (kn[1]) deployPlace(kn[1], 8, H - 1);
    const hv = G.units.filter(u => u.side === 0 && u.type === "heavy");
    if (hv[0]) deployPlace(hv[0], 4, H - 2);          /* shields in the centre */
    const u = G.units.find(x => x.side === 0 && x.type === "archer");
    if (u) { UI.sel = u.uid; UI.cur = idx(u.c, u.r); }
  },

  /* The rule hardest to describe in words: an Archer shooting over its own
     front rank into the enemy line. */
  archer() {
    newGame(7, { setup: "basic" });
    const ar = G.units.find(u => u.side === 0 && u.type === "archer");
    ar.c = 4; ar.r = H - 1;
    const screen = G.units.find(u => u.side === 0 && u.type === "infantry");
    screen.c = 4; screen.r = H - 2;
    const foe = G.units.find(u => u.side === 1 && u.type === "infantry");
    foe.c = 4; foe.r = H - 4;
    const foe2 = G.units.find(u => u.side === 1 && u.type === "infantry" && u !== foe);
    foe2.c = 3; foe2.r = H - 3;
    UI.sel = ar.uid; UI.cur = idx(ar.c, ar.r);
    log("An Archer looses over its own front rank.");
  },

  /* The beat before the dice, when the AI attacks: who is swinging, what
     their reach is, and which base is about to be hit. */
  aim() {
    newGame(7, { setup: "basic", opponent: "ai" });
    G.players[1].isBot = true;
    const ar = G.units.find(u => u.side === 1 && u.type === "archer");
    ar.c = 4; ar.r = 2; ar.face = S;
    const screen = G.units.find(u => u.side === 1 && u.type === "infantry");
    screen.c = 4; screen.r = 3;
    const foe = G.units.find(u => u.side === 0 && u.type === "infantry");
    foe.c = 4; foe.r = 4;
    const foe2 = G.units.find(u => u.side === 0 && u.type === "infantry" && u !== foe);
    foe2.c = 3; foe2.r = 5;
    G.turn = 1;
    UI.aim = { atk: ar.uid, def: foe.uid };
    log("Gold Archer takes aim.");
  },

  /* The cut-in, held at the instant the last die stops. */
  combat() {
    newGame(7, { setup: "basic" });
    const ar = G.units.find(u => u.side === 0 && u.type === "archer");
    ar.c = 4; ar.r = H - 3;
    const foe = G.units.find(u => u.side === 1 && u.type === "infantry");
    foe.c = 4; foe.r = H - 5;
    HARNESS.forceFaces = [ARROW, AXE, ARROW, ARROW];
    applyAction(G, { kind: "attack", uid: ar.uid, defUid: foe.uid });
    HARNESS.forceFaces = null;
    const el = document.getElementById("combat");
    el.hidden = false;
    el.innerHTML = combatCardHTML(G.dice);
    /* Settled, outcome revealed -- the frame a player actually reads. */
    for (const d of el.querySelectorAll(".bigdie")) d.classList.add("settled");
    const line = el.querySelector(".combat-out");
    if (line) line.classList.remove("pending");
    log("Three arrows find their mark.");
  },

  /* A panic chain, caught mid-cascade. */
  panic() {
    newGame(7, { setup: "basic" });
    const inf = G.units.find(u => u.side === 0 && u.type === "infantry");
    inf.c = 4; inf.r = 4; inf.figs = 2; inf.face = N;
    const foe = G.units.find(u => u.side === 1 && u.type === "infantry");
    foe.c = 4; foe.r = 3; foe.face = S;
    const a1 = G.units.filter(u => u.side === 0 && u.type === "infantry")[1];
    a1.c = 4; a1.r = 5;
    const a2 = G.units.filter(u => u.side === 0 && u.type === "infantry")[2];
    a2.c = 4; a2.r = 6;
    HARNESS.forceFaces = [PANIC, PANIC];
    applyAction(G, { kind: "attack", uid: inf.uid, defUid: foe.uid });
    HARNESS.forceFaces = null;
    log("Every die came up PANIC — the line buckles backwards.");
    for (const step of (G.dice.retreats || [])) {
      if (!step.dead) continue;
      const u = byUid(G, step.uid);
      log(`${G.players[u.side].name} ${defOf(u).name} is broken and lost at ${squareName(step.c, step.r)}.`);
    }
  },

  gameover() {
    newGame(21, { setup: "custom" });
    let guard = 0;
    while (!G.gameOver && guard++ < 4000) botStep(G.turn, 2);
  },
};

function runShot(name) {
  const fn = SHOTS[name];
  if (!fn) return false;
  UI.reducedMotion = true;
  /* Not muted: headless capture has no audio device anyway, and the HUD
     should not advertise "Sound off" in the README images. */
  /* Reset every overlay and selection first. Shots are run back to back when
     regenerating the images, and without this each one inherits the last
     one's open muster or lit archer block. */
  const cb = document.getElementById("combat");
  if (cb) { cb.hidden = true; cb.innerHTML = ""; }
  UI.musterOpen = false; UI.menuOpen = false; UI.helpOpen = false;
  UI.curtain = false; UI.curtainThen = null;
  UI.sel = null; UI.cur = null; UI.rects = null; UI.aim = null; UI.preAttack = null;
  UI.eventQueue = []; UI.animating = false; UI.advancing = false;
  try { localStorage.setItem(COACH_KEY, JSON.stringify({ actions: 1, figures: 1, reach: 1, panic: 1 })); } catch (e) {}
  UI.headless = false;
  fn();
  updateAll();
  document.body.setAttribute("data-shot", name);
  return true;
}

/* ============================================================
   DEPLOYMENT — "Your Secret Battle Plans" (rulebook p.6)
   "Your King must start on the royal emblem in the back row,
   and you may place your other figures on that row and the row
   in front of it. Other than that, use your strategy: Will you
   bunch your units in the middle, or start your Knights along
   the outside to flank your opponent? You're in command!"

   That last line is the designer saying placement IS the game,
   so it cannot be a template. The board starts in the auto
   formation and every base is yours to move, swap and face --
   which also means the position is legal at every moment, with
   no half-placed state for the invariants to trip over.
   ============================================================ */

function deployRows(side) {
  return side === 0 ? [H - 1, H - 2] : [0, 1];
}
function inDeployZone(side, c, r) {
  return inBoard(c, r) && deployRows(side).includes(r);
}
/* p.6: "Your King must start on the royal emblem in the back row." That is
   what ships. Freeing the King to deploy like any other base is a house rule
   -- the author plays it that way, with the board in front of him -- and it
   is his to switch on, not ours to assume. */
function isAnchored(u) { return u.type === "king" && !!(G.cfg && G.cfg.anchorKing); }

function deployingSide() { return G.phase === "deploy" ? G.deploySide : -1; }

/* Move within the zone, or swap with one of your own bases. Both are legal
   at any moment, so there is never an illegal board to guard against. */
function deployPlace(unit, c, r) {
  if (G.phase !== "deploy" || unit.side !== G.deploySide) return false;
  if (isAnchored(unit)) return false;
  if (!inDeployZone(unit.side, c, r)) return false;
  const other = unitAt(G, buildGrid(G), c, r);
  if (other === unit) return false;
  if (other) {
    if (other.side !== unit.side || isAnchored(other)) return false;
    const oc = other.c, or = other.r;
    other.c = unit.c; other.r = unit.r;
    unit.c = oc; unit.r = or;
    log(`${defOf(unit).name} and ${defOf(other).name} change places.`);
  } else {
    unit.c = c; unit.r = r;
    log(`${defOf(unit).name} takes ${squareName(c, r)}.`);
  }
  sfx("move");
  return true;
}

function deployFace(unit, face) {
  if (G.phase !== "deploy" || unit.side !== G.deploySide) return false;
  unit.face = face;
  sfx("turn");
  return true;
}

/* Steps through the same library the AI draws from, so the shapes are
   learnable by using them rather than by being described. Each press is the
   next opening, named in the field report; adjust from there by hand. */
function deployAuto() {
  const side = G.deploySide;
  const mine = G.units.filter(u => u.side === side);
  UI.openingIdx = UI.openingIdx == null ? 0 : (UI.openingIdx + 1) % OPENINGS.length;
  const op = OPENINGS[UI.openingIdx];
  const list = mine.map(u => ({ type: u.type, figs: u.figs }));
  placeArmy(side, list, op).forEach(p => {
    const u = mine.find(x => x.type === p.unit.type && x.figs === p.unit.figs && !x._pl);
    if (u) { u.c = p.c; u.r = p.r; u._pl = true; }
  });
  for (const u of mine) delete u._pl;
  G.openingShown = op.key;
  log(`The line re-forms: ${op.name}.`);
  updateAll();
}

function deployReady() {
  if (G.phase !== "deploy") return;
  const done = G.deploySide;
  G.playersDeployed = (G.playersDeployed || []).concat([done]);

  const other = 1 - done;
  const otherIsHuman = !G.players[other].isBot;
  if (otherIsHuman && !G.playersDeployed.includes(other)) {
    G.deploySide = other;
    UI.sel = null;
    UI.cur = idx(4, deployRows(other)[0]);
    /* Hot-seat: the second battle plan is laid in secret, which is what the
       rulebook's upright game box is for. */
    if (G.cfg.opponent === "hotseat") { UI.curtain = true; UI.curtainThen = "deploy"; }
    log(`${G.players[other].name} lays a battle plan.`);
    updateAll();
    return;
  }
  UI.sel = null;
  go("play", "begin");
  log("The armies take the field.");
  advance();
}

function renderDeployBar() {
  const el = document.getElementById("deploybar");
  if (G.phase !== "deploy") { el.hidden = true; return; }
  el.hidden = false;
  const side = G.deploySide;
  el.innerHTML = `<span class="box-label">Battle Plan</span>
    <p class="dep-who"><span class="side s${side}">${esc(G.players[side].name)}</span>
      &mdash; place your line on the near two ranks.
      ${G.cfg.anchorKing ? "The King holds the royal emblem." : "The King goes where you like."}
      <span class="dim">Their plan is behind the screen until both are laid.</span></p>
    <p class="dim">Pick a base, then a square to move it, or another base to swap them.
      The two curved arrows in a selected base's front corners turn it.</p>
    <div class="muster-actions">
      <button class="btn" data-act="deployAuto">Re-form the line</button>
      <button class="btn btn-go" data-act="deployReady">Take the field</button>
    </div>`;
}

/* ============================================================
   COMBAT CUT-IN
   An attack is the only moment in the game where the player has
   no agency and everything is at stake, so it gets the screen.
   Big dice tumble, settle one at a time, and the outcome is
   held for a beat before the panel clears.

   It is deliberately pointer-events: none and self-dismissing --
   a cut-in, not a dialog. Nothing waits on the player here.

   Ordering matters as much as the animation: this runs BEFORE
   the board re-renders, so a base that is about to die is still
   standing while its dice are in the air. Rendering first, which
   is what the code did until now, removed the casualty before
   showing the roll that killed it.
   ============================================================ */
/* Never more than were there to lose. Old saves predate defFigs, so the
   uncapped count stands in rather than reporting zero. */
function figuresLost(res) {
  if (!res.removed) return 0;
  return res.defFigs == null ? res.removed : Math.min(res.removed, res.defFigs);
}

function combatOutcome(res) {
  const atk = byUid(G, res.atkUid), def = byUid(G, res.defUid);
  const ad = defOf(atk), dd = defOf(def);
  if (res.panicSteps && !ad.panicPerDie) return { text: "PANIC — the unit breaks", tone: "bad" };
  if (res.killed) return { text: `${dd.name} base destroyed`, tone: "kill" };
  const lost = figuresLost(res);
  if (lost) return { text: `${lost} ${lost === 1 ? "figure" : "figures"} lost`, tone: "hit" };
  return { text: "No effect", tone: "none" };
}

/* Shared by the cut-in. Settles each die in turn and calls back when the
   last one stops, so the outcome can be withheld until then. */
function tumbleInto(dice, sf, onAllSettled) {
  const glyphs = [DIE_GLYPH[AXE], DIE_GLYPH[ARROW], DIE_GLYPH[PANIC]];
  const finals = dice.map(d => d.innerHTML);
  dice.forEach((die, i) => {
    die.classList.add("rolling");
    die.setAttribute("aria-busy", "true");
    const spin = setInterval(() => {
      const g = glyphs[Math.floor(Math.random() * 3)];   // flavour only, never rules
      die.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${g}"/></svg>`;
    }, Math.max(46, 68 * sf));
    setTimeout(() => {
      clearInterval(spin);
      die.innerHTML = finals[i];
      die.classList.remove("rolling");
      die.removeAttribute("aria-busy");
      die.classList.add("settled");
      sfx("tick");
      if (i === dice.length - 1) onAllSettled();
    }, (425 + i * 262) * sf);
  });
}

function combatCardHTML(res) {
  const atk = byUid(G, res.atkUid), def = byUid(G, res.defUid);
  const hitFace = defOf(atk).hitFace;
  const out = combatOutcome(res);

  const dice = res.faces.map(f => {
    const scores = (hitFace === null ? (f === AXE || f === ARROW) : f === hitFace) && !res.panicSteps;
    return `<span class="bigdie ${DIE_CLASS[f]}${scores ? " scores" : ""}"
      role="img" aria-label="${DIE_NAME[f]}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="${DIE_GLYPH[f]}"/></svg></span>`;
  }).join("");

  return `<div class="box combat-card" role="status" aria-live="polite">
    <span class="box-label">Attack</span>
    <p class="combat-who">
      <span class="side s${atk.side}">${esc(G.players[atk.side].name)} ${esc(defOf(atk).name)}</span>
      <span class="dim">strikes</span>
      <span class="side s${def.side}">${esc(G.players[def.side].name)} ${esc(defOf(def).name)}</span>
    </p>
    <div class="combat-dice">${dice}</div>
    <p class="combat-out t-${out.tone} pending">${esc(out.text)}</p>
    ${res.duel ? `<p class="dim combat-note">A single figure against armour: one die, thrown twice.</p>` : ""}
  </div>`;
}

function showCombat(res, done) {
  const el = document.getElementById("combat");
  const sf = UI.speedFactor == null ? 1 : UI.speedFactor;
  if (!el || UI.reducedMotion || UI.headless || sf === 0 || !res || !res.faces.length) {
    if (el) { el.hidden = true; el.innerHTML = ""; }
    done();
    return;
  }
  el.hidden = false;
  el.innerHTML = combatCardHTML(res);

  const nodes = [...el.querySelectorAll(".bigdie")];
  tumbleInto(nodes, sf, () => {
    const line = el.querySelector(".combat-out");
    if (line) line.classList.remove("pending");
    setTimeout(() => {
      el.classList.add("is-closing");
      setTimeout(() => {
        el.classList.remove("is-closing");
        el.hidden = true;
        el.innerHTML = "";
        done();
      }, 212 * sf);
    }, 975 * sf);          /* hold the outcome */
  });
}

/* ============================================================
   RULE TESTS — hand-built positions for the rules random play
   cannot reach. A full 4-dice base suffers a total panic once in
   1296 attacks, so the retreat cascade -- the single riskiest
   piece of this engine -- is effectively untested by simulation.
   These force the dice instead.
   ============================================================ */

function testPosition(specs) {
  G = {
    v: 1, seed: 1, rng: 1,
    cfg: { setup: "basic", massiveInfantry: false, partialBases: true,
           noPeasantDuel: true, anchorKing: true, roundCap: 60 },
    phase: "play", step: "test", round: 1, turn: 0, actionsLeft: 2, first: 0,
    /* Players belong here even though no test reads them: without the array
       any render of a test position throws, which makes __PH.ruleTests()
       unsafe to run from the console mid-game. */
    players: [
      { id: 0, army: "green", name: "Green", isBot: false, skill: 1, losses: 0 },
      { id: 1, army: "gold", name: "Gold", isBot: true, skill: 1, losses: 0 },
    ],
    units: [], dice: null, log: [], gameOver: false, result: null, nextUid: 1,
  };
  for (const s of specs) G.units.push(makeUnit(s.side, s.type, s.figs, s.c, s.r, s.face));
  return G.units;
}
function force(faces) { HARNESS.forceFaces = faces.slice(); }
function attackWith(atk, def) {
  const res = resolveAttack(G, buildGrid(G), atk, def);
  if (res.removed) applyRemoval(G, def, res.removed);
  if (res.panicSteps) panicRetreat(G, atk, res.panicSteps, 0);
  if (res.victimRetreat && def.alive) panicRetreat(G, def, res.victimRetreat, 0);
  return res;
}
function at(c, r) { return unitAt(G, buildGrid(G), c, r); }

const RULE_TESTS = [
  ["mounted units stop before a blocker and may halt anywhere short of it", () => {
    const [kn] = testPosition([
      { side: 0, type: "knight", figs: 2, c: 4, r: 7, face: N },
      { side: 0, type: "infantry", figs: 4, c: 4, r: 4, face: N },
    ]);
    const dests = moveSquares(G, buildGrid(G), kn).map(m => m.r);
    return JSON.stringify(dests) === JSON.stringify([6, 5]);
  }],

  ["foot units move exactly one square per action", () => {
    const [inf] = testPosition([{ side: 0, type: "infantry", figs: 4, c: 4, r: 7, face: N }]);
    return moveSquares(G, buildGrid(G), inf).length === 1;
  }],

  ["Heavy Infantry pays 2 actions to move and 2 to turn, but 1 to attack", () => {
    const [hv] = testPosition([{ side: 0, type: "heavy", figs: 2, c: 4, r: 4, face: N }]);
    return actionCost(hv, "move") === 2 && actionCost(hv, "turn") === 2 && actionCost(hv, "attack") === 1;
  }],

  ["Heavy Infantry attacks all eight neighbours, facing ignored", () => {
    const [hv] = testPosition([
      { side: 0, type: "heavy", figs: 2, c: 4, r: 4, face: N },
      { side: 1, type: "infantry", figs: 4, c: 3, r: 3, face: S },   /* diagonal */
      { side: 1, type: "infantry", figs: 4, c: 4, r: 5, face: N },   /* directly behind */
      { side: 1, type: "infantry", figs: 4, c: 5, r: 4, face: N },   /* directly beside */
    ]);
    return attackTargets(G, buildGrid(G), hv).length === 3;
  }],

  ["an Archer's block is 9 squares, 3 wide by 3 deep, starting immediately ahead", () => {
    const [ar] = testPosition([{ side: 0, type: "archer", figs: 4, c: 4, r: 7, face: N }]);
    const z = attackZone(ar);
    const rows = [...new Set(z.map(s => s.r))].sort();
    const cols = [...new Set(z.map(s => s.c))].sort();
    return z.length === 9 &&
      JSON.stringify(rows) === JSON.stringify([4, 5, 6]) &&
      JSON.stringify(cols) === JSON.stringify([3, 4, 5]);
  }],

  ["Archers fire over the heads of intervening units", () => {
    const [ar] = testPosition([
      { side: 0, type: "archer", figs: 4, c: 4, r: 7, face: N },
      { side: 0, type: "infantry", figs: 4, c: 4, r: 6, face: N },   /* own front rank */
      { side: 1, type: "infantry", figs: 4, c: 4, r: 5, face: S },   /* the target beyond it */
    ]);
    const t = attackTargets(G, buildGrid(G), ar);
    return t.length === 1 && t[0].side === 1;
  }],

  ["melee requires the attacker to be facing its target", () => {
    const [inf] = testPosition([
      { side: 0, type: "infantry", figs: 4, c: 4, r: 4, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 5, face: N },   /* behind the attacker */
    ]);
    if (attackTargets(G, buildGrid(G), inf).length !== 0) return false;
    inf.face = S;
    return attackTargets(G, buildGrid(G), inf).length === 1;
  }],

  ["a Knight needs two hits in the same attack per figure removed", () => {
    const out = [];
    for (const [axes, expect] of [[1, 0], [2, 1], [3, 1], [4, 2]]) {
      const [inf, kn] = testPosition([
        { side: 0, type: "infantry", figs: 4, c: 4, r: 5, face: N },
        { side: 1, type: "knight", figs: 2, c: 4, r: 4, face: S },
      ]);
      force(Array(axes).fill(AXE).concat(Array(4 - axes).fill(ARROW)));
      out.push(attackWith(inf, kn).removed === expect);
    }
    return out.every(Boolean);
  }],

  ["Archers hit on arrows, not axes", () => {
    const [ar, inf] = testPosition([
      { side: 0, type: "archer", figs: 4, c: 4, r: 6, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 5, face: S },
    ]);
    force([AXE, AXE, AXE, ARROW]);
    return attackWith(ar, inf).removed === 1;
  }],

  ["Peasants hit with whichever symbol they rolled most of", () => {
    const [pea, inf] = testPosition([
      { side: 0, type: "peasant", figs: 4, c: 4, r: 5, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 4, face: S },
    ]);
    force([ARROW, ARROW, ARROW, AXE]);
    return attackWith(pea, inf).removed === 3;
  }],

  ["a total panic discards every hit rolled", () => {
    const [inf, foe] = testPosition([
      { side: 0, type: "infantry", figs: 2, c: 4, r: 5, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 4, face: S },
    ]);
    force([PANIC, PANIC]);
    const res = attackWith(inf, foe);
    return res.hits === 0 && res.removed === 0 && foe.figs === 4 && res.panicSteps === 1;
  }],

  ["a Peasant keeps its hits AND observes the PANIC (rulebook p.6 example)", () => {
    const [pea, foe] = testPosition([
      { side: 0, type: "peasant", figs: 4, c: 4, r: 5, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 4, face: S },
    ]);
    force([AXE, AXE, ARROW, PANIC]);
    const res = attackWith(pea, foe);
    /* 2 axes beats 1 arrow, so 2 hits land; the single PANIC still retreats
       the Peasant one square, after the figures come off. */
    return res.hits === 2 && res.removed === 2 && foe.figs === 2 &&
           res.panicSteps === 1 && pea.alive && pea.r === 6 && pea.face === S;
  }],

  ["a panicking unit retreating off the board is eliminated", () => {
    const [inf, foe] = testPosition([
      { side: 0, type: "infantry", figs: 2, c: 4, r: 0, face: S },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 1, face: N },
    ]);
    force([PANIC, PANIC]);
    attackWith(inf, foe);
    return !inf.alive && inf.figs === 0;
  }],

  ["a panicking unit retreating into an enemy is eliminated", () => {
    const [inf, foe, block] = testPosition([
      { side: 0, type: "infantry", figs: 2, c: 4, r: 4, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 3, face: S },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 5, face: N },
    ]);
    force([PANIC, PANIC]);
    attackWith(inf, foe);
    return !inf.alive && block.alive && block.r === 5;
  }],

  ["a panicking unit retreating into its own King is eliminated, and the King does not move", () => {
    const [inf, foe, king] = testPosition([
      { side: 0, type: "infantry", figs: 2, c: 4, r: 4, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 3, face: S },
      { side: 0, type: "king", figs: 1, c: 4, r: 5, face: N },
    ]);
    force([PANIC, PANIC]);
    attackWith(inf, foe);
    return !inf.alive && king.alive && king.r === 5 && king.face === N;
  }],

  ["a panicking unit retreating into a Mercenary is eliminated", () => {
    const [inf, foe, merc] = testPosition([
      { side: 0, type: "infantry", figs: 2, c: 4, r: 4, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 3, face: S },
      { side: 0, type: "mercenary", figs: 2, c: 4, r: 5, face: N },
    ]);
    force([PANIC, PANIC]);
    attackWith(inf, foe);
    return !inf.alive && merc.alive && merc.r === 5;
  }],

  ["a panicking unit shoves an ordinary ally, which panics in turn", () => {
    const [inf, foe, ally] = testPosition([
      { side: 0, type: "infantry", figs: 2, c: 4, r: 4, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 3, face: S },
      { side: 0, type: "infantry", figs: 4, c: 4, r: 5, face: N },
    ]);
    force([PANIC, PANIC]);
    attackWith(inf, foe);
    /* attacker about-faces to S and takes r=5; the ally about-faces and falls back to r=6 */
    return inf.alive && inf.r === 5 && inf.face === S &&
           ally.alive && ally.r === 6 && ally.face === S;
  }],

  ["panic chains through two allies at once", () => {
    const [inf, foe, a1, a2] = testPosition([
      { side: 0, type: "infantry", figs: 2, c: 4, r: 3, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 2, face: S },
      { side: 0, type: "infantry", figs: 4, c: 4, r: 4, face: N },
      { side: 0, type: "infantry", figs: 4, c: 4, r: 5, face: N },
    ]);
    force([PANIC, PANIC]);
    attackWith(inf, foe);
    return inf.r === 4 && a1.r === 5 && a2.r === 6 && [inf, a1, a2].every(u => u.alive);
  }],

  ["a lone Infantryman against a Knight must roll two axes in succession", () => {
    const mk = () => testPosition([
      { side: 0, type: "infantry", figs: 1, c: 4, r: 5, face: N },
      { side: 1, type: "knight", figs: 2, c: 4, r: 4, face: S },
    ]);
    let u = mk(); force([AXE, AXE]);
    const win = attackWith(u[0], u[1]);
    u = mk(); force([AXE, ARROW]);
    const miss = attackWith(u[0], u[1]);
    u = mk(); force([PANIC]);
    const pan = attackWith(u[0], u[1]);
    return win.duel && win.removed === 1 && miss.removed === 0 && pan.panicSteps === 1 && !u[0].alive === false;
  }],

  ["as printed, a lone Peasant gets no re-roll against armour", () => {
    const u = testPosition([
      { side: 0, type: "peasant", figs: 1, c: 4, r: 5, face: N },
      { side: 1, type: "knight", figs: 2, c: 4, r: 4, face: S },
    ]);
    force([AXE, AXE]);
    const res = attackWith(u[0], u[1]);
    /* One die, one hit, and armour needs two in the same attack. */
    return !res.duel && res.removed === 0;
  }],

  ["the lone-Peasant house rule grants the re-roll, scored by most-of", () => {
    const mk = () => {
      const u = testPosition([
        { side: 0, type: "peasant", figs: 1, c: 4, r: 5, face: N },
        { side: 1, type: "knight", figs: 2, c: 4, r: 4, face: S },
      ]);
      G.cfg.noPeasantDuel = false;          /* houseRulesToCfg: peasantDuel on */
      return u;
    };
    let u = mk(); force([AXE, AXE]);
    const both = attackWith(u[0], u[1]);
    u = mk(); force([AXE, ARROW]);
    const split = attackWith(u[0], u[1]);
    /* Two axes is two hits and removes a Knight figure. One axe and one arrow
       is "most of" = 1, which armour shrugs off. */
    return both.duel && both.hits === 2 && both.removed === 1 &&
           split.duel && split.hits === 1 && split.removed === 0;
  }],

  ["a Mercenary never panics; its victim about-faces and retreats once per PANIC", () => {
    const [merc, foe] = testPosition([
      { side: 0, type: "mercenary", figs: 2, c: 4, r: 5, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 4, face: S },
    ]);
    force([PANIC, PANIC, PANIC, PANIC]);
    const res = attackWith(merc, foe);
    /* r=4 back four squares lands exactly on r=0, the far edge: shoved the
       length of the board but still on it. */
    return res.panicSteps === 0 && res.victimRetreat === 4 &&
           merc.alive && merc.r === 5 && merc.face === N &&
           foe.alive && foe.r === 0 && foe.face === N && foe.figs === 4;
  }],

  ["a Mercenary can shove its victim clean off the board", () => {
    const [merc, foe] = testPosition([
      { side: 0, type: "mercenary", figs: 2, c: 4, r: 4, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 3, face: S },
    ]);
    force([PANIC, PANIC, PANIC, PANIC]);
    attackWith(merc, foe);
    return !foe.alive && foe.figs === 0 && merc.alive;
  }],

  ["a Mercenary cannot shove an enemy King or an enemy Mercenary", () => {
    const [merc, king] = testPosition([
      { side: 0, type: "mercenary", figs: 2, c: 4, r: 5, face: N },
      { side: 1, type: "king", figs: 1, c: 4, r: 4, face: S },
    ]);
    force([PANIC, PANIC, PANIC, PANIC]);
    const res = attackWith(merc, king);
    return res.victimRetreat === 0 && king.alive && king.r === 4 && king.face === S;
  }],

  ["victory when the enemy King is killed", () => {
    const [inf, king] = testPosition([
      { side: 0, type: "infantry", figs: 4, c: 4, r: 5, face: N },
      { side: 1, type: "king", figs: 1, c: 4, r: 4, face: S },
      { side: 1, type: "infantry", figs: 4, c: 0, r: 0, face: S },
      { side: 0, type: "king", figs: 1, c: 8, r: 7, face: N },
    ]);
    force([AXE, AXE, AXE, AXE]);
    attackWith(inf, king);
    const v = checkVictory(G);
    return !king.alive && v && v.winner === 0 && v.reason === "king";
  }],

  ["victory when the enemy King is left standing alone", () => {
    const [inf, last] = testPosition([
      { side: 0, type: "infantry", figs: 4, c: 4, r: 5, face: N },
      { side: 1, type: "infantry", figs: 1, c: 4, r: 4, face: S },
      { side: 1, type: "king", figs: 1, c: 0, r: 0, face: S },
      { side: 0, type: "king", figs: 1, c: 8, r: 7, face: N },
    ]);
    force([AXE, AXE, AXE, AXE]);
    attackWith(inf, last);
    const v = checkVictory(G);
    return !last.alive && v && v.winner === 0 && v.reason === "alone";
  }],

  ["the printed basic army is a legal muster: 10 bases, 33 warriors", () => {
    const spec = basicSpec();
    return validateArmy(spec, { partialBases: true }) === null &&
           specBases(spec) === 10 && specFigures(spec) === 33;
  }],

  ["a muster cannot field more figures than the player owns", () => {
    const spec = basicSpec();
    spec.infantry = { bases: 6, figs: 4 };        /* 24 Infantry; the pool is 20 */
    spec.archer = { bases: 1, figs: 4 };
    const why = validateArmy(spec, { partialBases: true });
    return !!why && /own 20/.test(why);
  }],

  ["a muster cannot exceed the printed base caps for the specials", () => {
    const blank = () => ({ knight: { bases: 0, figs: 0 }, archer: { bases: 0, figs: 0 },
                           infantry: { bases: 0, figs: 0 }, heavy: { bases: 0, figs: 0 },
                           peasant: { bases: 0, figs: 0 }, mercenary: { bases: 0, figs: 0 } });
    const mk = (t, bases, figs) => { const sp = blank(); sp[t] = { bases, figs }; return validateArmy(sp, { partialBases: true }); };

    /* Mercenaries are the only special whose BASE cap binds independently:
       2 bases of 1 stays inside the pool of 2, but the rules allow 1 base. */
    if (!/allows 1 base/.test(mk("mercenary", 2, 1) || "")) return false;

    /* For Heavy Infantry and Peasants the figure pool binds first -- 3 Heavy
       bases needs 3 figures and you own 2 -- so the cap is unreachable. Both
       are still rejected, which is what matters. */
    if (!mk("heavy", 3, 1) || !mk("peasant", 5, 1)) return false;

    /* And the legal maxima are accepted on their own terms. */
    return validateArmy(Object.assign(blank(), { heavy: { bases: 2, figs: 1 } }), { partialBases: true }) !== null &&
           /bases still to fill/.test(validateArmy(Object.assign(blank(), { heavy: { bases: 2, figs: 1 } }), { partialBases: true }));
  }],

  ["a base cannot be over-filled beyond its printed maximum", () => {
    const spec = basicSpec();
    spec.peasant = { bases: 1, figs: 5 };          /* "up to 4 on a base" */
    const why = validateArmy(spec, { partialBases: true });
    return !!why && /only 4 fit/.test(why);
  }],

  ["a muster must be exactly ten bases, and says how many are missing", () => {
    const spec = basicSpec();
    spec.infantry = { bases: 3, figs: 4 };          /* 8 bases with the King */
    const why = validateArmy(spec, { partialBases: true });
    return !!why && /2 bases still to fill/.test(why);
  }],

  ["every army the bot musters is legal", () => {
    G = { cfg: { partialBases: true } };
    for (let seed = 0; seed < 200; seed++) {
      const spec = botMuster(0, seed);
      if (validateArmy(spec, { partialBases: true }) !== null) return false;
      if (specBases(spec) !== 10) return false;
    }
    return true;
  }],

  ["a customised game deploys ten bases a side, in the back two rows only", () => {
    newGame(9, { setup: "custom" });
    for (const side of [0, 1]) {
      const mine = G.units.filter(u => u.side === side);
      if (mine.length !== 10) return false;
      const rows = side === 0 ? [H - 1, H - 2] : [0, 1];
      if (!mine.every(u => rows.includes(u.r))) return false;
      const king = mine.find(u => u.type === "king");
      if (!king || king.c !== 4 || king.r !== (side === 0 ? H - 1 : 0)) return false;
      if (new Set(mine.map(u => idx(u.c, u.r))).size !== mine.length) return false;
    }
    return true;
  }],

  ["a King facing an enemy Mercenary bribes it instead of attacking (p.7)", () => {
    const [king, merc] = testPosition([
      { side: 0, type: "king", figs: 1, c: 4, r: 5, face: N },
      { side: 1, type: "mercenary", figs: 2, c: 4, r: 4, face: S },
      { side: 1, type: "king", figs: 1, c: 0, r: 0, face: S },
      { side: 1, type: "infantry", figs: 4, c: 8, r: 0, face: S },
    ]);
    G.actionsLeft = 2;
    const acts = legalActions(G, buildGrid(G), 0).filter(a => a.uid === king.uid && a.kind !== "move" && a.kind !== "turn");
    if (acts.length !== 1 || acts[0].kind !== "bribe") return false;
    applyAction(G, acts[0]);
    /* The pennant changes and nothing else: same square, facing and figures. */
    return merc.side === 0 && merc.alive && merc.figs === 2 &&
           merc.c === 4 && merc.r === 4 && merc.face === S &&
           G.actionsLeft === 1 && G.dice === null;
  }],

  ["a Mercenary under its own King's eye cannot be bribed, and is attacked instead", () => {
    const [king, merc] = testPosition([
      { side: 0, type: "king", figs: 1, c: 4, r: 5, face: N },
      { side: 1, type: "mercenary", figs: 2, c: 4, r: 4, face: S },
      { side: 1, type: "king", figs: 1, c: 4, r: 3, face: S },   /* adjacent AND facing it */
    ]);
    G.actionsLeft = 2;
    const acts = legalActions(G, buildGrid(G), 0).filter(a => a.uid === king.uid && a.kind === "bribe");
    const attacks = legalActions(G, buildGrid(G), 0).filter(a => a.uid === king.uid && a.kind === "attack");
    return acts.length === 0 && attacks.length === 1;
  }],

  ["a King merely adjacent to its Mercenary, not facing it, does not protect it", () => {
    testPosition([
      { side: 0, type: "king", figs: 1, c: 4, r: 5, face: N },
      { side: 1, type: "mercenary", figs: 2, c: 4, r: 4, face: S },
      { side: 1, type: "king", figs: 1, c: 4, r: 3, face: N },   /* adjacent, facing AWAY */
    ]);
    G.actionsLeft = 2;
    return legalActions(G, buildGrid(G), 0).some(a => a.kind === "bribe");
  }],

  ["bribing the enemy's last warrior leaves their King alone and wins", () => {
    const [king, merc] = testPosition([
      { side: 0, type: "king", figs: 1, c: 4, r: 5, face: N },
      { side: 1, type: "mercenary", figs: 2, c: 4, r: 4, face: S },
      { side: 1, type: "king", figs: 1, c: 0, r: 0, face: S },
    ]);
    G.actionsLeft = 2;
    const bribe = legalActions(G, buildGrid(G), 0).find(a => a.kind === "bribe");
    applyAction(G, bribe);
    const v = checkVictory(G);
    return !!v && v.winner === 0 && v.reason === "alone";
  }],

  ["the printed basic deployment matches the diagram on p.3", () => {
    newGame(4, { setup: "basic" });
    const at = (c, r) => (G.units.find(u => u.c === c && u.r === r) || {}).type;
    const back = H - 1, front = H - 2;
    /* "King in the center of your back row ... a unit of Knights on either
       side of the King ... a unit of Archers on either side of the Knights
       ... your 5 Infantry units directly in front." */
    const row = at(2, back) === "archer" && at(3, back) === "knight" &&
                at(4, back) === "king" && at(5, back) === "knight" && at(6, back) === "archer";
    const line = [2, 3, 4, 5, 6].every(c => at(c, front) === "infantry");
    const empty = [0, 1, 7, 8].every(c => !at(c, back) && !at(c, front));
    return row && line && empty;
  }],

  ["movement may not pass through another unit (p.4)", () => {
    const [kn] = testPosition([
      { side: 0, type: "knight", figs: 2, c: 4, r: 7, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 4, face: S },
      { side: 0, type: "infantry", figs: 4, c: 4, r: 2, face: N },
    ]);
    const dests = moveSquares(G, buildGrid(G), kn).map(m => m.r);
    /* Stops at r=5, one short of the blocker; nothing beyond it is reachable. */
    return JSON.stringify(dests) === JSON.stringify([6, 5]);
  }],

  ["Mercenaries move one square at a time, not as riders do (p.7)", () => {
    const [merc] = testPosition([{ side: 0, type: "mercenary", figs: 2, c: 4, r: 7, face: N }]);
    return moveSquares(G, buildGrid(G), merc).length === 1 && !defOf(merc).mounted;
  }],

  ["a base leaves the board when its last figure is hit (p.5)", () => {
    const [inf, foe] = testPosition([
      { side: 0, type: "infantry", figs: 4, c: 4, r: 5, face: N },
      { side: 1, type: "infantry", figs: 2, c: 4, r: 4, face: S },
    ]);
    force([AXE, AXE, AXE, ARROW]);            /* 3 hits against 2 figures */
    const res = attackWith(inf, foe);
    return res.hits === 3 && !foe.alive && foe.figs === 0 &&
           buildGrid(G)[idx(4, 4)] === 0;      /* and the square is clear */
  }],

  ["first turn goes to whoever rolls the most battle-axes (p.4)", () => {
    /* Both sides roll 4 dice; ties re-roll. Over many seeds neither side may
       be favoured, and G.first must always be a valid side. */
    let side0 = 0;
    for (let seed = 1; seed <= 400; seed++) {
      newGame(seed);
      if (G.first !== 0 && G.first !== 1) return false;
      if (G.turn !== G.first) return false;
      if (G.first === 0) side0++;
    }
    return side0 > 150 && side0 < 250;        /* ~200 of 400, well inside noise */
  }],

  ["with one action left, Heavy Infantry may attack but not move or turn", () => {
    /* The enemy sits DIAGONALLY: Heavy Infantry attacks any adjacent square,
       so it can still strike while its forward square stays open to move to.
       With the enemy directly ahead it would be blocked, and the test would
       be measuring the blocker rather than the action economy. */
    const [hv] = testPosition([
      { side: 0, type: "heavy", figs: 2, c: 4, r: 5, face: N },
      { side: 1, type: "infantry", figs: 4, c: 5, r: 4, face: S },
    ]);
    G.actionsLeft = 2;
    const two = legalActions(G, buildGrid(G), 0).map(a => a.kind);
    G.actionsLeft = 1;
    const one = legalActions(G, buildGrid(G), 0).map(a => a.kind);
    /* Move and Turn cost 2 actions, Attack costs 1 -- so with a single action
       left only the attack survives. The UI must not offer what it cannot do. */
    return two.includes("move") && two.includes("turn") && two.includes("attack") &&
           one.includes("attack") && !one.includes("move") && !one.includes("turn");
  }],

  ["an Archer's block is clipped at the board edge, never wrapped", () => {
    const [ar] = testPosition([{ side: 0, type: "archer", figs: 4, c: 0, r: 1, face: N }]);
    const z = attackZone(ar);
    return z.every(sq => inBoard(sq.c, sq.r)) && z.every(sq => sq.c >= 0) && z.length < 9;
  }],

  ["the default muster, left alone, deploys to the printed Basic opening", () => {
    /* This is why the menu no longer offers "Basic" as a separate choice:
       it was a choice between a thing and itself. If this test ever fails,
       the option has to come back. */
    const snap = () => G.units.filter(u => u.side === 0)
      .map(u => `${u.type}@${u.c},${u.r}/${u.face}`).sort().join(" ");
    newGame(4, { setup: "basic" });
    const printed = snap();
    newGame(4, { setup: "custom", specs: { 0: basicSpec(), 1: basicSpec() } });
    return printed === snap() && /king@4,7/.test(printed);
  }],

  ["a customised game with a human in it stops to lay a battle plan", () => {
    UI.pendingOpponent = "ai"; UI.houseRules = defaultHouseRules();
    startGame(55, { setup: "custom", opponent: "ai" });
    const deploying = G.phase === "deploy" && G.deploySide === 0;
    /* The Basic Game's opening is printed and fixed -- no plan to lay. */
    startGame(55, { setup: "basic", opponent: "ai" });
    return deploying && G.phase === "play";
  }],

  ["a base may be moved anywhere in its own two ranks, and swapped with another", () => {
    UI.pendingOpponent = "ai"; UI.houseRules = defaultHouseRules();
    startGame(56, { setup: "custom", opponent: "ai" });
    const mine = G.units.filter(u => u.side === 0 && u.type !== "king");
    const u = mine[0];
    const empty = (() => {
      const grid = buildGrid(G);
      for (const r of deployRows(0)) for (let c = 0; c < W; c++) {
        if (!grid[idx(c, r)]) return { c, r };
      }
      return null;
    })();
    if (!empty || !deployPlace(u, empty.c, empty.r)) return false;
    if (u.c !== empty.c || u.r !== empty.r) return false;

    const other = G.units.find(o => o.side === 0 && o !== u && o.type !== "king");
    const uc = u.c, ur = u.r, oc = other.c, or_ = other.r;
    if (!deployPlace(u, oc, or_)) return false;
    return u.c === oc && u.r === or_ && other.c === uc && other.r === ur;
  }],

  ["as printed, the King holds the royal emblem and nothing leaves the zone", () => {
    UI.pendingOpponent = "ai"; UI.houseRules = defaultHouseRules();
    startGame(57, Object.assign(houseRulesToCfg(UI.houseRules),
      { setup: "custom", opponent: "ai" }));
    const king = G.units.find(u => u.side === 0 && u.type === "king");
    const other = G.units.find(u => u.side === 0 && u.type !== "king");
    const kc = king.c, kr = king.r;
    /* p.6: "Your King must start on the royal emblem in the back row." */
    const onEmblem = kc === 4 && kr === H - 1;
    const pinned = !deployPlace(king, 0, H - 1) && king.c === kc && king.r === kr;
    const unswappable = !deployPlace(other, kc, kr);
    /* "...you may place your other figures on that row and the row in front." */
    const zoneHeld = !deployPlace(other, 4, 3) && !deployPlace(other, 4, 0);
    return onEmblem && pinned && unswappable && zoneHeld;
  }],

  ["the free-King house rule lets it move and be swapped with", () => {
    UI.pendingOpponent = "ai";
    UI.houseRules = Object.assign(defaultHouseRules(), { freeKing: true });
    startGame(57, Object.assign(houseRulesToCfg(UI.houseRules),
      { setup: "custom", opponent: "ai" }));
    const king = G.units.find(u => u.side === 0 && u.type === "king");
    const other = G.units.find(u => u.side === 0 && u.type !== "king");
    const kingMoves = deployPlace(king, 0, H - 1) && king.c === 0 && king.r === H - 1;
    const kc = king.c, kr = king.r, oc = other.c, or_ = other.r;
    const kingSwaps = deployPlace(other, kc, kr) &&
                      other.c === kc && other.r === kr && king.c === oc && king.r === or_;
    return kingMoves && kingSwaps;
  }],

  ["as printed, a base carries its full count; the house rule relaxes it", () => {
    const spec = basicSpec();
    spec.infantry = { bases: spec.infantry.bases, figs: 3 };   /* 3 of a printed 4 */
    const printed = validateArmy(spec, defaultHouseRules());
    const relaxed = validateArmy(spec, Object.assign(defaultHouseRules(), { partialBases: true }));
    return typeof printed === "string" && printed.length > 0 && relaxed === null;
  }],

  ["facing can be set freely while deploying, and costs nothing", () => {
    UI.pendingOpponent = "ai"; UI.houseRules = defaultHouseRules();
    startGame(58, { setup: "custom", opponent: "ai" });
    const u = G.units.find(x => x.side === 0 && x.type !== "king");
    const before = G.actionsLeft;
    deployFace(u, E); const east = u.face === E;
    deployFace(u, WEST);
    return east && u.face === WEST && G.actionsLeft === before;
  }],

  ["every opening places every base, in its own two ranks, no two on a square", () => {
    UI.pendingOpponent = "ai"; UI.houseRules = defaultHouseRules();
    startGame(61, Object.assign(houseRulesToCfg(UI.houseRules),
      { setup: "custom", opponent: "ai" }));
    for (const op of OPENINGS) {
      for (const seed of [1, 2, 3, 4]) {
        for (const side of [0, 1]) {
          const list = unitsFromSpec(side, botMuster(side, seed));
          const placed = placeArmy(side, list, op);
          if (placed.length !== list.length) return false;
          const rows = deployRows(side);
          const seen = new Set();
          for (const pl of placed) {
            if (!rows.includes(pl.r) || !inBoard(pl.c, pl.r)) return false;
            const k = idx(pl.c, pl.r);
            if (seen.has(k)) return false;
            seen.add(k);
          }
        }
      }
    }
    return true;
  }],

  ["cleverness weights the opening: a Marshal all but never draws a weak one", () => {
    const rate = skill => {
      let weak = 0;
      for (let i = 1; i <= 2000; i++) if (pickOpening(skill, i * 2654435761).grade === 1) weak++;
      return weak / 2000;
    };
    const squire = rate(0), marshal = rate(2);
    /* Two weak shapes of eight, so a coin-toss lands on one a quarter of the
       time; sharpening has to bring that down by an order of magnitude. */
    return squire > 0.18 && squire < 0.32 && marshal < 0.02 && rate(1) < squire;
  }],

  ["fortune leaves the printed die alone at Even, and never touches a human", () => {
    startGame(62, { setup: "basic", opponent: "ai" });
    G.players[0].isBot = false; G.players[1].isBot = true;
    const count = (fortune, side) => {
      G.cfg.fortune = fortune;
      const c = { [AXE]: 0, [ARROW]: 0, [PANIC]: 0 };
      for (let i = 0; i < 6000; i++) for (const f of rollDice(4, side, AXE)) c[f]++;
      const n = c[AXE] + c[ARROW] + c[PANIC];
      return { axe: c[AXE] / n, panic: c[PANIC] / n };
    };
    const near = (a, b) => Math.abs(a - b) < 0.02;
    const even = count(FORTUNE_EVEN, 1);
    const lucky = count(2, 1), unlucky = count(0, 1);
    const humanUnderLucky = count(2, 0);
    G.cfg.fortune = FORTUNE_EVEN;
    return near(even.axe, 0.5) && near(even.panic, 1 / 6) &&
           near(humanUnderLucky.axe, 0.5) && near(humanUnderLucky.panic, 1 / 6) &&
           lucky.axe > 0.62 && lucky.panic < 0.09 &&
           unlucky.axe < 0.38 && unlucky.panic > 0.30;
  }],

  ["the screen covers every enemy base while a plan is being laid", () => {
    /* The board hides the far zone during deployment, not the far units, so
       the screen is only airtight while every enemy base is inside its own
       deployment rows. A unit starting outside them would be drawn in the
       open for the player still laying his plan. */
    for (const opp of ["ai", "hotseat"]) {
      UI.pendingOpponent = opp; UI.houseRules = defaultHouseRules();
      startGame(63, Object.assign(houseRulesToCfg(UI.houseRules),
        { setup: "custom", opponent: opp }));
      if (G.phase !== "deploy") return false;
      for (const side of [0, 1]) {
        for (const u of G.units.filter(x => x.side === side && x.alive)) {
          if (!inDeployZone(side, u.c, u.r)) return false;
        }
      }
      /* And the screen is a whole zone: two ranks, every file. */
      let veiled = 0;
      for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
        if (inDeployZone(1 - G.deploySide, c, r)) veiled++;
      }
      if (veiled !== W * 2) return false;
    }
    return true;
  }],

  ["taking the field ends deployment and starts play", () => {
    UI.pendingOpponent = "ai"; UI.houseRules = defaultHouseRules();
    startGame(59, { setup: "custom", opponent: "ai" });
    deployReady();
    return G.phase === "play" && !G.units.some(u => !inBoard(u.c, u.r));
  }],

  ["a unit may not attack twice in the same turn, but another unit may", () => {
    const [a, b] = testPosition([
      { side: 0, type: "infantry", figs: 4, c: 4, r: 5, face: N },
      { side: 0, type: "infantry", figs: 4, c: 5, r: 5, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 4, face: S },
      { side: 1, type: "infantry", figs: 4, c: 5, r: 4, face: S },
    ]);
    G.actionsLeft = 2;
    a.attackedThisTurn = true;
    const acts = legalActions(G, buildGrid(G), 0).filter(x => x.kind === "attack");
    return acts.length === 1 && acts[0].uid === b.uid;
  }],
];

function ruleTests() {
  /* Restore whatever game was in progress: a console tool must not eat it. */
  const saved = G ? JSON.parse(JSON.stringify(G)) : null;
  const savedSel = UI.sel, savedCur = UI.cur;
  const results = [];
  for (const [name, fn] of RULE_TESTS) {
    let pass, err = null;
    try { pass = fn(); } catch (e) { pass = false; err = e.message; }
    HARNESS.forceFaces = null;
    results.push({ name, pass: !!pass, err });
  }
  if (saved) { G = saved; UI.sel = savedSel; UI.cur = savedCur; }
  HARNESS.forceFaces = null;
  if (!UI.headless && G) updateAll();
  const failed = results.filter(r => !r.pass);
  return { total: results.length, passed: results.length - failed.length, failed };
}

/* ============================================================
   TABLE SELF-CHECK — runs at load and THROWS. These are the
   printed facts, so a violation means the tables were mistyped,
   not that the game is unbalanced. A check nobody has watched
   fail is indistinguishable from one that cannot fail, so each
   of these has been seen to go red.
   ============================================================ */
function validateTables() {
  const die = DIE_FACES.reduce((m, f) => (m[f] = (m[f] || 0) + 1, m), {});
  if (die[AXE] !== 3 || die[ARROW] !== 2 || die[PANIC] !== 1) {
    throw new Error("Die faces must be 3 axe / 2 arrow / 1 PANIC (rulebook p.2)");
  }
  for (let n = 1; n <= MAX_DICE; n++) {
    const sum = DICE_DIST[n].reduce((s, r) => s + r.p, 0);
    if (Math.abs(sum - 1) > 1e-12) throw new Error(`DICE_DIST[${n}] sums to ${sum}, not 1`);
  }
  for (const t in UNIT_DEFS) {
    const d = UNIT_DEFS[t];
    if (Math.min(MAX_DICE, d.perBase * d.dicePerFig) > MAX_DICE) {
      throw new Error(`${t} would roll more than ${MAX_DICE} dice; the box holds ${MAX_DICE}`);
    }
  }
  const bases = BASIC_ARMY.reduce((s, r) => s + r.bases, 0);
  if (bases !== BASES_TOTAL) throw new Error(`Basic army is ${bases} bases, not ${BASES_TOTAL}`);
  for (const r of BASIC_ARMY) {
    if (r.figs > UNIT_DEFS[r.type].perBase) throw new Error(`Basic army over-fills a ${r.type} base`);
    if (r.bases * r.figs > UNIT_DEFS[r.type].perPlayer) {
      throw new Error(`Basic army uses more ${r.type} than a player owns`);
    }
  }
  /* Seeded replay is the property the whole architecture rests on. */
  const a = mulberry32(7), b = mulberry32(7);
  for (let i = 0; i < 8; i++) if (a() !== b()) throw new Error("mulberry32 is not deterministic");
}
