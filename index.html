<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PumaHeart — Medieval Grid Wargame</title>
<meta name="description" content="A faithful port of Lionheart (1997). Two prides of puma warriors on nine squares by eight, two actions a turn. Facing matters, dice decide, and a panicking unit will shove your own line off the board.">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta property="og:title" content="PumaHeart">
<meta property="og:description" content="A faithful port of Lionheart (1997). Two prides of puma warriors on nine squares by eight, two actions a turn. Facing matters, dice decide, and a panicking unit will shove your own line off the board.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://greykit.com/games/pumaheart/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://greykit.com/games/pumaheart/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="PumaHeart">
<meta name="twitter:image" content="https://greykit.com/games/pumaheart/og.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
/* ============================================================
   TOKENS — cybersec-CRT tribe palette. The :root values are
   byte-identical to the sibling games; everything PumaHeart
   adds is a mapping onto them, never a new hue.
   ============================================================ */
:root {
  --green: #00ff41;
  --green-dim: #00cc33;
  --green-dark: #009926;
  --amber: #ffb000;
  --amber-dim: #cc8800;
  --red: #ff3333;
  --red-dim: #cc2222;
  --yellow: #ffdd33;
  --blue: #6699ff;
  --pink: #ff5fbf;
  --cyan: #00cccc;
  --white: #e8ffe8;
  --bg: #0a0a0a;
  --panel: #111;
  --panel-2: #0d160d;
  --border: #1a3a1a;
  --text: #00ff41;
  --text-dim: #00aa2a;
  --font-mono: "Courier New", "Lucida Console", monospace;
  --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);

  /* --- PumaHeart mapping layer -------------------------------
     Two prides sit at 14.50:1 and 10.81:1 against --bg, but only
     1.34:1 against EACH OTHER: green and amber differ in hue, not
     in brightness, which is the pair red-green colour blindness
     confuses. Side is therefore also carried by glyph treatment
     (side 0 filled, side 1 outlined), by the figure pips, and by
     the aria-label. Never let colour be the only channel. */
  --pale: var(--green);            /* side 0 */
  --dun: var(--amber);             /* side 1 */
  --sel: var(--white);             /* selection ring            */
  --mv: var(--cyan);               /* legal move destination    */
  --tg: var(--red);                /* legal attack target       */
  --zone: rgba(255, 221, 51, 0.14);  /* an archer's 3x3 block   */
  --lane: rgba(0, 204, 204, 0.12);   /* a mounted charge lane   */
  --sq-light: #0d160d;
  --sq-dark: #0a0f0a;
  --deploy-pale: rgba(0, 255, 65, 0.07);   /* side 0 deployment ranks */
  --deploy-dun: rgba(255, 176, 0, 0.07);   /* side 1 deployment ranks */

  /* Floors at 32px so a 9-wide board fits a 380px viewport. */
  --sq: clamp(32px, min(9vw, 7vh), 58px);
}

* { box-sizing: border-box; }
:root { color-scheme: dark; }
* { scrollbar-width: thin; scrollbar-color: #1a3a1a var(--bg); }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-track { background: var(--bg); }
*::-webkit-scrollbar-thumb { background: #1a3a1a; border: 2px solid var(--bg); border-radius: 5px; }
*::-webkit-scrollbar-thumb:hover { background: var(--green-dark); }

html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-mono); font-size: 14px; line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

/* The CRT overlay is the tribe signature. Reduced motion kills it. */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 9000; pointer-events: none;
  background: repeating-linear-gradient(0deg,
    rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 3px);
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: 9001; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
}

/* ============================================================
   BOXED CHROME — the Crescent Hawk layer. Every panel is a hard
   rectangle with a double rule at the top and a small-caps label
   notched into it. No rounding, no shadows, no gradients: the
   1988 look is flat and framed.
   ============================================================ */
.box {
  position: relative; background: var(--panel);
  border: 1px solid var(--border); border-top: 3px double var(--border);
  padding: 14px 12px 12px;
}
.box > .box-label {
  position: absolute; top: -8px; left: 10px;
  background: var(--bg); padding: 0 6px;
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--amber);
}
.box.is-live { border-color: var(--amber-dim); }

/* ============================================================
   LAYOUT — board centre, status panel beside it, command rail
   under it. Collapses to one column on a phone, where the rail
   becomes a fixed thumb-reachable bottom bar.
   ============================================================ */
#app {
  display: grid; gap: 12px; padding: 12px;
  grid-template-columns: minmax(0, 1fr) 300px;
  grid-template-areas: "hud hud" "board side" "rail side";
  align-content: start; min-height: 100%;
}
#hud { grid-area: hud; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
#hud .brand { color: var(--amber); letter-spacing: 0.22em; text-transform: uppercase; }
#hud .brand b { color: var(--green); font-weight: 700; }
#board-wrap { grid-area: board; display: flex; justify-content: center; }
#grid { margin: 0 auto; }
#side { grid-area: side; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
#rail { grid-area: rail; }

#rail .keys { display: flex; flex-wrap: wrap; gap: 4px 18px; }
#rail kbd {
  font: inherit; color: var(--amber); background: none; border: 0; padding: 0;
}
#rail .cmd {
  color: var(--text-dim); white-space: nowrap; cursor: pointer;
  padding: 2px 4px; border: 1px solid transparent;
}
#rail .cmd:hover { color: var(--text); border-color: var(--border); }

#log-list { list-style: none; margin: 0; padding: 0; max-height: 30vh; overflow-y: auto; }
#log-list li { padding: 2px 0; border-bottom: 1px solid var(--panel-2); color: var(--text-dim); }

/* ============================================================
   BOARD & UNITS
   Side is carried by FOUR channels, never by colour alone: hue,
   a solid vs dashed base ring, the figure pips, and the
   aria-label. --pale and --dun sit at 14.5:1 and 10.8:1 against
   the ground but only 1.34:1 against each other -- they differ
   in hue, not brightness, which is exactly the pair red-green
   colour blindness confuses.
   ============================================================ */
#grid { display: grid; grid-auto-rows: var(--sq); border: 1px solid var(--border); width: max-content; }
.sq {
  position: relative; width: var(--sq); height: var(--sq);
  border: 1px solid var(--border); background: var(--sq-dark);
}
.sq.lt { background: var(--sq-light); }
.sq.dz0 { background-image: linear-gradient(var(--deploy-pale), var(--deploy-pale)); }
.sq.dz1 { background-image: linear-gradient(var(--deploy-dun), var(--deploy-dun)); }
.sq.zone { box-shadow: inset 0 0 0 99px var(--zone); }
.sq.mv { box-shadow: inset 0 0 0 2px var(--mv); }
.sq.tg { box-shadow: inset 0 0 0 2px var(--tg); }
.sq.zone.mv { box-shadow: inset 0 0 0 99px var(--zone), inset 0 0 0 2px var(--mv); }
.sq.zone.tg { box-shadow: inset 0 0 0 99px var(--zone), inset 0 0 0 2px var(--tg); }

.u { position: absolute; inset: 2px; display: flex; align-items: center; justify-content: center; }
.u.s0 { color: var(--pale); }
.u.s1 { color: var(--dun); }
.u::before {
  content: ""; position: absolute; inset: 0;
  border: 2px solid currentColor;              /* side 0 solid ... */
}
.u.s1::before { border-style: dashed; }        /* ... side 1 dashed */
.u.is-sel::before { border-color: var(--sel); box-shadow: 0 0 7px var(--sel); }

.u svg { width: 56%; height: 56%; margin-bottom: 16%; }
.u svg.fl path { fill: currentColor; }
.u svg.ln path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

/* The figure count is the single most important number in the game -- it is
   at once the unit's toughness AND its dice pool -- so it is drawn, not
   merely implied. */
.u .pips {
  position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 1.5px;
}
.u .pips i { width: 4px; height: 5px; background: currentColor; }
/* A spent figure reads as ABSENT, not as an outlined box: at 32px a 1px
   outline is indistinguishable from a fill, so the length of the bar has to
   carry the count. */
.u .pips i.off { background: currentColor; opacity: 0.16; }

/* Facing: a chevron on the facing edge, plus the aria-label. */
.u::after { content: ""; position: absolute; width: 0; height: 0; }
.u[data-face="0"]::after { top: -4px; left: 50%; margin-left: -4px;
  border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 5px solid currentColor; }
.u[data-face="2"]::after { bottom: -4px; left: 50%; margin-left: -4px;
  border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid currentColor; }
.u[data-face="1"]::after { right: -4px; top: 50%; margin-top: -4px;
  border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 5px solid currentColor; }
.u[data-face="3"]::after { left: -4px; top: 50%; margin-top: -4px;
  border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-right: 5px solid currentColor; }

/* Menu, help and tutorial share the overlay shell */
#menu, #help, #tutorial {
  position: fixed; inset: 0; z-index: 8200; display: flex;
  align-items: center; justify-content: center; background: rgba(10,10,10,0.94);
  overflow: auto; padding: 16px;
}
#menu[hidden], #help[hidden], #tutorial[hidden] { display: none !important; }
.menu-card { background: var(--bg); min-width: 340px; max-width: 560px; }
.help-card { background: var(--bg); max-width: 780px; }
.tut-card { background: var(--bg); max-width: 420px; }
.menu-rows { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 10px 0 14px; align-items: start; }
.menu-rows dt { color: var(--amber); }
.menu-rows dd { margin: 0; display: flex; gap: 6px; flex-wrap: wrap; }
.opt {
  border: 1px solid var(--border); padding: 2px 8px; cursor: pointer; color: var(--text-dim);
}
.opt:hover { border-color: var(--amber-dim); color: var(--text); }
.opt.on { border-color: var(--green-dark); color: var(--green); }
.prov-head { color: var(--amber); margin: 10px 0 4px; }
ul.house { list-style: none; margin: 0 0 12px; padding: 0; }
ul.house li { border-top: 1px solid var(--panel-2); padding: 6px 0; }
ul.house .prov { color: var(--amber-dim); font-size: 11px; margin-left: 8px; }
ul.house p { margin: 3px 0 0; font-size: 13px; }
.help-card h3 { color: var(--amber); font-size: 12px; letter-spacing: 0.12em;
  text-transform: uppercase; margin: 16px 0 6px; }
.help-card p { margin: 6px 0; }
.scrollx { overflow-x: auto; }
table.ref { border-collapse: collapse; width: 100%; }
table.ref th, table.ref td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--panel-2);
  vertical-align: top; }
table.ref thead th { color: var(--amber); font-weight: normal; font-size: 11px;
  letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
table.ref tbody th { font-weight: normal; white-space: nowrap; }
table.ref td.note { color: var(--text-dim); font-size: 12px; min-width: 220px; }
table.ref.keys { max-width: 460px; }
.u .pipnum { position: static; font-size: 10px; color: currentColor; line-height: 1; }

/* Dice tray */
#tray .dice-row { display: flex; gap: 6px; flex-wrap: wrap; }
.die {
  width: 30px; height: 30px; border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; color: var(--text-dim);
  animation: land 220ms var(--ease-out-quart) backwards;
  animation-delay: calc(var(--i) * 60ms);
}
.die svg { width: 74%; height: 74%; }
.die svg path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.die.f-axe.scores, .die.f-arrow.scores { color: var(--green); border-color: var(--green-dark); }
.die.f-panic { color: var(--red); border-color: var(--red-dim); }
#tray .verdict { margin: 8px 0 0; color: var(--amber); }
@keyframes land {
  from { transform: translateY(-10px) rotate(-18deg); opacity: 0; }
  to   { transform: none; opacity: 1; }
}

/* A unit that falls leaves a ghost where it stood */
.ghost {
  position: fixed; z-index: 40; pointer-events: none;
  animation: fade 640ms var(--ease-out-quart) forwards;
}
.ghost .u { position: absolute; inset: 0; }
@keyframes fade { to { opacity: 0; transform: scale(1.35); } }

/* Muster screen */
#muster {
  position: fixed; inset: 0; z-index: 8100; display: flex;
  align-items: center; justify-content: center; background: rgba(10,10,10,0.94);
  overflow: auto; padding: 16px;
}
#muster[hidden] { display: none !important; }
.muster-card { background: var(--bg); min-width: 340px; max-width: 560px; }
table.muster { border-collapse: collapse; width: 100%; margin: 10px 0; }
table.muster th, table.muster td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--panel-2); }
table.muster thead th { color: var(--amber); font-weight: normal; font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase; }
table.muster tbody th { font-weight: normal; }
table.muster .cap { color: var(--text-dim); font-size: 11px; }
table.muster .pool { color: var(--text-dim); text-align: right; }
table.muster tr.bad .pool, table.muster tr.bad th { color: var(--red); }
table.muster tr.locked { color: var(--text-dim); }
td.step { white-space: nowrap; }
td.step b { display: inline-block; min-width: 1.6em; text-align: center; }
.sbtn {
  display: inline-block; min-width: 20px; text-align: center; cursor: pointer;
  border: 1px solid var(--border); color: var(--amber); line-height: 18px;
}
.sbtn:hover { border-color: var(--amber-dim); }
.tally { margin: 6px 0 0; }
.tally .ok { color: var(--green); }
.tally .bad { color: var(--red); }
.why { margin: 4px 0 12px; color: var(--amber); min-height: 1.4em; }
.muster-actions { display: flex; gap: 10px; }
.btn[disabled] { color: var(--text-dim); border-color: var(--panel-2); cursor: not-allowed; }
.hud-new { display: flex; gap: 8px; margin-left: auto; }
.hud-new .cmd { color: var(--text-dim); cursor: pointer; padding: 2px 6px; border: 1px solid var(--border); }
.hud-new .cmd:hover { color: var(--text); border-color: var(--amber-dim); }

/* Hot-seat handover curtain */
#curtain {
  position: fixed; inset: 0; z-index: 8000; display: flex;
  align-items: center; justify-content: center; background: rgba(10,10,10,0.92);
}
#curtain[hidden] { display: none !important; }
.curtain-card { min-width: 260px; text-align: center; background: var(--bg); }
.btn {
  font: inherit; color: var(--amber); background: none;
  border: 1px solid var(--border); border-top-width: 3px; border-top-style: double;
  padding: 8px 18px; cursor: pointer;
}
.btn:hover { border-color: var(--amber-dim); }

/* HUD & status */
#hud-state { display: flex; align-items: center; gap: 12px; }
.side.s0 { color: var(--pale); }
.side.s1 { color: var(--dun); }
.acts { letter-spacing: 2px; color: var(--amber); }
.rnd { color: var(--text-dim); }
.unit-name { margin: 0 0 8px; letter-spacing: 0.1em; text-transform: uppercase; }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
.stats dt { color: var(--text-dim); }
.stats dd { margin: 0; }
.note { color: var(--text-dim); margin: 10px 0 0; font-size: 13px; }
.dim { color: var(--text-dim); margin: 0; }

/* ============================================================
   A11Y, TOUCH, MOTION, RESPONSIVE
   ============================================================ */
*:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

@media (pointer: coarse) {
  .btn, .icon-btn, #rail .cmd { min-height: 44px; display: inline-flex; align-items: center; }
}

@media (max-width: 760px) {
  #app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "hud" "board" "side";
    padding-bottom: calc(var(--rail-h, 84px) + 12px);
  }
  #rail .keys { gap: 2px 14px; font-size: 13px; }
  #rail {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    border-left: 0; border-right: 0; border-bottom: 0;
    background: var(--bg);
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  body::before, body::after { display: none; }
  .ghost { display: none !important; }
}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <span class="brand">Puma<b>Heart</b></span>
    <span id="hud-state"></span>
    <span class="hud-new">
      <span class="cmd" data-act="menuOpen" role="button" tabindex="0">New game</span>
      <span class="cmd" data-act="speed" role="button" tabindex="0" id="hud-speed"></span>
      <span class="cmd" data-act="mute" role="button" tabindex="0" id="hud-mute"></span>
    </span>
    <span id="hud-turn" class="sr-only" aria-live="polite"></span>
  </header>

  <section id="board-wrap" class="box" aria-labelledby="board-label">
    <span class="box-label" id="board-label">Field</span>
    <div id="grid" role="grid" aria-label="Battlefield, 9 files by 8 ranks"></div>
  </section>

  <aside id="side">
    <div id="status" class="box" aria-labelledby="status-label">
      <span class="box-label" id="status-label">Unit</span>
      <div id="status-body">No unit selected.</div>
    </div>
    <div id="tray-box" class="box" aria-labelledby="tray-label">
      <span class="box-label" id="tray-label">Dice</span>
      <div id="tray" aria-live="off"></div>
    </div>
    <div id="log" class="box" aria-labelledby="log-label">
      <span class="box-label" id="log-label">Field Report</span>
      <ul id="log-list" aria-label="Event log"></ul>
    </div>
  </aside>

  <nav id="rail" class="box" aria-labelledby="rail-label">
    <span class="box-label" id="rail-label">Orders</span>
    <div class="keys" id="rail-keys"></div>
  </nav>
</div>
<div id="curtain" hidden></div>
<div id="muster" hidden></div>
<div id="menu" hidden></div>
<div id="help" hidden></div>
<div id="tutorial" hidden></div>
<div id="announcements" class="sr-only" aria-live="polite"></div>

<script>
/* ============================================================
   RULE TABLES — transcribed from the official rulebook scan
   (Parker Brothers 40742-I, 1997). Every number here is PRINTED.
   Nothing is designed, costed or balanced by us. The Gameplay
   Reference Table is on p.8; setup and dice labels on pp.2-3.
   If a value here disagrees with your copy, this table is the
   one place to change it.
   ============================================================ */

/* The board. 9 wide is printed -- countable in the p.3 setup diagram,
   which reads [blank][blank] Archers Knights King Knights Archers
   [blank][blank]. 8 deep is not printed anywhere; it was counted on the
   physical board and corroborated four further ways, the neatest being
   that the board's fold bisects the centre column, which is only
   possible if the column count is odd. Every online source says 9x10,
   traceable to one hedged line in a 1998 InQuest Gamer review. It is
   wrong. Only four empty ranks separate the armies. */
const W = 9, H = 8;

/* Facing is an integer 0..3. Rotation is (face + k) % 4, and an
   about-face is + 2. */
const N = 0, E = 1, S = 2, WEST = 3;
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const FACE_NAMES = ["north", "east", "south", "west"];

/* "Each gets 2 Arrows, one PANIC and 3 Battle-axes." (p.2) */
const AXE = 0, ARROW = 1, PANIC = 2;
const DIE_FACES = [AXE, AXE, AXE, ARROW, ARROW, PANIC];

/* p.8 Gameplay Reference Table. perBase is the printed maximum:
   the rulebook prints fixed counts for basic units and ranges for
   specials ("1 or 2", "up to 4"), but calls 4 "the standard limit
   of 4 Infantry per base", so we read them all as maxima and allow
   under-filled bases. See the plan, section 6 gap 2. */
const UNIT_DEFS = {
  king: {
    name: "King", perPlayer: 1, perBase: 1, dicePerFig: 2,
    hitFace: AXE, htk: 2, mounted: true, panics: false,
    note: "Never panics. Starts in the centre of the back row. May bribe an adjacent Mercenary.",
  },
  knight: {
    name: "Knight", perPlayer: 4, perBase: 2, dicePerFig: 2,
    hitFace: AXE, htk: 2, mounted: true, panics: true,
    note: "Moves any distance in a straight line until blocked.",
  },
  infantry: {
    name: "Infantry", perPlayer: 20, perBase: 4, dicePerFig: 1,
    hitFace: AXE, htk: 1, mounted: false, panics: true,
    note: "",
  },
  archer: {
    name: "Archer", perPlayer: 8, perBase: 4, dicePerFig: 1,
    hitFace: ARROW, htk: 1, mounted: false, panics: true,
    note: "Attacks any single enemy in the 9-square block ahead, firing over intervening heads.",
  },
  heavy: {
    name: "Heavy Infantry", perPlayer: 2, perBase: 2, dicePerFig: 2,
    hitFace: AXE, htk: 2, mounted: false, panics: true,
    moveCost: 2, turnCost: 2, allAdjacent: true, needsFacing: false,
    note: "Move and Turn cost 2 actions each. Attacks any adjacent square, facing ignored.",
  },
  peasant: {
    name: "Peasant", perPlayer: 4, perBase: 4, dicePerFig: 1,
    hitFace: null, htk: 1, mounted: false, panics: true, panicPerDie: true,
    note: "Hits with whichever it rolled most of. Retreats 1 square per PANIC rolled.",
  },
  mercenary: {
    name: "Mercenary", perPlayer: 2, perBase: 2, dicePerFig: 2,
    hitFace: AXE, htk: 1, mounted: false, panics: false, panicsVictim: true, bribable: true,
    note: "Never panics. Its victim retreats 1 square per PANIC rolled. Can be bribed by a King.",
  },
};

/* Optional printed rule (p.8): 10 Infantry per base, never more than
   4 dice. Off by default -- "If both players agree". */
const MASSIVE_INFANTRY = { perBase: 10, maxDice: 4 };

/* How many figures fit on a base RIGHT NOW. The printed optional rule (p.8)
   raises Infantry from 4 to 10, and this is the single place that knows it:
   the muster, the validator, the invariants and the figure pips all read
   through here. */
function perBaseOf(type, cfg) {
  const c = cfg || (G && G.cfg) || null;
  if (type === "infantry" && c && c.massiveInfantry) return MASSIVE_INFANTRY.perBase;
  return UNIT_DEFS[type].perBase;
}

/* The box holds exactly 4 combat dice, and no unit can roll more.
   king 1x2, knight 2x2, infantry 4x1, archer 4x1, heavy 2x2,
   peasant 4x1, mercenary 2x2 -- every one lands on 4. */
const MAX_DICE = 4;

/* p.3 Basic Game Setup: 10 bases, 33 warriors. */
const BASIC_ARMY = [
  { type: "king", bases: 1, figs: 1 },
  { type: "knight", bases: 2, figs: 2 },
  { type: "archer", bases: 2, figs: 4 },
  { type: "infantry", bases: 5, figs: 4 },
];

/* p.6 Customized Setup: still exactly 10 bases; these cap the specials. */
const BASES_TOTAL = 10;
const CUSTOM_BASE_CAPS = { heavy: 2, peasant: 4, mercenary: 1 };

/* ============================================================
   RNG & DICE DISTRIBUTION
   mulberry32, seeded from G so a saved game replays identically.
   DICE_DIST is the exact multinomial over (axes, arrows, panics)
   for n = 1..4, enumerated once at load. It exists so the AI can
   read probabilities WITHOUT rolling -- if the AI ever called
   rnd(), it would advance the shared stream and seeded replay
   would break. That is asserted, not assumed.
   ============================================================ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const P_AXE = 3 / 6, P_ARROW = 2 / 6, P_PANIC = 1 / 6;

function factorial(n) { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }

/* DICE_DIST[n] = [{ axes, arrows, panics, p }, ...] summing to 1. */
const DICE_DIST = (function buildDiceDist() {
  const out = [null];
  for (let n = 1; n <= MAX_DICE; n++) {
    const rows = [];
    for (let a = 0; a <= n; a++) {
      for (let r = 0; r + a <= n; r++) {
        const pa = n - a - r;
        const coeff = factorial(n) / (factorial(a) * factorial(r) * factorial(pa));
        rows.push({
          axes: a, arrows: r, panics: pa,
          p: coeff * Math.pow(P_AXE, a) * Math.pow(P_ARROW, r) * Math.pow(P_PANIC, pa),
        });
      }
    }
    out.push(rows);
  }
  return out;
})();

/* Hits for a roll, by attacker. Peasants use "whichever you rolled
   the most of -- Battle-axes or Arrows" (p.5). */
function hitsFrom(def, axes, arrows) {
  if (def.hitFace === null) return Math.max(axes, arrows);
  return def.hitFace === AXE ? axes : arrows;
}

/* Total panic iff EVERY die says PANIC (p.5). Peasants instead
   retreat once per PANIC die, and Kings and Mercenaries never
   panic at all. */
function panicsFrom(def, panics, n) {
  if (!def.panics) return 0;
  if (def.panicPerDie) return panics;
  return panics === n ? 1 : 0;
}

function diceForFigs(type, figs) {
  return Math.min(MAX_DICE, figs * UNIT_DEFS[type].dicePerFig);
}

/* ============================================================
   GAME STATE
   G is pure JSON and is saved verbatim: no Map, no Set, no
   functions, no DOM references, no derived indices. UI holds
   everything transient. G.rng is the LIVE mulberry32 state, so a
   saved game replays identically -- which is why rnd() mutates
   G.rng in place rather than closing over a generator.
   ============================================================ */
let G = null;

function rnd() {
  let a = (G.rng + 0x6D2B79F5) | 0;
  G.rng = a;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rint(n) { return Math.floor(rnd() * n); }
function pickOne(arr) { return arr[rint(arr.length)]; }

function makeUnit(side, type, figs, c, r, face) {
  return { uid: G.nextUid++, side, type, figs, c, r, face, alive: true, attackedThisTurn: false };
}

/* p.3: King centre of the back row, Knights either side of the King,
   Archers either side of the Knights, 5 Infantry directly in front. */
function deployBasic(side) {
  const back = side === 0 ? H - 1 : 0;
  const front = side === 0 ? H - 2 : 1;
  const face = side === 0 ? 0 : 2;          /* 0 = N, 2 = S */
  G.units.push(makeUnit(side, "king", 1, 4, back, face));
  for (const c of [3, 5]) G.units.push(makeUnit(side, "knight", 2, c, back, face));
  for (const c of [2, 6]) G.units.push(makeUnit(side, "archer", 4, c, back, face));
  for (const c of [2, 3, 4, 5, 6]) G.units.push(makeUnit(side, "infantry", 4, c, front, face));
}

function newGame(seed, opts) {
  G = {
    v: 1, seed: seed, rng: seed,
    /* roundCap is NOT a printed rule. It exists only so headless sims
       terminate, and is off (0) in human play. */
    cfg: { setup: (opts && opts.setup) || "basic", opponent: "ai",
           massiveInfantry: false, partialBases: true, roundCap: 0 },
    phase: "play", step: "begin", round: 1, turn: 0, actionsLeft: 2, first: 0,
    /* Pride names are placeholders for the author's own wording. */
    players: [
      { id: 0, pride: "pale", name: "Pale", isBot: false, skill: 1, losses: 0 },
      { id: 1, pride: "dun", name: "Dun", isBot: true, skill: 1, losses: 0 },
    ],
    units: [], botPlan: [], dice: null, log: [], gameOver: false, result: null, nextUid: 1,
  };
  if (G.cfg.setup === "custom") {
    for (const side of [0, 1]) {
      const spec = (opts && opts.specs && opts.specs[side]) || botMuster(side, seed + side * 7919);
      G.players[side].spec = spec;
      deployFromSpec(side, spec);
    }
  } else {
    for (const side of [0, 1]) G.players[side].spec = basicSpec();
    deployBasic(0);
    deployBasic(1);
  }
  /* p.4: "Each player rolls all 4 Combat dice. The player who rolls the
     most Battle-axes will go first." Ties are not addressed by the rules;
     we re-roll (plan section 6, gap 3). */
  for (;;) {
    const a = rollDice(4).filter(f => f === AXE).length;
    const b = rollDice(4).filter(f => f === AXE).length;
    if (a !== b) { G.first = a > b ? 0 : 1; break; }
  }
  G.turn = G.first;
  return G;
}

/* ============================================================
   RULES ENGINE — pure functions over a position P. G satisfies
   the interface, so the same code drives the human, the bots and
   the headless sims. Nothing here touches the DOM.
   ============================================================ */

function idx(c, r) { return r * W + c; }
function inBoard(c, r) { return c >= 0 && c < W && r >= 0 && r < H; }
function stepFrom(c, r, face, k) {
  return { c: c + DIRS[face][0] * k, r: r + DIRS[face][1] * k };
}

/* The one derived index, rebuilt on demand. Storing it in G is how
   saves go stale. */
function buildGrid(P) {
  const g = new Array(W * H).fill(0);
  for (const u of P.units) if (u.alive) g[idx(u.c, u.r)] = u.uid;
  return g;
}
function byUid(P, uid) { return uid ? P.units.find(u => u.uid === uid) : null; }
function unitAt(P, grid, c, r) {
  return inBoard(c, r) ? byUid(P, grid[idx(c, r)]) : null;
}
function livingOf(P, side) { return P.units.filter(u => u.alive && u.side === side); }
function kingOf(P, side) {
  return P.units.find(u => u.alive && u.side === side && u.type === "king") || null;
}
function defOf(u) { return UNIT_DEFS[u.type]; }

/* p.4: "A unit may only move in the direction its warriors are facing."
   Foot moves 1 square per action; Kings and Knights "move as far as they
   want... They stop if blocked by a friendly or enemy unit." A mounted
   unit may stop at ANY distance, not only the maximum. */
function moveSquares(P, grid, u) {
  const out = [];
  const max = defOf(u).mounted ? Math.max(W, H) : 1;
  for (let k = 1; k <= max; k++) {
    const s = stepFrom(u.c, u.r, u.face, k);
    if (!inBoard(s.c, s.r) || grid[idx(s.c, s.r)]) break;
    out.push({ c: s.c, r: s.r, dist: k });
  }
  return out;
}

function actionCost(u, kind) {
  const d = defOf(u);
  if (kind === "attack") return 1;
  return (kind === "move" ? d.moveCost : d.turnCost) || 1;
}

/* p.5: "Archers attack units within the block of 9 squares directly in
   front of them" and "may fire over the heads of units in front of them
   and attack any single enemy unit within the 9 squares." The block is
   3 wide x 3 deep and starts immediately in front. There is no
   line-of-fire rule -- arrows pass over friend and foe alike.

   Heavy Infantry (p.6) "may attack any adjacent square -- forwards,
   sideways, diagonally or to the back... the only unit that does not
   have to face its enemy in order to attack."

   Everyone else (p.4): "You must be next to and facing the unit you are
   attacking. You may attack from the side or rear!" -- the DEFENDER's
   facing is irrelevant, so there is no flanking rule. */
function attackZone(u) {
  const d = defOf(u);
  const out = [];
  if (d.allAdjacent) {
    for (let dc = -1; dc <= 1; dc++) {
      for (let dr = -1; dr <= 1; dr++) {
        if (dc || dr) out.push({ c: u.c + dc, r: u.r + dr });
      }
    }
    return out.filter(s => inBoard(s.c, s.r));
  }
  if (u.type === "archer") {
    const F = DIRS[u.face], R = DIRS[(u.face + 1) % 4];
    for (let dist = 1; dist <= 3; dist++) {
      for (let side = -1; side <= 1; side++) {
        const c = u.c + F[0] * dist + R[0] * side;
        const r = u.r + F[1] * dist + R[1] * side;
        if (inBoard(c, r)) out.push({ c, r });
      }
    }
    return out;
  }
  const s = stepFrom(u.c, u.r, u.face, 1);
  return inBoard(s.c, s.r) ? [s] : [];
}

function attackTargets(P, grid, u) {
  return attackZone(u)
    .map(s => unitAt(P, grid, s.c, s.r))
    .filter(t => t && t.side !== u.side);
}

/* "The number of dice you roll depends on the type of unit and how many
   figures are on it." The box holds 4 dice and nothing can exceed that. */
function diceFor(u) {
  const d = defOf(u);
  const per = (G && G.cfg.massiveInfantry && u.type === "infantry") ? MASSIVE_INFANTRY.maxDice : MAX_DICE;
  return Math.min(per, MAX_DICE, u.figs * d.dicePerFig);
}

function rollDice(n) {
  /* Test seam. A total panic on a full base happens once in 1296
     attacks, so the cascade cannot be reached by simulation alone. */
  if (HARNESS.forceFaces) {
    const forced = HARNESS.forceFaces.splice(0, n);
    if (forced.length === n) return forced;
  }
  const out = [];
  for (let i = 0; i < n; i++) out.push(DIE_FACES[rint(6)]);
  return out;
}

/* p.5 last-man rule: a single Infantry or Archer attacking a target that
   needs two hits rolls one die, and on a hit rolls that die again. A PANIC
   either time panics the attacker. */
function needsLastManDuel(atk, def) {
  return atk.figs === 1 && defOf(atk).dicePerFig === 1 && defOf(def).htk === 2;
}

function resolveAttack(P, grid, atk, def) {
  const ad = defOf(atk);
  const res = { atkUid: atk.uid, defUid: def.uid, faces: [], hits: 0, removed: 0,
                panicSteps: 0, duel: false, victimRetreat: 0, killed: false,
                /* An ordered record of the cascade, so the presentation can
                   replay it as a chain rather than a single jump. Pure data:
                   it serialises with the rest of G. */
                retreats: [] };

  if (needsLastManDuel(atk, def)) {
    res.duel = true;
    const f1 = rollDice(1)[0];
    res.faces.push(f1);
    if (f1 === PANIC) { res.panicSteps = 1; return res; }
    if (f1 === ad.hitFace) {
      const f2 = rollDice(1)[0];
      res.faces.push(f2);
      if (f2 === PANIC) { res.panicSteps = 1; return res; }
      if (f2 === ad.hitFace) res.hits = 2;
    }
  } else {
    const n = diceFor(atk);
    res.faces = rollDice(n);
    const axes = res.faces.filter(f => f === AXE).length;
    const arrows = res.faces.filter(f => f === ARROW).length;
    const panics = res.faces.filter(f => f === PANIC).length;
    res.hits = hitsFrom(ad, axes, arrows);
    res.panicSteps = panicsFrom(ad, panics, n);
    /* Mercenaries never panic; instead their victim retreats once per
       PANIC they rolled, unless it is an enemy King or Mercenary. */
    if (ad.panicsVictim && panics) {
      const dd = defOf(def);
      if (dd.panics) res.victimRetreat = panics;
    }
  }

  /* "If it's not a total panic, disregard the PANICs you rolled." A TOTAL
     panic takes the hits with it -- which is vacuous for most units, since
     every die must read PANIC for it to happen, so there are no hits to lose.
     Peasants are the exception: they panic per die and KEEP their hits.
     Rulebook p.6, verbatim: "You roll 4 dice and they come up 2 Battle-axes,
     1 Arrow and 1 PANIC. You choose the Battle-axes (= 2 hits) AND you
     observe the PANIC." */
  if (res.panicSteps && !ad.panicPerDie) { res.hits = 0; return res; }

  /* "remove 1 figure ... for every Battle-ax"; a Knight, King or Heavy
     Infantry "must be hit twice in the same Attack to be eliminated". */
  res.removed = Math.floor(res.hits / defOf(def).htk);
  return res;
}

function applyRemoval(P, def, count) {
  if (count <= 0) return false;
  def.figs -= count;
  if (def.figs <= 0) { def.figs = 0; def.alive = false; return true; }
  return false;
}

/* p.5 PANIC. Blocked retreats ELIMINATE rather than fizzle, so every case
   resolves and there is no invalid chain to roll back:
     - off the board            -> the retreating unit is eliminated
     - into an enemy            -> the retreating unit is eliminated
     - into your own King       -> the retreating unit is eliminated
     - into a Mercenary         -> the retreating unit is eliminated (p.7)
     - into your own other unit -> that unit also panics, and the chain
                                   continues. "Watch out for chain reactions!" */
function panicRetreat(P, u, steps, depth, trace) {
  if (!u.alive || !defOf(u).panics) return;
  if ((depth || 0) > 64) return;                 /* cycles are impossible, but never trust that */
  const rec = dead => { if (trace) trace.push({ uid: u.uid, c: u.c, r: u.r, dead: !!dead, depth: depth || 0 }); };
  u.face = (u.face + 2) % 4;                     /* about-face */
  for (let i = 0; i < steps; i++) {
    if (!u.alive) return;
    const grid = buildGrid(P);
    const s = stepFrom(u.c, u.r, u.face, 1);
    if (!inBoard(s.c, s.r)) { u.alive = false; u.figs = 0; rec(true); return; }
    const occ = unitAt(P, grid, s.c, s.r);
    if (occ) {
      const blocked = occ.side !== u.side || occ.type === "king" || occ.type === "mercenary";
      if (blocked) { u.alive = false; u.figs = 0; rec(true); return; }
      panicRetreat(P, occ, 1, (depth || 0) + 1, trace);
      if (occ.alive && occ.c === s.c && occ.r === s.r) return;   /* ally could not clear */
    }
    u.c = s.c; u.r = s.r;
    rec(false);
  }
}

/* p.8: win by eliminating the King, OR by leaving the rival's King
   standing ALONE on the field -- not by wiping the whole army. */
function checkVictory(P) {
  for (const side of [0, 1]) {
    if (!kingOf(P, side)) return { winner: 1 - side, reason: "king" };
    if (livingOf(P, side).length === 1) return { winner: 1 - side, reason: "alone" };
  }
  return null;
}

/* ============================================================
   ACTIONS — legalActions() drives BOTH the UI's highlighting and
   the AI, so there is exactly one definition of what is legal.
   ============================================================ */
function legalActions(P, grid, side) {
  const out = [];
  for (const u of P.units) {
    if (!u.alive || u.side !== side) continue;
    if (actionCost(u, "move") <= P.actionsLeft) {
      for (const m of moveSquares(P, grid, u)) {
        out.push({ kind: "move", uid: u.uid, c: m.c, r: m.r, dist: m.dist });
      }
    }
    if (actionCost(u, "turn") <= P.actionsLeft) {
      for (let f = 0; f < 4; f++) if (f !== u.face) out.push({ kind: "turn", uid: u.uid, face: f });
    }
    /* "An individual unit may not attack more than once per turn." */
    if (!u.attackedThisTurn && actionCost(u, "attack") <= P.actionsLeft) {
      for (const t of attackTargets(P, grid, u)) {
        out.push({ kind: "attack", uid: u.uid, defUid: t.uid });
      }
    }
  }
  return out;
}

function applyAction(P, a) {
  const u = byUid(P, a.uid);
  P.actionsLeft -= actionCost(u, a.kind);
  if (a.kind === "move") { u.c = a.c; u.r = a.r; return; }
  if (a.kind === "turn") { u.face = a.face; return; }

  const grid = buildGrid(P);
  const def = byUid(P, a.defUid);
  const res = resolveAttack(P, grid, u, def);
  u.attackedThisTurn = true;
  P.dice = res;
  if (res.removed) res.killed = applyRemoval(P, def, res.removed);
  if (res.panicSteps) panicRetreat(P, u, res.panicSteps, 0, res.retreats);
  if (res.victimRetreat && def.alive) panicRetreat(P, def, res.victimRetreat, 0, res.retreats);
}

function endTurn(P) {
  P.turn = 1 - P.turn;
  if (P.turn === P.first) P.round++;
  P.actionsLeft = 2;
  for (const u of P.units) if (u.side === P.turn) u.attackedThisTurn = false;
}

/* ============================================================
   INVARIANTS — conservation laws, not per-feature unit tests,
   which is why they can run on every single step with no
   fixtures. Each throw carries the phase and round so a failing
   seed is reproducible. Every one of these has been watched
   going red; a check nobody has seen fail is indistinguishable
   from one that cannot fail.
   ============================================================ */
const HARNESS = {
  watermark: {}, expectedUnits: 0, tally: null,
  forceFaces: null,
  resetTally() {
    this.tally = { attacks: 0, hits: 0, figsRemoved: 0, panics: 0,
                   victimRetreats: 0, duels: 0, actions: {} };
  },
};

function assertInvariants() {
  const where = `at ${G.phase}.${G.step} round ${G.round} turn ${G.turn}`;

  if (G.units.length !== HARNESS.expectedUnits) {
    throw new Error(`Unit conservation broken: ${G.units.length} vs ${HARNESS.expectedUnits} ${where}`);
  }

  const seen = new Set();
  const occupied = new Set();
  for (const u of G.units) {
    if (seen.has(u.uid)) throw new Error(`Duplicate uid ${u.uid} ${where}`);
    seen.add(u.uid);

    if (!Number.isInteger(u.face) || u.face < 0 || u.face > 3) {
      throw new Error(`Bad facing ${u.face} on uid ${u.uid} ${where}`);
    }
    if (!Number.isInteger(u.figs) || u.figs < 0) {
      throw new Error(`Bad figure count ${u.figs} on uid ${u.uid} ${where}`);
    }

    /* Figures are removed, never added. */
    const wm = HARNESS.watermark[u.uid];
    if (wm !== undefined && u.figs > wm) {
      throw new Error(`Figures increased on uid ${u.uid}: ${wm} -> ${u.figs} ${where}`);
    }
    HARNESS.watermark[u.uid] = u.figs;

    if (u.alive) {
      if (u.figs < 1 || u.figs > perBaseOf(u.type)) {
        throw new Error(`Living ${u.type} has ${u.figs} figures ${where}`);
      }
      if (!inBoard(u.c, u.r) || !Number.isInteger(u.c) || !Number.isInteger(u.r)) {
        throw new Error(`uid ${u.uid} off-board at ${u.c},${u.r} ${where}`);
      }
      const k = idx(u.c, u.r);
      if (occupied.has(k)) throw new Error(`Two living units on ${u.c},${u.r} ${where}`);
      occupied.add(k);

      /* The box holds 4 combat dice. Nothing may exceed that. */
      const n = diceFor(u);
      if (n < 1 || n > MAX_DICE) throw new Error(`${u.type} would roll ${n} dice ${where}`);
    } else if (u.figs !== 0) {
      throw new Error(`Dead uid ${u.uid} still has ${u.figs} figures ${where}`);
    }
  }

  for (const side of [0, 1]) {
    const kings = G.units.filter(u => u.side === side && u.type === "king").length;
    if (kings !== 1) throw new Error(`Side ${side} has ${kings} kings ${where}`);
  }

  /* Dead units must be invisible to both the grid and the action list. */
  const grid = buildGrid(G);
  for (const u of G.units) {
    if (!u.alive && grid[idx(u.c, u.r)] === u.uid) {
      throw new Error(`Dead uid ${u.uid} still occupies the grid ${where}`);
    }
  }
  if (!G.gameOver) {
    for (const a of legalActions(G, grid, G.turn)) {
      if (!byUid(G, a.uid).alive) throw new Error(`Dead uid ${a.uid} has a legal action ${where}`);
    }
  }

  if (!G.gameOver && checkVictory(G)) {
    throw new Error(`Victory reached but the game kept playing ${where}`);
  }

  if (!Number.isInteger(G.actionsLeft) || G.actionsLeft < 0 || G.actionsLeft > 2) {
    throw new Error(`actionsLeft = ${G.actionsLeft} ${where}`);
  }
  if (G.turn !== 0 && G.turn !== 1) throw new Error(`turn = ${G.turn} ${where}`);
}

function assertSerialisable() {
  const round = JSON.parse(JSON.stringify(G));
  if (JSON.stringify(round) !== JSON.stringify(G)) throw new Error("G does not round-trip through JSON");
}

/* ============================================================
   HEADLESS SIM — random legal moves, both sides. This is a
   crash-and-termination harness, NOT a balance harness: the
   numbers are Larry Harris's and tuning them is exactly what
   this port exists to avoid. What it can legitimately reveal is
   a MISREAD rule.
   ============================================================ */
function playRandomGame(seed) {
  newGame(seed);
  G.cfg.roundCap = 60;                    /* sims must terminate; human play has no cap */
  HARNESS.watermark = {};
  HARNESS.expectedUnits = G.units.length;
  if (!HARNESS.tally) HARNESS.resetTally();
  let steps = 0;

  while (!G.gameOver) {
    if (++steps > 20000) throw new Error(`Runaway at round ${G.round} seed ${seed}`);

    const v = checkVictory(G);
    if (v) { G.result = v; G.gameOver = true; break; }
    if (G.cfg.roundCap && G.round > G.cfg.roundCap) {
      G.result = { winner: null, reason: "cap" }; G.gameOver = true; break;
    }

    const grid = buildGrid(G);
    const acts = legalActions(G, grid, G.turn);
    if (!acts.length || G.actionsLeft <= 0) { endTurn(G); assertInvariants(); continue; }

    const chosen = pickWeighted(acts);
    HARNESS.tally.actions[chosen.kind] = (HARNESS.tally.actions[chosen.kind] || 0) + 1;
    applyAction(G, chosen);

    if (chosen.kind === "attack") {
      const d = G.dice;
      HARNESS.tally.attacks++;
      HARNESS.tally.hits += d.hits;
      HARNESS.tally.figsRemoved += d.removed;
      if (d.panicSteps) HARNESS.tally.panics++;
      if (d.victimRetreat) HARNESS.tally.victimRetreats++;
      if (d.duel) HARNESS.tally.duels++;
    }

    /* Victory must be recorded BEFORE the invariants run: an action can end
       the game, and "gameOver === (checkVictory() !== null)" is one of them. */
    const won = checkVictory(G);
    if (won) { G.result = won; G.gameOver = true; }

    assertInvariants();
    if (steps % 20 === 0) assertSerialisable();
  }
  assertInvariants();
  return { seed, steps, rounds: G.round, result: G.result,
           survivors: [livingOf(G, 0).length, livingOf(G, 1).length] };
}

/* Uniform-random selection is a terrible driver: every unit always offers
   three Turn options and rarely an Attack, so 85% of actions are spent
   turning in place and the engine is barely exercised. This still picks
   at random -- it is not an AI and makes no positional judgement -- but it
   prefers acting over fidgeting, which is what makes the sim reach combat,
   panic and victory at all. */
function pickWeighted(acts) {
  const attacks = acts.filter(a => a.kind === "attack");
  if (attacks.length && rnd() < 0.75) return pickOne(attacks);
  const moves = acts.filter(a => a.kind === "move");
  if (moves.length && rnd() < 0.80) return pickOne(moves);
  return pickOne(acts);
}

/* Bot-vs-bot. Sides are swapped halfway so a first-move edge cannot be
   mistaken for a skill edge. */
function playBotGame(seed, skillLo, skillHi, swap) {
  newGame(seed);
  G.cfg.roundCap = 60;
  const s0 = swap ? skillHi : skillLo, s1 = swap ? skillLo : skillHi;
  G.players[0].isBot = true; G.players[0].skill = s0;
  G.players[1].isBot = true; G.players[1].skill = s1;
  HARNESS.watermark = {};
  HARNESS.expectedUnits = G.units.length;

  let steps = 0;
  while (!G.gameOver) {
    if (++steps > 20000) throw new Error(`Runaway at round ${G.round} seed ${seed}`);
    const v = checkVictory(G);
    if (v) { G.result = v; G.gameOver = true; break; }
    if (G.round > G.cfg.roundCap) { G.result = { winner: null, reason: "cap" }; G.gameOver = true; break; }
    const grid = buildGrid(G);
    if (G.actionsLeft <= 0 || !legalActions(G, grid, G.turn).length) { endTurn(G); assertInvariants(); continue; }
    const plan = botChooseTurnChecked(G, G.turn, G.players[G.turn].skill);
    if (!plan.length) { endTurn(G); assertInvariants(); continue; }
    for (const a of plan) {
      const g2 = buildGrid(G);
      if (!legalActions(G, g2, G.turn).some(x => sameAction(x, a))) break;
      applyAction(G, a);
      const won = checkVictory(G);
      if (won) { G.result = won; G.gameOver = true; }
      assertInvariants();
      if (G.gameOver) break;
    }
  }
  /* Which SKILL won, independent of which side it played. */
  const winnerSkill = G.result.winner === null ? null : G.players[G.result.winner].skill;
  return { winnerSkill, reason: G.result.reason, rounds: G.round };
}

function runMatch(skillLo, skillHi, games, startSeed) {
  HARNESS.resetTally();
  HARNESS.maxPlanMs = 0;
  const t0 = Date.now();
  const out = { lo: SKILL[skillLo].name, hi: SKILL[skillHi].name,
                loWins: 0, hiWins: 0, draws: 0, crashes: [], rounds: [] };
  for (let i = 0; i < games; i++) {
    const seed = (startSeed || 1) + i;
    try {
      const r = playBotGame(seed, skillLo, skillHi, i % 2 === 1);
      out.rounds.push(r.rounds);
      if (r.winnerSkill === null) out.draws++;
      else if (r.winnerSkill === skillHi) out.hiWins++;
      else out.loWins++;
    } catch (e) { out.crashes.push({ seed, error: e.message }); }
  }
  const played = out.loWins + out.hiWins;
  return {
    matchup: `${out.hi} vs ${out.lo}`, games, crashes: out.crashes,
    hiWins: out.hiWins, loWins: out.loWins, draws: out.draws,
    hiWinRate: played ? +(out.hiWins / played).toFixed(3) : 0,
    avgRounds: out.rounds.length ? +(out.rounds.reduce((a, b) => a + b, 0) / out.rounds.length).toFixed(1) : 0,
    maxPlanMs: +(HARNESS.maxPlanMs || 0).toFixed(1),
    ms: Date.now() - t0,
  };
}

function runSim(n, startSeed) {
  const t0 = Date.now();
  HARNESS.resetTally();
  const out = { games: 0, crashes: [], byReason: {}, winsBySide: { 0: 0, 1: 0 },
                rounds: [], firstStrikeWins: 0, steps: [] };
  for (let i = 0; i < n; i++) {
    const seed = (startSeed || 1) + i;
    try {
      const r = playRandomGame(seed);
      out.games++;
      out.rounds.push(r.rounds);
      out.steps.push(r.steps);
      out.byReason[r.result.reason] = (out.byReason[r.result.reason] || 0) + 1;
      if (r.result.winner !== null) {
        out.winsBySide[r.result.winner]++;
        if (r.result.winner === G.first) out.firstStrikeWins++;
      }
    } catch (e) {
      out.crashes.push({ seed, error: e.message });
    }
  }
  const avg = a => a.length ? +(a.reduce((s, v) => s + v, 0) / a.length).toFixed(1) : 0;
  return {
    games: out.games, crashes: out.crashes, byReason: out.byReason,
    winsBySide: out.winsBySide,
    firstStrikeWinRate: out.games ? +(out.firstStrikeWins / out.games).toFixed(3) : 0,
    avgRounds: avg(out.rounds), minRounds: Math.min(...out.rounds), maxRounds: Math.max(...out.rounds),
    avgSteps: avg(out.steps),
    combat: HARNESS.tally,
    ms: Date.now() - t0,
  };
}


/* ============================================================
   SAVE / LOAD
   G is pure JSON, so the save is the game. Every localStorage
   touch is wrapped: quota and private mode must not break play,
   they may only cost you the resume.
   ============================================================ */
const SAVE_KEY = "pumaheart_save_v1";
const TUTORIAL_KEY = "pumaheart_tutorial_v1";
const MUTED_KEY = "pumaheart_muted_v1";
const SPEED_KEY = "pumaheart_speed_v1";

function saveGame() {
  if (!G || G.gameOver || UI.headless) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, G })); }
  catch (e) { /* quota or private mode -- the game still plays, it just won't resume */ }
}
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    return s && s.G && !s.G.gameOver ? s.G : null;
  } catch (e) { return null; }
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

/* ============================================================
   PHASE MACHINE
   STEP[phase][step]() mutates G, sets the next phase/step and
   returns WAIT (human input needed), ANIM (presentation queued)
   or NEXT (keep going). Bots never WAIT, so hot-seat, AI and the
   headless sims all fall out of the single isHuman() branch.
   ============================================================ */
const WAIT = "wait", ANIM = "anim", NEXT = "next";

function go(phase, step) { G.phase = phase; G.step = step; }
function isHuman(side) { return !G.players[side].isBot && !UI.autoHuman; }

function animate(events) {
  if (UI.headless || UI.reducedMotion) return NEXT;
  UI.eventQueue = events.concat([{ type: "callback", fn: advance }]);
  UI.animating = true;
  processEventQueue();
  return ANIM;
}

const STEP = {
  play: {
    begin() {
      for (const u of G.units) if (u.side === G.turn) u.attackedThisTurn = false;
      G.actionsLeft = 2;
      const v = checkVictory(G);
      if (v) { G.result = v; G.gameOver = true; go("gameover", "done"); return NEXT; }
      if (G.cfg.roundCap && G.round > G.cfg.roundCap) {
        G.result = { winner: null, reason: "cap" }; G.gameOver = true;
        go("gameover", "done"); return NEXT;
      }
      go("play", "act"); return NEXT;
    },

    act() {
      const grid = buildGrid(G);
      const acts = legalActions(G, grid, G.turn);
      if (!acts.length || G.actionsLeft <= 0) { go("play", "endTurn"); return NEXT; }
      if (isHuman(G.turn)) return WAIT;              /* the only human WAIT in play */
      if (!G.botPlan || !G.botPlan.length) {
        G.botPlan = botChooseTurnChecked(G, G.turn, G.players[G.turn].skill);
      }
      if (!G.botPlan.length) { go("play", "endTurn"); return NEXT; }
      go("play", "botAct"); return NEXT;
    },

    botAct() {
      const a = G.botPlan.shift();
      const grid = buildGrid(G);
      const still = legalActions(G, grid, G.turn).some(x => sameAction(x, a));
      if (!still) { go("play", "act"); return NEXT; }
      return doAction(a);
    },

    /* Entered by doAction for an attack. The state is already final here:
       this step is presentation and bookkeeping only. */
    resolve() {
      go("play", "act");
      return animate(attackEvents(G.dice));
    },

    endTurn() {
      const v = checkVictory(G);
      if (v) { G.result = v; G.gameOver = true; go("gameover", "done"); return NEXT; }
      if (G.cfg.roundCap && G.round > G.cfg.roundCap) {
        G.result = { winner: null, reason: "cap" }; G.gameOver = true;
        go("gameover", "done"); return NEXT;
      }
      endTurn(G);
      G.botPlan = [];
      if (G.cfg.opponent === "hotseat" && isHuman(G.turn)) { go("play", "handoff"); return NEXT; }
      go("play", "begin"); return NEXT;
    },

    handoff() {
      UI.curtain = true;
      go("play", "begin");
      return WAIT;                                   /* the curtain's Ready button calls advance() */
    },
  },

  gameover: {
    done() { UI.curtain = false; return WAIT; },
  },
};

function sameAction(a, b) {
  return a.kind === b.kind && a.uid === b.uid &&
         a.c === b.c && a.r === b.r && a.face === b.face && a.defUid === b.defUid;
}

/* The single mutation entry point used by BOTH the human input layer and
   the bot, so there is one path through which the game can change. */
function doAction(a) {
  /* Logged here rather than in the human input path, so the field report
     records BOTH sides. Attacks are logged by attackEvents() instead, which
     also reports the dice. */
  const actor = byUid(G, a.uid);
  const who = `${G.players[actor.side].name} ${defOf(actor).name}`;
  if (a.kind === "move") { log(`${who} advances to ${squareName(a.c, a.r)}.`); sfx("move"); }
  if (a.kind === "turn") { log(`${who} faces ${FACE_NAMES[a.face]}.`); sfx("turn"); }

  applyAction(G, a);
  const v = checkVictory(G);
  if (v) { G.result = v; G.gameOver = true; }
  if (a.kind === "attack" && !G.gameOver) { go("play", "resolve"); return NEXT; }
  if (G.gameOver) { go("gameover", "done"); return NEXT; }
  go("play", "act");
  return NEXT;
}

/* Trampoline. The runaway guard is not paranoia: a step that forgets to
   call go() loops for ever, and a silent hang is far worse than a throw. */
function advance() {
  if (!G) return;
  if (UI.animating || UI.advancing) { UI.needAdvance = true; return; }
  UI.advancing = true;
  let guard = 0;
  try {
    for (;;) {
      if (++guard > 2000) { console.error("Phase machine runaway at", G.phase, G.step); break; }
      const fn = STEP[G.phase] && STEP[G.phase][G.step];
      if (!fn) { console.error("Unknown step", G.phase, G.step); break; }
      const r = fn();
      if (r === WAIT) { if (UI.autoHuman && !G.gameOver) { continue; } break; }
      if (r === ANIM) { UI.advancing = false; return; }
    }
  } finally { UI.advancing = false; }
  commit();
}

function commit() {
  saveGame();
  if (UI.headless) { assertInvariants(); return; }
  updateAll();
  if (UI.needAdvance) { UI.needAdvance = false; advance(); }
}

/* ============================================================
   GLYPHS — one silhouette path per unit type on a 24x24 box.
   Drawn as paths, never as text: no web fonts are loaded and a
   glyph must not depend on one being present. These are the
   BOARD treatment; the 16x16 pixel portraits (B5b) are the
   status-panel treatment, because a portrait is unreadable at
   32px.
   ============================================================ */
const UNIT_GLYPH = {
  king: "M3 17l1.6-9 4 4.4L12 4l3.4 8.4 4-4.4L21 17zM4 18.4h16V21H4z",
  knight: "M8.6 3.4c3.4-1 7 .6 8.2 3.6 1.4 3.4-.4 6.4-2.6 8.4l1.4 5.6H6.6l1.2-4.8-3-1.6c-1.6-1-1.4-3 .4-3.6l2-.8-.6-3.4c-.2-1.6.8-2.8 2-3.4z",
  heavy: "M12 2.6l8.4 3v6.2c0 5.4-4.2 8.8-8.4 9.8-4.2-1-8.4-4.4-8.4-9.8V5.6zM12 6v12",
  infantry: "M11 2.4h2l1.6 4.2v9.2h-5.2V6.6zM7.4 15h9.2v2.2H7.4zM11 17.8h2V22h-2z",
  archer: "M7.4 2.6C11.8 5 13.6 8.8 13.6 12s-1.8 7-6.2 9.4l1.2-2.2c3-2 4.2-4.6 4.2-7.2s-1.2-5.2-4.2-7.2zM8.6 4.4l9 7.6-9 7.6",
  mercenary: "M12 2l2.4 5.2L12 9.6 9.6 7.2zM11 9.6h2V22h-2zM13 10.6h6.4v4.4H13z",
  peasant: "M5.4 2.6v6.2M9.6 2.6v6.2M13.8 2.6v6.2M4 8.8h11.2M9.2 8.8V22",
};
const GLYPH_STROKE = { archer: true, peasant: true, heavy: true };

/* ============================================================
   RENDERING
   updateAll() is the ONLY render entry point; sub-renderers
   build strings. Every interpolated value goes through esc().
   ============================================================ */
function squareName(c, r) {
  /* Files a-i, ranks counted from side 0's back row, so side 0's King
     starts on e1 and side 1's on e8. */
  return "abcdefghi"[c] + (H - r);
}

function unitAria(u) {
  const d = defOf(u);
  return `${G.players[u.side].name} ${d.name} at ${squareName(u.c, u.r)}, facing ${FACE_NAMES[u.face]}, `
       + `${u.figs} of ${d.perBase} ${u.figs === 1 ? "figure" : "figures"}`;
}

function renderUnit(u) {
  const d = defOf(u);
  const stroke = GLYPH_STROKE[u.type];
  const maxPer = perBaseOf(u.type);
  const pips = maxPer > 6
    ? `<b class="pipnum">${u.figs}</b>`          /* ten pips are a smear at 32px */
    : Array.from({ length: maxPer }, (_, i) =>
        `<i class="${i < u.figs ? "on" : "off"}"></i>`).join("");
  const sel = UI.sel === u.uid ? " is-sel" : "";
  return `<div class="u s${u.side}${sel}" data-uid="${u.uid}" data-face="${u.face}"
    role="button" tabindex="-1" aria-label="${esc(unitAria(u))}">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="${stroke ? "ln" : "fl"}">
      <path d="${UNIT_GLYPH[u.type]}"/>
    </svg>
    <span class="pips" aria-hidden="true">${pips}</span>
  </div>`;
}

function renderBoard() {
  const grid = buildGrid(G);
  const sel = UI.sel ? byUid(G, UI.sel) : null;
  const moves = new Set(), targets = new Set(), zone = new Set();
  if (sel && sel.alive) {
    for (const m of moveSquares(G, grid, sel)) moves.add(idx(m.c, m.r));
    for (const t of attackTargets(G, grid, sel)) targets.add(idx(t.c, t.r));
    if (sel.type === "archer" || defOf(sel).allAdjacent) {
      for (const s of attackZone(sel)) zone.add(idx(s.c, s.r));
    }
  }

  let html = "";
  for (let r = 0; r < H; r++) {
    for (let c = 0; c < W; c++) {
      const k = idx(c, r);
      const u = byUid(G, grid[k]);
      const cls = ["sq"];
      if ((c + r) % 2 === 0) cls.push("lt");
      if (r <= 1) cls.push("dz1");
      if (r >= H - 2) cls.push("dz0");
      if (zone.has(k)) cls.push("zone");
      if (moves.has(k)) cls.push("mv");
      if (targets.has(k)) cls.push("tg");
      const label = u ? esc(unitAria(u)) : `${squareName(c, r)}, empty`;
      html += `<div class="${cls.join(" ")}" role="gridcell" data-c="${c}" data-r="${r}"
        tabindex="${UI.cur === k ? 0 : -1}" aria-label="${label}">${u ? renderUnit(u) : ""}</div>`;
    }
  }
  const g = document.getElementById("grid");
  g.style.gridTemplateColumns = `repeat(${W}, var(--sq))`;
  g.innerHTML = html;
}

function renderHUD() {
  const sp = document.getElementById("hud-speed");
  if (sp) sp.textContent = "Speed: " + SPEED_NAME[UI.speed];
  const mu = document.getElementById("hud-mute");
  if (mu) mu.textContent = UI.muted ? "Sound off" : "Sound on";
  const p = G.players[G.turn];
  const pips = `<span class="acts" aria-hidden="true">${
    "●".repeat(G.actionsLeft)}${"○".repeat(Math.max(0, 2 - G.actionsLeft))}</span>`;
  const who = G.gameOver
    ? (G.result.winner === null ? "Stalemate" : `${esc(G.players[G.result.winner].name)} wins`)
    : `${esc(p.name)} to act`;
  document.getElementById("hud-turn").textContent = who;
  document.getElementById("hud-state").innerHTML =
    `<span class="side s${G.turn}">${who}</span> ${G.gameOver ? "" : pips}
     <span class="rnd">Round ${G.round}</span>`;
}

function renderStatus() {
  const u = UI.sel ? byUid(G, UI.sel) : null;
  const el = document.getElementById("status-body");
  if (!u || !u.alive) { el.innerHTML = `<p class="dim">No unit selected.</p>`; return; }
  const d = defOf(u);
  el.innerHTML = `
    <p class="unit-name side s${u.side}">${esc(d.name)}</p>
    <dl class="stats">
      <dt>Square</dt><dd>${squareName(u.c, u.r)}</dd>
      <dt>Facing</dt><dd>${FACE_NAMES[u.face]}</dd>
      <dt>Figures</dt><dd>${u.figs} of ${perBaseOf(u.type)}</dd>
      <dt>Dice</dt><dd>${diceFor(u)}</dd>
      <dt>Hits to kill each</dt><dd>${d.htk}</dd>
    </dl>
    ${d.note ? `<p class="note">${esc(d.note)}</p>` : ""}`;
}

/* Hot-seat handoff. Without a dismissible curtain the machine parks on a
   WAIT that nothing resumes, and the next action skips the step that checks
   for victory. */
function renderCurtain() {
  const el = document.getElementById("curtain");
  if (!UI.curtain || G.gameOver) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<div class="box curtain-card">
    <span class="box-label">Handover</span>
    <p>Pass the field to <span class="side s${G.turn}">${esc(G.players[G.turn].name)}</span>.</p>
    <button class="btn" data-act="ready" autofocus>Ready</button>
  </div>`;
}

function renderLog() {
  document.getElementById("log-list").innerHTML =
    G.log.slice(-40).reverse().map(l => `<li>${esc(l)}</li>`).join("");
}

function log(msg) {
  G.log.push(msg);
  if (G.log.length > 200) G.log.shift();
  announce(msg);
}

/* Screen-reader commentary only. Action counts and cursor feedback matter
   to someone who cannot see the pips, but they are noise in the visible
   field report, which is a record of what happened on the field. */
function announce(msg) {
  const a = document.getElementById("announcements");
  if (a) a.textContent = msg;
}

function updateAll() {
  if (UI.headless || !G) return;
  snapshotRects();
  renderBoard();
  playFlip();
  renderTray();
  renderHUD();
  renderStatus();
  renderCurtain();
  renderMuster();
  renderMenu();
  renderHelp();
  renderTutorial();
  renderLog();
  restoreFocus();
}

/* updateAll() replaces #grid.innerHTML wholesale, which destroys the focused
   cell. Without this, keyboard play breaks silently after the first action. */
function restoreFocus() {
  const g = document.getElementById("grid");
  if (!g || UI.cur == null) return;
  const cell = g.querySelector(`[data-c="${UI.cur % W}"][data-r="${Math.floor(UI.cur / W)}"]`);
  if (!cell) return;
  cell.setAttribute("tabindex", "0");
  if (UI.focusInGrid) cell.focus();
}

/* ============================================================
   EVENT QUEUE — presentation only: the state is already final
   by the time these run. Reduced motion skips the queue
   entirely rather than merely disabling CSS transitions.
   ============================================================ */
function attackEvents(res) {
  const atk = byUid(G, res.atkUid), def = byUid(G, res.defUid);
  const parts = [`${G.players[atk.side].name} ${defOf(atk).name} attacks`,
                 `${G.players[def.side].name} ${defOf(def).name}`,
                 `\u2014 ${res.faces.map(f => DIE_NAME[f]).join(", ")}`];
  if (res.panicSteps && !defOf(atk).panicPerDie) parts.push("\u2014 PANIC!");
  else if (res.removed) parts.push(`\u2014 ${res.removed} lost`);
  else parts.push("\u2014 no effect");

  const ev = [
    { type: "sfx", name: "dice" },
    { type: "render" },                    /* the tray shows the faces */
    { type: "wait", delay: 420 },          /* read them */
    { type: "log", text: parts.join(" ") },
  ];
  if (res.removed) ev.push({ type: "sfx", name: res.killed ? "kill" : "hit" });
  if (res.retreats && res.retreats.length) ev.push({ type: "sfx", name: "panic" });
  /* One beat per link of the cascade, so a chain reaction reads as a chain. */
  ev.push({ type: "wait", delay: 220 + 70 * ((res.retreats && res.retreats.length) || 0) });
  return ev;
}

function processEventQueue() {
  const q = UI.eventQueue;
  const nextEvent = () => {
    if (!q.length) { UI.animating = false; return; }
    const e = q.shift();
    if (e.type === "log") { log(e.text); nextEvent(); return; }
    if (e.type === "sfx") { sfx(e.name); nextEvent(); return; }
    if (e.type === "render") { updateAll(); nextEvent(); return; }
    if (e.type === "callback") { UI.animating = false; e.fn(); return; }
    if (e.type === "wait") {
      setTimeout(nextEvent, e.delay * (UI.speedFactor == null ? 1 : UI.speedFactor));
      return;
    }
    nextEvent();
  };
  nextEvent();
}

/* ============================================================
   HUMAN INPUT
   One click listener and one keydown listener on #app, routed by
   data-act, plus contextual activation on the grid. Selection is
   the only mode: clicking a legal destination moves, clicking a
   legal target attacks, so ordinary play never needs a mode
   switch. Everything reachable by mouse is reachable by key.
   ============================================================ */

function clone(o) { return JSON.parse(JSON.stringify(o)); }

function pushUndo() {
  if (!UI.undo) UI.undo = [];
  UI.undo.push(clone(G));
  if (UI.undo.length > 40) UI.undo.shift();
}
function canUndo() { return !!(UI.undo && UI.undo.length && !G.gameOver); }
function doUndo() {
  if (!canUndo()) return;
  G = UI.undo.pop();
  UI.sel = null;
  log("Order withdrawn.");
  updateAll();
}

function selUnit() {
  const u = UI.sel ? byUid(G, UI.sel) : null;
  return u && u.alive ? u : null;
}
function myTurn() {
  return !G.gameOver && isHuman(G.turn) && !UI.animating && !UI.curtain && !UI.musterOpen && !UI.menuOpen && !UI.helpOpen && !UI.tutorialOpen;
}

function selectUnit(uid) {
  const u = byUid(G, uid);
  if (!u || !u.alive) return;
  UI.sel = UI.sel === uid ? null : uid;
  if (UI.sel) sfx("select");
  if (UI.sel) UI.cur = idx(u.c, u.r);
  updateAll();
}

/* An attack reveals information, so it seals everything before it: you may
   take a move back, never a dice roll. */
function tryAction(a) {
  if (!myTurn()) return false;
  const grid = buildGrid(G);
  if (!legalActions(G, grid, G.turn).some(x => sameAction(x, a))) return false;

  if (a.kind === "attack") { UI.undo = []; } else { pushUndo(); }

  doAction(a);
  if (a.kind === "move" || a.kind === "turn") UI.cur = idx(byUid(G, a.uid).c, byUid(G, a.uid).r);
  if (!byUid(G, a.uid).alive) UI.sel = null;
  advance();
  announceActions();
  return true;
}

function announceActions() {
  if (G.gameOver) return;
  const n = G.actionsLeft;
  announce(n === 0 ? "No actions left." : n === 1 ? "One action left." : "Two actions left.");
}

/* Contextual activation: the square under the cursor decides what happens,
   which is what keeps play to two clicks with no mode switching. */
function activateSquare(c, r) {
  if (!myTurn()) return;
  const grid = buildGrid(G);
  const u = unitAt(G, grid, c, r);
  const sel = selUnit();

  if (sel) {
    const target = u && u.side !== sel.side
      ? legalActions(G, grid, G.turn).find(a => a.kind === "attack" && a.uid === sel.uid && a.defUid === u.uid)
      : null;
    if (target) { tryAction(target); return; }
    const move = legalActions(G, grid, G.turn)
      .find(a => a.kind === "move" && a.uid === sel.uid && a.c === c && a.r === r);
    if (move) { tryAction(move); return; }
  }
  if (u && u.side === G.turn) { selectUnit(u.uid); return; }
  if (sel) { UI.sel = null; updateAll(); }
}

function faceSelected(face) {
  const sel = selUnit();
  if (!sel || sel.face === face) return;
  tryAction({ kind: "turn", uid: sel.uid, face });
}

/* Attack ahead: fires when exactly one target is legal, otherwise parks the
   cursor on the first so the choice is visible rather than guessed. */
function attackAhead() {
  const sel = selUnit();
  if (!sel) return;
  const grid = buildGrid(G);
  const acts = legalActions(G, grid, G.turn).filter(a => a.kind === "attack" && a.uid === sel.uid);
  if (!acts.length) return;
  if (acts.length === 1) { tryAction(acts[0]); return; }
  const t = byUid(G, acts[0].defUid);
  UI.cur = idx(t.c, t.r);
  updateAll();
}

function cycleUnit(dir) {
  const grid = buildGrid(G);
  const acts = legalActions(G, grid, G.turn);
  const uids = [...new Set(acts.map(a => a.uid))]
    .map(id => byUid(G, id))
    .sort((a, b) => (a.r - b.r) || (a.c - b.c))
    .map(u => u.uid);
  if (!uids.length) return;
  const at = uids.indexOf(UI.sel);
  const next = uids[(at + (dir > 0 ? 1 : uids.length - 1) + uids.length) % uids.length];
  UI.sel = next;
  const u = byUid(G, next);
  UI.cur = idx(u.c, u.r);
  updateAll();
}

function moveCursor(dc, dr) {
  if (UI.cur == null) UI.cur = idx(4, H - 1);
  let c = (UI.cur % W) + dc, r = Math.floor(UI.cur / W) + dr;
  c = Math.max(0, Math.min(W - 1, c));
  r = Math.max(0, Math.min(H - 1, r));
  UI.cur = idx(c, r);
  UI.focusInGrid = true;
  updateAll();
}

function passTurn() {
  if (!myTurn()) return;
  UI.undo = [];
  UI.sel = null;
  log(`${G.players[G.turn].name} stands fast.`);
  go("play", "endTurn");
  advance();
}

const ACTS = {
  turnLeft: () => { const s = selUnit(); if (s) faceSelected((s.face + 3) % 4); },
  turnRight: () => { const s = selUnit(); if (s) faceSelected((s.face + 1) % 4); },
  attack: attackAhead,
  next: () => cycleUnit(1),
  prev: () => cycleUnit(-1),
  undo: doUndo,
  endTurn: passTurn,
  help: () => toggleHelp(),
  ready: () => {
    UI.curtain = false;
    if (UI.curtainThen === "muster") { UI.curtainThen = null; updateAll(); return; }
    updateAll();
    advance();
  },
  musterBases: el => musterAdjust(el.dataset.type, "bases", +el.dataset.delta),
  musterFigs: el => musterAdjust(el.dataset.type, "figs", +el.dataset.delta),
  musterPreset: () => { UI.muster = basicSpec(); updateAll(); },
  musterConfirm: musterConfirm,
  speed: cycleSpeed,
  mute: toggleMute,
  menuOpen: openMenu,
  menuClose: closeMenu,
  menuBegin: menuBegin,
  menuPick: el => { UI.menu[el.dataset.group] = el.dataset.value; updateAll(); },
  menuHouse: el => { UI.menu.house[el.dataset.key] = !UI.menu.house[el.dataset.key]; updateAll(); },
  helpClose: () => { UI.helpOpen = false; updateAll(); },
  tutNext: () => {
    if (UI.tutorialStep >= TUTORIAL.length - 1) { tutorialDone(); return; }
    UI.tutorialStep++; updateAll();
  },
  tutSkip: tutorialDone,
  newGame: () => { clearSave(); startGame(); },
};

function dispatchAct(name, el) {
  const fn = ACTS[name];
  if (fn) fn(el);
}

const KEYS = {
  ArrowLeft: () => moveCursor(-1, 0), a: () => moveCursor(-1, 0),
  ArrowRight: () => moveCursor(1, 0), d: () => moveCursor(1, 0),
  ArrowUp: () => moveCursor(0, -1), w: () => moveCursor(0, -1),
  ArrowDown: () => moveCursor(0, 1), s: () => moveCursor(0, 1),
  n: () => cycleUnit(1), p: () => cycleUnit(-1),
  1: () => faceSelected(N), 2: () => faceSelected(E), 3: () => faceSelected(S), 4: () => faceSelected(WEST),
  q: () => dispatchAct("turnLeft"), e: () => dispatchAct("turnRight"),
  f: attackAhead, z: doUndo, ".": passTurn, m: toggleMute, s2: null,
  /* Escape dismisses the topmost overlay, then falls back to clearing the
     selection. It deliberately does NOT clear the handover curtain: that has
     to go through Ready, which calls advance(), or the phase machine is left
     parked on a WAIT nothing resumes. The muster is not escapable either --
     you cannot take the field without an army. */
  Escape: () => {
    if (UI.helpOpen) { UI.helpOpen = false; updateAll(); return; }
    if (UI.menuOpen) { UI.menuOpen = false; updateAll(); return; }
    if (UI.tutorialOpen) { tutorialDone(); return; }
    if (UI.musterOpen || UI.curtain) return;
    UI.sel = null;
    updateAll();
  },
  h: () => toggleHelp(), "?": () => toggleHelp(),
};

function setupInput() {
  const app = document.getElementById("app");

  /* Delegation lives on document, not #app: overlays such as the handover
     curtain are siblings of #app, so an #app-scoped listener cannot see
     their buttons at all -- they look inert by both mouse and keyboard. */
  document.addEventListener("click", ev => {
    const act = ev.target.closest("[data-act]");
    if (act) { dispatchAct(act.dataset.act, act); return; }
    const cell = ev.target.closest(".sq");
    if (cell) {
      UI.cur = idx(+cell.dataset.c, +cell.dataset.r);
      UI.focusInGrid = true;
      activateSquare(+cell.dataset.c, +cell.dataset.r);
    }
  });

  app.addEventListener("focusin", ev => { UI.focusInGrid = !!ev.target.closest("#grid"); });
  void app;

  document.addEventListener("keydown", ev => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const inGrid = UI.focusInGrid || !document.activeElement || document.activeElement === document.body;

    if (ev.key === "Enter" || ev.key === " ") {
      /* Read the focused element, not ev.target: delegation is on document,
         and a <span role="button"> gets no native Enter-to-click the way a
         real <button> does. Without this the whole command rail is dead to
         the keyboard. */
      const focused = document.activeElement;
      const act = focused && focused.closest && focused.closest("[data-act]");
      if (act) { ev.preventDefault(); dispatchAct(act.dataset.act, act); return; }
      if (inGrid && UI.cur != null) {
        ev.preventDefault();
        activateSquare(UI.cur % W, Math.floor(UI.cur / W));
        return;
      }
    }
    const fn = KEYS[ev.key] || KEYS[ev.key.toLowerCase()];
    if (fn && (inGrid || !/^(Arrow|w|a|s|d)/.test(ev.key))) { ev.preventDefault(); fn(); }
  });
}

function toggleHelp() {
  UI.helpOpen = !UI.helpOpen;
  if (UI.helpOpen) UI.menuOpen = false;
  updateAll();
}

function startGame(seed, opts) {
  UI.rects = null;                      /* no FLIP continuity across games */
  for (const g of document.querySelectorAll(".ghost")) g.remove();
  newGame(seed == null ? Math.floor(Math.random() * 1e9) : seed, opts);
  Object.assign(G.cfg, opts || {});
  if (G.cfg.opponent === "hotseat") G.players[1].isBot = false;
  else G.players[1].skill = UI.pendingSkill != null ? +UI.pendingSkill : 1;
  UI.sel = null; UI.undo = []; UI.cur = idx(4, H - 1);
  log("The prides take the field.");
  advance();
}

/* ============================================================
   AI
   Exhaustive first ply, beam-pruned second ply, closed-form
   expected values, no rollouts. Rollouts were rejected because
   they would consume rnd() in unbounded amounts that depend on
   search internals; DICE_DIST gives exact probabilities for
   free. botChooseTurn() therefore touches G.rng ZERO times,
   which invariant 12 asserts rather than assumes -- including
   the difficulty noise, which is derived from a hash of the
   position instead of a draw.

   Material is counted in FIGURES, not bases, because that is
   how the game counts: wearing a 4-man base down to 1 costs
   three quarters of its strength AND three quarters of its
   firepower, and the evaluator sees both for free.
   ============================================================ */

const AI_MAX_LEAVES = 4000;

/* Per-figure worth. An Infantryman is the unit of account at 15: one die,
   one hit to remove. A Knight figure rolls two dice and takes two hits, so
   it is worth about three of them. An Archer figure rolls one die but hits
   on arrows (1/3, against an axe's 1/2) and shoots over heads at range. */
const FIG_VALUE = { king: 400, knight: 45, heavy: 40, mercenary: 30,
                    archer: 18, infantry: 15, peasant: 10 };
const KING_LOSS = 100000;

const W_ATTACK = 0.45;    /* value of an attack available right now       */
/* Closing the gap has to be worth more than a free turn, or both sides sit
   in their deployment rows until the round cap -- measured, not guessed:
   at 1.2 the best advance scored -4.8 against dozens of 0-delta turns. */
const W_ADVANCE = 3;      /* per rank closer to the enemy King            */
const W_FACING = 3;       /* pointed at the nearest enemy                 */
/* Cover was the stalemate. The printed opening is already maximally packed,
   so every move broke three adjacencies and cost 6 -- the army was glued to
   its deployment. Kept only as a whisper for tie-breaking. */
const W_COVER = 0.5;      /* per orthogonally adjacent friendly           */
const W_KINGSAFE = 8;     /* per enemy within 3 squares of my King        */
const W_KINGLANE = 120;   /* an enemy rider has a clear run at my King    */
const W_ARCHER = 6;       /* my archer has something in its block         */
const W_SCREEN = 5;       /* my archer has a friendly directly ahead      */

const SKILL = [
  { name: "Squire",  beam: 1,  threat: false, kingLane: false, archer: false, noise: "top4" },
  { name: "Knight",  beam: 6,  threat: true,  kingLane: true,  archer: true,  noise: "second" },
  { name: "Marshal", beam: 14, threat: true,  kingLane: true,  archer: true,  noise: "none" },
];

/* A light clone. JSON round-tripping G ~900 times per turn is far too slow;
   the search only needs the position. */
function snapshot(P) {
  return {
    actionsLeft: P.actionsLeft, turn: P.turn,
    units: P.units.map(u => ({ uid: u.uid, side: u.side, type: u.type, figs: u.figs,
                               c: u.c, r: u.r, face: u.face, alive: u.alive,
                               attackedThisTurn: u.attackedThisTurn })),
  };
}

/* Exact outcome distribution for one attack, from DICE_DIST. Never rolls. */
function expectedAttack(P, atk, def) {
  const ad = defOf(atk), dd = defOf(def);

  if (needsLastManDuel(atk, def)) {
    /* One die; on a hit, roll it again. A PANIC either time panics. */
    const pHit = ad.hitFace === AXE ? P_AXE : P_ARROW;
    const pPanic = P_PANIC + pHit * P_PANIC;
    const pTwo = pHit * pHit;
    return { pPanic, eRemoved: pTwo, pKill: def.figs === 1 ? pTwo : 0 };
  }

  const n = diceFor(atk);
  let pPanic = 0, eRemoved = 0, pKill = 0;
  for (const row of DICE_DIST[n]) {
    if (panicsFrom(ad, row.panics, n)) { pPanic += row.p; continue; }
    const hits = hitsFrom(ad, row.axes, row.arrows);
    const removed = Math.min(def.figs, Math.floor(hits / dd.htk));
    eRemoved += row.p * removed;
    if (removed >= def.figs) pKill += row.p;
  }
  return { pPanic, eRemoved, pKill };
}

function unitWorth(u) { return u.figs * FIG_VALUE[u.type]; }

function chebyshev(a, b) { return Math.max(Math.abs(a.c - b.c), Math.abs(a.r - b.r)); }

/* Does an enemy rider have an unblocked straight run to a square from which
   it faces my King? This is the single most important thing the bot has to
   learn, so it carries a weight of about 1.3 Knights. */
function kingLaneThreat(P, grid, king) {
  for (const e of P.units) {
    if (!e.alive || e.side === king.side || !defOf(e).mounted) continue;
    const F = DIRS[e.face];
    for (let k = 1; k < Math.max(W, H); k++) {
      const c = e.c + F[0] * k, r = e.r + F[1] * k;
