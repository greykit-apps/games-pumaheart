      UI.cur = idx(+cell.dataset.c, +cell.dataset.r);
      UI.focusInGrid = true;
      activateSquare(+cell.dataset.c, +cell.dataset.r);
    }
  });

  setupDrag();
  app.addEventListener("focusin", ev => { UI.focusInGrid = !!ev.target.closest("#grid"); });

  document.addEventListener("keydown", ev => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (UI.titleOpen && titleKey(ev)) return;
    const onEnd = ev.key === "." ||
      ((ev.key === "Enter" || ev.key === " ") && document.activeElement && document.activeElement.id === "hud-end");
    if (!onEnd && !/^(Shift|Tab)$/.test(ev.key)) disarmEnd();
    const inGrid = UI.focusInGrid || !document.activeElement || document.activeElement === document.body;

    if (ev.key === "Enter" || ev.key === " ") {
      /* Read the focused element, not ev.target: delegation is on document,
         and a <span role="button"> gets no native Enter-to-click the way a
         real <button> does. Without this every such control is dead to the
         keyboard. */
      const focused = document.activeElement;
      const act = focused && focused.closest && focused.closest("[data-act]");
      if (act) { ev.preventDefault(); dispatchAct(act.dataset.act, act); return; }
      if (inGrid && UI.cur != null) {
        ev.preventDefault();
        activateSquare(UI.cur % W, Math.floor(UI.cur / W));
        return;
      }
    }
    const fn = KEYS[ev.key] || KEYS[ev.key.toLowerCase()];
    if (fn && (inGrid || !/^(Arrow|w|a|s|d)/.test(ev.key))) { ev.preventDefault(); fn(); }
  });
}

function toggleHelp() {
  UI.helpOpen = !UI.helpOpen;
  if (UI.helpOpen) UI.menuOpen = false;
  updateAll();
}

function startGame(seed, opts) {
  closeTitle();
  UI.live = true;
  UI.rects = null;                      /* no FLIP continuity across games */
  UI.entering = true; UI.lastSel = null; UI.lastTurnKey = null;
  UI.aim = null; UI.preAttack = null; UI.openingShown = null; UI.openingIdx = null;
  UI.trails = null; UI.trailShown = null;
  for (const g of document.querySelectorAll(".ghost")) g.remove();
  newGame(seed == null ? Math.floor(Math.random() * 1e9) : seed,
    Object.assign({ humanSide: UI.humanSide || 0,
                    skill: UI.pendingSkill != null ? +UI.pendingSkill : 1 }, opts || {}));

  /* The standard opening is fixed. A customised army gets the
     secret battle plan, which is where the strategy lives. */
  const humans = [0, 1].filter(i => !G.players[i].isBot);
  if (G.cfg.setup === "custom" && humans.length) {
    G.phase = "deploy"; G.step = "place";
    G.deploySide = humans[0];
    G.playersDeployed = [];
    UI.cur = idx(4, deployRows(G.deploySide)[0]);
  }
  UI.sel = null; UI.undo = [];
  if (G.phase === "deploy") {
    startLibrary();
    log(`${G.players[G.deploySide].name} lays a battle plan.`);
    updateAll();
    return;
  }
  UI.cur = idx(4, humanSideOf() === 1 ? 0 : H - 1);
  log("The armies take the field.");
  advance();
}

/* The army a human plays, for a game against the AI; Green in hot-seat. */
function humanSideOf() {
  return G && G.players && G.players[0].isBot && !G.players[1].isBot ? 1 : 0;
}

/* ============================================================
   AI
   Exhaustive first ply, beam-pruned second ply, closed-form
   expected values, no rollouts. Rollouts were rejected because
   they would consume rnd() in unbounded amounts that depend on
   search internals; DICE_DIST gives exact probabilities for
   free. botChooseTurn() therefore touches G.rng ZERO times,
   which botChooseTurnChecked() asserts rather than assumes -- including
   the difficulty noise, which is derived from a hash of the
   position instead of a draw.

   Material is counted in FIGURES, not bases, because that is
   how the game counts: wearing a 4-man base down to 1 costs
   three quarters of its strength AND three quarters of its
   firepower, and the evaluator sees both for free.
   ============================================================ */

const AI_MAX_LEAVES = 4000;

/* Per-figure worth. An Infantryman is the unit of account at 15: one die,
   one hit to remove. A Knight figure rolls two dice and takes two hits, so
   it is worth about three of them. An Archer figure rolls one die but hits
   on arrows (1/3, against an axe's 1/2) and shoots over heads at range. */
const FIG_VALUE = { king: 400, knight: 45, heavy: 40, mercenary: 30,
                    archer: 18, infantry: 15, peasant: 10 };
const KING_LOSS = 100000;

const W_ATTACK = 0.45;    /* value of an attack available right now       */
/* Closing the gap has to be worth more than a free turn, or both sides sit
   in their deployment rows until the round cap -- measured, not guessed:
   at 1.2 the best advance scored -4.8 against dozens of 0-delta turns. */
const W_ADVANCE = 3;      /* per rank closer to the enemy King            */
const W_FACING = 3;       /* pointed at the nearest enemy                 */
/* Cover was the stalemate. The standard opening is already maximally packed,
   so every move broke three adjacencies and cost 6 -- the army was glued to
   its deployment. Kept only as a whisper for tie-breaking. */
const W_COVER = 0.5;      /* per orthogonally adjacent friendly           */
const W_KINGSAFE = 8;     /* per enemy within 3 squares of my King        */
const W_KINGLANE = 120;   /* an enemy rider has a clear run at my King    */
const W_ARCHER = 6;       /* my archer has something in its block         */
const W_SCREEN = 5;       /* my archer has a friendly directly ahead      */

/* `sharp` is how hard the tier weights an opening by its grade. 0 is a
   coin-toss across the whole library, weak shapes included; 5 all but
   guarantees a sound one. It is the deployment half of cleverness, and it
   matters: the opening is the one decision the search never revisits. */
const SKILL = [
  { name: "Squire",  beam: 1,  threat: false, kingLane: false, archer: false, noise: "top4", sharp: 0 },
  { name: "Captain", beam: 6,  threat: true,  kingLane: true,  archer: true,  noise: "second", sharp: 2 },
  { name: "Marshal", beam: 14, threat: true,  kingLane: true,  archer: true,  noise: "none", sharp: 5 },
];

/* Deterministic from the seed, like botMuster, and drawn before a die is
   ever thrown -- so it costs G.rng nothing and a game still replays. */
function pickOpening(skill, pickSeed) {
  const sharp = (SKILL[skill] || SKILL[1]).sharp;
  const weights = OPENINGS.map(o => Math.pow(o.grade, sharp));
  const total = weights.reduce((a, b) => a + b, 0);
  const roll = mulberry32((pickSeed >>> 0) || 1)() * total;
  let acc = 0;
  for (let i = 0; i < OPENINGS.length; i++) {
    acc += weights[i];
    if (roll < acc) return OPENINGS[i];
  }
  return OPENINGS[0];
}

/* A light clone. JSON round-tripping G ~900 times per turn is far too slow;
   the search only needs the position. */
function snapshot(P) {
  return {
    actionsLeft: P.actionsLeft, turn: P.turn,
    units: P.units.map(u => ({ uid: u.uid, side: u.side, type: u.type, figs: u.figs,
                               c: u.c, r: u.r, face: u.face, alive: u.alive,
                               attackedThisTurn: u.attackedThisTurn })),
  };
}

/* Exact outcome distribution for one attack, from DICE_DIST. Never rolls. */
function expectedAttack(P, atk, def) {
  const ad = defOf(atk), dd = defOf(def);

  if (needsLastManDuel(atk, def)) {
    /* One die; on a hit, roll it again. Enumerated over both rolls. */
    const P_OF = { [AXE]: P_AXE, [ARROW]: P_ARROW, [PANIC]: P_PANIC };
    const isHit = f => f === ad.hitFace;
    let pPanic = 0, pTwo = 0;
    for (const f1 of [AXE, ARROW, PANIC]) {
      if (f1 === PANIC) { pPanic += P_OF[f1]; continue; }
      if (!isHit(f1)) continue;
      for (const f2 of [AXE, ARROW, PANIC]) {
        const p = P_OF[f1] * P_OF[f2];
        if (f2 === PANIC) { pPanic += p; continue; }
        const axes = (f1 === AXE ? 1 : 0) + (f2 === AXE ? 1 : 0);
        const arrows = (f1 === ARROW ? 1 : 0) + (f2 === ARROW ? 1 : 0);
        if (hitsFrom(ad, axes, arrows) >= 2) pTwo += p;
      }
    }
    return { pPanic, eRemoved: pTwo, pKill: def.figs === 1 ? pTwo : 0 };
  }

  const n = diceFor(atk);
  let pPanic = 0, eRemoved = 0, pKill = 0;
  for (const row of DICE_DIST[n]) {
    const panicked = panicsFrom(ad, row.panics, n);
    if (panicked) pPanic += row.p;
    if (panicked && !ad.panicPerDie) continue;          /* a total panic scores nothing */
    const hits = hitsFrom(ad, row.axes, row.arrows, row.panics);
    const removed = Math.min(def.figs, Math.floor(hits / dd.htk));
    eRemoved += row.p * removed;
    if (removed >= def.figs) pKill += row.p;
  }
  return { pPanic, eRemoved, pKill };
}

function unitWorth(u) { return u.figs * FIG_VALUE[u.type]; }

function chebyshev(a, b) { return Math.max(Math.abs(a.c - b.c), Math.abs(a.r - b.r)); }

/* Does an enemy rider have an unblocked straight run to a square from which
   it faces my King? This is the single most important thing the bot has to
   learn, so it carries a weight of about 1.3 Knights. */
function kingLaneThreat(P, grid, king) {
  for (const e of P.units) {
    if (!e.alive || e.side === king.side || !defOf(e).mounted) continue;
    const F = DIRS[e.face];
    for (let k = 1; k < Math.max(W, H); k++) {
      const c = e.c + F[0] * k, r = e.r + F[1] * k;
      if (!inBoard(c, r)) break;
      const occ = grid[idx(c, r)];
      if (occ) {
        if (occ === king.uid) return true;          /* runs straight onto him */
        break;
      }
      /* stopping here, would it then be adjacent and facing the King? */
      const ahead = { c: c + F[0], r: r + F[1] };
      if (ahead.c === king.c && ahead.r === king.r) return true;
    }
  }
  return false;
}

function sideScore(P, grid, s, sk) {
  let score = 0;
  const king = kingOf(P, s);
  if (!king) return -KING_LOSS;

  const foeKing = kingOf(P, 1 - s);
  const mine = [], foes = [];
  for (const u of P.units) {
    if (!u.alive) continue;
    (u.side === s ? mine : foes).push(u);
    if (u.side === s) score += unitWorth(u);
  }

  for (const u of mine) {
    /* Attacks available to me right now. */
    for (const t of attackTargets(P, grid, u)) {
      const ex = expectedAttack(P, u, t);
      score += W_ATTACK * (ex.eRemoved * FIG_VALUE[t.type] + (t.type === "king" ? ex.pKill * KING_LOSS : 0));
    }
    /* Close the distance -- deliberately tiny, so it breaks ties without
       ever outweighing a trade. On a board with four empty ranks it matters
       far less than threat does. */
    if (foeKing) score += W_ADVANCE * (H - Math.abs(u.r - foeKing.r));

    /* Facing the nearest enemy. */
    let near = null, nd = 99;
    for (const f of foes) { const d = chebyshev(u, f); if (d < nd) { nd = d; near = f; } }
    if (near) {
      const F = DIRS[u.face];
      if (F[0] * (near.c - u.c) + F[1] * (near.r - u.r) > 0) score += W_FACING;
    }
    for (const m of mine) {
      if (m !== u && Math.abs(m.c - u.c) + Math.abs(m.r - u.r) === 1) score += W_COVER / 2;
    }
    if (sk.archer && u.type === "archer") {
      if (attackTargets(P, grid, u).length) score += W_ARCHER;
      const ahead = stepFrom(u.c, u.r, u.face, 1);
      const inFront = inBoard(ahead.c, ahead.r) && byUid(P, grid[idx(ahead.c, ahead.r)]);
      if (inFront && inFront.side === s) score += W_SCREEN;
    }
  }

  if (sk.threat) {
    for (const f of foes) if (chebyshev(f, king) <= 3) score -= W_KINGSAFE;
  }
  if (sk.kingLane && kingLaneThreat(P, grid, king)) score -= W_KINGLANE;
  return score;
}

/* Zero-sum: positive is good for `side`. */
function evaluate(P, side, sk) {
  const grid = buildGrid(P);
  return sideScore(P, grid, side, sk) - sideScore(P, grid, 1 - side, sk);
}

/* Applies an action WITHOUT touching rnd(). An attack is resolved to its
   most likely figure loss rather than rolled, which keeps the second ply
   deterministic and the dice stream untouched. */
function applyQuiet(P, a) {
  const u = P.units.find(x => x.uid === a.uid);
  P.actionsLeft -= actionCost(u, a.kind);
  if (a.kind === "move") { u.c = a.c; u.r = a.r; return; }
  if (a.kind === "turn") { u.face = a.face; return; }
  if (a.kind === "bribe") {
    u.attackedThisTurn = true;
    applyBribe(P, u, P.units.find(x => x.uid === a.defUid));
    return;
  }
  const def = P.units.find(x => x.uid === a.defUid);
  u.attackedThisTurn = true;
  const ex = expectedAttack(P, u, def);
  const removed = Math.min(def.figs, Math.round(ex.eRemoved));
  if (removed > 0) {
    def.figs -= removed;
    if (def.figs <= 0) { def.figs = 0; def.alive = false; }
  }
}

/* Invariant 12. The search is pure, so a bot turn must leave G.rng
   byte-identical -- otherwise the dice stream would depend on search
   internals and a saved game would not replay. Asserted, not assumed. */
function botChooseTurnChecked(P, side, skill) {
  const before = P.rng;
  const now = () => (typeof performance !== "undefined" ? performance.now() : Date.now());
  const t0 = now();
  const plan = botChooseTurn(P, side, skill);
  const ms = now() - t0;
  if (typeof HARNESS !== "undefined" && HARNESS) {
    HARNESS.maxPlanMs = Math.max(HARNESS.maxPlanMs || 0, ms);
  }
  if (P.rng !== before) {
    throw new Error(`Bot consumed rnd(): ${before} -> ${P.rng} (the search must be pure)`);
  }
  return plan;
}

function actionDelta(P, base, a, side, sk) {
  const P2 = snapshot(P);
  applyQuiet(P2, a);
  return evaluate(P2, side, sk) - base;
}

/* Deterministic noise: a hash of the POSITION, never a draw from rnd().
   That is what lets the bot be imperfect at low skill while leaving the
   dice stream byte-identical across a turn. */
function posHash(P) {
  let h = 2166136261;
  for (const u of P.units) {
    h ^= u.uid + (u.c * 31) + (u.r * 7) + (u.face * 3) + (u.figs * 11) + (u.alive ? 1 : 0);
    h = Math.imul(h, 16777619);
  }
  h ^= P.turn * 13 + P.actionsLeft * 29;
  return h >>> 0;
}

/* THE FIDGET BREAK.

   A customised army against an opponent who does not advance reaches
   positions where the evaluator likes nothing: measured at round 21 of seed
   1, every one of 37 legal actions scored zero or less -- best move -2, best
   turn exactly 0.00, and even an available attack 0.00, because applyQuiet
   rounds a Peasant's expected removal against armour down to none. The bot
   took a zero-delta turn, and next turn took it back, for ever. Neither army
   closed and nothing ended the game, human play having no round cap.

   These three are smaller than the smallest difference the evaluator can
   produce, so they never decide between actions it can tell apart. They
   decide only between actions it calls equal, and there they say: hitting
   something beats walking, walking towards the enemy beats walking away,
   and turning on the spot is the least productive thing a unit can do. A
   turn that genuinely opens a line still scores its W_ATTACK and wins on the
   evaluation, far above this. */
const TIE_ATTACK = 0.05, TIE_CLOSE = 0.02, TIE_TURN = -0.01;

/* AND THE PRESSURE TO CLOSE.

   Tie-breaks are not enough on their own, because the deadlock is not always
   a tie. Seed 5 at round 200: three infantry could each step to rank 4 and
   every one scored -5, because rank 4 is inside the enemy archers' block and
   the evaluator prices that correctly. Standing off costs nothing and gains
   nothing, so the bot stood off for six hundred rounds with all sixty
   figures alive. It was playing not to lose, in a game you cannot draw.

   So closing is worth more the longer the game has gone. Nothing before
   round 10 -- a normal game is over by then, and these games average eight
   -- and from there it grows until it outweighs what the enemy bows are
   worth. It only ever pushes a unit FORWARD or onto a target; it never
   makes a bad trade look good, because it is not added to the trade. */
const PRESSURE_FROM = 10, PRESSURE_RATE = 1.5;

/* The backstop, for the freeze the pressure does not reach: roughly one game
   in three hundred, at the weakest tier, against an opponent who never moves
   at all. Measured over 120 such games the longest that finished ran 80
   rounds, median 36, so 200 is two and a half times anything legitimate and
   can only be met by a game that has genuinely stopped. It ends as a
   stalemate and says so, which beats hanging for ever. */
const STALEMATE_CAP = 200;

function closingPressure(P) {
  return Math.max(0, ((P.round || 1) - PRESSURE_FROM)) * PRESSURE_RATE;
}


function progressTie(P, grid, a, side, push) {
  if (a.kind === "attack" || a.kind === "bribe") return TIE_ATTACK + push;
  const u = P.units.find(x => x.uid === a.uid);
  const foeKing = kingOf(P, 1 - side);
  if (!u || !foeKing) return 0;
  const dist = (c, r) => Math.max(Math.abs(c - foeKing.c), Math.abs(r - foeKing.r));
  if (a.kind === "move") return dist(a.c, a.r) < dist(u.c, u.r) ? TIE_CLOSE + push : 0;

  /* A turn earns its keep only by opening a way forward: the square it comes
     to face has to be empty, and nearer the enemy King than the one the unit
     stands on. Without that, a line which has turned itself sideways is
     wedged -- every unit blocked by the neighbour it faces, no move legal
     anywhere on the board, and every turn worth exactly the same as every
     other. Seed 5 sat like that for six hundred rounds with all sixty
     figures alive, a Knight rocking between south and east for ever. */
  const ahead = stepFrom(u.c, u.r, a.face, 1);
  if (!inBoard(ahead.c, ahead.r) || grid[idx(ahead.c, ahead.r)]) return TIE_TURN;
  return dist(ahead.c, ahead.r) < dist(u.c, u.r) ? TIE_CLOSE + push : TIE_TURN;
}

function botChooseTurn(P, side, skillIx) {
  const sk = SKILL[Math.max(0, Math.min(SKILL.length - 1, skillIx | 0))];
  const grid = buildGrid(P);
  const acts = legalActions(P, grid, side);
  if (!acts.length) return [];

  const base = evaluate(P, side, sk);
  const push = closingPressure(P);
  const scored = acts.map(a => ({ a, s: actionDelta(P, base, a, side, sk) + progressTie(P, grid, a, side, push) }));
  scored.sort((x, y) => y.s - x.s);
  const h = posHash(P);

  /* Squire does not look ahead at all. It takes the best IMMEDIATE action and
     replans, which is both cheaper and genuinely weaker -- a shallower search,
     not merely a noisier one. Returning a single action is what makes it
     greedy: the phase machine calls back for the next one. */
  if (sk.beam <= 1) {
    /* Weak, not paralysed. It still draws blind from four, which is where
       its weakness lives -- but only from four that DO something. Drawing
       from the top four outright let a Squire pass over the only productive
       action three times in four, and against an opponent who does not
       advance either, that is a game with no end.

       Narrowing it to "comparable to the best" was the first attempt and it
       was worse: it made the Squire nearly greedy, and it started beating a
       Captain. The tie-breaks above are what make this filter work -- an
       attack or a closing move is above zero even when the evaluator is
       indifferent, and a turn on the spot is below it. */
    const useful = scored.filter(x => x.s > 0);
    const from = useful.length ? useful : scored;
    const pool = from.slice(0, Math.min(4, from.length));
    return [pool[h % pool.length].a];
  }

  /* Shrink the beam to fit the leaf budget. This depends only on the
     position, so seeds still replay identically. */
  const beam = Math.max(1, Math.min(sk.beam, Math.floor(AI_MAX_LEAVES / Math.max(1, acts.length))));

  const results = [];
  for (const cand of scored.slice(0, beam)) {
    const P2 = snapshot(P);
    applyQuiet(P2, cand.a);
    let total = evaluate(P2, side, sk);
    let second = null;
    if (P2.actionsLeft > 0) {
      const g2 = buildGrid(P2);
      const b2 = evaluate(P2, side, sk);
      let bestS = 0;
      for (const b of legalActions(P2, g2, side)) {
        const d = actionDelta(P2, b2, b, side, sk);
        if (d > bestS) { bestS = d; second = b; }
      }
      total += bestS;
    }
    results.push({ total, first: cand.a, second });
  }
  results.sort((x, y) => y.total - x.total);

  let pick = results[0];
  if (sk.noise === "second" && results.length > 1 && (h % 5) === 0) {
    pick = results[1];                       /* second best one turn in five */
  }
  return pick.second ? [pick.first, pick.second] : [pick.first];
}

/* ============================================================
   CUSTOMISED MUSTER
   Both players start with 10 bases on the board. There is no
   points system: the constraints are the physical components --
   how many figures you own, how many fit on a base, and how
   many bases of each special you are allowed.

     Heavy Infantry - 1 or 2 bases: put 1 or 2 on a base
     Peasants       - up to 4 bases: put up to 4 on a base
     Mercenaries    - 1 base: put 2 on a base

   Which basic bases you drop to make room is NOT stated
   anywhere, so the figure pool is left to do the work.
   ============================================================ */

const MUSTER_ORDER = ["knight", "archer", "infantry", "heavy", "peasant", "mercenary"];

/* An army spec is { type: { bases, figs } }. The King is implicit: exactly
   one base of one figure, mandatory, and never in the spec. */
function basicSpec() {
  return { knight: { bases: 2, figs: 2 }, archer: { bases: 2, figs: 4 },
           infantry: { bases: 5, figs: 4 }, heavy: { bases: 0, figs: 0 },
           peasant: { bases: 0, figs: 0 }, mercenary: { bases: 0, figs: 0 } };
}

function specBases(spec) {
  return 1 + MUSTER_ORDER.reduce((n, t) => n + (spec[t] ? spec[t].bases : 0), 0);
}
function specFigures(spec) {
  return 1 + MUSTER_ORDER.reduce((n, t) => n + (spec[t] ? spec[t].bases * spec[t].figs : 0), 0);
}

/* Returns null when legal, otherwise a sentence naming what is wrong. The
   UI shows that sentence rather than greying a button with no explanation. */
function validateArmy(spec, cfg) {
  const partial = !cfg || cfg.partialBases !== false;
  for (const t of MUSTER_ORDER) {
    const e = spec[t] || { bases: 0, figs: 0 };
    const d = UNIT_DEFS[t];
    if (e.bases < 0 || e.figs < 0) return `${d.name}: negative count.`;
    if (e.bases > 0 && e.figs < 1) return `${d.name}: a base cannot be empty.`;
    const maxPer = perBaseOf(t, cfg);
    if (e.figs > maxPer) return `${d.name}: only ${maxPer} fit on a base.`;
    if (e.bases > 0 && !partial && e.figs !== maxPer && t !== "heavy" && t !== "peasant") {
      return `${d.name}: bases must be filled to ${maxPer}.`;
    }
    const used = e.bases * e.figs;
    if (used > d.perPlayer) {
      return `${d.name}: you own ${d.perPlayer}, this uses ${used}.`;
    }
    const capBases = CUSTOM_BASE_CAPS[t];
    if (capBases !== undefined && e.bases > capBases) {
      return `${d.name}: the muster allows ${capBases} ${capBases === 1 ? "base" : "bases"}.`;
    }
  }
  const n = specBases(spec);
  if (n !== BASES_TOTAL) {
    return n < BASES_TOTAL
      ? `${BASES_TOTAL - n} ${BASES_TOTAL - n === 1 ? "base" : "bases"} still to fill.`
      : `${n - BASES_TOTAL} ${n - BASES_TOTAL === 1 ? "base" : "bases"} too many.`;
  }
  return null;
}

/* Build the actual units from a spec, ordered so the King lands centre-back
   and the rest fill outward -- the standard arrangement generalised. */
function unitsFromSpec(side, spec) {
  const out = [{ type: "king", figs: 1 }];
  for (const t of MUSTER_ORDER) {
    const e = spec[t] || { bases: 0, figs: 0 };
    for (let i = 0; i < e.bases; i++) out.push({ type: t, figs: e.figs });
  }
  return out;
}

/* The King starts on the royal emblem in the back row; everything else
   goes on that row or the one in front of it.

   The default formation follows the shape of the standard army rather
   than filling the back row first: bows and horse behind the line, foot
   screening in front. Both rows fill outward from the centre, so a short
   muster still forms a line instead of hugging one edge. */
const CENTRE_OUT = [4, 3, 5, 2, 6, 1, 7, 0, 8];
const EDGE_IN    = [0, 8, 1, 7, 2, 6, 3, 5, 4];
const LEFT_HALF  = [4, 3, 2, 1, 0, 5, 6, 7, 8];
const RIGHT_HALF = [4, 5, 6, 7, 8, 3, 2, 1, 0];
const FOOT = ["infantry", "heavy", "peasant", "mercenary"];
const MISSILE_HORSE = ["archer", "knight"];

/* ============================================================
   OPENINGS — a library of shapes for the two deployment ranks.

   One shape per entry, described as column orders and which
   types prefer which rank; the placer fills a preferred rank
   and overflows to the other, so an opening works whatever the
   muster turned out to be. `grade` is soundness, 1 to 3, and it
   is what separates a Squire's opening from a Marshal's -- see
   pickOpening(). Nothing here reads the enemy: both plans are
   laid blind.
   ============================================================ */
const OPENINGS = [
  { key: "line", grade: 3, name: "The standard line",
    note: "Bows and horse behind, foot screening in front — the shape of the standard army.",
    back: MISSILE_HORSE, backCols: CENTRE_OUT, frontCols: CENTRE_OUT, kingCol: 4 },

  { key: "screen", grade: 3, name: "Archer screen",
    note: "Every bow directly behind a body, shooting over its own front rank — but the block reaches only three ranks, so walk them up with the line or they will never fire.",
    back: ["archer"], backCols: CENTRE_OUT, frontCols: CENTRE_OUT, kingCol: 4 },

  { key: "refusedLeft", grade: 2, name: "Refused left",
    note: "The whole line shifted right, leaving a flank to be turned rather than held.",
    back: MISSILE_HORSE, backCols: RIGHT_HALF, frontCols: RIGHT_HALF, kingCol: 6 },

  { key: "refusedRight", grade: 2, name: "Refused right",
    note: "The mirror: weight on the left, the right flank given away on purpose.",
    back: MISSILE_HORSE, backCols: LEFT_HALF, frontCols: LEFT_HALF, kingCol: 2 },

  { key: "vanguard", grade: 2, name: "Vanguard",
    note: "Horse and shields forward together, the rest massed behind. Contact comes early, and on your terms.",
    /* Horse ALONE was the first cut, and a muster that rolled one Knight base
       put a single rider out in front of the army to die. The shock units
       lead as a group instead, so the shape holds however the horse came
       out: every bot muster fields two or three bases here. */
    back: ["archer", "infantry", "peasant", "mercenary"], front: ["knight", "heavy"],
    backCols: CENTRE_OUT, frontCols: CENTRE_OUT, kingCol: 4 },

  { key: "forward", grade: 2, name: "Everything forward",
    note: "One rank, as far up as the rules allow, and nothing held back.",
    back: [], backCols: CENTRE_OUT, frontCols: CENTRE_OUT, kingCol: 4 },

  { key: "wide", grade: 1, name: "Wide wings",
    note: "Filled from the edges in. Threatens both flanks and holds neither.",
    back: MISSILE_HORSE, backCols: EDGE_IN, frontCols: EDGE_IN, kingCol: 4 },

  { key: "deep", grade: 1, name: "Held back",
    note: "The back rank first. Slow to arrive, and the front rank goes hungry.",
    back: MISSILE_HORSE.concat(FOOT), backCols: CENTRE_OUT, frontCols: CENTRE_OUT, kingCol: 4 },
];

function openingByKey(key) {
  return OPENINGS.find(o => o.key === key) || OPENINGS[0];
}

/* The King takes its square first -- the royal emblem, or the opening's
   own preference when the free-King house rule is on -- and everything else
   fills its preferred rank, overflowing to the other. */
function placeArmy(side, list, opening) {
  const op = opening || OPENINGS[0];
  const back = side === 0 ? H - 1 : 0;
  const front = side === 0 ? H - 2 : 1;
  const king = list.find(u => u.type === "king");
  const rest = list.filter(u => u !== king);

  const anchored = !(G && G.cfg) || G.cfg.anchorKing !== false;
  const kingCol = anchored ? 4 : (op.kingCol == null ? 4 : op.kingCol);

  const free = {
    [back]: (op.backCols || CENTRE_OUT).filter(c => c !== kingCol),
    [front]: (op.frontCols || CENTRE_OUT).slice(),
  };
  const out = king ? [{ unit: king, c: kingCol, r: back }] : [];

  const take = (u, first, second) => {
    const row = free[first].length ? first : second;
    const c = free[row].shift();
    if (c === undefined) return false;
    out.push({ unit: u, c, r: row });
    return true;
  };
  /* Rank preference: `front` wins over `back`, and also takes the front
     rank's best columns before anything else does -- which is what makes a
     vanguard a vanguard rather than the same line with the bows moved. */
  const leads = op.front || [];
  const wantsBack = u => leads.includes(u.type) ? false : (op.back || []).includes(u.type);
  const ahead = rest.filter(u => !wantsBack(u));
  for (const u of rest.filter(wantsBack)) take(u, back, front);
  for (const u of ahead.filter(u => leads.includes(u.type))) take(u, front, back);
  for (const u of ahead.filter(u => !leads.includes(u.type))) take(u, front, back);
  return out;
}

function deployFromSpec(side, spec, opening) {
  const face = side === 0 ? N : S;
  for (const p of placeArmy(side, unitsFromSpec(side, spec), opening)) {
    G.units.push(makeUnit(side, p.unit.type, p.unit.figs, p.c, p.r, face));
  }
}

/* The bot's muster. Deterministic from the seed so a game replays, and it
   never produces an illegal army -- validateArmy() gates every candidate. */
function botMuster(side, pickSeed) {
  const candidates = [
    /* Mixed host: the standard basics stiffened with a Heavy Infantry pair. */
    { knight: { bases: 2, figs: 2 }, archer: { bases: 2, figs: 4 },
      infantry: { bases: 3, figs: 4 }, heavy: { bases: 1, figs: 2 },
      peasant: { bases: 1, figs: 4 }, mercenary: { bases: 0, figs: 0 } },
    /* Shield line: both Heavy bases, bows behind. */
    { knight: { bases: 1, figs: 2 }, archer: { bases: 2, figs: 4 },
      infantry: { bases: 3, figs: 4 }, heavy: { bases: 2, figs: 1 },
      peasant: { bases: 1, figs: 4 }, mercenary: { bases: 0, figs: 0 } },
    /* Free company: mercenaries and a screen of peasants. */
    { knight: { bases: 2, figs: 2 }, archer: { bases: 1, figs: 4 },
      infantry: { bases: 3, figs: 4 }, heavy: { bases: 0, figs: 0 },
      peasant: { bases: 2, figs: 2 }, mercenary: { bases: 1, figs: 2 } },
    /* The standard army, unchanged. */
    basicSpec(),
    /* Massive Infantry: all twenty foot on two ten-man bases. Legal only
       under that rule, so it is filtered out of every other game. */
    { knight: { bases: 2, figs: 2 }, archer: { bases: 2, figs: 4 },
      infantry: { bases: 2, figs: 10 }, heavy: { bases: 1, figs: 2 },
      peasant: { bases: 1, figs: 4 }, mercenary: { bases: 1, figs: 2 } },
  ];
  const legal = candidates.filter(c => validateArmy(c, G.cfg) === null);
  const pool = legal.length ? legal : [basicSpec()];
  return pool[(pickSeed >>> 0) % pool.length];
}

/* ============================================================
   MUSTER SCREEN
   Renders itself from UNIT_DEFS and CUSTOM_BASE_CAPS, so
   changing a rule number changes the screen with no edit
   here. The confirm button is never silently dead: when the
   muster is illegal it shows the validator's own sentence.
   ============================================================ */

function openMuster(side) {
  UI.musterOpen = true;
  UI.musterSide = side;
  UI.muster = basicSpec();
  UI.curtain = false;
  updateAll();
}

function musterAdjust(type, field, delta) {
  const e = UI.muster[type];
  const d = UNIT_DEFS[type];
  if (field === "bases") {
    e.bases = Math.max(0, Math.min(BASES_TOTAL - 1, e.bases + delta));
    if (e.bases > 0 && e.figs < 1) e.figs = Math.min(perBaseOf(type, UI.houseRules), d.perPlayer);
    if (e.bases === 0) e.figs = 0;
  } else {
    e.figs = Math.max(0, Math.min(perBaseOf(type, UI.houseRules), e.figs + delta));
    if (e.figs > 0 && e.bases < 1) e.bases = 1;
  }
  updateAll();
}

function musterConfirm() {
  if (validateArmy(UI.muster, UI.houseRules)) return;
  UI.musterSpecs = UI.musterSpecs || {};
  UI.musterSpecs[UI.musterSide] = JSON.parse(JSON.stringify(UI.muster));

  /* Hot-seat: the second player musters in secret behind the curtain. */
  const other = 1 - UI.musterSide;
  if (UI.pendingOpponent === "hotseat" && !UI.musterSpecs[other]) {
    UI.musterSide = other;
    UI.muster = basicSpec();
    UI.curtain = true;
    UI.curtainThen = "muster";
    updateAll();
    return;
  }

  const specs = { 0: UI.musterSpecs[0], 1: UI.musterSpecs[1] || null };
  UI.musterOpen = false;
  UI.musterSpecs = null;
  clearSave();
  startGame(undefined, Object.assign(houseRulesToCfg(UI.houseRules || defaultHouseRules()),
    { setup: "custom", opponent: UI.pendingOpponent || "ai", specs }));
}

function renderMuster() {
  const el = document.getElementById("muster");
  if (!UI.musterOpen || UI.curtain) { el.hidden = true; return; }
  el.hidden = false;

  const spec = UI.muster;
  const rows = MUSTER_ORDER.map(t => {
    const d = UNIT_DEFS[t], e = spec[t];
    const used = e.bases * e.figs;
    const cap = CUSTOM_BASE_CAPS[t];
    const over = used > d.perPlayer || e.figs > perBaseOf(t, UI.houseRules) || (cap !== undefined && e.bases > cap);
    return `<tr class="${over ? "bad" : ""}">
      <th scope="row">${esc(d.name)}${cap !== undefined ? `<span class="cap"> max ${cap} base${cap === 1 ? "" : "s"}</span>` : ""}</th>
      <td class="step">
        <span class="sbtn" data-act="musterBases" data-type="${t}" data-delta="-1" role="button" tabindex="0" aria-label="One fewer ${esc(d.name)} base">&minus;</span>
        <b aria-label="${e.bases} ${esc(d.name)} bases">${e.bases}</b>
        <span class="sbtn" data-act="musterBases" data-type="${t}" data-delta="1" role="button" tabindex="0" aria-label="One more ${esc(d.name)} base">+</span>
      </td>
      <td class="step">
        <span class="sbtn" data-act="musterFigs" data-type="${t}" data-delta="-1" role="button" tabindex="0" aria-label="One fewer ${esc(d.name)} per base">&minus;</span>
        <b aria-label="${e.figs} per base">${e.figs}</b>
        <span class="sbtn" data-act="musterFigs" data-type="${t}" data-delta="1" role="button" tabindex="0" aria-label="One more ${esc(d.name)} per base">+</span>
      </td>
      <td class="pool">${used} of ${d.perPlayer}</td>
    </tr>`;
  }).join("");

  const why = validateArmy(spec, UI.houseRules);
  const n = specBases(spec);
  /* "Basic army" beside "Take the field" read as a second army to choose,
     when it is the one already on the table. It is a reset, and it says so,
     and it stands down when there is nothing to reset. */
  const isStandard = JSON.stringify(spec) === JSON.stringify(basicSpec());
  /* Hot-seat's first muster leads to the second player's, not to the board. */
  const handover = UI.pendingOpponent === "hotseat" && !(UI.musterSpecs && UI.musterSpecs[1 - UI.musterSide]);

  el.innerHTML = `<div class="box muster-card">
    <span class="box-label">Muster &mdash; <span class="side s${UI.musterSide}">${esc((G && G.players ? G.players[UI.musterSide].name : UI.musterSide === 0 ? "Green" : "Gold"))}</span></span>
    <p class="muster-lede">You field ten bases. A base is one unit of identical figures, and its
      figure count is both its strength and the dice it rolls.</p>
    <p class="dim">Leave it as it stands for the standard army, or build your own from your
      pool of figures.</p>
    <table class="muster">
      <thead><tr><th scope="col">Warrior</th><th scope="col">Bases</th><th scope="col">Figures each</th><th scope="col">Used</th></tr></thead>
      <tbody>
        <tr class="locked"><th scope="row">King</th><td class="step"><b>1</b></td><td class="step"><b>1</b></td><td class="pool">1 of 1</td></tr>
        ${rows}
      </tbody>
    </table>
    <p class="tally">Bases <b class="${n === BASES_TOTAL ? "ok" : "bad"}">${n}</b> of ${BASES_TOTAL}
       &middot; ${specFigures(spec)} warriors</p>
    <p class="why${why ? "" : " ok"}" role="status">${why ? esc(why) : "Ready."}</p>
    <div class="muster-actions">
      <button class="btn" data-act="musterPreset" ${isStandard ? "disabled" : ""}>Reset to standard</button>
      <button class="btn btn-go" data-act="musterConfirm" ${why ? "disabled" : ""}>${handover ? "Done &mdash; hand over" : "Lay the battle plan"}</button>
    </div>
  </div>`;
}

/* ============================================================
   DICE — drawn as paths on a 24x24 box, never as text, because
   no font is loaded and a die face must not depend on one.
   ============================================================ */
const DIE_GLYPH = {
  /* A double-bitted axe on an upright haft. The old head-on-a-wedge read, at
     log size, as a letter B; a single blade on a staff read as a P, and as
     the PANIC banner's twin. Two blades are an axe and nothing else. */
  0: "M12 3v19M12 6.5Q8.5 5.5 5 3.5Q2.6 8.5 5 13.5Q8.5 11.5 12 10.5M12 6.5Q15.5 5.5 19 3.5Q21.4 8.5 19 13.5Q15.5 11.5 12 10.5", /* battle-axe */
  1: "M3 19L19 5M15 5h4v4M5 21l-2-2M3 5l16 14M5 3h4M3 5v4",             /* crossed arrows */
  2: "M6 3h12l-3 5 3 5-12 1 2-6zM6 3v18",                               /* torn banner  */
};
const DIE_NAME = { 0: "battle-axe", 1: "arrows", 2: "PANIC" };
/* Under each die on the attack card, so the faces teach themselves. */
const DIE_CAP = { 0: "axe", 1: "arrows", 2: "panic" };
const DIE_CLASS = { 0: "f-axe", 1: "f-arrow", 2: "f-panic" };

/* ============================================================
   FLIP
   updateAll() replaces the grid wholesale, so without this a
   unit teleports. Snapshot the rects before the rebuild, invert
   afterwards, release. The panic cascade is staggered off the
   retreat trace so it reads as a chain rather than one jump.
   ============================================================ */
function snapshotRects() {
  if (UI.reducedMotion) { UI.rects = null; return; }
  UI.rects = {};
  for (const el of document.querySelectorAll("#grid .u[data-uid]")) {
    const b = el.querySelector(".base");
    UI.rects[el.dataset.uid] = {
      rect: el.getBoundingClientRect(), html: el.outerHTML,
      angle: b ? (parseFloat(b.style.transform.replace(/[^-\d.]/g, "")) || 0) : 0,
    };
  }
}

function playFlip() {
  const prev = UI.rects;
  UI.rects = null;
  if (!prev || UI.reducedMotion) return;

  /* Each link of a cascade starts a little after the one before it. */
  const delay = {};
  const trace = (G.dice && G.dice.retreats) || [];
  trace.forEach((step, i) => { if (delay[step.uid] === undefined) delay[step.uid] = i * 70; });

  const seen = new Set();
  const grid = document.getElementById("grid");
  for (const el of grid.querySelectorAll(".u[data-uid]")) {
    const uid = el.dataset.uid;
    seen.add(uid);
    const was = prev[uid];
    if (!was) continue;
    const now = el.getBoundingClientRect();
    const dx = was.rect.left - now.left, dy = was.rect.top - now.top;
    const base = el.querySelector(".base");
    const toAngle = base ? (parseFloat(base.style.transform.replace(/[^-\d.]/g, "")) || 0) : 0;
    const spun = base && Math.abs(toAngle - was.angle) > 0.5;
    if (!dx && !dy && !spun) continue;

    const sf = UI.speedFactor == null ? 1 : UI.speedFactor;
    const d = (delay[uid] || 0) * sf;
    const ms = Math.round(240 * (sf || 1));

    if (dx || dy) {
      el.style.transition = "none";
      el.style.transform = `translate(${dx}px, ${dy}px)`;
    }
    /* The selected unit's turn handles ride the same angle, so they swing
       with the plate rather than jumping to the new corners. */
    const rots = el.querySelector(".rots");
    if (spun) {
      base.style.transition = "none";
      base.style.transform = `rotate(${was.angle}deg)`;
      if (rots) { rots.style.transition = "none"; rots.style.transform = `rotate(${was.angle}deg)`; }
    }
    requestAnimationFrame(() => {
      if (dx || dy) {
        el.style.transition = `transform ${ms}ms var(--ease-out-quart) ${Math.round(d)}ms`;
        el.style.transform = "";
      }
      if (spun) {
        /* A shade longer than the slide: a piece swinging round reads better
           slightly behind the piece travelling. */
        const spin = `transform ${Math.round(ms * 1.25)}ms var(--ease-out-expo) ${Math.round(d)}ms`;
        base.style.transition = spin;
        base.style.transform = `rotate(${toAngle}deg)`;
        if (rots) { rots.style.transition = spin; rots.style.transform = `rotate(${toAngle}deg)`; }
      }
    });
  }

  /* A CASUALTY leaves a ghost where it fell. A unit that is simply absent
     from G -- because the board was replaced by a new game, a muster or an
     undo -- is not a casualty, and ghosting it showers the screen with the
     previous army. A dead unit stays in G.units with alive:false, which is
     exactly what distinguishes the two. */
  for (const uid in prev) {
    if (seen.has(uid)) continue;
    const gone = byUid(G, +uid);
    if (!gone || gone.alive) continue;
    const g = document.createElement("div");
    g.className = "ghost";
    g.innerHTML = prev[uid].html;
    g.style.left = prev[uid].rect.left + "px";
    g.style.top = prev[uid].rect.top + "px";
    g.style.width = prev[uid].rect.width + "px";
    g.style.height = prev[uid].rect.height + "px";
    document.body.appendChild(g);
    setTimeout(() => g.remove(), 700);
  }
}

/* ============================================================
   AUDIO — synthesised on the fly. No files, because the game
   ships as one HTML document with no external assets at all.
   ============================================================ */
let AC = null;
function audioCtx() {
  if (AC === null) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { AC = false; }
  }
  return AC || null;
}

function tone(freq, dur, type, gain, delay) {
  const ac = audioCtx();
  if (!ac) return;
  const t0 = ac.currentTime + (delay || 0);
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = type || "square";
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(ac.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}

/* A burst of noise shaped by env(p) as p runs from 0 to 1, through the
   filters given in order, starting delay seconds from now. */
function noiseBurst(dur, env, filters, gain, delay) {
  const ac = audioCtx();
  if (!ac) return;
  const t0 = ac.currentTime + (delay || 0), n = Math.max(1, Math.floor(ac.sampleRate * dur));
  const buf = ac.createBuffer(1, n, ac.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * env(i / n, i);
  const src = ac.createBufferSource(), g = ac.createGain();
  src.buffer = buf;
  g.gain.value = gain;
  let node = src;
  for (const [type, freq, q, to] of filters) {
    const f = ac.createBiquadFilter();
    f.type = type;
    f.frequency.setValueAtTime(freq, t0);
    if (to) f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    if (q) f.Q.value = q;
    node.connect(f);
    node = f;
  }
  node.connect(g).connect(ac.destination);
  src.start(t0);
}
/* A struck partial: a sine that rings and dies, for the metal and the dice. */
function ring(freq, dur, gain, delay) {
  const ac = audioCtx();
  if (!ac) return;
  const t0 = ac.currentTime + (delay || 0), osc = ac.createOscillator(), g = ac.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(ac.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
const speedNow = () => (UI.speedFactor == null ? 1 : UI.speedFactor);

/* A base pushed across the field: felt over wood, grainy, quickest at the
   start and slowing into place, as the glide does (240ms, easing out). */
function slideSound() {
  const dur = Math.max(0.12, 0.27 * (speedNow() || 0.45));
  let grain = 1;
  noiseBurst(dur, (p, i) => {
    if (i % 90 === 0) grain = 0.55 + Math.random() * 0.9;
    return grain * Math.min(1, p * 16) * Math.pow(1 - p, 1.7);
  }, [["bandpass", 1500, 0.8, 620], ["lowpass", 3200]], 0.1);
}
/* The dice thrown: each one knocking against the others and the board for
   as long as they tumble on screen (425ms before the first lands), over the
   low roll of them along the cloth. n is how many are thrown. */
function diceRattle(n) {
  const span = Math.max(0.2, 0.42 * (speedNow() || 0.45));
  noiseBurst(span, p => Math.min(1, p * 8) * (1 - p) * 0.8, [["lowpass", 700]], 0.035);
  for (let d = 0; d < Math.max(1, n || 3); d++) {
    for (let t = Math.random() * 0.03; t < span; t += 0.03 + Math.random() * 0.05) {
      const lvl = 0.5 + Math.random() * 0.5, f = 2200 + Math.random() * 2400;
      noiseBurst(0.007, p => 1 - p, [["bandpass", f, 3]], 0.09 * lvl, t);
      ring(900 + Math.random() * 900, 0.018, 0.012 * lvl, t);
    }
  }
}
/* One die coming to rest: a knock, and a smaller one as it settles. */
function dieLand() {
  for (const [at, lvl] of [[0, 1], [0.045 + Math.random() * 0.03, 0.4]]) {
    noiseBurst(0.012, p => Math.pow(1 - p, 2), [["bandpass", 1700, 1.6]], 0.11 * lvl, at);
    ring(620, 0.045, 0.03 * lvl, at);
  }
}
/* Steel on steel: the partials of a struck bar (1 : 2.76 : 5.40 : 8.93),
   each dying faster than the one under it, a bright scrape on the strike,
   and a second blade a moment behind. Bigger for a base destroyed. */
function clash(big) {
  const f = 560 + Math.random() * 120, len = big ? 0.75 : 0.45, lvl = big ? 1.05 : 0.8;
  for (const [at, k] of [[0, 1], [0.055, 0.6]]) {
    const fk = f * (at ? 1.06 : 1);
    [[1, 1], [2.76, 0.7], [5.4, 0.45], [8.93, 0.3]].forEach(([r, a], i) => {
      ring(fk * r, len / (1 + i * 0.6), 0.016 * a * k * lvl, at);
      ring(fk * r + 3.1, len / (1 + i * 0.6), 0.008 * a * k * lvl, at);   /* the shimmer: two strokes, a hair apart */
    });
    noiseBurst(0.05, p => Math.pow(1 - p, 3), [["highpass", 3800]], 0.07 * k * lvl, at);
  }
}

const SFX = {
  select: () => tone(520, 0.05, "square", 0.04),
  move:   slideSound,
  turn:   () => tone(220, 0.05, "square", 0.03),
  dice:   n => diceRattle(n),
  tick:   dieLand,
  hit:    () => clash(false),
  kill:   () => { clash(true); tone(70, 0.3, "square", 0.04, 0.05); },
  /* a base lost to a panic: no blow struck it, so no clash */
  broken: () => { tone(140, 0.22, "sawtooth", 0.08); tone(70, 0.3, "square", 0.05, 0.05); },
  panic:  () => { tone(420, 0.1, "sine", 0.05); tone(300, 0.12, "sine", 0.05, 0.08); tone(200, 0.16, "sine", 0.05, 0.17); },
};

function sfx(name, arg) {
  if (UI.muted) return;
  const fn = SFX[name];
  if (fn) { try { fn(arg); } catch (e) { /* audio is a nicety, never a failure */ } }
}

/* ============================================================
   SPEED & MUTE — both persisted, both reflected in the HUD.
   ============================================================ */
const SPEED_FACTOR = { 1: 1, 2: 0.35, 3: 0 };
const SPEED_NAME = { 1: "Measured", 2: "Brisk", 3: "Instant" };

function applySpeed() { UI.speedFactor = SPEED_FACTOR[UI.speed] != null ? SPEED_FACTOR[UI.speed] : 1; }

function cycleSpeed() {
  UI.speed = (UI.speed % 3) + 1;
  applySpeed();
  try { localStorage.setItem(SPEED_KEY, String(UI.speed)); } catch (e) {}
  announce("Speed: " + SPEED_NAME[UI.speed]);
  updateAll();
}

function toggleMute() {
  UI.muted = !UI.muted;
  try { localStorage.setItem(MUTED_KEY, UI.muted ? "1" : "0"); } catch (e) {}
  announce(UI.muted ? "Muted." : "Sound on.");
  if (!UI.muted) sfx("select");
  updateAll();
}

function loadPrefs() {
  try {
    UI.muted = localStorage.getItem(MUTED_KEY) === "1";
    const sp = parseInt(localStorage.getItem(SPEED_KEY) || "1", 10);
    UI.speed = (sp >= 1 && sp <= 3) ? sp : 1;
  } catch (e) { UI.muted = false; UI.speed = 1; }
  applySpeed();
}

/* ============================================================
   HOUSE RULES
   Each carries its provenance, because "optional rule" and "we
   invented this" are not the same claim. Everything is off by
   default, so the shipped defaults are the standard game.
   ============================================================ */
/* Shown in the menu. The round limit is deliberately NOT here: it is not a
   game rule at all, only a stalemate backstop, and offering it as a choice
   invites someone to switch on a rule the game does not have. */
/* Off is the standard game. Every switch here is an override, and none of
   them is on unless you turn it on. */
const HOUSE_RULES = [
  { key: "massiveInfantry", name: "Massive Infantry",
    source: "Optional rule",
    note: "All 20 Infantry a side, up to 10 on a base, never more than 4 dice." },
  { key: "partialBases", name: "Bases may be under-filled",
    source: "House rule",
    note: "Normally a base is fielded full and holds fewer only once it has taken casualties. This lets you field a 3-man Infantry base or a lone Knight from the start." },
  { key: "freeKing", name: "The King deploys freely",
    source: "House rule",
    note: "Normally your King must start on the royal emblem in the centre of the back row, and nothing may swap onto that square. This frees it to go anywhere on your two ranks like every other base." },
  { key: "extraGreen", name: "Green rolls an extra die",
    source: "House rule",
    note: "Green throws one die more than the unit is owed and discards the worst of them — three dice become four, keep three. A PANIC goes first, then a face that scores nothing; a scoring face is never the one thrown away." },
  { key: "extraGold", name: "Gold rolls an extra die",
    source: "House rule",
    note: "The same for Gold. Set one for a handicap either way, or both to leave the odds level and the fights bloodier." },
];

function defaultHouseRules() {
  return { massiveInfantry: false, partialBases: false, freeKing: false,
           extraGreen: false, extraGold: false };
}
/* The engine keeps its own polarity -- anchorKing describes a
   restriction, which is what the rules functions want to ask about. This is
   the one place the two vocabularies meet. */
function houseRulesToCfg(hr) {
  return { massiveInfantry: !!hr.massiveInfantry,
           partialBases: !!hr.partialBases,
           anchorKing: !hr.freeKing,
           extraDie: [!!hr.extraGreen, !!hr.extraGold],
           roundCap: STALEMATE_CAP };
}
