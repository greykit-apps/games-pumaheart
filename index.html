<style>
/* ============================================================
   TOKENS — Tactical tribe. The canon block is the palette every
   Tactical game shares; everything PumaHeart adds is a mapping
   onto it, never a new hue.
   ============================================================ */
/* @gk-tokens-begin v0.1 -- greykit.games canon (games-meta STANDARD.md §4): the Tactical palette, PumaRally's (editor/render/palette.js). The copy of record is games-meta's canon/gk-tokens.css. */
:root{--bg:#05070f;--panel:#0a0e1a;--panel2:#0d1424;--line:#1b2540;--lit:#47609c;
  --text:#dbe4fb;--ink:#8b96b8;--dim:#7d8aa8;--accent:#54f2ff;--warn:#ffb000;--danger:#ff5266;
  --good:#4ade6a;--violet:#b47dff;--steel:#94a0c4;--blue:#4c8dff}
/* @gk-tokens-end */
:root {
  /* Darker steps of tribe hues, for borders under a lit label. accent-dim
     and floor are PumaRally's; the other two are the same hue taken down. */
  --accent-dim: #2b7f92;
  --good-dim: #297a3a;
  --danger-dim: #a8364a;
  --floor: #0e1524;
  --font-mono: "Courier New", "Lucida Console", monospace;
  --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);

  /* --- PumaHeart mapping layer -------------------------------
     Cyan is the live thing, amber is Gold, green is Green, red is
     only harm. The two armies sit at 11.45:1 and 10.98:1 against
     --bg but only 1.04:1 against EACH OTHER: they differ in hue
     alone, which is the pair red-green colour blindness confuses.
     Side is therefore also carried by base treatment (side 0
     solid, side 1 dashed), by the figure pips, and by the
     aria-label. Never let colour be the only channel. */
  --army-green: var(--good);       /* side 0 */
  --army-gold: var(--warn);        /* side 1 */
  --sel: var(--text);              /* selection ring            */
  --mv: var(--accent);             /* legal move destination    */
  --tg: var(--danger);             /* legal attack target       */
  --zone: rgba(242, 196, 0, 0.14);   /* an archer's 3x3 block -- PumaRally's hazard */
  --sq-light: var(--floor);
  --sq-dark: var(--panel);
  --deploy-green: rgba(74, 222, 106, 0.07);  /* side 0 deployment ranks */
  --deploy-gold: rgba(255, 176, 0, 0.07);    /* side 1 deployment ranks */

  /* Floors at 32px so a 9-wide board fits a 380px viewport. */
  /* Nine files have to clear the rail and the gaps, eight ranks the window.
     424px is the rail, the gaps, and the stage's margin around the frame;
     --chrome-h is everything stacked above and below the eight ranks -- the
     stage margin, the frame, the HUD and the Field box -- plus room for a
     three-line hint, so a hint arriving does not push the board off-screen
     at any size down to a small laptop.
     Without one the frame is that much shorter and the scenery fills in.
     ONE SIZE FOR EVERY PHASE. The board used to shrink for deployment and
     the frame to widen with whatever was under the board, and with the
     frame centred over scenery every change of width slid the field in and
     out behind it. The board's size depends on the window alone. */
  --chrome-h: 242px;
  --sq: clamp(32px, min(calc((100vw - 424px) / 9.6), calc((100vh - var(--chrome-h)) / 8)), 96px);
}

* { box-sizing: border-box; }
:root { color-scheme: dark; }
/* scrollbars: the greykit.games canon's (the @gk-title script) */

html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-mono); font-size: 14px; line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

/* ============================================================
   SCENERY -- a line-drawn field at dusk behind the frame, after
   PumaCity's. Low contrast on purpose: it frames the board and
   never competes with it. The colours are PumaCity's scene
   values; the only game hues it borrows are the two armies',
   one to a side.
   ============================================================ */
.scene {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background: linear-gradient(#05070f 0%, #070b17 40%, #0c1020 68%, #181622 88%, #231a17 100%);
}
.scene svg { display: block; width: 100%; height: 100%; }
.scene .sf { fill: #0a0f1d; stroke: #2a3960; stroke-width: 2; stroke-linejoin: round; }
.scene .sf.far { fill: #080c18; stroke: #1d2948; }
.scene .sground { fill: #070a13; }
.scene .sl { fill: none; stroke: #2a3960; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.scene .sd { fill: none; stroke: #1d2948; stroke-width: 1.5; stroke-linecap: round; }
.scene .sx { fill: #111a30; }
.scene .st { fill: #8b96b8; opacity: 0.45; }
.scene .smoon { fill: #dbe4fb; opacity: 0.32; }
.scene .ssky { fill: #05070f; }
.scene .sgold { fill: #ffb000; opacity: 0.3; }
.scene .sgreen { fill: #4ade6a; opacity: 0.3; }
.scene .sgold.door, .scene .sgreen.door { opacity: 0.2; }
.scene .sglow-gold { fill: #ffb000; opacity: 0.045; }
.scene .sglow-green { fill: #4ade6a; opacity: 0.045; }

/* ============================================================
   BOXED CHROME — the Crescent Hawk layer. Every panel is a hard
   rectangle with a double rule at the top and a small-caps label
   notched into it. No rounding, no shadows, no gradients: the
   1988 look is flat and framed.
   ============================================================ */
.box {
  position: relative; background: var(--panel);
  border: 1px solid var(--line); border-top: 3px double var(--line);
  padding: 14px 12px 12px;
}
.box > .box-label {
  position: absolute; top: -8px; left: 10px;
  background: var(--bg); padding: 0 6px;
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--steel);
}

/* Progressive disclosure, native. The house rules and their notes are
   exactly the wrong thing to hand a first-time player at the moment they
   are trying to start a game. */
.disclose { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px; }
.disclose > summary {
  cursor: pointer; color: var(--dim); list-style: none;
  padding: 4px 0; user-select: none;
}
.disclose > summary::-webkit-details-marker { display: none; }
.disclose > summary::before { content: "+ "; color: var(--accent); }
.disclose[open] > summary::before { content: "\2212 "; }
.disclose > summary:hover, .disclose > summary:focus-visible { color: var(--text); }
/* The opening the library just laid, named where it can replace itself. */
.dep-opening { margin: 6px 0 0; }
.dep-opening .box-label-ish {
  color: var(--steel); letter-spacing: 0.12em; text-transform: uppercase;
  font-size: 12px; margin-right: 8px;
}

/* ============================================================
   LAYOUT — board centre, the rail beside it, the battle plan
   at the top of the rail during deployment. The frame is one
   width in every phase and the board one size; only a hint under
   the board changes the frame's height. Collapses to one column
   on a phone, where the battle plan lands under the board.
   ============================================================ */
/* THE STAGE centres the frame in the window over the scenery -- PumaCity's
   arrangement. On a large screen the game used to sit at the top with the
   rest of the window empty below it.
   Centred horizontally by flex, but vertically by placeFrame(), which sets
   the top padding from the frame's height WITHOUT the coach line. Flex
   centring both ways slid the whole frame up and down over the scenery
   every time a hint arrived, changed length or left; anchored by its top,
   a hint grows the frame downward and nothing above it moves. */
.stage {
  position: relative; z-index: 1; min-height: 100dvh;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 24px;
}
#app {
  /* The frame: opaque, so the scenery never shows through text, and square
     with the box's double rule rather than PumaCity's rounded, shadowed
     terminal -- the Crescent Hawk layer is flat and framed. */
  max-width: 100%; background: var(--bg);
  border: 1px solid var(--line); border-top: 3px double var(--line);
  /* Row spacing lives on the items, not in row-gap: the touch row is empty
     most of the time, and a row-gap still opens between empty tracks, which
     ran the rail past the board's foot once the frame made it visible. */
  display: grid; gap: 0 12px; padding: 12px;
  /* The board column is exactly as wide as the board -- min-content, so a
     long line of text under it wraps instead of widening the frame -- and
     the rail is a fixed 320px. Nothing a turn puts on screen moves either. */
  grid-template-columns: min-content 320px;
  grid-template-areas: "hud hud" "board side" "touch side";
  align-content: start; justify-content: center;
}
/* On a phone End turn and Undo come down out of the HUD to sit under the
   board, in the thumb's reach -- placeThumbCmds() moves the two nodes. On a
   wider screen this holder is empty and takes no room. */
#thumb { grid-area: thumb; display: none; }
#hud { grid-area: hud; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-width: 0; }
#hud .brand { color: var(--accent); letter-spacing: 0.22em; text-transform: uppercase; }
#hud .brand b { color: var(--text); font-weight: 700; }
#board-wrap, #side, #touchbar, #coach { margin-top: 12px; }
#board-wrap { grid-area: board; display: flex; flex-direction: column; align-items: center; position: relative; }
#grid { margin: 0 auto; }
/* The rail takes its height from the board and never the other way round:
   contain:size stops its contents counting toward the row, so the battle
   plan or a long field report cannot stretch the frame. If it ever runs
   short, it scrolls. */
#side { grid-area: side; display: flex; flex-direction: column; gap: 14px; min-width: 0;
  contain: size; overflow-y: auto; }
/* The field report takes whatever height the board leaves, rather than
   stopping at 30vh and leaving the rail half empty on a tall screen. */
#log { flex: 1 1 0; min-height: 96px; display: flex; flex-direction: column; }
#log-list { flex: 1 1 0; }

/* Turning on touch. Hidden on a mouse, where the on-base handles are better:
   they sit on the corner they rotate and need no second place to look. */
#touchbar { grid-area: touch; display: none; align-items: center; gap: 14px; justify-content: center; }
#touchbar[hidden] { display: none !important; }
.turnbtn {
  width: 52px; height: 46px; flex: none;
  background: none; border: 1px solid var(--line); color: var(--accent);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
}
.turnbtn svg { width: 26px; height: 26px; overflow: visible; }
.turnbtn .arc { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.turnbtn .head { fill: currentColor; stroke: none; }
.turnbtn:active { color: var(--text); border-color: var(--accent-dim); }
.turn-who { text-align: center; min-width: 9em; }
.turn-who .dim { display: block; font-size: 12px; }

/* THE COACH. One line, under the board, in the cyan reserved for the thing
   to look at -- not a modal, and never covering what it describes. It sits
   inside the Field box and wraps to the board's width; with no hint it takes
   no room at all. */
#coach {
  align-self: stretch; display: flex; align-items: flex-start; gap: 12px;
  border: 1px solid var(--accent-dim); padding: 8px 10px;
  color: var(--accent);
}
#coach > * { animation: coachIn 260ms var(--ease-out-expo) backwards; }
/* display:flex beats the hidden attribute's default display:none, so the
   empty frame sat under the board for every state that has no hint. */
#coach[hidden] { display: none !important; }
#coach p { margin: 0; flex: 1; }
@keyframes coachIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.coach-x {
  flex: none; background: none; border: 1px solid var(--line); color: var(--dim);
  font: inherit; font-size: 12px; padding: 3px 8px; cursor: pointer;
}
.coach-x:hover, .coach-x:focus-visible { color: var(--text); border-color: var(--lit); }



#log-list { list-style: none; margin: 0; padding: 0; max-height: 30vh; overflow-y: auto; }
#log-list li { padding: 2px 0; border-bottom: 1px solid var(--panel2); color: var(--dim); }
/* An attack is two lines: who swung at what, then the roll and what it cost.
   Dice at log scale carry no border -- four boxed glyphs in a narrow column
   read as a row of buttons, and the field report is a record, not a control. */
#log-list li.log-attack { padding: 5px 0 6px; }
.log-who, .log-roll { margin: 0; }
.log-roll { display: flex; align-items: center; gap: 3px; margin-top: 3px; }
.logdie { width: 15px; height: 15px; flex: none; color: var(--dim); }
.logdie svg { width: 100%; height: 100%; display: block; }
.logdie svg path { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.logdie.f-axe.scores, .logdie.f-arrow.scores { color: var(--good); }
.logdie.f-panic { color: var(--danger); }
/* Set aside by the extra-die house rule: rolled, and not counted. */
.logdie.discarded, .bigdie.discarded { opacity: 0.3; }
.logdie.discarded { margin-left: 5px; }
.bigdie.discarded { border-style: dashed; }
.log-sum { margin-left: 5px; white-space: nowrap; }
.sum-bad { color: var(--danger); }
.sum-note { color: var(--dim); }

/* ============================================================
   BOARD & UNITS
   Side is carried by FOUR channels, never by colour alone: hue,
   a solid vs dashed base ring, the figure pips, and the
   aria-label. --army-green and --army-gold sit at 11.5:1 and 11.0:1
   against the ground but only 1.04:1 against each other -- they differ
   in hue, not brightness, which is exactly the pair red-green
   colour blindness confuses.
   ============================================================ */
#grid { display: grid; grid-auto-rows: var(--sq); border: 1px solid var(--line); width: max-content; }
.sq {
  position: relative; width: var(--sq); height: var(--sq);
  border: 1px solid var(--line); background: var(--sq-dark);
}
.sq.lt { background: var(--sq-light); }
.sq.dz0 { background-image: linear-gradient(var(--deploy-green), var(--deploy-green)); }
.sq.dz1 { background-image: linear-gradient(var(--deploy-gold), var(--deploy-gold)); }
/* Highlights live on two pseudo layers rather than one box-shadow, so each
   can animate independently: ::before is the wash and paints UNDER the unit,
   ::after is the ring and paints OVER it, which is what makes a target ring
   read as a crosshair. */
.sq::before, .sq::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
.sq.zone::before { background: var(--zone); }
/* Behind the screen: the square is occupied and you are not to know by what.
   Ruled rather than blank, so the far ranks read as a line you cannot see
   through rather than as empty board. */
.sq.screened::before {
  background: repeating-linear-gradient(
    135deg, var(--line) 0 1px, transparent 1px 7px);
  opacity: 0.9;
}
/* THE TRAIL. The other side's turn used to land in a single frame -- a base
   was simply somewhere new, and the only record was a log line naming a
   square. Where each unit started is left dashed, and where it is now rings
   in its army's colour, until you take your first action. Declared before
   the move and target rings so either of those outranks it on the same
   square. --tr is set per square to the mover's hue. */
.sq.tr-from::before { outline: 1px dashed color-mix(in srgb, var(--tr) 70%, transparent); outline-offset: -6px; }
.sq.tr-to::after { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--tr) 75%, transparent); }
@keyframes trailIn { from { opacity: 0; } to { opacity: 1; } }
/* Fades in once, after the slide has landed -- not on every re-render. */
#grid.is-trailing .sq.tr-from::before,
#grid.is-trailing .sq.tr-to::after { animation: trailIn 420ms var(--ease-out-quart) 200ms backwards; }

/* File letters under the board and rank numbers beside it, in the Field
   box's own padding, so the squares the field report names can be found.
   Absolutely placed, so they cost the board no width. */
#grid { position: relative; }
.coord {
  position: absolute; pointer-events: none; color: var(--lit);
  font-size: 10px; line-height: 1; text-align: center;
}
.coord.file { bottom: -12px; width: var(--sq); }
.coord.rank { left: -12px; width: 10px; height: var(--sq); display: flex; align-items: center; justify-content: center; }

.sq.mv::after { box-shadow: inset 0 0 0 2px var(--mv); }
/* The square under the hand during a drag. */
#grid.is-dragging { cursor: grabbing; }
#grid.is-dragging .sq { cursor: grabbing; }
.sq.drag-over::after { box-shadow: inset 0 0 0 3px var(--sel); }
.sq.mv.drag-over::after { box-shadow: inset 0 0 0 3px var(--mv); }
.sq.tg.drag-over::after { box-shadow: inset 0 0 0 3px var(--tg); }
.sq.tg::after { box-shadow: inset 0 0 0 2px var(--tg); }

@keyframes bloom { from { opacity: 0; transform: scale(0.72); } to { opacity: 1; transform: none; } }
#grid.is-blooming .sq.zone::before,
#grid.is-blooming .sq.mv::after,
#grid.is-blooming .sq.tg::after {
  animation: bloom 260ms var(--ease-out-expo) backwards;
  animation-delay: calc(var(--d, 0) * 42ms);
}
/* Targets land after the moves around them, so "you can go there" reads
   before "you can hit that". */
#grid.is-blooming .sq.tg::after { animation-delay: calc(var(--d, 0) * 42ms + 90ms); }

/* THE CALL-OUT. An attack the player did not order is the one moment where
   the dice arrive with no idea who threw them, so the board says so first:
   the attacker rings in its own colour, its reach washes in exactly as a
   selected unit's would -- an Archer's block over friendly heads especially
   -- and the unit about to be hit rings red and pulses. The plain .tg ring
   cannot carry this on its own: during your own turn it means "you could hit
   this", and here it has to mean "this is being hit, now". */
@keyframes aimPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.sq.aim-atk.aim-s0::after { box-shadow: inset 0 0 0 3px var(--army-green); }
.sq.aim-atk.aim-s1::after { box-shadow: inset 0 0 0 3px var(--army-gold); }
.sq.aim-def::after { box-shadow: inset 0 0 0 3px var(--tg), 0 0 9px var(--tg); }
.sq.aim-atk::after, .sq.aim-def::after {
  animation: aimPulse var(--aim-ms, 520ms) var(--ease-out-quart) infinite;
}
/* The pulse is the whole point of the beat, so it outranks the bloom that
   would otherwise fade these two squares in and then stop. */
#grid.is-blooming .sq.aim-atk::after,
#grid.is-blooming .sq.aim-def::after { animation-delay: 0s; }

/* The armies march on. Opacity and transform only. */
@keyframes marchIn {
  from { opacity: 0; transform: translateY(var(--march, 0)) scale(0.88); }
  to   { opacity: 1; transform: none; }
}
#grid.is-entering .u {
  animation: marchIn 460ms var(--ease-out-expo) backwards;
  animation-delay: calc(var(--e, 0) * 38ms);
}
#grid.is-entering .u.s0 { --march: 26px; }
#grid.is-entering .u.s1 { --march: -26px; }

.u { position: absolute; inset: 2px; display: flex; align-items: center; justify-content: center; }
.u.s0 { color: var(--army-green); }
.u.s1 { color: var(--army-gold); }
/* The base plate. Stroke stays 2px at every board size, so the shave reads
   the same on a phone as on a desktop. */
.u .base { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 50% 50%; }
.u .base path {
  /* A faint fill matters more than it sounds: an outline alone reads as a
     wire box and you have to inspect the corners, whereas a filled shape
     registers its silhouette at a glance -- which is the entire point of
     shaving the front corners. */
  fill: currentColor; fill-opacity: 0.13;
  stroke: currentColor; stroke-width: 2;
  vector-effect: non-scaling-stroke; stroke-linejoin: round;
}
/* Side is still carried by more than hue: side 0 solid, side 1 dashed. */
/* Long dashes: short ones chop up the diagonals, which are the part of the
   outline actually carrying the facing. */
.u.s1 .base path { stroke-dasharray: 9 4; }
/* The halo goes on the plate alone. On the whole unit it bled white into the
   glyph and the pips, and the selected base was the one you could no longer
   read -- you lost WHAT you had picked at the moment you picked it. */
.u.is-sel .base path { stroke: var(--sel); stroke-width: 3; fill-opacity: 0.24; }
.u.is-sel .base { filter: drop-shadow(0 0 3px rgba(219, 228, 251, 0.55)); }

.u svg:not(.base) { width: 52%; height: 52%; margin-bottom: 26%; position: relative; }
/* evenodd, so a glyph can knock a detail out of itself -- the knight's eye. */
.u svg.fl path { fill: currentColor; fill-rule: evenodd; }
.u svg.ln path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* The figure count is the single most important number in the game -- it is
   at once the unit's toughness AND its dice pool -- so it is drawn, not
   merely implied. */
/* Raised off the base's edge and sized with the square, so a full row
   clears the border in every facing. At 2px off the bottom, a base turned
   east or west put its shaved corner across the end of the row -- the
   pips poked through the outline by up to 3px on a small board. Measured:
   9.6px clear at 96px squares, 2.5px at 39px, the worst facing each time. */
.u .pips {
  position: absolute; bottom: calc(var(--sq) * 0.17); left: 50%; transform: translateX(-50%);
  display: flex; gap: max(1px, calc(var(--sq) * 0.016));
}
.u .pips i {
  width: clamp(2.5px, calc(var(--sq) * 0.048), 5px);
  height: clamp(3px, calc(var(--sq) * 0.058), 6px);
  background: currentColor;
}
/* A spent figure reads as ABSENT, not as an outlined box: at 32px a 1px
   outline is indistinguishable from a fill, so the length of the bar has to
   carry the count. */
.u .pips i.off { background: currentColor; opacity: 0.16; }
.u .pipnum { position: static; font-size: 10px; color: currentColor; line-height: 1; }

/* Deployment */
#deploybar { flex: none; }
/* Side by side in the 320px rail: the default padding stacked them. */
#deploybar .muster-actions { flex-wrap: wrap; }
#deploybar .muster-actions .btn { flex: 1 1 auto; padding: 8px 6px; }
/* The battle plan takes the rail's top, and the field report stands down
   while it does: during deployment it only echoes placements the board is
   already showing, and on a laptop-sized window the plan, the unit and the
   report together overran the rail. */
#app.is-deploying #log { display: none; }
#deploybar[hidden] { display: none !important; }
#deploybar .dep-who { margin: 2px 0 4px; }
#deploybar p { margin: 2px 0; }
.sq.dzone { outline: 1px solid var(--lit); outline-offset: -1px; }


/* The ending sits over the board rather than replacing it -- the final
   position is the last thing worth looking at, so it stays lit behind. */
#over {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: center; justify-content: center;
  background: rgba(5, 7, 15, 0.72); padding: 20px;
  animation: backdropIn 200ms var(--ease-out-quart);
}
#over[hidden] { display: none !important; }
.over-card {
  min-width: 300px; max-width: 420px; background: var(--bg);
  padding: 22px 24px 18px; text-align: center;
  animation: overIn 320ms var(--ease-out-expo);
}
@keyframes overIn { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: none; } }
.over-who { margin: 6px 0 2px; font-size: 21px; letter-spacing: 0.1em; text-transform: uppercase; }
.over-why { margin: 0 0 16px; color: var(--dim); }
.over-count {
  display: grid; grid-template-columns: auto auto; gap: 3px 14px;
  justify-content: center; margin: 0 0 18px; text-align: left;
}
.over-count dt, .over-count dd { margin: 0; }
.over-count dd { color: var(--dim); }
.over-card .muster-actions { justify-content: center; }

/* Menu and help share the overlay shell. */
#menu, #help {
  position: fixed; inset: 0; z-index: 8200; display: flex;
  align-items: center; justify-content: center; background: rgba(5,7,15,0.94);
  overflow: auto; padding: 16px;
}
#menu[hidden], #help[hidden] { display: none !important; }
.menu-card { background: var(--bg); min-width: 340px; max-width: 560px; }
.help-card { background: var(--bg); max-width: 780px; width: 100%;
  display: flex; flex-direction: column; max-height: calc(100dvh - 32px); }
.help-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 10px; }
.help-body { overflow-y: auto; min-height: 0; flex: 1; padding-right: 4px; }
.help-card > .muster-actions { margin-top: 10px; }
.menu-rows { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 10px 0 14px; align-items: start; }
.menu-rows dt { color: var(--steel); }
.menu-rows dd { margin: 0; display: flex; gap: 6px; flex-wrap: wrap; }
.opt {
  border: 1px solid var(--line); padding: 2px 8px; cursor: pointer; color: var(--dim);
}
.opt:hover { border-color: var(--lit); color: var(--text); }
.opt.on { border-color: var(--accent-dim); color: var(--accent); }
.prov-head { color: var(--steel); margin: 10px 0 4px; }
ul.house { list-style: none; margin: 0 0 12px; padding: 0; }
ul.house li { border-top: 1px solid var(--panel2); padding: 6px 0; }
ul.house .prov { color: var(--dim); font-size: 11px; margin-left: 8px; }
ul.house p { margin: 3px 0 0; font-size: 13px; }
.help-card h3 { color: var(--steel); font-size: 12px; letter-spacing: 0.12em;
  text-transform: uppercase; margin: 16px 0 6px; }
.help-card p { margin: 6px 0; }
.scrollx { overflow-x: auto; }
table.ref { border-collapse: collapse; width: 100%; }
table.ref th, table.ref td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--panel2);
  vertical-align: top; }
table.ref thead th { color: var(--steel); font-weight: normal; font-size: 11px;
  letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
table.ref tbody th { font-weight: normal; white-space: nowrap; }
/* Each warrior's note runs the full width on its own line under the numbers.
   As an eighth column it was pushed off the card's right edge behind a
   horizontal scroll -- and it is the column that says what the unit DOES. */
table.ref tr.has-note th, table.ref tr.has-note td { border-bottom: 0; padding-bottom: 0; }
table.ref td.note { color: var(--dim); font-size: 12px; padding-top: 2px; padding-bottom: 6px; }
table.ref.keys { max-width: 460px; }

/* Tumbling: dim and restless, so a settled die reads as decided. Both
   keyframes belong to the cut-in's .bigdie now -- there was a Dice panel
   holding a third copy of the same roll, and it went once the field report
   started drawing the faces itself. */
@keyframes rollShake {
  0%   { transform: translateY(0) rotate(-7deg); }
  50%  { transform: translateY(-3px) rotate(7deg); }
  100% { transform: translateY(0) rotate(-7deg); }
}
@keyframes dieLand {
  from { transform: scale(1.3) rotate(-9deg); }
  to   { transform: none; }
}

/* A unit that falls leaves a ghost where it stood */
.ghost {
  position: fixed; z-index: 40; pointer-events: none;
  animation: fade 640ms var(--ease-out-quart) forwards;
}
.ghost .u { position: absolute; inset: 0; }
@keyframes fade { to { opacity: 0; transform: scale(1.35); } }

/* Muster screen */
#muster {
  position: fixed; inset: 0; z-index: 8100; display: flex;
  align-items: center; justify-content: center; background: rgba(5,7,15,0.94);
  overflow: auto; padding: 16px;
}
#muster[hidden] { display: none !important; }
.muster-card { background: var(--bg); min-width: 340px; max-width: 560px; }
table.muster { border-collapse: collapse; width: 100%; margin: 10px 0; }
table.muster th, table.muster td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--panel2); }
table.muster thead th { color: var(--steel); font-weight: normal; font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase; }
table.muster tbody th { font-weight: normal; }
/* The cap is a footnote to the name, not part of it. */
table.muster .cap { display: block; color: var(--dim); font-size: 11px; line-height: 1.2; }
.muster-lede { margin: 6px 0 2px; }
table.muster .pool { color: var(--dim); text-align: right; white-space: nowrap; }
table.muster tr.bad .pool, table.muster tr.bad th { color: var(--danger); }
table.muster tr.locked { color: var(--dim); }
td.step { white-space: nowrap; }
td.step b { display: inline-block; min-width: 1.6em; text-align: center; }
.sbtn {
  display: inline-block; min-width: 20px; text-align: center; cursor: pointer;
  border: 1px solid var(--line); color: var(--accent); line-height: 18px;
}
.sbtn:hover { border-color: var(--lit); }
.tally { margin: 6px 0 0; }
.tally .ok { color: var(--good); }
.tally .bad { color: var(--danger); }
.why { margin: 4px 0 12px; color: var(--warn); min-height: 1.4em; }
.why.ok { color: var(--accent); }
.muster-actions { display: flex; gap: 10px; }
.btn[disabled] { color: var(--dim); border-color: var(--panel2); cursor: not-allowed; }
/* Six identical ghost buttons said nothing about which one you want. Ending
   your turn is the only command play needs, so it is the only one that looks
   like a command; the two toggles read as settings; starting over -- the one
   that throws the game away -- sits last and quietest, not first. */
.hud-new { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 1 1 auto; min-width: 0; }
/* flex:none, or a narrow window shrinks the long ones below their text and
   clips them instead of wrapping the row. */
.cmd { flex: none; white-space: nowrap; color: var(--dim); cursor: pointer; padding: 2px 6px; border: 1px solid var(--line); }
.cmd:hover { color: var(--text); border-color: var(--lit); }
.cmd.is-primary { color: var(--accent); border-color: var(--accent-dim); }
.cmd.is-primary:hover { color: var(--bg); background: var(--accent); border-color: var(--accent); }
.cmd.is-toggle { border-style: dashed; }
.cmd.is-quiet { border-color: transparent; }
.cmd.is-quiet:hover { border-color: var(--line); }
/* Armed: the first click on End turn with an action still unspent asks for a
   second, and the pips it would throw away blink. See passTurn(). */
/* Wide enough for either label, so arming it does not re-flow the HUD. */
#hud-end { min-width: calc(11ch + 14px); text-align: center; }
.cmd.is-primary.is-armed,
.cmd.is-primary.is-armed:hover { color: var(--bg); background: var(--accent); border-color: var(--accent); }
@keyframes actsBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
.acts.is-armed { animation: actsBlink 700ms var(--ease-out-quart) infinite; }
/* A command that cannot act says so, instead of swallowing the click. */
.cmd.is-off,
.cmd.is-primary.is-off { opacity: 0.38; cursor: default; color: var(--dim); border-color: var(--line); }
.cmd.is-off:hover { color: var(--dim); border-color: var(--line); background: none; }


/* The title screen (greykit.games canon: the @gk-title script draws it) sits
   over the scene with the board hidden behind it; its Settings, About and
   are-you-sure come up in a card like the New Game menu's. */
#title { position: fixed; inset: 0; z-index: 7900; overflow-y: auto; }
/* The table's pieces are the board's bases, outlined in Green's colour and
   square, as on the field; the shaved prow ends 42% down (BASE_SHAPE). */
#title .gk-title { --gk-table-edge: var(--army-green); --gk-table-ratio: 1; --gk-table-head: 0.42; }
/* In step with the quicker entrance (finish()'s timing, in init): each line
   of the name settles faster than canon's .9s, and the pieces and counters
   come down closer together than canon's 140ms and 130ms. A piece's own
   fall keeps canon's .5s, which gktPlace's knock is timed to. */
#title .gk-title.gkt.gki-intro h1 > span.gki-on { animation-duration: .45s; }
#title .gk-title.gkt.gkt-tiles.gk-rise .gk-menu > .gk-pr { animation-delay: calc(var(--i) * 100ms); }
#title .gk-title.gkt.gk-rise .gk-menu .gk-util .gk-pr { animation-delay: calc(var(--i) * 100ms + 100ms); }
#title[hidden], #sheet[hidden] { display: none !important; }
body.on-title .stage { visibility: hidden; }
#sheet {
  position: fixed; inset: 0; z-index: 8200; display: flex;
  align-items: center; justify-content: center; background: rgba(5,7,15,0.94);
  overflow: auto; padding: 16px;
}
.sheet-card { background: var(--bg); min-width: 300px; max-width: 520px; }
.sheet-card .menu-rows { margin-top: 4px; }

/* Hot-seat handover curtain */
#curtain {
  position: fixed; inset: 0; z-index: 8000; display: flex;
  align-items: center; justify-content: center; background: rgba(5,7,15,0.92);
}
#curtain[hidden] { display: none !important; }
.curtain-card { min-width: 260px; text-align: center; background: var(--bg); }
.btn {
  font: inherit; color: var(--accent); background: none;
  border: 1px solid var(--line); border-top-width: 3px; border-top-style: double;
  padding: 8px 18px; cursor: pointer;
}
.btn:hover { border-color: var(--lit); }
/* Every button in a card being identical leaves the player hunting for the
   one that starts the thing. */
.btn.btn-go { color: var(--accent); border-color: var(--accent-dim); }
.btn.btn-go:hover { color: var(--bg); background: var(--accent); border-color: var(--accent); }

/* ============================================================
   FEEDBACK
   Hover and press deliberately avoid `transform` on .u: FLIP
   owns that property during movement, and two things writing
   the same property is how animation fights itself. Fill and
   stroke carry the feedback instead.
   ============================================================ */
.u .base path { transition: fill-opacity 140ms var(--ease-out-quart), stroke-width 140ms var(--ease-out-quart); }
.sq::after { transition: box-shadow 140ms var(--ease-out-quart); }

@media (hover: hover) {
  .sq:hover .u .base path { fill-opacity: 0.28; }
  .sq.mv:hover, .sq.tg:hover { cursor: pointer; }
  .sq.mv:hover::after { box-shadow: inset 0 0 0 3px var(--mv); }
  .sq.tg:hover::after { box-shadow: inset 0 0 0 3px var(--tg); }
  .sq:has(.u):hover { cursor: pointer; }
}
.sq:active .u .base path { fill-opacity: 0.4; transition-duration: 70ms; }

/* The base plate owns `transform` for its facing, so selection cannot animate
   scale on the same element without fighting the rotation. The glow carries
   it instead. */
@keyframes ringIn { from { filter: drop-shadow(0 0 0 rgba(219, 228, 251, 0)); } to { filter: drop-shadow(0 0 3px rgba(219, 228, 251, 0.55)); } }
.u.is-sel .base { animation: ringIn 220ms var(--ease-out-expo); }

/* ============================================================
   OVERLAYS — backdrop fades, card rises. Exit is not animated:
   dismissing should feel instant, and a card that lingers on
   the way out reads as lag.
   ============================================================ */
@keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes cardIn { from { opacity: 0; transform: translateY(12px) scale(0.985); } to { opacity: 1; transform: none; } }
#menu, #help, #muster, #curtain { animation: backdropIn 170ms var(--ease-out-quart); }
#menu > *, #help > *, #muster > *, #curtain > * {
  animation: cardIn 280ms var(--ease-out-expo) backwards;
  animation-delay: 55ms;
}
#deploybar { animation: cardIn 300ms var(--ease-out-expo) backwards; }

/* ============================================================
   ROTATION HANDLES
   Sit just clear of the selected base's top corners. Ranks are
   horizontal and packed, so above the unit is the reliably
   empty direction -- flanking it would land on its neighbours.
   ============================================================ */
/* The frame the handles ride in. It carries the base's angle, so the two
   arrows stay in the shaved corners instead of sliding onto the flat rear
   edge when a unit turns away from north. It covers the whole base, so it
   must not eat clicks meant for the square underneath. */
.rots {
  position: absolute; inset: 0; transform-origin: 50% 50%;
  pointer-events: none;
}
/* Inert while the swing settles -- see rotLockMs(). */
.rots.is-locked .rot { pointer-events: none; opacity: 0.45; }
.rot { transition: opacity 120ms var(--ease-out-quart); }

.rot {
  pointer-events: auto;
  /* Wholly inside the base. At 0.60sq hanging off the corners they covered
     part of FIVE neighbouring squares -- 223px of the square directly ahead,
     which is where you click to advance, and about 200px of each side
     neighbour. A click meant for a move landed on a turn. Nothing of them
     now reaches past the base they belong to. */
  /* Tucked into the base's own top corners rather than floating above it.
     Bare strokes sitting clear of the unit landed on whatever occupied the
     rank behind, and an opaque box was what used to hide that. A north-facing
     base has those corners shaved away, so the handles drop into empty
     notches; on other facings they sit on a thin stroke and a 13% fill, which
     cyan reads over comfortably. */
  /* The box is larger than the arrow: the extra is transparent padding, so
     the mark stays a small gesture while the target stays easy to hit. */
  /* 0.38sq of target round a mark drawn at 72% of it -- the same 0.27sq
     arrow as before, in a box a quarter wider. At 0.30 the target was 19px
     on a laptop board, which is a squint, not a click. */
  position: absolute; top: 0;
  width: calc(var(--sq) * 0.38); height: calc(var(--sq) * 0.38);
  min-width: 22px; min-height: 22px;
  display: flex; align-items: center; justify-content: center;
  border: 0; background: none;
  color: var(--accent); cursor: pointer; z-index: 12;
  /* A dark halo so the bare stroke stays legible over any square. */
  filter: drop-shadow(0 0 2px var(--bg)) drop-shadow(0 0 1px var(--bg));
  animation: rotIn 200ms var(--ease-out-expo) backwards;
}
.rot-left  { left: 0; }
.rot-right { right: 0; }
.rot-right { animation-delay: 50ms; }
.rot svg { width: 72%; height: 72%; overflow: visible; }
.rot .arc  { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.rot .head { fill: currentColor; stroke: none; }
.rot:hover, .rot:focus-visible { color: var(--text); }
.rot:active { color: var(--accent-dim); }
@keyframes rotIn { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: none; } }

/* Touch needs a real target, and a phone board is only 32px a square. */
@media (pointer: coarse) {
  /* Off the base entirely -- see renderTouchbar(). */
  .rots { display: none; }
  #touchbar { display: flex; }
}
@media (pointer: coarse) and (min-width: 761px) {
  #touchbar[hidden] { display: flex !important; visibility: hidden; min-height: 46px; }
}


/* ============================================================
   COMBAT CUT-IN
   A cut-in, not a dialog: pointer-events: none, self-dismissing,
   nothing waits on the player. The one moment in the game where
   they have no agency and everything is at stake.
   ============================================================ */
#combat {
  position: absolute; inset: 0; z-index: 40; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  animation: backdropIn 150ms var(--ease-out-quart);
}
#combat[hidden] { display: none !important; }
#combat.is-closing { animation: cutOut 170ms var(--ease-out-quart) forwards; }
@keyframes cutOut { to { opacity: 0; transform: scale(0.985); } }

.combat-card {
  background: var(--bg); text-align: center; min-width: min(320px, 88vw);
  box-shadow: 0 0 0 1px var(--line), 0 18px 60px rgba(0, 0, 0, 0.75);
  animation: cutIn 260ms var(--ease-out-expo) backwards;
}
@keyframes cutIn {
  from { opacity: 0; transform: translateY(14px) scale(0.96); }
  to   { opacity: 1; transform: none; }
}
.combat-who { margin: 4px 0 14px; }
.combat-who .dim { margin: 0 6px; }
.combat-dice { display: flex; gap: 12px; justify-content: center; }

/* Big, because the dice are the event rather than a readout. */
.bigdie {
  width: 66px; height: 66px; border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  color: var(--dim);
}
.bigdie svg { width: 74%; height: 74%; }
.bigdie svg path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.bigdie.f-axe.scores, .bigdie.f-arrow.scores { color: var(--good); border-color: var(--good-dim); }
.bigdie.f-panic { color: var(--danger); border-color: var(--danger-dim); }
.bigdie.rolling { color: var(--dim); border-color: var(--line); animation: rollShake 150ms linear infinite; }
.bigdie.settled { animation: dieLand 300ms var(--ease-out-expo); }

/* Each die names its face. The player has never played before, and the rules
   hang on which face came up -- Archers score arrows, Peasants count piles,
   all PANIC is a rout -- so a glyph alone asked them to learn an alphabet
   mid-fight. The caption is withheld while the die is in the air, exactly
   as its colour is. */
.die { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.die-cap {
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim);
  transition: opacity 160ms var(--ease-out-quart);
}
.die:has(.bigdie.rolling) .die-cap { opacity: 0; }
.die:has(.bigdie.scores) .die-cap { color: var(--good); }
.die:has(.bigdie.f-panic) .die-cap { color: var(--danger); }
.die:has(.bigdie.discarded) .die-cap { opacity: 0.4; }

.combat-out {
  margin: 16px 0 2px; letter-spacing: 0.12em; text-transform: uppercase;
  transition: opacity 200ms var(--ease-out-quart);
}
/* Withheld until the last die stops. */
.combat-out.pending { opacity: 0; }
.combat-out.t-kill { color: var(--danger); }
.combat-out.t-hit { color: var(--warn); }
.combat-out.t-bad { color: var(--danger); }
.combat-out.t-none { color: var(--dim); }
.combat-note { margin: 6px 0 0; font-size: 12px; }

@media (max-width: 760px) {
  .combat-card { min-width: 0; width: 100%; }
  .bigdie { width: 52px; height: 52px; }
}

/* ============================================================
   TURN ANNOUNCEMENT
   The audience has never seen this game. Whose turn it is has
   to be unmissable, so it is said over the board once per turn
   and then gets out of the way.
   ============================================================ */
#turnbar {
  position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
  z-index: 30; pointer-events: none;
  padding: 6px 18px; border: 1px solid var(--line); border-top: 3px double var(--line);
  background: var(--bg); letter-spacing: 0.18em; text-transform: uppercase;
  animation: turnSweep 1150ms var(--ease-out-quart) forwards;
}
@keyframes turnSweep {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.94); }
  14%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  72%  { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.02); }
}


/* HUD & status */
#hud-state { display: flex; align-items: center; gap: 12px; }
.side.s0 { color: var(--army-green); }
.side.s1 { color: var(--army-gold); }
.acts { letter-spacing: 2px; color: var(--accent); }
.rnd { color: var(--dim); }
.unit-name { margin: 0 0 8px; letter-spacing: 0.1em; text-transform: uppercase; }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
.stats dt { color: var(--dim); }
.stats dd { margin: 0; }
.note { color: var(--dim); margin: 10px 0 0; font-size: 13px; }
.dim { color: var(--dim); margin: 0; }

/* ============================================================
   A11Y, TOUCH, MOTION, RESPONSIVE
   ============================================================ */
*:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.sr-only {
  /* Pinned to the top: left at its static position, the live region below
     the stage made every page one pixel too tall to fit the window. */
  position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

@media (pointer: coarse) {
  .btn, .cmd { min-height: 44px; display: inline-flex; align-items: center; }
}

@media (max-width: 760px) {
  /* One column, so the rail no longer takes a share of the width. */
  :root { --sq: clamp(30px, min(9.6vw, 8vh), 58px); }
  /* Brand and whose turn it is share the first line; the settings take the
     full width of the second. End turn and Undo are not up here at all --
     placeThumbCmds() moves them under the board. Six boxed commands in two
     rows of three stood taller over the board than half of the board, and
     the one a turn needs most sat in the corner a thumb cannot reach. */
  #hud { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  /* A grid rather than a wrapping flex row, so "Speed: Measured" wraps
     inside its own cell instead of flexbox deciding it fits when it does
     not. */
  .hud-new {
    display: grid; flex: 1 1 100%; margin-top: 6px;
    grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;
  }
  .hud-new .cmd {
    white-space: normal; text-align: center; justify-content: center;
    padding: 4px; font-size: 12px; line-height: 1.2;
  }
  #thumb {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 8px;
    margin-top: 12px;
  }
  #thumb .cmd {
    display: flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 6px;
  }
  #thumb:empty { display: none; }
  /* Four columns of steppers and counts in a 340px card: the padding goes
     before the numbers do. */
  .muster-card { min-width: 0; }
  table.muster th, table.muster td { padding: 3px 2px; }
  #scene { display: none; }
  .stage { display: block; padding: 0; }
  #app { border: 0; }
  #app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "hud" "board" "touch" "thumb" "side";
    justify-content: stretch;
  }
  /* What just happened outranks what is selected: after an AI attack the
     field report must not be a scroll away. */
  #side { contain: none; overflow: visible; }
  #log { order: 1; min-height: 120px; flex: none; }
  #status { order: 2; }
  #log-list { max-height: 34vh; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  #combat { display: none !important; }
  .ghost { display: none !important; }
  #turnbar { display: none !important; }
}
</style>
</head>
<body>
<div class="scene" id="scene" aria-hidden="true"></div>
<div class="stage">
<div id="app">
  <header id="hud">
    <span class="brand">Puma<b>Heart</b></span>
    <span id="hud-state"></span>
    <span class="hud-new">
      <span class="cmd is-primary" data-act="endTurn" role="button" tabindex="0" id="hud-end">End turn</span>
      <span class="cmd" data-act="undo" role="button" tabindex="0" id="hud-undo">Undo</span>
      <span class="cmd" data-act="help" role="button" tabindex="0">Help</span>
      <span class="cmd is-toggle" data-act="speed" role="button" tabindex="0" id="hud-speed"></span>
      <span class="cmd is-toggle" data-act="mute" role="button" tabindex="0" id="hud-mute" aria-label="Sound" aria-pressed="true"></span>
      <span class="cmd is-quiet" data-act="titleOpen" role="button" tabindex="0" title="Back to the title screen. The battle stays saved.">Menu</span>
    </span>
    <span id="hud-turn" class="sr-only" aria-live="polite"></span>
  </header>

  <section id="board-wrap" class="box" aria-labelledby="board-label">
    <span class="box-label" id="board-label">Field</span>
    <div id="grid" role="grid" aria-label="Battlefield, 9 files by 8 ranks"></div>
    <aside id="coach" hidden aria-live="polite"></aside>
    <div id="combat" hidden></div>
  </section>

  <aside id="side">
    <!-- The battle plan rides in the rail, so deployment needs no room under
         the board and the board keeps its size. -->
    <nav id="deploybar" class="box" hidden aria-label="Battle plan"></nav>
    <div id="status" class="box" aria-labelledby="status-label">
      <span class="box-label" id="status-label">Unit</span>
      <div id="status-body">No unit selected.</div>
    </div>
    <div id="log" class="box" aria-labelledby="log-label">
      <span class="box-label" id="log-label">Field Report</span>
      <ul id="log-list" aria-label="Event log"></ul>
    </div>
  </aside>

  <nav id="touchbar" hidden aria-label="Turn the selected unit"></nav>
  <div id="thumb"></div>
  <div id="over" hidden></div>

</div>
</div>
<div id="curtain" hidden></div>
<div id="muster" hidden></div>
<div id="menu" hidden></div>
<div id="help" hidden></div>
<div id="title" hidden></div>
<div id="sheet" hidden></div>
<div id="announcements" class="sr-only" aria-live="polite"></div>
