      if (!inBoard(c, r)) break;
      const occ = grid[idx(c, r)];
      if (occ) {
        if (occ === king.uid) return true;          /* runs straight onto him */
        break;
      }
      /* stopping here, would it then be adjacent and facing the King? */
      const ahead = { c: c + F[0], r: r + F[1] };
      if (ahead.c === king.c && ahead.r === king.r) return true;
    }
  }
  return false;
}

function sideScore(P, grid, s, sk) {
  let score = 0;
  const king = kingOf(P, s);
  if (!king) return -KING_LOSS;

  const foeKing = kingOf(P, 1 - s);
  const mine = [], foes = [];
  for (const u of P.units) {
    if (!u.alive) continue;
    (u.side === s ? mine : foes).push(u);
    if (u.side === s) score += unitWorth(u);
  }

  for (const u of mine) {
    /* Attacks available to me right now. */
    for (const t of attackTargets(P, grid, u)) {
      const ex = expectedAttack(P, u, t);
      score += W_ATTACK * (ex.eRemoved * FIG_VALUE[t.type] + (t.type === "king" ? ex.pKill * KING_LOSS : 0));
    }
    /* Close the distance -- deliberately tiny, so it breaks ties without
       ever outweighing a trade. On a board with four empty ranks it matters
       far less than threat does. */
    if (foeKing) score += W_ADVANCE * (H - Math.abs(u.r - foeKing.r));

    /* Facing the nearest enemy. */
    let near = null, nd = 99;
    for (const f of foes) { const d = chebyshev(u, f); if (d < nd) { nd = d; near = f; } }
    if (near) {
      const F = DIRS[u.face];
      if (F[0] * (near.c - u.c) + F[1] * (near.r - u.r) > 0) score += W_FACING;
    }
    for (const m of mine) {
      if (m !== u && Math.abs(m.c - u.c) + Math.abs(m.r - u.r) === 1) score += W_COVER / 2;
    }
    if (sk.archer && u.type === "archer") {
      if (attackTargets(P, grid, u).length) score += W_ARCHER;
      const ahead = stepFrom(u.c, u.r, u.face, 1);
      const inFront = inBoard(ahead.c, ahead.r) && byUid(P, grid[idx(ahead.c, ahead.r)]);
      if (inFront && inFront.side === s) score += W_SCREEN;
    }
  }

  if (sk.threat) {
    for (const f of foes) if (chebyshev(f, king) <= 3) score -= W_KINGSAFE;
  }
  if (sk.kingLane && kingLaneThreat(P, grid, king)) score -= W_KINGLANE;
  return score;
}

/* Zero-sum: positive is good for `side`. */
function evaluate(P, side, sk) {
  const grid = buildGrid(P);
  return sideScore(P, grid, side, sk) - sideScore(P, grid, 1 - side, sk);
}

/* Applies an action WITHOUT touching rnd(). An attack is resolved to its
   most likely figure loss rather than rolled, which keeps the second ply
   deterministic and the dice stream untouched. */
function applyQuiet(P, a) {
  const u = P.units.find(x => x.uid === a.uid);
  P.actionsLeft -= actionCost(u, a.kind);
  if (a.kind === "move") { u.c = a.c; u.r = a.r; return; }
  if (a.kind === "turn") { u.face = a.face; return; }
  const def = P.units.find(x => x.uid === a.defUid);
  u.attackedThisTurn = true;
  const ex = expectedAttack(P, u, def);
  const removed = Math.min(def.figs, Math.round(ex.eRemoved));
  if (removed > 0) {
    def.figs -= removed;
    if (def.figs <= 0) { def.figs = 0; def.alive = false; }
  }
}

/* Invariant 12. The search is pure, so a bot turn must leave G.rng
   byte-identical -- otherwise the dice stream would depend on search
   internals and a saved game would not replay. Asserted, not assumed. */
function botChooseTurnChecked(P, side, skill) {
  const before = P.rng;
  const now = () => (typeof performance !== "undefined" ? performance.now() : Date.now());
  const t0 = now();
  const plan = botChooseTurn(P, side, skill);
  const ms = now() - t0;
  if (typeof HARNESS !== "undefined" && HARNESS) {
    HARNESS.maxPlanMs = Math.max(HARNESS.maxPlanMs || 0, ms);
  }
  if (P.rng !== before) {
    throw new Error(`Bot consumed rnd(): ${before} -> ${P.rng} (the search must be pure)`);
  }
  return plan;
}

function actionDelta(P, base, a, side, sk) {
  const P2 = snapshot(P);
  applyQuiet(P2, a);
  return evaluate(P2, side, sk) - base;
}

/* Deterministic noise: a hash of the POSITION, never a draw from rnd().
   That is what lets the bot be imperfect at low skill while leaving the
   dice stream byte-identical across a turn. */
function posHash(P) {
  let h = 2166136261;
  for (const u of P.units) {
    h ^= u.uid + (u.c * 31) + (u.r * 7) + (u.face * 3) + (u.figs * 11) + (u.alive ? 1 : 0);
    h = Math.imul(h, 16777619);
  }
  h ^= P.turn * 13 + P.actionsLeft * 29;
  return h >>> 0;
}

function botChooseTurn(P, side, skillIx) {
  const sk = SKILL[Math.max(0, Math.min(SKILL.length - 1, skillIx | 0))];
  const grid = buildGrid(P);
  const acts = legalActions(P, grid, side);
  if (!acts.length) return [];

  const base = evaluate(P, side, sk);
  const scored = acts.map(a => ({ a, s: actionDelta(P, base, a, side, sk) }));
  scored.sort((x, y) => y.s - x.s);
  const h = posHash(P);

  /* Squire does not look ahead at all. It takes the best IMMEDIATE action and
     replans, which is both cheaper and genuinely weaker -- a shallower search,
     not merely a noisier one. Returning a single action is what makes it
     greedy: the phase machine calls back for the next one. */
  if (sk.beam <= 1) {
    const pool = scored.slice(0, Math.min(4, scored.length));
    return [pool[h % pool.length].a];
  }

  /* Shrink the beam to fit the leaf budget. This depends only on the
     position, so seeds still replay identically. */
  const beam = Math.max(1, Math.min(sk.beam, Math.floor(AI_MAX_LEAVES / Math.max(1, acts.length))));

  const results = [];
  for (const cand of scored.slice(0, beam)) {
    const P2 = snapshot(P);
    applyQuiet(P2, cand.a);
    let total = evaluate(P2, side, sk);
    let second = null;
    if (P2.actionsLeft > 0) {
      const g2 = buildGrid(P2);
      const b2 = evaluate(P2, side, sk);
      let bestS = 0;
      for (const b of legalActions(P2, g2, side)) {
        const d = actionDelta(P2, b2, b, side, sk);
        if (d > bestS) { bestS = d; second = b; }
      }
      total += bestS;
    }
    results.push({ total, first: cand.a, second });
  }
  results.sort((x, y) => y.total - x.total);

  let pick = results[0];
  if (sk.noise === "second" && results.length > 1 && (h % 5) === 0) {
    pick = results[1];                       /* second best one turn in five */
  }
  return pick.second ? [pick.first, pick.second] : [pick.first];
}

/* ============================================================
   CUSTOMISED MUSTER (rulebook p.6)
   "Both players start with 10 bases on the board." There is no
   points system: the constraints are the physical components --
   how many figures you own, how many fit on a base, and how
   many bases of each special you are allowed.

     Heavy Infantry - 1 or 2 bases: put 1 or 2 on a base
     Peasants       - up to 4 bases: put up to 4 on a base
     Mercenaries    - 1 base: put 2 on a base

   Which basic bases you drop to make room is NOT stated
   anywhere, so the figure pool is left to do the work.
   ============================================================ */

const MUSTER_ORDER = ["knight", "archer", "infantry", "heavy", "peasant", "mercenary"];

/* An army spec is { type: { bases, figs } }. The King is implicit: exactly
   one base of one figure, mandatory, and never in the spec. */
function basicSpec() {
  return { knight: { bases: 2, figs: 2 }, archer: { bases: 2, figs: 4 },
           infantry: { bases: 5, figs: 4 }, heavy: { bases: 0, figs: 0 },
           peasant: { bases: 0, figs: 0 }, mercenary: { bases: 0, figs: 0 } };
}

function specBases(spec) {
  return 1 + MUSTER_ORDER.reduce((n, t) => n + (spec[t] ? spec[t].bases : 0), 0);
}
function specFigures(spec) {
  return 1 + MUSTER_ORDER.reduce((n, t) => n + (spec[t] ? spec[t].bases * spec[t].figs : 0), 0);
}

/* Returns null when legal, otherwise a sentence naming what is wrong. The
   UI shows that sentence rather than greying a button with no explanation. */
function validateArmy(spec, cfg) {
  const partial = !cfg || cfg.partialBases !== false;
  for (const t of MUSTER_ORDER) {
    const e = spec[t] || { bases: 0, figs: 0 };
    const d = UNIT_DEFS[t];
    if (e.bases < 0 || e.figs < 0) return `${d.name}: negative count.`;
    if (e.bases > 0 && e.figs < 1) return `${d.name}: a base cannot be empty.`;
    const maxPer = perBaseOf(t, cfg);
    if (e.figs > maxPer) return `${d.name}: only ${maxPer} fit on a base.`;
    if (e.bases > 0 && !partial && e.figs !== maxPer && t !== "heavy" && t !== "peasant") {
      return `${d.name}: bases must be filled to ${maxPer}.`;
    }
    const used = e.bases * e.figs;
    if (used > d.perPlayer) {
      return `${d.name}: you own ${d.perPlayer}, this uses ${used}.`;
    }
    const capBases = CUSTOM_BASE_CAPS[t];
    if (capBases !== undefined && e.bases > capBases) {
      return `${d.name}: the muster allows ${capBases} ${capBases === 1 ? "base" : "bases"}.`;
    }
  }
  const n = specBases(spec);
  if (n !== BASES_TOTAL) {
    return n < BASES_TOTAL
      ? `${BASES_TOTAL - n} ${BASES_TOTAL - n === 1 ? "base" : "bases"} still to fill.`
      : `${n - BASES_TOTAL} ${n - BASES_TOTAL === 1 ? "base" : "bases"} too many.`;
  }
  return null;
}

/* Build the actual units from a spec, ordered so the King lands centre-back
   and the rest fill outward -- the printed basic arrangement generalised. */
function unitsFromSpec(side, spec) {
  const out = [{ type: "king", figs: 1 }];
  for (const t of MUSTER_ORDER) {
    const e = spec[t] || { bases: 0, figs: 0 };
    for (let i = 0; i < e.bases; i++) out.push({ type: t, figs: e.figs });
  }
  return out;
}

/* p.6: "Your King must start on the royal emblem in the back row, and you
   may place your other figures on that row and the row in front of it."

   The default formation follows the shape of the printed basic army rather
   than filling the back row first: bows and horse behind the line, foot
   screening in front. Both rows fill outward from the centre, so a short
   muster still forms a line instead of hugging one edge. */
const BACK_ROW_TYPES = ["archer", "knight"];
const CENTRE_OUT = [4, 3, 5, 2, 6, 1, 7, 0, 8];

function placeArmy(side, list) {
  const back = side === 0 ? H - 1 : 0;
  const front = side === 0 ? H - 2 : 1;
  const king = list.find(u => u.type === "king");
  const rest = list.filter(u => u !== king);

  const behind = rest.filter(u => BACK_ROW_TYPES.includes(u.type));
  const ahead = rest.filter(u => !BACK_ROW_TYPES.includes(u.type));

  /* The King holds the centre of the back row; everything else fills the
     free columns of its preferred row, overflowing to the other. */
  const free = { [back]: CENTRE_OUT.filter(c => c !== 4), [front]: CENTRE_OUT.slice() };
  const out = [{ unit: king, c: 4, r: back }];

  const take = (u, first, second) => {
    const row = free[first].length ? first : second;
    const c = free[row].shift();
    if (c === undefined) return false;
    out.push({ unit: u, c, r: row });
    return true;
  };
  for (const u of behind) take(u, back, front);
  for (const u of ahead) take(u, front, back);
  return out;
}

function deployFromSpec(side, spec) {
  const face = side === 0 ? N : S;
  for (const p of placeArmy(side, unitsFromSpec(side, spec))) {
    G.units.push(makeUnit(side, p.unit.type, p.unit.figs, p.c, p.r, face));
  }
}

/* The bot's muster. Deterministic from the seed so a game replays, and it
   never produces an illegal army -- validateArmy() gates every candidate. */
function botMuster(side, pickSeed) {
  const candidates = [
    /* Mixed host: the printed basics stiffened with a Heavy Infantry pair. */
    { knight: { bases: 2, figs: 2 }, archer: { bases: 2, figs: 4 },
      infantry: { bases: 3, figs: 4 }, heavy: { bases: 1, figs: 2 },
      peasant: { bases: 1, figs: 4 }, mercenary: { bases: 0, figs: 0 } },
    /* Shield line: both Heavy bases, bows behind. */
    { knight: { bases: 1, figs: 2 }, archer: { bases: 2, figs: 4 },
      infantry: { bases: 3, figs: 4 }, heavy: { bases: 2, figs: 1 },
      peasant: { bases: 1, figs: 4 }, mercenary: { bases: 0, figs: 0 } },
    /* Free company: mercenaries and a screen of peasants. */
    { knight: { bases: 2, figs: 2 }, archer: { bases: 1, figs: 4 },
      infantry: { bases: 3, figs: 4 }, heavy: { bases: 0, figs: 0 },
      peasant: { bases: 2, figs: 2 }, mercenary: { bases: 1, figs: 2 } },
    /* The printed basic army, unchanged. */
    basicSpec(),
  ];
  const legal = candidates.filter(c => validateArmy(c, G.cfg) === null);
  const pool = legal.length ? legal : [basicSpec()];
  return pool[(pickSeed >>> 0) % pool.length];
}

/* ============================================================
   MUSTER SCREEN
   Renders itself from UNIT_DEFS and CUSTOM_BASE_CAPS, so
   changing a printed number changes the screen with no edit
   here. The confirm button is never silently dead: when the
   muster is illegal it shows the validator's own sentence.
   ============================================================ */

function openMuster(side) {
  UI.musterOpen = true;
  UI.musterSide = side;
  UI.muster = basicSpec();
  UI.curtain = false;
  updateAll();
}

function musterAdjust(type, field, delta) {
  const e = UI.muster[type];
  const d = UNIT_DEFS[type];
  if (field === "bases") {
    e.bases = Math.max(0, Math.min(BASES_TOTAL - 1, e.bases + delta));
    if (e.bases > 0 && e.figs < 1) e.figs = Math.min(perBaseOf(type, UI.houseRules), d.perPlayer);
    if (e.bases === 0) e.figs = 0;
  } else {
    e.figs = Math.max(0, Math.min(perBaseOf(type, UI.houseRules), e.figs + delta));
    if (e.figs > 0 && e.bases < 1) e.bases = 1;
  }
  updateAll();
}

function musterConfirm() {
  if (validateArmy(UI.muster, UI.houseRules)) return;
  UI.musterSpecs = UI.musterSpecs || {};
  UI.musterSpecs[UI.musterSide] = JSON.parse(JSON.stringify(UI.muster));

  /* Hot-seat: the second player musters in secret behind the curtain, which
     is the digital stand-in for the rulebook's upright game box. */
  const other = 1 - UI.musterSide;
  if (UI.pendingOpponent === "hotseat" && !UI.musterSpecs[other]) {
    UI.musterSide = other;
    UI.muster = basicSpec();
    UI.curtain = true;
    UI.curtainThen = "muster";
    updateAll();
    return;
  }

  const specs = { 0: UI.musterSpecs[0], 1: UI.musterSpecs[1] || null };
  UI.musterOpen = false;
  UI.musterSpecs = null;
  clearSave();
  startGame(undefined, Object.assign(houseRulesToCfg(UI.houseRules || defaultHouseRules()),
    { setup: "custom", opponent: UI.pendingOpponent || "ai", specs }));
}

function renderMuster() {
  const el = document.getElementById("muster");
  if (!UI.musterOpen || UI.curtain) { el.hidden = true; return; }
  el.hidden = false;

  const spec = UI.muster;
  const rows = MUSTER_ORDER.map(t => {
    const d = UNIT_DEFS[t], e = spec[t];
    const used = e.bases * e.figs;
    const cap = CUSTOM_BASE_CAPS[t];
    const over = used > d.perPlayer || e.figs > perBaseOf(t, UI.houseRules) || (cap !== undefined && e.bases > cap);
    return `<tr class="${over ? "bad" : ""}">
      <th scope="row">${esc(d.name)}${cap !== undefined ? `<span class="cap"> max ${cap} base${cap === 1 ? "" : "s"}</span>` : ""}</th>
      <td class="step">
        <span class="sbtn" data-act="musterBases" data-type="${t}" data-delta="-1" role="button" tabindex="0" aria-label="One fewer ${esc(d.name)} base">&minus;</span>
        <b aria-label="${e.bases} ${esc(d.name)} bases">${e.bases}</b>
        <span class="sbtn" data-act="musterBases" data-type="${t}" data-delta="1" role="button" tabindex="0" aria-label="One more ${esc(d.name)} base">+</span>
      </td>
      <td class="step">
        <span class="sbtn" data-act="musterFigs" data-type="${t}" data-delta="-1" role="button" tabindex="0" aria-label="One fewer ${esc(d.name)} per base">&minus;</span>
        <b aria-label="${e.figs} per base">${e.figs}</b>
        <span class="sbtn" data-act="musterFigs" data-type="${t}" data-delta="1" role="button" tabindex="0" aria-label="One more ${esc(d.name)} per base">+</span>
      </td>
      <td class="pool">${used} of ${d.perPlayer}</td>
    </tr>`;
  }).join("");

  const why = validateArmy(spec, UI.houseRules);
  const n = specBases(spec);

  el.innerHTML = `<div class="box muster-card">
    <span class="box-label">Muster &mdash; <span class="side s${UI.musterSide}">${esc((G && G.players ? G.players[UI.musterSide].name : UI.musterSide === 0 ? "Pale" : "Dun"))}</span></span>
    <p class="dim">Ten bases take the field. The King holds the centre of the back row.</p>
    <table class="muster">
      <thead><tr><th scope="col">Warrior</th><th scope="col">Bases</th><th scope="col">Per base</th><th scope="col">Figures</th></tr></thead>
      <tbody>
        <tr class="locked"><th scope="row">King</th><td class="step"><b>1</b></td><td class="step"><b>1</b></td><td class="pool">1 of 1</td></tr>
        ${rows}
      </tbody>
    </table>
    <p class="tally">Bases <b class="${n === BASES_TOTAL ? "ok" : "bad"}">${n}</b> of ${BASES_TOTAL}
       &middot; ${specFigures(spec)} warriors</p>
    <p class="why" role="status">${why ? esc(why) : "Ready."}</p>
    <div class="muster-actions">
      <button class="btn" data-act="musterPreset">Basic army</button>
      <button class="btn" data-act="musterConfirm" ${why ? "disabled" : ""}>Take the field</button>
    </div>
  </div>`;
}

/* ============================================================
   DICE — drawn as paths on a 24x24 box, never as text, because
   no font is loaded and a die face must not depend on one.
   ============================================================ */
const DIE_GLYPH = {
  0: "M6 4c4-2 8-1 10 2l-3 3-2-2-5 3zM13 9l-8 9 2 2 9-8z",              /* battle-axe   */
  1: "M3 19L19 5M15 5h4v4M5 21l-2-2M3 5l16 14M5 3h4M3 5v4",             /* crossed arrows */
  2: "M6 3h12l-3 5 3 5-12 1 2-6zM6 3v18",                               /* torn banner  */
};
const DIE_NAME = { 0: "battle-axe", 1: "arrows", 2: "PANIC" };
const DIE_CLASS = { 0: "f-axe", 1: "f-arrow", 2: "f-panic" };

function renderTray() {
  const el = document.getElementById("tray");
  const d = G.dice;
  if (!d || !d.faces || !d.faces.length) { el.innerHTML = `<p class="dim">No dice cast yet.</p>`; return; }
  const atk = byUid(G, d.atkUid), def = byUid(G, d.defUid);
  const hitFace = defOf(atk).hitFace;
  const faces = d.faces.map((f, i) => {
    const counts = (hitFace === null ? (f === AXE || f === ARROW) : f === hitFace) && !d.panicSteps;
    return `<span class="die ${DIE_CLASS[f]}${counts ? " scores" : ""}" style="--i:${i}"
      role="img" aria-label="${DIE_NAME[f]}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="${DIE_GLYPH[f]}"/></svg></span>`;
  }).join("");
  const verdict = d.panicSteps && !defOf(atk).panicPerDie ? "PANIC — the unit breaks"
    : d.killed ? `${esc(defOf(def).name)} base destroyed`
    : d.removed ? `${d.removed} ${d.removed === 1 ? "figure" : "figures"} lost`
    : "no effect";
  const duelNote = d.duel ? " <span class='dim'>(single figure, two hits needed)</span>" : "";
  el.innerHTML = `<div class="dice-row">${faces}</div>
    <p class="verdict">${esc(verdict)}${duelNote}</p>`;
}

/* ============================================================
   FLIP
   updateAll() replaces the grid wholesale, so without this a
   unit teleports. Snapshot the rects before the rebuild, invert
   afterwards, release. The panic cascade is staggered off the
   retreat trace so it reads as a chain rather than one jump.
   ============================================================ */
function snapshotRects() {
  if (UI.reducedMotion) { UI.rects = null; return; }
  UI.rects = {};
  for (const el of document.querySelectorAll("#grid .u[data-uid]")) {
    UI.rects[el.dataset.uid] = { rect: el.getBoundingClientRect(), html: el.outerHTML };
  }
}

function playFlip() {
  const prev = UI.rects;
  UI.rects = null;
  if (!prev || UI.reducedMotion) return;

  /* Each link of a cascade starts a little after the one before it. */
  const delay = {};
  const trace = (G.dice && G.dice.retreats) || [];
  trace.forEach((step, i) => { if (delay[step.uid] === undefined) delay[step.uid] = i * 70; });

  const seen = new Set();
  const grid = document.getElementById("grid");
  for (const el of grid.querySelectorAll(".u[data-uid]")) {
    const uid = el.dataset.uid;
    seen.add(uid);
    const was = prev[uid];
    if (!was) continue;
    const now = el.getBoundingClientRect();
    const dx = was.rect.left - now.left, dy = was.rect.top - now.top;
    if (!dx && !dy) continue;
    const d = (delay[uid] || 0) * (UI.speedFactor == null ? 1 : UI.speedFactor);
    el.style.transition = "none";
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    requestAnimationFrame(() => {
      el.style.transition = `transform ${Math.round(240 * (UI.speedFactor || 1))}ms var(--ease-out-quart) ${Math.round(d)}ms`;
      el.style.transform = "";
    });
  }

  /* A CASUALTY leaves a ghost where it fell. A unit that is simply absent
     from G -- because the board was replaced by a new game, a muster or an
     undo -- is not a casualty, and ghosting it showers the screen with the
     previous army. A dead unit stays in G.units with alive:false, which is
     exactly what distinguishes the two. */
  for (const uid in prev) {
    if (seen.has(uid)) continue;
    const gone = byUid(G, +uid);
    if (!gone || gone.alive) continue;
    const g = document.createElement("div");
    g.className = "ghost";
    g.innerHTML = prev[uid].html;
    g.style.left = prev[uid].rect.left + "px";
    g.style.top = prev[uid].rect.top + "px";
    g.style.width = prev[uid].rect.width + "px";
    g.style.height = prev[uid].rect.height + "px";
    document.body.appendChild(g);
    setTimeout(() => g.remove(), 700);
  }
}

/* ============================================================
   AUDIO — synthesised on the fly. No files, because the game
   ships as one HTML document with no external assets at all.
   ============================================================ */
let AC = null;
function audioCtx() {
  if (AC === null) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { AC = false; }
  }
  return AC || null;
}

function tone(freq, dur, type, gain, delay) {
  const ac = audioCtx();
  if (!ac) return;
  const t0 = ac.currentTime + (delay || 0);
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = type || "square";
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(ac.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}

function clatter(dur, gain, delay) {
  const ac = audioCtx();
  if (!ac) return;
  const t0 = ac.currentTime + (delay || 0);
  const n = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  src.buffer = buf; f.type = "bandpass"; f.frequency.value = 1800;
  g.gain.setValueAtTime(gain, t0);
  src.connect(f).connect(g).connect(ac.destination);
  src.start(t0);
}

const SFX = {
  select: () => tone(520, 0.05, "square", 0.04),
  move:   () => tone(300, 0.07, "triangle", 0.05),
  turn:   () => tone(220, 0.05, "square", 0.03),
  dice:   () => { clatter(0.16, 0.06); clatter(0.12, 0.04, 0.07); },
  hit:    () => { tone(180, 0.09, "sawtooth", 0.07); clatter(0.07, 0.05); },
  kill:   () => { tone(140, 0.22, "sawtooth", 0.08); tone(70, 0.3, "square", 0.05, 0.05); },
  panic:  () => { tone(420, 0.1, "sine", 0.05); tone(300, 0.12, "sine", 0.05, 0.08); tone(200, 0.16, "sine", 0.05, 0.17); },
  victory: () => [0, 0.12, 0.24, 0.42].forEach((d, i) => tone([392, 523, 659, 784][i], 0.3, "triangle", 0.06, d)),
};

function sfx(name) {
  if (UI.muted) return;
  const fn = SFX[name];
  if (fn) { try { fn(); } catch (e) { /* audio is a nicety, never a failure */ } }
}

/* ============================================================
   SPEED & MUTE — both persisted, both reflected in the HUD.
   ============================================================ */
const SPEED_FACTOR = { 1: 1, 2: 0.35, 3: 0 };
const SPEED_NAME = { 1: "Measured", 2: "Brisk", 3: "Instant" };

function applySpeed() { UI.speedFactor = SPEED_FACTOR[UI.speed] != null ? SPEED_FACTOR[UI.speed] : 1; }

function cycleSpeed() {
  UI.speed = (UI.speed % 3) + 1;
  applySpeed();
  try { localStorage.setItem(SPEED_KEY, String(UI.speed)); } catch (e) {}
  announce("Speed: " + SPEED_NAME[UI.speed]);
  updateAll();
}

function toggleMute() {
  UI.muted = !UI.muted;
  try { localStorage.setItem(MUTED_KEY, UI.muted ? "1" : "0"); } catch (e) {}
  announce(UI.muted ? "Muted." : "Sound on.");
  if (!UI.muted) sfx("select");
  updateAll();
}

function loadPrefs() {
  try {
    UI.muted = localStorage.getItem(MUTED_KEY) === "1";
    const sp = parseInt(localStorage.getItem(SPEED_KEY) || "1", 10);
    UI.speed = (sp >= 1 && sp <= 3) ? sp : 1;
  } catch (e) { UI.muted = false; UI.speed = 1; }
  applySpeed();
}

/* ============================================================
   HOUSE RULES
   Each carries its provenance, because "optional rule" and "we
   invented this" are not the same claim. Everything is off by
   default, so the shipped defaults are the printed game.
   ============================================================ */
const HOUSE_RULES = [
  { key: "massiveInfantry", name: "Massive Infantry",
    source: "Printed optional rule, rulebook p.8",
    note: "All 20 Infantry a side, up to 10 on a base. Never more than 4 dice. “If both players agree.”" },
  { key: "strictBases", name: "Bases must be filled",
    source: "Our reading of a gap in the rules",
    note: "The rulebook prints fixed counts for basic units but calls 4 “the standard limit”, so we allow under-filled bases. Turn this on for the strict reading." },
  { key: "useRoundCap", name: "60-round limit",
    source: "Not a rule at all",
    note: "No such limit is printed. It exists so headless simulations terminate, and is off in human play." },
];

function defaultHouseRules() {
  return { massiveInfantry: false, strictBases: false, useRoundCap: false, partialBases: true };
}
function houseRulesToCfg(hr) {
  return { massiveInfantry: !!hr.massiveInfantry, partialBases: !hr.strictBases,
           roundCap: hr.useRoundCap ? 60 : 0 };
}

/* ============================================================
   MENU — the one place a game is configured. Difficulty lives
   here because the AI had no selector at all until now.
   ============================================================ */
function openMenu() { UI.menuOpen = true; UI.helpOpen = false; updateAll(); }
function closeMenu() { UI.menuOpen = false; updateAll(); }

function menuBegin() {
  const m = UI.menu;
  UI.menuOpen = false;
  UI.pendingOpponent = m.opponent;
  UI.pendingSkill = m.skill;
  UI.houseRules = Object.assign(defaultHouseRules(), m.house);
  const cfg = Object.assign(houseRulesToCfg(UI.houseRules), { opponent: m.opponent });
  if (m.setup === "custom") { UI.musterSpecs = null; openMuster(0); return; }
  clearSave();
  startGame(undefined, Object.assign({ setup: "basic" }, cfg));
}

function renderMenu() {
  const el = document.getElementById("menu");
  if (!UI.menuOpen) { el.hidden = true; return; }
  el.hidden = false;
  const m = UI.menu;
  const pick = (group, value, label, sub) =>
    `<span class="opt ${m[group] === value ? "on" : ""}" data-act="menuPick" data-group="${group}"
      data-value="${value}" role="button" tabindex="0" aria-pressed="${m[group] === value}">
      ${esc(label)}${sub ? `<span class="dim"> ${esc(sub)}</span>` : ""}</span>`;

  const skills = SKILL.map((sk, i) => pick("skill", String(i), sk.name)).join("");
  const house = HOUSE_RULES.map(h => `
    <li>
      <span class="opt ${m.house[h.key] ? "on" : ""}" data-act="menuHouse" data-key="${h.key}"
        role="button" tabindex="0" aria-pressed="${!!m.house[h.key]}">${m.house[h.key] ? "■" : "□"} ${esc(h.name)}</span>
      <span class="prov">${esc(h.source)}</span>
      <p class="dim">${esc(h.note)}</p>
    </li>`).join("");

  el.innerHTML = `<div class="box menu-card">
    <span class="box-label">New Game</span>
    <dl class="menu-rows">
      <dt>Army</dt><dd>${pick("setup", "basic", "Basic", "the printed opening")}${pick("setup", "custom", "Customised", "muster your own")}</dd>
      <dt>Opponent</dt><dd>${pick("opponent", "ai", "Versus AI")}${pick("opponent", "hotseat", "Hot-seat", "two players, one screen")}</dd>
      ${m.opponent === "ai" ? `<dt>Difficulty</dt><dd>${skills}</dd>` : ""}
    </dl>
    <p class="prov-head">House rules &mdash; all off by default, so the defaults are the printed game.</p>
    <ul class="house">${house}</ul>
    <div class="muster-actions">
      <button class="btn" data-act="menuClose">Cancel</button>
      <button class="btn" data-act="menuBegin">Begin</button>
    </div>
  </div>`;
}

/* ============================================================
   HELP — rendered FROM the rule tables, never transcribed
   beside them, so a change to a printed number reaches the help
   with no edit here. That is the B10 gate.
   ============================================================ */
function renderHelp() {
  const el = document.getElementById("help");
  if (!UI.helpOpen) { el.hidden = true; return; }
  el.hidden = false;

  const order = ["king", "knight", "archer", "infantry", "heavy", "peasant", "mercenary"];
  const rows = order.map(t => {
    const d = UNIT_DEFS[t];
    const per = perBaseOf(t);
    return `<tr>
      <th scope="row">${esc(d.name)}</th>
      <td>${d.perPlayer}</td>
      <td>${per}</td>
      <td>${d.dicePerFig}</td>
      <td>${d.hitFace === null ? "axe or arrow" : d.hitFace === AXE ? "battle-axe" : "arrows"}</td>
      <td>${d.htk}</td>
      <td>${d.panics ? (d.panicPerDie ? "per die" : "yes") : "never"}</td>
      <td class="note">${esc(d.note || "—")}</td>
    </tr>`;
  }).join("");

  const keys = RAIL.map(([k, label]) => `<tr><th scope="row"><kbd>${esc(k)}</kbd></th><td>${esc(label)}</td></tr>`).join("")
    + `<tr><th scope="row"><kbd>arrows</kbd> / <kbd>WASD</kbd></th><td>Move the cursor</td></tr>`
    + `<tr><th scope="row"><kbd>Enter</kbd></th><td>Select, move or attack, by what is under the cursor</td></tr>`
    + `<tr><th scope="row"><kbd>1</kbd>&ndash;<kbd>4</kbd></th><td>Face north, east, south, west</td></tr>`
    + `<tr><th scope="row"><kbd>M</kbd></th><td>Mute</td></tr>`;

  el.innerHTML = `<div class="box help-card">
    <span class="box-label">How to Play</span>
    <p><b>${W} files by ${H} ranks.</b> Two actions a turn, taken from Move, Turn and Attack &mdash;
       the same action twice is allowed, and the two may be split between different units, but
       no unit attacks twice in a turn.</p>
    <p><b>A unit is a base of identical figures, and the figure count is everything.</b> It is the
       unit's strength and its dice pool at once: a four-man Infantry base rolls four dice, and
       worn to two men it rolls two.</p>
    <p><b>Facing matters.</b> Foot moves one square forward; Kings and Knights ride as far as they
       like in a straight line until something blocks them. You must be next to and facing what you
       attack &mdash; though you may strike its side or rear. Archers are the exception: they hit any
       single enemy in the block of nine squares ahead, firing over intervening heads.</p>
    <p><b>Dice.</b> Three battle-axes, two arrows, one PANIC. Most units hit on axes; Archers hit
       on arrows. Knights, Kings and Heavy Infantry take two hits in the <i>same</i> attack to lose
       a figure.</p>
    <p><b>PANIC.</b> If every die comes up PANIC the unit turns about and retreats a square, shoving
       whoever is behind it into panicking too. A retreat blocked by the board edge, an enemy, your
       own King or a Mercenary <i>kills the retreating unit</i>. Watch for chain reactions.</p>
    <p><b>Winning.</b> Kill the enemy King, or leave it standing alone on the field.</p>

    <h3>The warriors</h3>
    <div class="scrollx"><table class="ref">
      <thead><tr><th scope="col">Warrior</th><th scope="col">You own</th><th scope="col">Per base</th>
        <th scope="col">Dice each</th><th scope="col">Hits with</th><th scope="col">Hits to kill each</th>
        <th scope="col">Panics</th><th scope="col">Notes</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>

    <h3>Keys</h3>
    <table class="ref keys">${keys}</table>

    <h3>Where these rules come from</h3>
    <p class="dim">Everything above is transcribed from the official Parker Brothers rulebook for
      <i>Lionheart</i> (1997), product 40742-I, which Hasbro still serves at
      <code>hasbro.com/common/instruct/Lionheart.PDF</code>. The board is nine files by eight ranks;
      the widely repeated “9 by 10” traces to a single hedged line in a 1998 magazine review and is
      wrong. The rules are silent on four points &mdash; what you give up when customising, whether a
      base may be under-filled, how a turn-order tie is broken, and whether a rider may move zero
      squares &mdash; and those readings are ours.</p>
    <div class="muster-actions"><button class="btn" data-act="helpClose">Close</button></div>
  </div>`;
}

/* ============================================================
   RULE TESTS — hand-built positions for the rules random play
   cannot reach. A full 4-dice base suffers a total panic once in
   1296 attacks, so the retreat cascade -- the single riskiest
   piece of this engine -- is effectively untested by simulation.
   These force the dice instead.
   ============================================================ */

function testPosition(specs) {
  G = {
    v: 1, seed: 1, rng: 1,
    cfg: { setup: "basic", massiveInfantry: false, partialBases: true, roundCap: 60 },
    phase: "play", step: "test", round: 1, turn: 0, actionsLeft: 2, first: 0,
    units: [], dice: null, log: [], gameOver: false, result: null, nextUid: 1,
  };
  for (const s of specs) G.units.push(makeUnit(s.side, s.type, s.figs, s.c, s.r, s.face));
  return G.units;
}
function force(faces) { HARNESS.forceFaces = faces.slice(); }
function attackWith(atk, def) {
  const res = resolveAttack(G, buildGrid(G), atk, def);
  if (res.removed) applyRemoval(G, def, res.removed);
  if (res.panicSteps) panicRetreat(G, atk, res.panicSteps, 0);
  if (res.victimRetreat && def.alive) panicRetreat(G, def, res.victimRetreat, 0);
  return res;
}
function at(c, r) { return unitAt(G, buildGrid(G), c, r); }

const RULE_TESTS = [
  ["mounted units stop before a blocker and may halt anywhere short of it", () => {
    const [kn] = testPosition([
      { side: 0, type: "knight", figs: 2, c: 4, r: 7, face: N },
      { side: 0, type: "infantry", figs: 4, c: 4, r: 4, face: N },
    ]);
    const dests = moveSquares(G, buildGrid(G), kn).map(m => m.r);
    return JSON.stringify(dests) === JSON.stringify([6, 5]);
  }],

  ["foot units move exactly one square per action", () => {
    const [inf] = testPosition([{ side: 0, type: "infantry", figs: 4, c: 4, r: 7, face: N }]);
    return moveSquares(G, buildGrid(G), inf).length === 1;
  }],

  ["Heavy Infantry pays 2 actions to move and 2 to turn, but 1 to attack", () => {
    const [hv] = testPosition([{ side: 0, type: "heavy", figs: 2, c: 4, r: 4, face: N }]);
    return actionCost(hv, "move") === 2 && actionCost(hv, "turn") === 2 && actionCost(hv, "attack") === 1;
  }],

  ["Heavy Infantry attacks all eight neighbours, facing ignored", () => {
    const [hv] = testPosition([
      { side: 0, type: "heavy", figs: 2, c: 4, r: 4, face: N },
      { side: 1, type: "infantry", figs: 4, c: 3, r: 3, face: S },   /* diagonal */
      { side: 1, type: "infantry", figs: 4, c: 4, r: 5, face: N },   /* directly behind */
      { side: 1, type: "infantry", figs: 4, c: 5, r: 4, face: N },   /* directly beside */
    ]);
    return attackTargets(G, buildGrid(G), hv).length === 3;
  }],

  ["an Archer's block is 9 squares, 3 wide by 3 deep, starting immediately ahead", () => {
    const [ar] = testPosition([{ side: 0, type: "archer", figs: 4, c: 4, r: 7, face: N }]);
    const z = attackZone(ar);
    const rows = [...new Set(z.map(s => s.r))].sort();
    const cols = [...new Set(z.map(s => s.c))].sort();
    return z.length === 9 &&
      JSON.stringify(rows) === JSON.stringify([4, 5, 6]) &&
      JSON.stringify(cols) === JSON.stringify([3, 4, 5]);
  }],

  ["Archers fire over the heads of intervening units", () => {
    const [ar] = testPosition([
      { side: 0, type: "archer", figs: 4, c: 4, r: 7, face: N },
      { side: 0, type: "infantry", figs: 4, c: 4, r: 6, face: N },   /* own front rank */
      { side: 1, type: "infantry", figs: 4, c: 4, r: 5, face: S },   /* the target beyond it */
    ]);
    const t = attackTargets(G, buildGrid(G), ar);
    return t.length === 1 && t[0].side === 1;
  }],

  ["melee requires the attacker to be facing its target", () => {
    const [inf] = testPosition([
      { side: 0, type: "infantry", figs: 4, c: 4, r: 4, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 5, face: N },   /* behind the attacker */
    ]);
    if (attackTargets(G, buildGrid(G), inf).length !== 0) return false;
    inf.face = S;
    return attackTargets(G, buildGrid(G), inf).length === 1;
  }],

  ["a Knight needs two hits in the same attack per figure removed", () => {
    const out = [];
    for (const [axes, expect] of [[1, 0], [2, 1], [3, 1], [4, 2]]) {
      const [inf, kn] = testPosition([
        { side: 0, type: "infantry", figs: 4, c: 4, r: 5, face: N },
        { side: 1, type: "knight", figs: 2, c: 4, r: 4, face: S },
      ]);
      force(Array(axes).fill(AXE).concat(Array(4 - axes).fill(ARROW)));
      out.push(attackWith(inf, kn).removed === expect);
    }
    return out.every(Boolean);
  }],

  ["Archers hit on arrows, not axes", () => {
    const [ar, inf] = testPosition([
      { side: 0, type: "archer", figs: 4, c: 4, r: 6, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 5, face: S },
    ]);
    force([AXE, AXE, AXE, ARROW]);
    return attackWith(ar, inf).removed === 1;
  }],

  ["Peasants hit with whichever symbol they rolled most of", () => {
    const [pea, inf] = testPosition([
      { side: 0, type: "peasant", figs: 4, c: 4, r: 5, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 4, face: S },
    ]);
    force([ARROW, ARROW, ARROW, AXE]);
    return attackWith(pea, inf).removed === 3;
  }],

  ["a total panic discards every hit rolled", () => {
    const [inf, foe] = testPosition([
      { side: 0, type: "infantry", figs: 2, c: 4, r: 5, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 4, face: S },
    ]);
    force([PANIC, PANIC]);
    const res = attackWith(inf, foe);
    return res.hits === 0 && res.removed === 0 && foe.figs === 4 && res.panicSteps === 1;
  }],

  ["a Peasant keeps its hits AND observes the PANIC (rulebook p.6 example)", () => {
    const [pea, foe] = testPosition([
      { side: 0, type: "peasant", figs: 4, c: 4, r: 5, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 4, face: S },
    ]);
    force([AXE, AXE, ARROW, PANIC]);
    const res = attackWith(pea, foe);
    /* 2 axes beats 1 arrow, so 2 hits land; the single PANIC still retreats
       the Peasant one square, after the figures come off. */
    return res.hits === 2 && res.removed === 2 && foe.figs === 2 &&
           res.panicSteps === 1 && pea.alive && pea.r === 6 && pea.face === S;
  }],

  ["a panicking unit retreating off the board is eliminated", () => {
    const [inf, foe] = testPosition([
      { side: 0, type: "infantry", figs: 2, c: 4, r: 0, face: S },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 1, face: N },
    ]);
    force([PANIC, PANIC]);
    attackWith(inf, foe);
    return !inf.alive && inf.figs === 0;
  }],

  ["a panicking unit retreating into an enemy is eliminated", () => {
    const [inf, foe, block] = testPosition([
      { side: 0, type: "infantry", figs: 2, c: 4, r: 4, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 3, face: S },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 5, face: N },
    ]);
    force([PANIC, PANIC]);
    attackWith(inf, foe);
    return !inf.alive && block.alive && block.r === 5;
  }],

  ["a panicking unit retreating into its own King is eliminated, and the King does not move", () => {
    const [inf, foe, king] = testPosition([
      { side: 0, type: "infantry", figs: 2, c: 4, r: 4, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 3, face: S },
      { side: 0, type: "king", figs: 1, c: 4, r: 5, face: N },
    ]);
    force([PANIC, PANIC]);
    attackWith(inf, foe);
    return !inf.alive && king.alive && king.r === 5 && king.face === N;
  }],

  ["a panicking unit retreating into a Mercenary is eliminated", () => {
    const [inf, foe, merc] = testPosition([
      { side: 0, type: "infantry", figs: 2, c: 4, r: 4, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 3, face: S },
      { side: 0, type: "mercenary", figs: 2, c: 4, r: 5, face: N },
    ]);
    force([PANIC, PANIC]);
    attackWith(inf, foe);
    return !inf.alive && merc.alive && merc.r === 5;
  }],

  ["a panicking unit shoves an ordinary ally, which panics in turn", () => {
    const [inf, foe, ally] = testPosition([
      { side: 0, type: "infantry", figs: 2, c: 4, r: 4, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 3, face: S },
      { side: 0, type: "infantry", figs: 4, c: 4, r: 5, face: N },
    ]);
    force([PANIC, PANIC]);
    attackWith(inf, foe);
    /* attacker about-faces to S and takes r=5; the ally about-faces and falls back to r=6 */
    return inf.alive && inf.r === 5 && inf.face === S &&
           ally.alive && ally.r === 6 && ally.face === S;
  }],

  ["panic chains through two allies at once", () => {
    const [inf, foe, a1, a2] = testPosition([
      { side: 0, type: "infantry", figs: 2, c: 4, r: 3, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 2, face: S },
      { side: 0, type: "infantry", figs: 4, c: 4, r: 4, face: N },
      { side: 0, type: "infantry", figs: 4, c: 4, r: 5, face: N },
    ]);
    force([PANIC, PANIC]);
    attackWith(inf, foe);
    return inf.r === 4 && a1.r === 5 && a2.r === 6 && [inf, a1, a2].every(u => u.alive);
  }],

  ["a lone Infantryman against a Knight must roll two axes in succession", () => {
    const mk = () => testPosition([
      { side: 0, type: "infantry", figs: 1, c: 4, r: 5, face: N },
      { side: 1, type: "knight", figs: 2, c: 4, r: 4, face: S },
    ]);
    let u = mk(); force([AXE, AXE]);
    const win = attackWith(u[0], u[1]);
    u = mk(); force([AXE, ARROW]);
    const miss = attackWith(u[0], u[1]);
    u = mk(); force([PANIC]);
    const pan = attackWith(u[0], u[1]);
    return win.duel && win.removed === 1 && miss.removed === 0 && pan.panicSteps === 1 && !u[0].alive === false;
  }],

  ["a Mercenary never panics; its victim about-faces and retreats once per PANIC", () => {
    const [merc, foe] = testPosition([
      { side: 0, type: "mercenary", figs: 2, c: 4, r: 5, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 4, face: S },
    ]);
    force([PANIC, PANIC, PANIC, PANIC]);
    const res = attackWith(merc, foe);
    /* r=4 back four squares lands exactly on r=0, the far edge: shoved the
       length of the board but still on it. */
    return res.panicSteps === 0 && res.victimRetreat === 4 &&
           merc.alive && merc.r === 5 && merc.face === N &&
           foe.alive && foe.r === 0 && foe.face === N && foe.figs === 4;
  }],

  ["a Mercenary can shove its victim clean off the board", () => {
    const [merc, foe] = testPosition([
      { side: 0, type: "mercenary", figs: 2, c: 4, r: 4, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 3, face: S },
    ]);
    force([PANIC, PANIC, PANIC, PANIC]);
    attackWith(merc, foe);
    return !foe.alive && foe.figs === 0 && merc.alive;
  }],

  ["a Mercenary cannot shove an enemy King or an enemy Mercenary", () => {
    const [merc, king] = testPosition([
      { side: 0, type: "mercenary", figs: 2, c: 4, r: 5, face: N },
      { side: 1, type: "king", figs: 1, c: 4, r: 4, face: S },
    ]);
    force([PANIC, PANIC, PANIC, PANIC]);
    const res = attackWith(merc, king);
    return res.victimRetreat === 0 && king.alive && king.r === 4 && king.face === S;
  }],

  ["victory when the enemy King is killed", () => {
    const [inf, king] = testPosition([
      { side: 0, type: "infantry", figs: 4, c: 4, r: 5, face: N },
      { side: 1, type: "king", figs: 1, c: 4, r: 4, face: S },
      { side: 1, type: "infantry", figs: 4, c: 0, r: 0, face: S },
      { side: 0, type: "king", figs: 1, c: 8, r: 7, face: N },
    ]);
    force([AXE, AXE, AXE, AXE]);
    attackWith(inf, king);
    const v = checkVictory(G);
    return !king.alive && v && v.winner === 0 && v.reason === "king";
  }],

  ["victory when the enemy King is left standing alone", () => {
    const [inf, last] = testPosition([
      { side: 0, type: "infantry", figs: 4, c: 4, r: 5, face: N },
      { side: 1, type: "infantry", figs: 1, c: 4, r: 4, face: S },
      { side: 1, type: "king", figs: 1, c: 0, r: 0, face: S },
      { side: 0, type: "king", figs: 1, c: 8, r: 7, face: N },
    ]);
    force([AXE, AXE, AXE, AXE]);
    attackWith(inf, last);
    const v = checkVictory(G);
    return !last.alive && v && v.winner === 0 && v.reason === "alone";
  }],

  ["the printed basic army is a legal muster: 10 bases, 33 warriors", () => {
    const spec = basicSpec();
    return validateArmy(spec, { partialBases: true }) === null &&
           specBases(spec) === 10 && specFigures(spec) === 33;
  }],

  ["a muster cannot field more figures than the player owns", () => {
    const spec = basicSpec();
    spec.infantry = { bases: 6, figs: 4 };        /* 24 Infantry; the pool is 20 */
    spec.archer = { bases: 1, figs: 4 };
    const why = validateArmy(spec, { partialBases: true });
    return !!why && /own 20/.test(why);
  }],

  ["a muster cannot exceed the printed base caps for the specials", () => {
    const blank = () => ({ knight: { bases: 0, figs: 0 }, archer: { bases: 0, figs: 0 },
                           infantry: { bases: 0, figs: 0 }, heavy: { bases: 0, figs: 0 },
                           peasant: { bases: 0, figs: 0 }, mercenary: { bases: 0, figs: 0 } });
    const mk = (t, bases, figs) => { const sp = blank(); sp[t] = { bases, figs }; return validateArmy(sp, { partialBases: true }); };

    /* Mercenaries are the only special whose BASE cap binds independently:
       2 bases of 1 stays inside the pool of 2, but the rules allow 1 base. */
    if (!/allows 1 base/.test(mk("mercenary", 2, 1) || "")) return false;

    /* For Heavy Infantry and Peasants the figure pool binds first -- 3 Heavy
       bases needs 3 figures and you own 2 -- so the cap is unreachable. Both
       are still rejected, which is what matters. */
    if (!mk("heavy", 3, 1) || !mk("peasant", 5, 1)) return false;

    /* And the legal maxima are accepted on their own terms. */
    return validateArmy(Object.assign(blank(), { heavy: { bases: 2, figs: 1 } }), { partialBases: true }) !== null &&
           /bases still to fill/.test(validateArmy(Object.assign(blank(), { heavy: { bases: 2, figs: 1 } }), { partialBases: true }));
  }],

  ["a base cannot be over-filled beyond its printed maximum", () => {
    const spec = basicSpec();
    spec.peasant = { bases: 1, figs: 5 };          /* "up to 4 on a base" */
    const why = validateArmy(spec, { partialBases: true });
    return !!why && /only 4 fit/.test(why);
  }],

  ["a muster must be exactly ten bases, and says how many are missing", () => {
    const spec = basicSpec();
    spec.infantry = { bases: 3, figs: 4 };          /* 8 bases with the King */
    const why = validateArmy(spec, { partialBases: true });
    return !!why && /2 bases still to fill/.test(why);
  }],

  ["every army the bot musters is legal", () => {
    G = { cfg: { partialBases: true } };
    for (let seed = 0; seed < 200; seed++) {
      const spec = botMuster(0, seed);
      if (validateArmy(spec, { partialBases: true }) !== null) return false;
      if (specBases(spec) !== 10) return false;
    }
    return true;
  }],

  ["a customised game deploys ten bases a side, in the back two rows only", () => {
    newGame(9, { setup: "custom" });
    for (const side of [0, 1]) {
      const mine = G.units.filter(u => u.side === side);
      if (mine.length !== 10) return false;
      const rows = side === 0 ? [H - 1, H - 2] : [0, 1];
      if (!mine.every(u => rows.includes(u.r))) return false;
      const king = mine.find(u => u.type === "king");
      if (!king || king.c !== 4 || king.r !== (side === 0 ? H - 1 : 0)) return false;
      if (new Set(mine.map(u => idx(u.c, u.r))).size !== mine.length) return false;
    }
    return true;
  }],

  ["a unit may not attack twice in the same turn, but another unit may", () => {
    const [a, b] = testPosition([
      { side: 0, type: "infantry", figs: 4, c: 4, r: 5, face: N },
      { side: 0, type: "infantry", figs: 4, c: 5, r: 5, face: N },
      { side: 1, type: "infantry", figs: 4, c: 4, r: 4, face: S },
      { side: 1, type: "infantry", figs: 4, c: 5, r: 4, face: S },
    ]);
    G.actionsLeft = 2;
    a.attackedThisTurn = true;
    const acts = legalActions(G, buildGrid(G), 0).filter(x => x.kind === "attack");
    return acts.length === 1 && acts[0].uid === b.uid;
  }],
];

function ruleTests() {
  const results = [];
  for (const [name, fn] of RULE_TESTS) {
    let pass, err = null;
    try { pass = fn(); } catch (e) { pass = false; err = e.message; }
    HARNESS.forceFaces = null;
    results.push({ name, pass: !!pass, err });
  }
  const failed = results.filter(r => !r.pass);
  return { total: results.length, passed: results.length - failed.length, failed };
}

/* ============================================================
   TABLE SELF-CHECK — runs at load and THROWS. These are the
   printed facts, so a violation means the tables were mistyped,
   not that the game is unbalanced. A check nobody has watched
   fail is indistinguishable from one that cannot fail, so each
   of these has been seen to go red.
   ============================================================ */
function validateTables() {
  const die = DIE_FACES.reduce((m, f) => (m[f] = (m[f] || 0) + 1, m), {});
  if (die[AXE] !== 3 || die[ARROW] !== 2 || die[PANIC] !== 1) {
    throw new Error("Die faces must be 3 axe / 2 arrow / 1 PANIC (rulebook p.2)");
  }
  for (let n = 1; n <= MAX_DICE; n++) {
    const sum = DICE_DIST[n].reduce((s, r) => s + r.p, 0);
    if (Math.abs(sum - 1) > 1e-12) throw new Error(`DICE_DIST[${n}] sums to ${sum}, not 1`);
  }
  for (const t in UNIT_DEFS) {
    const d = UNIT_DEFS[t];
    if (Math.min(MAX_DICE, d.perBase * d.dicePerFig) > MAX_DICE) {
      throw new Error(`${t} would roll more than ${MAX_DICE} dice; the box holds ${MAX_DICE}`);
    }
  }
  const bases = BASIC_ARMY.reduce((s, r) => s + r.bases, 0);
  if (bases !== BASES_TOTAL) throw new Error(`Basic army is ${bases} bases, not ${BASES_TOTAL}`);
  for (const r of BASIC_ARMY) {
    if (r.figs > UNIT_DEFS[r.type].perBase) throw new Error(`Basic army over-fills a ${r.type} base`);
    if (r.bases * r.figs > UNIT_DEFS[r.type].perPlayer) {
      throw new Error(`Basic army uses more ${r.type} than a player owns`);
    }
  }
  /* Seeded replay is the property the whole architecture rests on. */
  const a = mulberry32(7), b = mulberry32(7);
  for (let i = 0; i < 8; i++) if (a() !== b()) throw new Error("mulberry32 is not deterministic");
}

const UI = {
  reducedMotion: false, headless: false, autoHuman: false,
  sel: null, cur: null, focusInGrid: false,
  eventQueue: [], animating: false, advancing: false, needAdvance: false,
  curtain: false, curtainThen: null, speedFactor: 1, undo: [], help: false,
  musterOpen: false, musterSide: 0, muster: null, musterSpecs: null, pendingOpponent: "ai",
  muted: false, speed: 1, rects: null,
  menuOpen: false, helpOpen: false, tutorialOpen: false, tutorialStep: 0,
  pendingSkill: 1, houseRules: null,
  menu: { setup: "basic", opponent: "ai", skill: "1", house: {} },
};

const RAIL = [
  ["Q", "Turn left", "turnLeft"], ["E", "Turn right", "turnRight"],
  ["F", "Attack", "attack"], ["N", "Next unit", "next"],
  ["Z", "Undo", "undo"], [".", "End turn", "endTurn"], ["?", "Help", "help"],
];

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderRail() {
  document.getElementById("rail-keys").innerHTML = RAIL
    .map(([k, label, act]) => `<span class="cmd" data-act="${esc(act)}" role="button"
      tabindex="0" aria-label="${esc(label)}, key ${esc(k)}">[<kbd>${esc(k)}</kbd>] ${esc(label)}</span>`)
    .join("");
}

window.__PH = {
  get G() { return G; },
  newGame, startGame, runSim, runMatch, playBotGame, playRandomGame, ruleTests,
  validateArmy, basicSpec, botMuster, specBases, specFigures, unitsFromSpec, MUSTER_ORDER,
  botChooseTurn, evaluate, expectedAttack, SKILL, assertInvariants, checkVictory,
  sfx, cycleSpeed, toggleMute, SPEED_FACTOR, perBaseOf, HOUSE_RULES, TUTORIAL,
  openMenu, toggleHelp,
  tryAction, activateSquare, get UI() { return UI; },
  legalActions, buildGrid, UNIT_DEFS, DICE_DIST,
};

/* The rail is fixed to the bottom on narrow screens, so #app must reserve its
   ACTUAL height -- it grows with the pointer:coarse 44px rule and with
   wrapping, and any hard-coded reservation is wrong on some device. */
function syncRailHeight() {
  const rail = document.getElementById("rail");
  document.documentElement.style.setProperty("--rail-h", rail.offsetHeight + "px");
}

function boot() {
  validateTables();
  loadPrefs();
  UI.houseRules = defaultHouseRules();
  UI.menu.house = {};
  UI.reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  renderRail();
  setupInput();
  startGame();
  try {
    if (localStorage.getItem(TUTORIAL_KEY) !== "1") { UI.tutorialOpen = true; updateAll(); }
  } catch (e) {}
  syncRailHeight();
  addEventListener("resize", syncRailHeight, { passive: true });
  console.log(
    "%cPumaHeart — a port of Lionheart (Parker Brothers, 1997). Board is 9x8, not the 9x10 the internet claims.",
    "color:#00ff41"
  );
}

boot();
