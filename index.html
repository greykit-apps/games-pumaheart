         a.c === b.c && a.r === b.r && a.face === b.face && a.defUid === b.defUid;
}

/* The single mutation entry point used by BOTH the human input layer and
   the bot, so there is one path through which the game can change. */
function doAction(a) {
  /* Logged here rather than in the human input path, so the field report
     records BOTH sides. Attacks are logged by attackEvents() instead, which
     also reports the dice. */
  const actor = byUid(G, a.uid);
  const who = `${G.players[actor.side].name} ${defOf(actor).name}`;
  if (a.kind === "move") { log(`${who} advances to ${squareName(a.c, a.r)}.`); sfx("move"); }
  if (a.kind === "turn") { log(`${who} faces ${FACE_NAMES[a.face]}.`); sfx("turn"); }
  if (a.kind === "bribe") {
    const m = byUid(G, a.defUid);
    log(`${who} bribes the ${G.players[m.side].name} Mercenary \u2014 it changes sides.`);
    sfx("select");
  }

  /* G is final the instant applyAction returns -- the casualty is already
     off it. The presentation has to show the board as it stood when the dice
     were thrown, so it keeps a copy of that board to render from. */
  if (a.kind === "attack" && !UI.headless && !UI.reducedMotion) UI.preAttack = clone(G);

  applyAction(G, a);
  const v = checkVictory(G);
  if (v) { G.result = v; G.gameOver = true; }
  /* Including the killing blow. Routing straight to gameover skipped the
     cut-in entirely, so the one attack that decides the game was the one
     nobody got to watch. */
  if (a.kind === "attack") { go("play", "resolve"); return NEXT; }
  if (a.kind === "bribe" && !G.gameOver) { updateAll(); }
  if (G.gameOver) { go("gameover", "done"); return NEXT; }
  go("play", "act");
  return NEXT;
}

/* Trampoline. The runaway guard is not paranoia: a step that forgets to
   call go() loops for ever, and a silent hang is far worse than a throw. */
function advance() {
  if (!G) return;
  if (UI.animating || UI.advancing) { UI.needAdvance = true; return; }
  UI.advancing = true;
  let guard = 0;
  try {
    for (;;) {
      if (++guard > 2000) { console.error("Phase machine runaway at", G.phase, G.step); break; }
      const fn = STEP[G.phase] && STEP[G.phase][G.step];
      if (!fn) { console.error("Unknown step", G.phase, G.step); break; }
      const r = fn();
      if (r === WAIT) { if (UI.autoHuman && !G.gameOver) { continue; } break; }
      if (r === ANIM) { UI.advancing = false; return; }
    }
  } finally { UI.advancing = false; }
  commit();
}

function commit() {
  saveGame();
  if (UI.headless) { assertInvariants(); return; }
  updateAll();
  if (UI.needAdvance) { UI.needAdvance = false; advance(); }
}

/* ============================================================
   GLYPHS — one silhouette path per unit type on a 24x24 box.
   Drawn as paths, never as text: no web fonts are loaded and a
   glyph must not depend on one being present. These are the
   BOARD treatment; the 16x16 pixel portraits (B5b) are the
   status-panel treatment, because a portrait is unreadable at
   32px.
   ============================================================ */
const UNIT_GLYPH = {
  king: "M3 17l1.6-9 4 4.4L12 4l3.4 8.4 4-4.4L21 17zM4 18.4h16V21H4z",
  knight: "M8.6 3.4c3.4-1 7 .6 8.2 3.6 1.4 3.4-.4 6.4-2.6 8.4l1.4 5.6H6.6l1.2-4.8-3-1.6c-1.6-1-1.4-3 .4-3.6l2-.8-.6-3.4c-.2-1.6.8-2.8 2-3.4z",
  heavy: "M12 2.6l8.4 3v6.2c0 5.4-4.2 8.8-8.4 9.8-4.2-1-8.4-4.4-8.4-9.8V5.6zM12 6v12",
  infantry: "M11 2.4h2l1.6 4.2v9.2h-5.2V6.6zM7.4 15h9.2v2.2H7.4zM11 17.8h2V22h-2z",
  archer: "M7.4 2.6C11.8 5 13.6 8.8 13.6 12s-1.8 7-6.2 9.4l1.2-2.2c3-2 4.2-4.6 4.2-7.2s-1.2-5.2-4.2-7.2zM8.6 4.4l9 7.6-9 7.6",
  mercenary: "M12 2l2.4 5.2L12 9.6 9.6 7.2zM11 9.6h2V22h-2zM13 10.6h6.4v4.4H13z",
  peasant: "M5.4 2.6v6.2M9.6 2.6v6.2M13.8 2.6v6.2M4 8.8h11.2M9.2 8.8V22",
};
const GLYPH_STROKE = { archer: true, peasant: true, heavy: true };

/* A short arc with a solid head -- a gesture, not an icon. Drawn rather than
   typed because no font is loaded and a glyph like U+21BA cannot be relied on
   to exist. Roughly a quarter turn of arc, which is exactly what the button
   does. */
const ROT_ARC = {
  left:  "M18.5 15.5A8 8 0 0 0 7.5 7.2",
  right: "M5.5 15.5A8 8 0 0 1 16.5 7.2",
};
const ROT_HEAD = {
  left:  "M3.6 6.2l8.2-1.4-4.7 6.9z",
  right: "M20.4 6.2l-8.2-1.4 4.7 6.9z",
};

/* Facing is carried by the outline of the base itself: the two corners at the
   FRONT are shaved off, so a unit points the way a ship's prow does. A small
   chevron was the previous channel and it was too fine to read at a glance
   across ten bases -- the silhouette reads instantly and survives being
   scaled to 32px.

   ONE shape, rotated, rather than four baked paths. Swapping paths made a
   turn snap; rotating a single plate lets it swing. Drawn pointing north in
   a 100x100 box, stretched to the base. */
const BASE_SHAPE = "M36 0H64L100 42V100H0V42Z";

/* Rotation is accumulated per unit rather than derived from the facing, so a
   turn always takes the SHORT way round: west to north is +90, never -270.
   Presentation only -- it lives in UI, never in G. */
function baseAngle(u) {
  if (!UI.angles) UI.angles = {};
  const want = u.face * 90;
  const prev = UI.angles[u.uid];
  if (prev == null) { UI.angles[u.uid] = want; return want; }
  let delta = ((want - (prev % 360)) % 360 + 540) % 360 - 180;
  UI.angles[u.uid] = prev + delta;
  return UI.angles[u.uid];
}

/* ============================================================
   RENDERING
   updateAll() is the ONLY render entry point; sub-renderers
   build strings. Every interpolated value goes through esc().
   ============================================================ */
function squareName(c, r) {
  /* Files a-i, ranks counted from side 0's back row, so side 0's King
     starts on e1 and side 1's on e8. */
  return "abcdefghi"[c] + (H - r);
}

function unitAria(u) {
  const d = defOf(u);
  return `${G.players[u.side].name} ${d.name} at ${squareName(u.c, u.r)}, facing ${FACE_NAMES[u.face]}, `
       + `${u.figs} of ${d.perBase} ${u.figs === 1 ? "figure" : "figures"}`;
}

function renderUnit(u) {
  const d = defOf(u);
  const stroke = GLYPH_STROKE[u.type];
  const maxPer = perBaseOf(u.type);
  const pips = maxPer > 6
    ? `<b class="pipnum">${u.figs}</b>`          /* ten pips are a smear at 32px */
    : Array.from({ length: maxPer }, (_, i) =>
        `<i class="${i < u.figs ? "on" : "off"}"></i>`).join("");
  const sel = UI.sel === u.uid ? " is-sel" : "";
  return `<div class="u s${u.side}${sel}" data-uid="${u.uid}" data-face="${u.face}"
    role="button" tabindex="-1" aria-label="${esc(unitAria(u))}">
    <svg class="base" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"
      style="transform:rotate(${baseAngle(u)}deg)">
      <path d="${BASE_SHAPE}"/>
    </svg>
    <svg viewBox="0 0 24 24" aria-hidden="true" class="${stroke ? "ln" : "fl"}">
      <path d="${UNIT_GLYPH[u.type]}"/>
    </svg>
    <span class="pips" aria-hidden="true">${pips}</span>
    ${UI.sel === u.uid ? rotateHandles(u) : ""}
  </div>`;
}

/* Turning is legal while deploying (free) or on your own turn with an action
   left -- Heavy Infantry costs two, so it may be affordable for one unit and
   not another on the same turn. */
function canTurnNow(u) {
  if (!u || !u.alive) return false;
  if (G.phase === "deploy") return u.side === G.deploySide && !UI.curtain;
  if (G.gameOver || !isHuman(G.turn) || u.side !== G.turn) return false;
  if (UI.animating || UI.curtain || UI.menuOpen || UI.helpOpen || UI.musterOpen) return false;
  return actionCost(u, "turn") <= G.actionsLeft;
}

/* The handles live in a frame carrying the base's own angle, so they stay in
   the two shaved corners whichever way the unit faces instead of sliding onto
   its flat rear edge. Rotation preserves handedness -- an arc curving
   anticlockwise still curves anticlockwise at 180 degrees -- so the mark goes
   on meaning the same turn; only which corner holds it changes. */
function rotateHandles(u) {
  if (!canTurnNow(u)) return "";
  const arms = ["left", "right"].map(dir => `<span class="rot rot-${dir}" data-act="rot${dir === "left" ? "L" : "R"}"
    role="button" tabindex="0" aria-label="Turn ${esc(defOf(u).name)} ${dir}">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="arc" d="${ROT_ARC[dir]}"/><path class="head" d="${ROT_HEAD[dir]}"/>
    </svg></span>`).join("");
  return `<span class="rots${rotLocked() ? " is-locked" : ""}"
    style="transform:rotate(${baseAngle(u)}deg)">${arms}</span>`;
}

function renderBoard() {
  const grid = buildGrid(G);
  const sel = UI.sel ? byUid(G, UI.sel) : null;
  /* During a call-out the attacker leads the highlights in the selection's
     place -- its reach, but never its moves: rings saying "it could have
     gone there" are noise at the moment it is swinging. */
  const aimAtk = UI.aim ? byUid(G, UI.aim.atk) : null;
  const aimDef = UI.aim ? byUid(G, UI.aim.def) : null;
  const lead = sel && sel.alive ? sel : (aimAtk && aimAtk.alive ? aimAtk : null);
  const moves = new Set(), targets = new Set(), zone = new Set();
  /* THE SCREEN. p.6: "Place the empty game box upright between you and your
     opponent to form a screen. Now, IN SECRET, set up your warriors." Both
     armies are on the board from the first frame of startGame, so laying a
     plan against the AI meant laying it against a line you could see -- and
     could answer. Hot-seat had the curtain; the AI game had nothing.

     Two leaks, not one. The bases were drawn, and selecting a rider drew its
     charge lane, which runs until it is blocked and so maps the enemy front
     rank square by square even with the bases hidden. The lane was wrong as
     UI anyway: while deploying you place a base in your own two ranks, you
     do not ride it anywhere. */
  const screened = G.phase === "deploy";
  if (lead && !screened) {
    if (lead === sel) for (const m of moveSquares(G, grid, lead)) moves.add(idx(m.c, m.r));
    for (const t of attackTargets(G, grid, lead)) targets.add(idx(t.c, t.r));
    if (lead.type === "archer" || defOf(lead).allAdjacent) {
      for (const s of attackZone(lead)) zone.add(idx(s.c, s.r));
    }
  }

  let html = "";
  for (let r = 0; r < H; r++) {
    for (let c = 0; c < W; c++) {
      const k = idx(c, r);
      const u = byUid(G, grid[k]);
      const cls = ["sq"];
      if ((c + r) % 2 === 0) cls.push("lt");
      if (r <= 1) cls.push("dz1");
      if (r >= H - 2) cls.push("dz0");
      if (G.phase === "deploy" && inDeployZone(G.deploySide, c, r)) cls.push("dzone");
      if (zone.has(k)) cls.push("zone");
      if (moves.has(k)) cls.push("mv");
      if (targets.has(k)) cls.push("tg");
      if (aimAtk && aimAtk.alive && aimAtk.c === c && aimAtk.r === r) {
        cls.push("aim-atk", "aim-s" + aimAtk.side);
      }
      if (aimDef && aimDef.alive && aimDef.c === c && aimDef.r === r) cls.push("aim-def");
      /* The screen covers the whole of their zone, not the squares that
         happen to be occupied: hatching only the filled ones would let you
         count ten bases and read the shape off the gaps, which is most of
         what a battle plan is. */
      const veiled = screened && inDeployZone(1 - G.deploySide, c, r);
      const hidden = screened && u && u.side !== G.deploySide;
      if (veiled) cls.push("screened");
      const label = veiled ? `${squareName(c, r)}, behind the screen`
                  : u ? esc(unitAria(u)) : `${squareName(c, r)}, empty`;
      /* Distance from the selected unit, so the highlight blooms OUTWARD from
         it rather than appearing all at once. For a rider that draws the lane
         as far as it reaches; for an Archer the block opens out of the bow.
         The player has never read the rulebook -- this is where the reach of
         a unit gets explained. */
      const d = lead ? Math.max(Math.abs(c - lead.c), Math.abs(r - lead.r)) : 0;
      html += `<div class="${cls.join(" ")}" role="gridcell" data-c="${c}" data-r="${r}"
        style="--d:${d}" tabindex="${UI.cur === k ? 0 : -1}" aria-label="${label}">${u && !hidden ? renderUnit(u) : ""}</div>`;
    }
  }
  const g = document.getElementById("grid");
  g.style.gridTemplateColumns = `repeat(${W}, var(--sq))`;
  g.style.setProperty("--aim-ms",
    Math.round(AIM_MS * (UI.speedFactor == null ? 1 : UI.speedFactor)) + "ms");
  g.innerHTML = html;

  /* Bloom only when the selection actually changed. Re-blooming on every
     render would make the board restless during play. */
  /* Keyed on whatever is leading the highlights, so a call-out blooms its
     reach outward the way a selection does. */
  const leadKey = UI.sel != null ? "s" + UI.sel : (UI.aim ? "a" + UI.aim.atk : null);
  if (leadKey !== UI.lastSel) { UI.bloom = true; UI.lastSel = leadKey; }
  g.classList.toggle("is-blooming", !!UI.bloom && !UI.reducedMotion);
  UI.bloom = false;

  /* The armies march on once, when a game begins. */
  if (UI.entering && !UI.reducedMotion) {
    g.classList.add("is-entering");
    [...g.querySelectorAll(".u")].forEach(el => {
      const uu = byUid(G, +el.dataset.uid);
      if (!uu) return;
      /* Stagger from each army's own back row forward, so the two lines
         arrive from opposite edges and the gap between them reads. */
      const rank = uu.side === 0 ? (H - 1 - uu.r) : uu.r;
      el.style.setProperty("--e", rank * 2 + Math.abs(uu.c - 4));
    });
    setTimeout(() => g.classList.remove("is-entering"), 1400);
    UI.entering = false;
  }
}

function setCmdEnabled(id, on) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle("is-off", !on);
  el.setAttribute("aria-disabled", on ? "false" : "true");
  el.setAttribute("tabindex", on ? "0" : "-1");
}

function syncPrefsChrome() {
  const sp = document.getElementById("hud-speed");
  if (sp) sp.textContent = "Speed: " + SPEED_NAME[UI.speed];
  const mu = document.getElementById("hud-mute");
  if (mu) mu.textContent = UI.muted ? "Sound off" : "Sound on";
}

function renderHUD() {
  if (G.phase === "deploy") {
    const el = document.getElementById("hud-state");
    if (el) el.innerHTML = `<span class="side s${G.deploySide}">${esc(G.players[G.deploySide].name)}</span>
      <span class="rnd">laying the battle plan</span>`;
    const t = document.getElementById("hud-turn");
    if (t) t.textContent = `${G.players[G.deploySide].name} is deploying`;
  }
  const sp = document.getElementById("hud-speed");
  if (sp) sp.textContent = "Speed: " + SPEED_NAME[UI.speed];
  const mu = document.getElementById("hud-mute");
  if (mu) mu.textContent = UI.muted ? "Sound off" : "Sound on";
  /* Undo and End turn stand down when they cannot act -- at game over, while
     the machine is animating, and before the first action of a turn. Undo in
     particular looked live at every moment and swallowed the click. */
  setCmdEnabled("hud-undo", canUndo() && myTurn());
  setCmdEnabled("hud-end", G.phase === "play" && myTurn());
  if (G.phase === "deploy") { syncPrefsChrome(); return; }
  const p = G.players[G.turn];
  const pips = `<span class="acts" aria-hidden="true">${
    "●".repeat(G.actionsLeft)}${"○".repeat(Math.max(0, 2 - G.actionsLeft))}</span>`;
  const who = G.gameOver
    ? (G.result.winner === null ? "Stalemate" : `${esc(G.players[G.result.winner].name)} wins`)
    : `${esc(p.name)} to act`;
  document.getElementById("hud-turn").textContent = who;
  document.getElementById("hud-state").innerHTML =
    `<span class="side s${G.turn}">${who}</span> ${G.gameOver ? "" : pips}
     <span class="rnd">Round ${G.round}</span>`;
}

/* Said once per turn, over the board, then gone. */
function announceTurn() {
  const wrap = document.getElementById("board-wrap");
  if (!wrap) return;
  const key = G.phase === "play" && !G.gameOver ? `${G.turn}:${G.round}` : null;
  if (key === UI.lastTurnKey) return;
  UI.lastTurnKey = key;
  const old = document.getElementById("turnbar");
  if (old) old.remove();
  if (!key || UI.reducedMotion) return;
  const el = document.createElement("div");
  el.id = "turnbar";
  el.className = `side s${G.turn}`;
  el.textContent = `${G.players[G.turn].name} to act`;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

function renderStatus() {
  /* The call-out puts the attacker in the panel too: how many dice are about
     to be thrown is the thing the player most wants before they land. */
  const u = UI.sel ? byUid(G, UI.sel) : (UI.aim ? byUid(G, UI.aim.atk) : null);
  const el = document.getElementById("status-body");
  if (!u || !u.alive) { el.innerHTML = `<p class="dim">No unit selected.</p>`; return; }
  const d = defOf(u);
  el.innerHTML = `
    <p class="unit-name side s${u.side}">${esc(d.name)}</p>
    <dl class="stats">
      <dt>Square</dt><dd>${squareName(u.c, u.r)}</dd>
      <dt>Facing</dt><dd>${FACE_NAMES[u.face]}</dd>
      <dt>Figures</dt><dd>${u.figs} of ${perBaseOf(u.type)}</dd>
      <dt>Dice</dt><dd>${diceFor(u)}</dd>
      <dt>Hits to kill each</dt><dd>${d.htk}</dd>
    </dl>
    ${d.note ? `<p class="note">${esc(d.note)}</p>` : ""}`;
}

/* Hot-seat handoff. Without a dismissible curtain the machine parks on a
   WAIT that nothing resumes, and the next action skips the step that checks
   for victory. */
function renderCurtain() {
  const el = document.getElementById("curtain");
  if (!UI.curtain || G.gameOver) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<div class="box curtain-card">
    <span class="box-label">Handover</span>
    <p>Pass the field to <span class="side s${G.turn}">${esc(G.players[G.turn].name)}</span>.</p>
    <button class="btn" data-act="ready" autofocus>Ready</button>
  </div>`;
}

/* "Green Archer advances to e4" reads far faster when the army is coloured.
   Built from the army and unit names rather than hard-coded, so it follows a
   rename, and applied at RENDER time -- a log entry stays plain data and
   keeps round-tripping through JSON. */
function colourNames(escaped) {
  const armies = G.players.map(p => p.name).join("|");
  /* Longest unit name first, so "Heavy Infantry" wins over "Infantry". */
  const units = Object.keys(UNIT_DEFS).map(t => UNIT_DEFS[t].name)
    .sort((a, b) => b.length - a.length).join("|");
  const re = new RegExp("\\b(" + armies + ") (" + units + ")\\b", "g");
  return escaped.replace(re, (m, army, unit) => {
    const side = G.players.findIndex(p => p.name === army);
    return `<span class="side s${side}">${army} ${unit}</span>`;
  });
}

/* An attack is the one entry that is not a sentence. It is a roll, and a
   roll reads far faster as four faces than as the words "arrows, battle-axe,
   battle-axe, PANIC" -- so it is stored as data and drawn as dice.

   Only the attacker carries its army. Naming the defender's side as well was
   redundant twice over: there are two armies, and the attacker's colour
   already says which one is swinging. */
function attackEntryHTML(e) {
  const atk = byUid(G, e.atk), def = byUid(G, e.def);
  if (!atk || !def) return esc(e.say || "");
  /* Scoring faces go green exactly as they do in the cut-in, so the summary
     can be traced back to the dice that produced it. A total panic scores
     nothing, whatever the other faces say. */
  const hitFace = defOf(atk).hitFace;
  const dice = e.faces.map(f => {
    const scores = !e.panic &&
      (hitFace === null ? (f === AXE || f === ARROW) : f === hitFace);
    return `<span class="logdie ${DIE_CLASS[f]}${scores ? " scores" : ""}"
      role="img" aria-label="${DIE_NAME[f]}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="${DIE_GLYPH[f]}"/></svg></span>`;
  }).join("");

  /* Red is the token for harm and nothing else, so it marks the figures that
     came off -- whichever side they came off. A Peasant can lose figures for
     its target AND panic itself on the same roll, which is why this is built
     from parts rather than picked from a list. */
  const bits = [];
  if (e.lost) bits.push(`<span class="sum-bad">\u2212${e.lost}</span>`);
  if (e.killed) bits.push(`<span class="sum-note">destroyed</span>`);
  if (e.panic) bits.push(`<span class="sum-bad">PANIC</span>`);
  if (!bits.length) bits.push(`<span class="sum-note">\u2014</span>`);

  /* A last-man duel throws ONE die twice, so the row shows two faces from a
     base that should roll one. The cut-in explains that as it happens; the
     record carries it on the row itself, for anyone reading back. */
  const duel = e.duel ? ` title="A single figure against armour: one die, thrown twice."` : "";

  return `<p class="log-who"><span class="side s${atk.side}">${esc(G.players[atk.side].name)} ${esc(defOf(atk).name)}</span>`
       + ` <span class="dim">attacks</span> ${esc(defOf(def).name)}</p>`
       + `<p class="log-roll"${duel}>${dice}<span class="log-sum" role="img"`
       + ` aria-label="${esc(summaryAria(e))}">${bits.join(" ")}</span></p>`;
}

function summaryAria(e) {
  const out = [];
  if (e.duel) out.push("single figure, two hits needed");
  if (e.lost) out.push(`${e.lost} ${e.lost === 1 ? "figure" : "figures"} lost`);
  if (e.killed) out.push("base destroyed");
  if (e.panic) out.push("PANIC");
  return out.length ? out.join(", ") : "no effect";
}

function renderLog() {
  document.getElementById("log-list").innerHTML =
    G.log.slice(-40).reverse().map(l =>
      typeof l === "string" ? `<li>${colourNames(esc(l))}</li>`
                            : `<li class="log-attack">${attackEntryHTML(l)}</li>`).join("");
}

function log(msg) {
  G.log.push(msg);
  if (G.log.length > 200) G.log.shift();
  announce(msg);
}

/* The structured entry. `say` is the same line in words, for the screen
   reader and for any entry whose units have since left G. */
function logAttack(res, say) {
  G.log.push({
    atk: res.atkUid, def: res.defUid, faces: res.faces.slice(),
    lost: figuresLost(res), killed: !!res.killed,
    panic: !!res.panicSteps, duel: !!res.duel, say: say,
  });
  if (G.log.length > 200) G.log.shift();
  announce(say);
}

/* Screen-reader commentary only. Action counts and cursor feedback matter
   to someone who cannot see the pips, but they are noise in the visible
   field report, which is a record of what happened on the field. */
function announce(msg) {
  const a = document.getElementById("announcements");
  if (a) a.textContent = msg;
}

function updateAll() {
  if (UI.headless || !G) return;
  const app = document.getElementById("app");
  if (app) app.classList.toggle("is-deploying", G.phase === "deploy");
  snapshotRects();
  renderBoard();
  playFlip();
  announceTurn();
  renderHUD();
  renderStatus();
  renderDeployBar();
  renderCurtain();
  renderMuster();
  renderMenu();
  renderHelp();
  renderTouchbar();
  renderCoach();
  renderOver();
  renderLog();
  restoreFocus();
}

/* updateAll() replaces #grid.innerHTML wholesale, which destroys the focused
   cell. Without this, keyboard play breaks silently after the first action. */
function restoreFocus() {
  const g = document.getElementById("grid");
  if (!g || UI.cur == null) return;
  const cell = g.querySelector(`[data-c="${UI.cur % W}"][data-r="${Math.floor(UI.cur / W)}"]`);
  if (!cell) return;
  cell.setAttribute("tabindex", "0");
  if (UI.focusInGrid) cell.focus();
}

/* ============================================================
   EVENT QUEUE — presentation only: the state is already final
   by the time these run. Reduced motion skips the queue
   entirely rather than merely disabling CSS transitions.
   ============================================================ */
/* Long enough to find the two squares, short enough that a game against the
   AI does not turn into a slideshow. The pulse is told the same number so it
   gets one full cycle whatever the speed setting. */
const AIM_MS = 520;

/* The gap between the cut-in closing and the board catching up. Without it
   the card and the casualty leave in the same frame, and the player never
   sees the board with the base still on it -- which is the half of "it was
   there, then it was not" that makes the removal read as a consequence
   rather than an edit. */
const SETTLE_MS = 260;

/* Renders the board as it stood when the dice were thrown. G is final by the
   time any of this runs, so the only honest way to hold the pre-attack
   position on screen is to render a copy of it. Restored in a finally: an
   exception mid-render must not leave the game pointing at a snapshot. */
function renderAs(snapshot) {
  if (!snapshot) { updateAll(); return; }
  const live = G;
  G = snapshot;
  try { updateAll(); } finally { G = live; }
}

/* The attack in words. The field report draws dice instead, but a screen
   reader cannot read a glyph, so this is what gets announced -- and it names
   BOTH armies, because without colour there is nothing else to tell them
   apart. */
function attackSentence(res) {
  const atk = byUid(G, res.atkUid), def = byUid(G, res.defUid);
  const parts = [`${G.players[atk.side].name} ${defOf(atk).name} attacks`,
                 `${G.players[def.side].name} ${defOf(def).name}`,
                 `\u2014 ${res.faces.map(f => DIE_NAME[f]).join(", ")}`];
  if (res.panicSteps && !defOf(atk).panicPerDie) parts.push("\u2014 PANIC!");
  else if (res.removed) parts.push(`\u2014 ${figuresLost(res)} lost`);
  else parts.push("\u2014 no effect");
  return parts.join(" ");
}

function attackEvents(res) {
  const atk = byUid(G, res.atkUid), def = byUid(G, res.defUid);
  /* The cut-in runs FIRST, while the board still shows the position as it was
     when the dice were thrown. Only once the outcome has been read does the
     board re-render and take the casualty off. */
  const ev = [];
  /* An attack the player ordered needs no announcement -- they just clicked
     the target. One the AI ordered does: without it the dice arrive over a
     board that gives no clue which of ten bases threw them. */
  if (!isHuman(atk.side)) ev.push({ type: "aim", atk: res.atkUid, def: res.defUid });
  ev.push(
    { type: "sfx", name: "dice" },
    { type: "combat", res },
    { type: "wait", delay: SETTLE_MS },
    { type: "render" },
    { type: "logAttack", res: res, say: attackSentence(res) });
  if (res.removed) ev.push({ type: "sfx", name: res.killed ? "kill" : "hit" });
  if (res.retreats && res.retreats.length) {
    ev.push({ type: "sfx", name: "panic" });
    /* A unit shoved off the board, into an enemy or into its own King is
       eliminated. Without this the casualty is invisible: the base simply
       disappears and the log says only that someone panicked. */
    for (const step of res.retreats) {
      if (!step.dead) continue;
      const u = byUid(G, step.uid);
      ev.push({ type: "log",
        text: `${G.players[u.side].name} ${defOf(u).name} is broken and lost at ${squareName(step.c, step.r)}.` });
      ev.push({ type: "sfx", name: "kill" });
    }
  }
  /* One beat per link of the cascade, so a chain reaction reads as a chain. */
  ev.push({ type: "wait", delay: 220 + 70 * ((res.retreats && res.retreats.length) || 0) });
  return ev;
}

function processEventQueue() {
  const q = UI.eventQueue;
  const nextEvent = () => {
    if (!q.length) { UI.animating = false; return; }
    const e = q.shift();
    if (e.type === "log") { log(e.text); nextEvent(); return; }
    if (e.type === "logAttack") { logAttack(e.res, e.say); nextEvent(); return; }
    if (e.type === "sfx") { sfx(e.name); nextEvent(); return; }
    if (e.type === "combat") { showCombat(e.res, nextEvent); return; }
    /* The one render that is allowed to take the casualty off, and the only
       one in the sequence that draws the live G. */
    if (e.type === "render") {
      UI.aim = null; UI.preAttack = null;
      updateAll(); nextEvent(); return;
    }
    if (e.type === "aim") {
      /* Held through the dice as well, so the board behind the cut-in still
         shows who is fighting whom -- both of them, at full strength.
         Cleared by the render that follows. */
      UI.aim = { atk: e.atk, def: e.def };
      renderAs(UI.preAttack);
      setTimeout(nextEvent, AIM_MS * (UI.speedFactor == null ? 1 : UI.speedFactor));
      return;
    }
    if (e.type === "callback") { UI.animating = false; e.fn(); return; }
    if (e.type === "wait") {
      setTimeout(nextEvent, e.delay * (UI.speedFactor == null ? 1 : UI.speedFactor));
      return;
    }
    nextEvent();
  };
  nextEvent();
}

/* ============================================================
   HUMAN INPUT
   One click listener and one keydown listener on #app, routed by
   data-act, plus contextual activation on the grid. Selection is
   the only mode: clicking a legal destination moves, clicking a
   legal target attacks, so ordinary play never needs a mode
   switch. Everything reachable by mouse is reachable by key.
   ============================================================ */

function clone(o) { return JSON.parse(JSON.stringify(o)); }

function pushUndo() {
  if (!UI.undo) UI.undo = [];
  UI.undo.push(clone(G));
  if (UI.undo.length > 40) UI.undo.shift();
}
function canUndo() { return !!(UI.undo && UI.undo.length && !G.gameOver); }
function doUndo() {
  if (!canUndo()) return;
  G = UI.undo.pop();
  UI.sel = null;
  log("Order withdrawn.");
  updateAll();
}

function selUnit() {
  const u = UI.sel ? byUid(G, UI.sel) : null;
  return u && u.alive ? u : null;
}
function deployTurn() {
  return G.phase === "deploy" && !UI.curtain && !UI.menuOpen && !UI.helpOpen &&
         !UI.musterOpen;
}
function myTurn() {
  return !G.gameOver && isHuman(G.turn) && !UI.animating && !UI.curtain && !UI.musterOpen && !UI.menuOpen && !UI.helpOpen;
}

function selectUnit(uid) {
  const u = byUid(G, uid);
  if (!u || !u.alive) return;
  UI.sel = UI.sel === uid ? null : uid;
  if (UI.sel) sfx("select");
  if (UI.sel) UI.cur = idx(u.c, u.r);
  updateAll();
}

/* An attack reveals information, so it seals everything before it: you may
   take a move back, never a dice roll. */
function tryAction(a) {
  if (!myTurn()) return false;
  const grid = buildGrid(G);
  if (!legalActions(G, grid, G.turn).some(x => sameAction(x, a))) return false;

  if (a.kind === "attack") { UI.undo = []; } else { pushUndo(); }

  doAction(a);
  if (a.kind === "move" || a.kind === "turn") UI.cur = idx(byUid(G, a.uid).c, byUid(G, a.uid).r);
  if (!byUid(G, a.uid).alive) UI.sel = null;
  advance();
  announceActions();
  return true;
}

function announceActions() {
  if (G.gameOver) return;
  const n = G.actionsLeft;
  announce(n === 0 ? "No actions left." : n === 1 ? "One action left." : "Two actions left.");
}

/* Contextual activation: the square under the cursor decides what happens,
   which is what keeps play to two clicks with no mode switching. */
function activateSquare(c, r) {
  if (G.phase === "deploy") { deployActivate(c, r); return; }
  if (!myTurn()) return;
  const grid = buildGrid(G);
  const u = unitAt(G, grid, c, r);
  const sel = selUnit();

  if (sel) {
    const target = u && u.side !== sel.side
      ? legalActions(G, grid, G.turn).find(a => a.kind === "attack" && a.uid === sel.uid && a.defUid === u.uid)
      : null;
    if (target) { tryAction(target); return; }
    const move = legalActions(G, grid, G.turn)
      .find(a => a.kind === "move" && a.uid === sel.uid && a.c === c && a.r === r);
    if (move) { tryAction(move); return; }
  }
  if (u && u.side === G.turn) { selectUnit(u.uid); return; }
  if (sel) { UI.sel = null; updateAll(); }
}

/* During deployment a click either picks a base up or puts it down. There is
   no separate "held" mode: the selected base is the held one. */
function deployActivate(c, r) {
  if (UI.curtain || UI.menuOpen || UI.helpOpen) return;
  const side = G.deploySide;
  const u = unitAt(G, buildGrid(G), c, r);
  const sel = UI.sel ? byUid(G, UI.sel) : null;

  if (sel && sel.side === side && !isAnchored(sel)) {
    if (deployPlace(sel, c, r)) { UI.cur = idx(sel.c, sel.r); updateAll(); return; }
  }
  if (u && u.side === side) {
    UI.sel = UI.sel === u.uid ? null : u.uid;
    if (UI.sel) sfx("select");
    UI.cur = idx(c, r);
    updateAll();
    return;
  }
  UI.sel = null;
  updateAll();
}

/* The handles are the primary way to turn; the keyboard mirrors them. */
/* Because the handles now swing with the base, the corner under the pointer
   holds the OTHER arrow a moment after a turn -- so a second click landing in
   the same place would undo the first. The handles go inert until the swing
   has settled, which is the length of the base's own rotation plus a little.
   Presentation only: the keys are not gated, since nothing moves under a
   finger on the keyboard. */
function rotLockMs() {
  const sf = UI.speedFactor == null ? 1 : UI.speedFactor;
  if (UI.reducedMotion || sf === 0) return 0;
  return Math.round(240 * sf * 1.25) + 90;
}

function rotLocked() { return UI.rotLock != null && Date.now() < UI.rotLock; }

function armRotLock() {
  const ms = rotLockMs();
  if (!ms) return;
  UI.rotLock = Date.now() + ms;
  clearTimeout(UI.rotLockTimer);
  UI.rotLockTimer = setTimeout(() => {
    UI.rotLock = null;
    const el = document.querySelector(".rots.is-locked");
    if (el) el.classList.remove("is-locked");
  }, ms);
}

function turnSelected(dir, viaHandle) {
  const u = selUnit();
  if (!u || !canTurnNow(u)) return;
  if (viaHandle && rotLocked()) return;
  /* Armed BEFORE the render, or the handles that come back would not know
     they are inert. */
  armRotLock();
  faceSelected(((u.face + dir) % 4 + 4) % 4);
}

function faceSelected(face) {
  const sel = selUnit();
  if (!sel || sel.face === face) return;
  if (G.phase === "deploy") {
    if (deployFace(sel, face)) updateAll();
    return;
  }
  tryAction({ kind: "turn", uid: sel.uid, face });
}

/* Attack ahead: fires when exactly one target is legal, otherwise parks the
   cursor on the first so the choice is visible rather than guessed. */
function attackAhead() {
  const sel = selUnit();
  if (!sel) return;
  const grid = buildGrid(G);
  const acts = legalActions(G, grid, G.turn).filter(a => a.kind === "attack" && a.uid === sel.uid);
  if (!acts.length) return;
  if (acts.length === 1) { tryAction(acts[0]); return; }
  const t = byUid(G, acts[0].defUid);
  UI.cur = idx(t.c, t.r);
  updateAll();
}

function cycleUnit(dir) {
  const grid = buildGrid(G);
  const acts = legalActions(G, grid, G.turn);
  const uids = [...new Set(acts.map(a => a.uid))]
    .map(id => byUid(G, id))
    .sort((a, b) => (a.r - b.r) || (a.c - b.c))
    .map(u => u.uid);
  if (!uids.length) return;
  const at = uids.indexOf(UI.sel);
  const next = uids[(at + (dir > 0 ? 1 : uids.length - 1) + uids.length) % uids.length];
  UI.sel = next;
  const u = byUid(G, next);
  UI.cur = idx(u.c, u.r);
  updateAll();
}

function moveCursor(dc, dr) {
  if (UI.cur == null) UI.cur = idx(4, H - 1);
  let c = (UI.cur % W) + dc, r = Math.floor(UI.cur / W) + dr;
  c = Math.max(0, Math.min(W - 1, c));
  r = Math.max(0, Math.min(H - 1, r));
  UI.cur = idx(c, r);
  UI.focusInGrid = true;
  updateAll();
}

function passTurn() {
  if (!myTurn()) return;
  UI.undo = [];
  UI.sel = null;
  log(`${G.players[G.turn].name} stands fast.`);
  go("play", "endTurn");
  advance();
}

const ACTS = {
  turnLeft: () => turnSelected(-1),
  turnRight: () => turnSelected(1),
  attack: attackAhead,
  next: () => cycleUnit(1),
  prev: () => cycleUnit(-1),
  undo: doUndo,
  endTurn: passTurn,
  help: () => toggleHelp(),
  ready: () => {
    UI.curtain = false;
    const then = UI.curtainThen;
    UI.curtainThen = null;
    if (then === "muster" || then === "deploy") { updateAll(); return; }
    updateAll();
    advance();
  },
  deployAuto: deployAuto,
  deployReady: deployReady,
  musterBases: el => musterAdjust(el.dataset.type, "bases", +el.dataset.delta),
  musterFigs: el => musterAdjust(el.dataset.type, "figs", +el.dataset.delta),
  musterPreset: () => { UI.muster = basicSpec(); updateAll(); },
  musterConfirm: musterConfirm,
  rotL: () => turnSelected(-1, true),
  rotR: () => turnSelected(1, true),
  speed: cycleSpeed,
  mute: toggleMute,
  menuOpen: openMenu,
  menuClose: closeMenu,
  menuBegin: menuBegin,
  menuPick: el => { UI.menu[el.dataset.group] = el.dataset.value; updateAll(); },
  menuHouse: el => { UI.menu.house[el.dataset.key] = !UI.menu.house[el.dataset.key]; updateAll(); },
  /* renderMenu replaces the card wholesale, so a <details> left to its own
     devices snapped shut on every toggle -- you could set one house rule and
     then had to reopen the section to set the next. The open state lives in
     UI and is re-applied on render; only this closes it. */
  menuAdvanced: el => {
    const d = el.closest("details");
    UI.menuAdvanced = d ? !d.open : !UI.menuAdvanced;   /* pre-default-action */
    updateAll();
  },
  helpClose: () => { UI.helpOpen = false; updateAll(); },
  coachGot: el => coachDismiss(el.dataset.id),
  /* Same opponent, same difficulty, same house rules -- a rematch, not a
     trip back through the setup screen. */
  again: () => { clearSave(); openMuster(0); },
  newGame: () => { clearSave(); startGame(); },
};

function dispatchAct(name, el) {
  const fn = ACTS[name];
  if (fn) fn(el);
}

const KEYS = {
  ArrowLeft: () => moveCursor(-1, 0), a: () => moveCursor(-1, 0),
  ArrowRight: () => moveCursor(1, 0), d: () => moveCursor(1, 0),
  ArrowUp: () => moveCursor(0, -1), w: () => moveCursor(0, -1),
  ArrowDown: () => moveCursor(0, 1), s: () => moveCursor(0, 1),
  n: () => cycleUnit(1), p: () => cycleUnit(-1),
  1: () => faceSelected(N), 2: () => faceSelected(E), 3: () => faceSelected(S), 4: () => faceSelected(WEST),
  q: () => dispatchAct("turnLeft"), e: () => dispatchAct("turnRight"),
  f: attackAhead, z: doUndo, ".": passTurn, m: toggleMute, s2: null,
  /* Escape dismisses the topmost overlay, then falls back to clearing the
     selection. It deliberately does NOT clear the handover curtain: that has
     to go through Ready, which calls advance(), or the phase machine is left
     parked on a WAIT nothing resumes. The muster is not escapable either --
     you cannot take the field without an army. */
  Escape: () => {
    if (UI.helpOpen) { UI.helpOpen = false; updateAll(); return; }
    if (UI.menuOpen) { UI.menuOpen = false; updateAll(); return; }
    if (UI.musterOpen || UI.curtain) return;
    UI.sel = null;
    updateAll();
  },
  h: () => toggleHelp(), "?": () => toggleHelp(),
};

function setupInput() {
  const app = document.getElementById("app");

  /* Delegation lives on document, not #app: overlays such as the handover
     curtain are siblings of #app, so an #app-scoped listener cannot see
     their buttons at all -- they look inert by both mouse and keyboard. */
  document.addEventListener("click", ev => {
    const act = ev.target.closest("[data-act]");
    if (act) { dispatchAct(act.dataset.act, act); return; }
    const cell = ev.target.closest(".sq");
    if (cell) {
      UI.cur = idx(+cell.dataset.c, +cell.dataset.r);
      UI.focusInGrid = true;
      activateSquare(+cell.dataset.c, +cell.dataset.r);
    }
  });

  app.addEventListener("focusin", ev => { UI.focusInGrid = !!ev.target.closest("#grid"); });
  void app;

  document.addEventListener("keydown", ev => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const inGrid = UI.focusInGrid || !document.activeElement || document.activeElement === document.body;

    if (ev.key === "Enter" || ev.key === " ") {
      /* Read the focused element, not ev.target: delegation is on document,
         and a <span role="button"> gets no native Enter-to-click the way a
         real <button> does. Without this every such control is dead to the
         keyboard. */
      const focused = document.activeElement;
      const act = focused && focused.closest && focused.closest("[data-act]");
      if (act) { ev.preventDefault(); dispatchAct(act.dataset.act, act); return; }
      if (inGrid && UI.cur != null) {
        ev.preventDefault();
        activateSquare(UI.cur % W, Math.floor(UI.cur / W));
        return;
      }
    }
    const fn = KEYS[ev.key] || KEYS[ev.key.toLowerCase()];
    if (fn && (inGrid || !/^(Arrow|w|a|s|d)/.test(ev.key))) { ev.preventDefault(); fn(); }
  });
}

function toggleHelp() {
  UI.helpOpen = !UI.helpOpen;
  if (UI.helpOpen) UI.menuOpen = false;
  updateAll();
}

function startGame(seed, opts) {
  UI.rects = null;                      /* no FLIP continuity across games */
  UI.entering = true; UI.lastSel = null; UI.lastActions = null; UI.lastTurnKey = null;
  UI.aim = null; UI.preAttack = null;
  for (const g of document.querySelectorAll(".ghost")) g.remove();
  newGame(seed == null ? Math.floor(Math.random() * 1e9) : seed, opts);
  Object.assign(G.cfg, opts || {});
  if (G.cfg.opponent === "hotseat") G.players[1].isBot = false;
  else G.players[1].skill = UI.pendingSkill != null ? +UI.pendingSkill : 1;

  /* The Basic Game's opening is printed and fixed. A customised army gets the
     secret battle plan, which is where the strategy lives. */
  const humans = [0, 1].filter(i => !G.players[i].isBot);
  if (G.cfg.setup === "custom" && humans.length) {
    G.phase = "deploy"; G.step = "place";
    G.deploySide = humans[0];
    G.playersDeployed = [];
    UI.cur = idx(4, deployRows(G.deploySide)[0]);
  }
  UI.sel = null; UI.undo = [];
  if (G.phase === "deploy") {
    log(`${G.players[G.deploySide].name} lays a battle plan.`);
    updateAll();
    return;
  }
  UI.cur = idx(4, H - 1);
  log("The armies take the field.");
  advance();
}

/* ============================================================
   AI
   Exhaustive first ply, beam-pruned second ply, closed-form
   expected values, no rollouts. Rollouts were rejected because
   they would consume rnd() in unbounded amounts that depend on
   search internals; DICE_DIST gives exact probabilities for
   free. botChooseTurn() therefore touches G.rng ZERO times,
   which invariant 12 asserts rather than assumes -- including
   the difficulty noise, which is derived from a hash of the
   position instead of a draw.

   Material is counted in FIGURES, not bases, because that is
   how the game counts: wearing a 4-man base down to 1 costs
   three quarters of its strength AND three quarters of its
   firepower, and the evaluator sees both for free.
   ============================================================ */

const AI_MAX_LEAVES = 4000;

/* Per-figure worth. An Infantryman is the unit of account at 15: one die,
   one hit to remove. A Knight figure rolls two dice and takes two hits, so
   it is worth about three of them. An Archer figure rolls one die but hits
   on arrows (1/3, against an axe's 1/2) and shoots over heads at range. */
const FIG_VALUE = { king: 400, knight: 45, heavy: 40, mercenary: 30,
                    archer: 18, infantry: 15, peasant: 10 };
const KING_LOSS = 100000;

const W_ATTACK = 0.45;    /* value of an attack available right now       */
/* Closing the gap has to be worth more than a free turn, or both sides sit
   in their deployment rows until the round cap -- measured, not guessed:
   at 1.2 the best advance scored -4.8 against dozens of 0-delta turns. */
const W_ADVANCE = 3;      /* per rank closer to the enemy King            */
const W_FACING = 3;       /* pointed at the nearest enemy                 */
/* Cover was the stalemate. The printed opening is already maximally packed,
   so every move broke three adjacencies and cost 6 -- the army was glued to
   its deployment. Kept only as a whisper for tie-breaking. */
const W_COVER = 0.5;      /* per orthogonally adjacent friendly           */
const W_KINGSAFE = 8;     /* per enemy within 3 squares of my King        */
const W_KINGLANE = 120;   /* an enemy rider has a clear run at my King    */
const W_ARCHER = 6;       /* my archer has something in its block         */
const W_SCREEN = 5;       /* my archer has a friendly directly ahead      */

/* `sharp` is how hard the tier weights an opening by its grade. 0 is a
   coin-toss across the whole library, weak shapes included; 5 all but
   guarantees a sound one. It is the deployment half of cleverness, and it
   matters: the opening is the one decision the search never revisits. */
const SKILL = [
  { name: "Squire",  beam: 1,  threat: false, kingLane: false, archer: false, noise: "top4", sharp: 0 },
  { name: "Knight",  beam: 6,  threat: true,  kingLane: true,  archer: true,  noise: "second", sharp: 2 },
  { name: "Marshal", beam: 14, threat: true,  kingLane: true,  archer: true,  noise: "none", sharp: 5 },
];

/* Deterministic from the seed, like botMuster, and drawn before a die is
   ever thrown -- so it costs G.rng nothing and a game still replays. */
function pickOpening(skill, pickSeed) {
  const sharp = (SKILL[skill] || SKILL[1]).sharp;
  const weights = OPENINGS.map(o => Math.pow(o.grade, sharp));
  const total = weights.reduce((a, b) => a + b, 0);
  const roll = mulberry32((pickSeed >>> 0) || 1)() * total;
  let acc = 0;
  for (let i = 0; i < OPENINGS.length; i++) {
    acc += weights[i];
    if (roll < acc) return OPENINGS[i];
  }
  return OPENINGS[0];
}

/* A light clone. JSON round-tripping G ~900 times per turn is far too slow;
   the search only needs the position. */
function snapshot(P) {
  return {
    actionsLeft: P.actionsLeft, turn: P.turn,
    units: P.units.map(u => ({ uid: u.uid, side: u.side, type: u.type, figs: u.figs,
                               c: u.c, r: u.r, face: u.face, alive: u.alive,
                               attackedThisTurn: u.attackedThisTurn })),
  };
}

/* Exact outcome distribution for one attack, from DICE_DIST. Never rolls. */
function expectedAttack(P, atk, def) {
  const ad = defOf(atk), dd = defOf(def);

  if (needsLastManDuel(atk, def)) {
    /* One die; on a hit, roll it again. Enumerated over both rolls so a
       Peasant's "most of" scoring is handled like any other. */
    const P_OF = { [AXE]: P_AXE, [ARROW]: P_ARROW, [PANIC]: P_PANIC };
    const isHit = f => ad.hitFace === null ? f !== PANIC : f === ad.hitFace;
    let pPanic = 0, pTwo = 0;
    for (const f1 of [AXE, ARROW, PANIC]) {
      if (f1 === PANIC) { pPanic += P_OF[f1]; continue; }
      if (!isHit(f1)) continue;
      for (const f2 of [AXE, ARROW, PANIC]) {
        const p = P_OF[f1] * P_OF[f2];
        if (f2 === PANIC) { pPanic += p; continue; }
        const axes = (f1 === AXE ? 1 : 0) + (f2 === AXE ? 1 : 0);
        const arrows = (f1 === ARROW ? 1 : 0) + (f2 === ARROW ? 1 : 0);
        if (hitsFrom(ad, axes, arrows) >= 2) pTwo += p;
      }
    }
    return { pPanic, eRemoved: pTwo, pKill: def.figs === 1 ? pTwo : 0 };
  }

  const n = diceFor(atk);
  let pPanic = 0, eRemoved = 0, pKill = 0;
  for (const row of DICE_DIST[n]) {
    if (panicsFrom(ad, row.panics, n)) { pPanic += row.p; continue; }
    const hits = hitsFrom(ad, row.axes, row.arrows);
    const removed = Math.min(def.figs, Math.floor(hits / dd.htk));
    eRemoved += row.p * removed;
    if (removed >= def.figs) pKill += row.p;
  }
  return { pPanic, eRemoved, pKill };
}

function unitWorth(u) { return u.figs * FIG_VALUE[u.type]; }

function chebyshev(a, b) { return Math.max(Math.abs(a.c - b.c), Math.abs(a.r - b.r)); }

/* Does an enemy rider have an unblocked straight run to a square from which
   it faces my King? This is the single most important thing the bot has to
   learn, so it carries a weight of about 1.3 Knights. */
function kingLaneThreat(P, grid, king) {
  for (const e of P.units) {
    if (!e.alive || e.side === king.side || !defOf(e).mounted) continue;
    const F = DIRS[e.face];
    for (let k = 1; k < Math.max(W, H); k++) {
      const c = e.c + F[0] * k, r = e.r + F[1] * k;
      if (!inBoard(c, r)) break;
      const occ = grid[idx(c, r)];
      if (occ) {
        if (occ === king.uid) return true;          /* runs straight onto him */
        break;
      }
      /* stopping here, would it then be adjacent and facing the King? */
      const ahead = { c: c + F[0], r: r + F[1] };
      if (ahead.c === king.c && ahead.r === king.r) return true;
    }
  }
  return false;
}

function sideScore(P, grid, s, sk) {
  let score = 0;
  const king = kingOf(P, s);
  if (!king) return -KING_LOSS;

  const foeKing = kingOf(P, 1 - s);
  const mine = [], foes = [];
  for (const u of P.units) {
    if (!u.alive) continue;
    (u.side === s ? mine : foes).push(u);
    if (u.side === s) score += unitWorth(u);
  }

  for (const u of mine) {
    /* Attacks available to me right now. */
    for (const t of attackTargets(P, grid, u)) {
      const ex = expectedAttack(P, u, t);
      score += W_ATTACK * (ex.eRemoved * FIG_VALUE[t.type] + (t.type === "king" ? ex.pKill * KING_LOSS : 0));
    }
    /* Close the distance -- deliberately tiny, so it breaks ties without
       ever outweighing a trade. On a board with four empty ranks it matters
       far less than threat does. */
    if (foeKing) score += W_ADVANCE * (H - Math.abs(u.r - foeKing.r));

    /* Facing the nearest enemy. */
    let near = null, nd = 99;
    for (const f of foes) { const d = chebyshev(u, f); if (d < nd) { nd = d; near = f; } }
    if (near) {
      const F = DIRS[u.face];
      if (F[0] * (near.c - u.c) + F[1] * (near.r - u.r) > 0) score += W_FACING;
    }
    for (const m of mine) {
      if (m !== u && Math.abs(m.c - u.c) + Math.abs(m.r - u.r) === 1) score += W_COVER / 2;
    }
    if (sk.archer && u.type === "archer") {
      if (attackTargets(P, grid, u).length) score += W_ARCHER;
      const ahead = stepFrom(u.c, u.r, u.face, 1);
      const inFront = inBoard(ahead.c, ahead.r) && byUid(P, grid[idx(ahead.c, ahead.r)]);
      if (inFront && inFront.side === s) score += W_SCREEN;
    }
  }

  if (sk.threat) {
    for (const f of foes) if (chebyshev(f, king) <= 3) score -= W_KINGSAFE;
  }
  if (sk.kingLane && kingLaneThreat(P, grid, king)) score -= W_KINGLANE;
  return score;
}

/* Zero-sum: positive is good for `side`. */
function evaluate(P, side, sk) {
  const grid = buildGrid(P);
  return sideScore(P, grid, side, sk) - sideScore(P, grid, 1 - side, sk);
}

/* Applies an action WITHOUT touching rnd(). An attack is resolved to its
   most likely figure loss rather than rolled, which keeps the second ply
   deterministic and the dice stream untouched. */
function applyQuiet(P, a) {
  const u = P.units.find(x => x.uid === a.uid);
  P.actionsLeft -= actionCost(u, a.kind);
  if (a.kind === "move") { u.c = a.c; u.r = a.r; return; }
  if (a.kind === "turn") { u.face = a.face; return; }
  if (a.kind === "bribe") {
    u.attackedThisTurn = true;
    P.units.find(x => x.uid === a.defUid).side = u.side;
    return;
  }
  const def = P.units.find(x => x.uid === a.defUid);
  u.attackedThisTurn = true;
  const ex = expectedAttack(P, u, def);
  const removed = Math.min(def.figs, Math.round(ex.eRemoved));
  if (removed > 0) {
    def.figs -= removed;
    if (def.figs <= 0) { def.figs = 0; def.alive = false; }
  }
}

/* Invariant 12. The search is pure, so a bot turn must leave G.rng
   byte-identical -- otherwise the dice stream would depend on search
   internals and a saved game would not replay. Asserted, not assumed. */
function botChooseTurnChecked(P, side, skill) {
  const before = P.rng;
  const now = () => (typeof performance !== "undefined" ? performance.now() : Date.now());
  const t0 = now();
  const plan = botChooseTurn(P, side, skill);
  const ms = now() - t0;
  if (typeof HARNESS !== "undefined" && HARNESS) {
    HARNESS.maxPlanMs = Math.max(HARNESS.maxPlanMs || 0, ms);
  }
  if (P.rng !== before) {
    throw new Error(`Bot consumed rnd(): ${before} -> ${P.rng} (the search must be pure)`);
  }
  return plan;
}

function actionDelta(P, base, a, side, sk) {
  const P2 = snapshot(P);
  applyQuiet(P2, a);
  return evaluate(P2, side, sk) - base;
}

/* Deterministic noise: a hash of the POSITION, never a draw from rnd().
   That is what lets the bot be imperfect at low skill while leaving the
   dice stream byte-identical across a turn. */
function posHash(P) {
  let h = 2166136261;
  for (const u of P.units) {
    h ^= u.uid + (u.c * 31) + (u.r * 7) + (u.face * 3) + (u.figs * 11) + (u.alive ? 1 : 0);
    h = Math.imul(h, 16777619);
  }
  h ^= P.turn * 13 + P.actionsLeft * 29;
  return h >>> 0;
}

function botChooseTurn(P, side, skillIx) {
  const sk = SKILL[Math.max(0, Math.min(SKILL.length - 1, skillIx | 0))];
  const grid = buildGrid(P);
  const acts = legalActions(P, grid, side);
  if (!acts.length) return [];

  const base = evaluate(P, side, sk);
  const scored = acts.map(a => ({ a, s: actionDelta(P, base, a, side, sk) }));
  scored.sort((x, y) => y.s - x.s);
  const h = posHash(P);

  /* Squire does not look ahead at all. It takes the best IMMEDIATE action and
     replans, which is both cheaper and genuinely weaker -- a shallower search,
     not merely a noisier one. Returning a single action is what makes it
     greedy: the phase machine calls back for the next one. */
  if (sk.beam <= 1) {
    const pool = scored.slice(0, Math.min(4, scored.length));
    return [pool[h % pool.length].a];
  }

  /* Shrink the beam to fit the leaf budget. This depends only on the
     position, so seeds still replay identically. */
  const beam = Math.max(1, Math.min(sk.beam, Math.floor(AI_MAX_LEAVES / Math.max(1, acts.length))));

  const results = [];
  for (const cand of scored.slice(0, beam)) {
    const P2 = snapshot(P);
    applyQuiet(P2, cand.a);
    let total = evaluate(P2, side, sk);
    let second = null;
    if (P2.actionsLeft > 0) {
      const g2 = buildGrid(P2);
      const b2 = evaluate(P2, side, sk);
      let bestS = 0;
      for (const b of legalActions(P2, g2, side)) {
        const d = actionDelta(P2, b2, b, side, sk);
        if (d > bestS) { bestS = d; second = b; }
      }
      total += bestS;
    }
    results.push({ total, first: cand.a, second });
  }
  results.sort((x, y) => y.total - x.total);

  let pick = results[0];
  if (sk.noise === "second" && results.length > 1 && (h % 5) === 0) {
    pick = results[1];                       /* second best one turn in five */
  }
  return pick.second ? [pick.first, pick.second] : [pick.first];
}

/* ============================================================
   CUSTOMISED MUSTER (rulebook p.6)
   "Both players start with 10 bases on the board." There is no
   points system: the constraints are the physical components --
   how many figures you own, how many fit on a base, and how
   many bases of each special you are allowed.

     Heavy Infantry - 1 or 2 bases: put 1 or 2 on a base
     Peasants       - up to 4 bases: put up to 4 on a base
     Mercenaries    - 1 base: put 2 on a base

   Which basic bases you drop to make room is NOT stated
   anywhere, so the figure pool is left to do the work.
   ============================================================ */

const MUSTER_ORDER = ["knight", "archer", "infantry", "heavy", "peasant", "mercenary"];

/* An army spec is { type: { bases, figs } }. The King is implicit: exactly
   one base of one figure, mandatory, and never in the spec. */
function basicSpec() {
  return { knight: { bases: 2, figs: 2 }, archer: { bases: 2, figs: 4 },
           infantry: { bases: 5, figs: 4 }, heavy: { bases: 0, figs: 0 },
           peasant: { bases: 0, figs: 0 }, mercenary: { bases: 0, figs: 0 } };
}

function specBases(spec) {
  return 1 + MUSTER_ORDER.reduce((n, t) => n + (spec[t] ? spec[t].bases : 0), 0);
}
function specFigures(spec) {
  return 1 + MUSTER_ORDER.reduce((n, t) => n + (spec[t] ? spec[t].bases * spec[t].figs : 0), 0);
}

/* Returns null when legal, otherwise a sentence naming what is wrong. The
   UI shows that sentence rather than greying a button with no explanation. */
function validateArmy(spec, cfg) {
  const partial = !cfg || cfg.partialBases !== false;
  for (const t of MUSTER_ORDER) {
    const e = spec[t] || { bases: 0, figs: 0 };
    const d = UNIT_DEFS[t];
    if (e.bases < 0 || e.figs < 0) return `${d.name}: negative count.`;
    if (e.bases > 0 && e.figs < 1) return `${d.name}: a base cannot be empty.`;
    const maxPer = perBaseOf(t, cfg);
    if (e.figs > maxPer) return `${d.name}: only ${maxPer} fit on a base.`;
    if (e.bases > 0 && !partial && e.figs !== maxPer && t !== "heavy" && t !== "peasant") {
      return `${d.name}: bases must be filled to ${maxPer}.`;
    }
    const used = e.bases * e.figs;
    if (used > d.perPlayer) {
      return `${d.name}: you own ${d.perPlayer}, this uses ${used}.`;
    }
    const capBases = CUSTOM_BASE_CAPS[t];
    if (capBases !== undefined && e.bases > capBases) {
      return `${d.name}: the muster allows ${capBases} ${capBases === 1 ? "base" : "bases"}.`;
    }
  }
  const n = specBases(spec);
  if (n !== BASES_TOTAL) {
    return n < BASES_TOTAL
      ? `${BASES_TOTAL - n} ${BASES_TOTAL - n === 1 ? "base" : "bases"} still to fill.`
      : `${n - BASES_TOTAL} ${n - BASES_TOTAL === 1 ? "base" : "bases"} too many.`;
  }
  return null;
}

/* Build the actual units from a spec, ordered so the King lands centre-back
   and the rest fill outward -- the printed basic arrangement generalised. */
function unitsFromSpec(side, spec) {
  const out = [{ type: "king", figs: 1 }];
  for (const t of MUSTER_ORDER) {
    const e = spec[t] || { bases: 0, figs: 0 };
    for (let i = 0; i < e.bases; i++) out.push({ type: t, figs: e.figs });
  }
  return out;
}

/* p.6: "Your King must start on the royal emblem in the back row, and you
   may place your other figures on that row and the row in front of it."

   The default formation follows the shape of the printed basic army rather
   than filling the back row first: bows and horse behind the line, foot
   screening in front. Both rows fill outward from the centre, so a short
   muster still forms a line instead of hugging one edge. */
const CENTRE_OUT = [4, 3, 5, 2, 6, 1, 7, 0, 8];
const EDGE_IN    = [0, 8, 1, 7, 2, 6, 3, 5, 4];
const LEFT_HALF  = [4, 3, 2, 1, 0, 5, 6, 7, 8];
const RIGHT_HALF = [4, 5, 6, 7, 8, 3, 2, 1, 0];
const FOOT = ["infantry", "heavy", "peasant", "mercenary"];
const MISSILE_HORSE = ["archer", "knight"];

/* ============================================================
   OPENINGS — a library of shapes for the two deployment ranks.

   One shape per entry, described as column orders and which
   types prefer which rank; the placer fills a preferred rank
   and overflows to the other, so an opening works whatever the
   muster turned out to be. `grade` is soundness, 1 to 3, and it
   is what separates a Squire's opening from a Marshal's -- see
   pickOpening(). Nothing here reads the enemy: both plans are
   laid blind, which is the rulebook's own arrangement.
   ============================================================ */
const OPENINGS = [
  { key: "line", grade: 3, name: "The printed line",
    note: "Bows and horse behind, foot screening in front — the shape of the printed army.",
    back: MISSILE_HORSE, backCols: CENTRE_OUT, frontCols: CENTRE_OUT, kingCol: 4 },

  { key: "screen", grade: 3, name: "Archer screen",
    note: "Every bow directly behind a body, shooting over its own front rank.",
    back: ["archer"], backCols: CENTRE_OUT, frontCols: CENTRE_OUT, kingCol: 4 },

  { key: "refusedLeft", grade: 2, name: "Refused left",
    note: "The whole line shifted right, leaving a flank to be turned rather than held.",
    back: MISSILE_HORSE, backCols: RIGHT_HALF, frontCols: RIGHT_HALF, kingCol: 6 },

  { key: "refusedRight", grade: 2, name: "Refused right",
    note: "The mirror: weight on the left, the right flank given away on purpose.",
    back: MISSILE_HORSE, backCols: LEFT_HALF, frontCols: LEFT_HALF, kingCol: 2 },

  { key: "vanguard", grade: 2, name: "Vanguard",
    note: "Horse and shields forward together, the rest massed behind. Contact comes early, and on your terms.",
    /* Horse ALONE was the first cut, and a muster that rolled one Knight base
       put a single rider out in front of the army to die. The shock units
       lead as a group instead, so the shape holds however the horse came
       out: every bot muster fields two or three bases here. */
    back: ["archer", "infantry", "peasant", "mercenary"], front: ["knight", "heavy"],
    backCols: CENTRE_OUT, frontCols: CENTRE_OUT, kingCol: 4 },

  { key: "forward", grade: 2, name: "Everything forward",
    note: "One rank, as far up as the rules allow, and nothing held back.",
    back: [], backCols: CENTRE_OUT, frontCols: CENTRE_OUT, kingCol: 4 },

  { key: "wide", grade: 1, name: "Wide wings",
    note: "Filled from the edges in. Threatens both flanks and holds neither.",
    back: MISSILE_HORSE, backCols: EDGE_IN, frontCols: EDGE_IN, kingCol: 4 },

  { key: "deep", grade: 1, name: "Held back",
    note: "The back rank first. Slow to arrive, and the front rank goes hungry.",
    back: MISSILE_HORSE.concat(FOOT), backCols: CENTRE_OUT, frontCols: CENTRE_OUT, kingCol: 4 },
];

function openingByKey(key) {
  return OPENINGS.find(o => o.key === key) || OPENINGS[0];
}

/* The King takes its square first -- the printed emblem, or the opening's
   own preference when the free-King house rule is on -- and everything else
   fills its preferred rank, overflowing to the other. */
function placeArmy(side, list, opening) {
  const op = opening || OPENINGS[0];
  const back = side === 0 ? H - 1 : 0;
  const front = side === 0 ? H - 2 : 1;
  const king = list.find(u => u.type === "king");
  const rest = list.filter(u => u !== king);

  const anchored = !(G && G.cfg) || G.cfg.anchorKing !== false;
  const kingCol = anchored ? 4 : (op.kingCol == null ? 4 : op.kingCol);

  const free = {
    [back]: (op.backCols || CENTRE_OUT).filter(c => c !== kingCol),
    [front]: (op.frontCols || CENTRE_OUT).slice(),
  };
  const out = king ? [{ unit: king, c: kingCol, r: back }] : [];

  const take = (u, first, second) => {
    const row = free[first].length ? first : second;
    const c = free[row].shift();
    if (c === undefined) return false;
    out.push({ unit: u, c, r: row });
    return true;
  };
  /* Rank preference: `front` wins over `back`, and also takes the front
     rank's best columns before anything else does -- which is what makes a
     vanguard a vanguard rather than the same line with the bows moved. */
  const leads = op.front || [];
  const wantsBack = u => leads.includes(u.type) ? false : (op.back || []).includes(u.type);
  const ahead = rest.filter(u => !wantsBack(u));
  for (const u of rest.filter(wantsBack)) take(u, back, front);
  for (const u of ahead.filter(u => leads.includes(u.type))) take(u, front, back);
  for (const u of ahead.filter(u => !leads.includes(u.type))) take(u, front, back);
  return out;
}

function deployFromSpec(side, spec, opening) {
  const face = side === 0 ? N : S;
  for (const p of placeArmy(side, unitsFromSpec(side, spec), opening)) {
    G.units.push(makeUnit(side, p.unit.type, p.unit.figs, p.c, p.r, face));
  }
}

/* The bot's muster. Deterministic from the seed so a game replays, and it
   never produces an illegal army -- validateArmy() gates every candidate. */
function botMuster(side, pickSeed) {
  const candidates = [
    /* Mixed host: the printed basics stiffened with a Heavy Infantry pair. */
    { knight: { bases: 2, figs: 2 }, archer: { bases: 2, figs: 4 },
      infantry: { bases: 3, figs: 4 }, heavy: { bases: 1, figs: 2 },
      peasant: { bases: 1, figs: 4 }, mercenary: { bases: 0, figs: 0 } },
    /* Shield line: both Heavy bases, bows behind. */
    { knight: { bases: 1, figs: 2 }, archer: { bases: 2, figs: 4 },
      infantry: { bases: 3, figs: 4 }, heavy: { bases: 2, figs: 1 },
      peasant: { bases: 1, figs: 4 }, mercenary: { bases: 0, figs: 0 } },
    /* Free company: mercenaries and a screen of peasants. */
    { knight: { bases: 2, figs: 2 }, archer: { bases: 1, figs: 4 },
      infantry: { bases: 3, figs: 4 }, heavy: { bases: 0, figs: 0 },
      peasant: { bases: 2, figs: 2 }, mercenary: { bases: 1, figs: 2 } },
    /* The printed basic army, unchanged. */
    basicSpec(),
  ];
  const legal = candidates.filter(c => validateArmy(c, G.cfg) === null);
  const pool = legal.length ? legal : [basicSpec()];
  return pool[(pickSeed >>> 0) % pool.length];
}

/* ============================================================
   MUSTER SCREEN
   Renders itself from UNIT_DEFS and CUSTOM_BASE_CAPS, so
   changing a printed number changes the screen with no edit
   here. The confirm button is never silently dead: when the
   muster is illegal it shows the validator's own sentence.
   ============================================================ */

function openMuster(side) {
  UI.musterOpen = true;
  UI.musterSide = side;
  UI.muster = basicSpec();
  UI.curtain = false;
  updateAll();
}

function musterAdjust(type, field, delta) {
  const e = UI.muster[type];
  const d = UNIT_DEFS[type];
  if (field === "bases") {
    e.bases = Math.max(0, Math.min(BASES_TOTAL - 1, e.bases + delta));
    if (e.bases > 0 && e.figs < 1) e.figs = Math.min(perBaseOf(type, UI.houseRules), d.perPlayer);
    if (e.bases === 0) e.figs = 0;
  } else {
    e.figs = Math.max(0, Math.min(perBaseOf(type, UI.houseRules), e.figs + delta));
    if (e.figs > 0 && e.bases < 1) e.bases = 1;
  }
  updateAll();
}

function musterConfirm() {
  if (validateArmy(UI.muster, UI.houseRules)) return;
  UI.musterSpecs = UI.musterSpecs || {};
  UI.musterSpecs[UI.musterSide] = JSON.parse(JSON.stringify(UI.muster));

  /* Hot-seat: the second player musters in secret behind the curtain, which
     is the digital stand-in for the rulebook's upright game box. */
  const other = 1 - UI.musterSide;
  if (UI.pendingOpponent === "hotseat" && !UI.musterSpecs[other]) {
    UI.musterSide = other;
    UI.muster = basicSpec();
    UI.curtain = true;
    UI.curtainThen = "muster";
    updateAll();
    return;
  }

  const specs = { 0: UI.musterSpecs[0], 1: UI.musterSpecs[1] || null };
  UI.musterOpen = false;
  UI.musterSpecs = null;
  clearSave();
  startGame(undefined, Object.assign(houseRulesToCfg(UI.houseRules || defaultHouseRules()),
    fortuneToCfg(UI.pendingFortune),
    { setup: "custom", opponent: UI.pendingOpponent || "ai", specs }));
}

function renderMuster() {
  const el = document.getElementById("muster");
  if (!UI.musterOpen || UI.curtain) { el.hidden = true; return; }
  el.hidden = false;

  const spec = UI.muster;
  const rows = MUSTER_ORDER.map(t => {
    const d = UNIT_DEFS[t], e = spec[t];
    const used = e.bases * e.figs;
    const cap = CUSTOM_BASE_CAPS[t];
    const over = used > d.perPlayer || e.figs > perBaseOf(t, UI.houseRules) || (cap !== undefined && e.bases > cap);
    return `<tr class="${over ? "bad" : ""}">
      <th scope="row">${esc(d.name)}${cap !== undefined ? `<span class="cap"> max ${cap} base${cap === 1 ? "" : "s"}</span>` : ""}</th>
      <td class="step">
        <span class="sbtn" data-act="musterBases" data-type="${t}" data-delta="-1" role="button" tabindex="0" aria-label="One fewer ${esc(d.name)} base">&minus;</span>
        <b aria-label="${e.bases} ${esc(d.name)} bases">${e.bases}</b>
        <span class="sbtn" data-act="musterBases" data-type="${t}" data-delta="1" role="button" tabindex="0" aria-label="One more ${esc(d.name)} base">+</span>
      </td>
      <td class="step">
        <span class="sbtn" data-act="musterFigs" data-type="${t}" data-delta="-1" role="button" tabindex="0" aria-label="One fewer ${esc(d.name)} per base">&minus;</span>
        <b aria-label="${e.figs} per base">${e.figs}</b>
        <span class="sbtn" data-act="musterFigs" data-type="${t}" data-delta="1" role="button" tabindex="0" aria-label="One more ${esc(d.name)} per base">+</span>
      </td>
      <td class="pool">${used} of ${d.perPlayer}</td>
    </tr>`;
  }).join("");

  const why = validateArmy(spec, UI.houseRules);
  const n = specBases(spec);

  el.innerHTML = `<div class="box muster-card">
    <span class="box-label">Muster &mdash; <span class="side s${UI.musterSide}">${esc((G && G.players ? G.players[UI.musterSide].name : UI.musterSide === 0 ? "Green" : "Gold"))}</span></span>
    <p class="dim">Ten bases take the field.
      Leave it as it stands for the printed army, or muster your own.</p>
    <table class="muster">
      <thead><tr><th scope="col">Warrior</th><th scope="col">Bases</th><th scope="col">Per base</th><th scope="col">Figures</th></tr></thead>
      <tbody>
        <tr class="locked"><th scope="row">King</th><td class="step"><b>1</b></td><td class="step"><b>1</b></td><td class="pool">1 of 1</td></tr>
        ${rows}
      </tbody>
    </table>
    <p class="tally">Bases <b class="${n === BASES_TOTAL ? "ok" : "bad"}">${n}</b> of ${BASES_TOTAL}
       &middot; ${specFigures(spec)} warriors</p>
    <p class="why" role="status">${why ? esc(why) : "Ready."}</p>
    <div class="muster-actions">
      <button class="btn" data-act="musterPreset">Basic army</button>
      <button class="btn btn-go" data-act="musterConfirm" ${why ? "disabled" : ""}>Take the field</button>
    </div>
  </div>`;
}

/* ============================================================
   DICE — drawn as paths on a 24x24 box, never as text, because
   no font is loaded and a die face must not depend on one.
   ============================================================ */
const DIE_GLYPH = {
  0: "M6 4c4-2 8-1 10 2l-3 3-2-2-5 3zM13 9l-8 9 2 2 9-8z",              /* battle-axe   */
  1: "M3 19L19 5M15 5h4v4M5 21l-2-2M3 5l16 14M5 3h4M3 5v4",             /* crossed arrows */
  2: "M6 3h12l-3 5 3 5-12 1 2-6zM6 3v18",                               /* torn banner  */
};
const DIE_NAME = { 0: "battle-axe", 1: "arrows", 2: "PANIC" };
const DIE_CLASS = { 0: "f-axe", 1: "f-arrow", 2: "f-panic" };

/* ============================================================
   FLIP
   updateAll() replaces the grid wholesale, so without this a
   unit teleports. Snapshot the rects before the rebuild, invert
   afterwards, release. The panic cascade is staggered off the
   retreat trace so it reads as a chain rather than one jump.
   ============================================================ */
function snapshotRects() {
  if (UI.reducedMotion) { UI.rects = null; return; }
  UI.rects = {};
  for (const el of document.querySelectorAll("#grid .u[data-uid]")) {
    const b = el.querySelector(".base");
    UI.rects[el.dataset.uid] = {
      rect: el.getBoundingClientRect(), html: el.outerHTML,
      angle: b ? (parseFloat(b.style.transform.replace(/[^-\d.]/g, "")) || 0) : 0,
    };
  }
}

function playFlip() {
  const prev = UI.rects;
  UI.rects = null;
  if (!prev || UI.reducedMotion) return;

  /* Each link of a cascade starts a little after the one before it. */
  const delay = {};
  const trace = (G.dice && G.dice.retreats) || [];
  trace.forEach((step, i) => { if (delay[step.uid] === undefined) delay[step.uid] = i * 70; });

  const seen = new Set();
  const grid = document.getElementById("grid");
  for (const el of grid.querySelectorAll(".u[data-uid]")) {
    const uid = el.dataset.uid;
    seen.add(uid);
    const was = prev[uid];
    if (!was) continue;
    const now = el.getBoundingClientRect();
    const dx = was.rect.left - now.left, dy = was.rect.top - now.top;
    const base = el.querySelector(".base");
    const toAngle = base ? (parseFloat(base.style.transform.replace(/[^-\d.]/g, "")) || 0) : 0;
    const spun = base && Math.abs(toAngle - was.angle) > 0.5;
    if (!dx && !dy && !spun) continue;

    const sf = UI.speedFactor == null ? 1 : UI.speedFactor;
    const d = (delay[uid] || 0) * sf;
    const ms = Math.round(240 * (sf || 1));

    if (dx || dy) {
      el.style.transition = "none";
      el.style.transform = `translate(${dx}px, ${dy}px)`;
    }
    /* The selected unit's turn handles ride the same angle, so they swing
       with the plate rather than jumping to the new corners. */
    const rots = el.querySelector(".rots");
    if (spun) {
      base.style.transition = "none";
      base.style.transform = `rotate(${was.angle}deg)`;
      if (rots) { rots.style.transition = "none"; rots.style.transform = `rotate(${was.angle}deg)`; }
    }
    requestAnimationFrame(() => {
      if (dx || dy) {
        el.style.transition = `transform ${ms}ms var(--ease-out-quart) ${Math.round(d)}ms`;
        el.style.transform = "";
      }
      if (spun) {
        /* A shade longer than the slide: a piece swinging round reads better
           slightly behind the piece travelling. */
        const spin = `transform ${Math.round(ms * 1.25)}ms var(--ease-out-expo) ${Math.round(d)}ms`;
        base.style.transition = spin;
        base.style.transform = `rotate(${toAngle}deg)`;
        if (rots) { rots.style.transition = spin; rots.style.transform = `rotate(${toAngle}deg)`; }
      }
    });
  }

  /* A CASUALTY leaves a ghost where it fell. A unit that is simply absent
     from G -- because the board was replaced by a new game, a muster or an
     undo -- is not a casualty, and ghosting it showers the screen with the
     previous army. A dead unit stays in G.units with alive:false, which is
     exactly what distinguishes the two. */
  for (const uid in prev) {
    if (seen.has(uid)) continue;
    const gone = byUid(G, +uid);
    if (!gone || gone.alive) continue;
    const g = document.createElement("div");
    g.className = "ghost";
    g.innerHTML = prev[uid].html;
    g.style.left = prev[uid].rect.left + "px";
    g.style.top = prev[uid].rect.top + "px";
    g.style.width = prev[uid].rect.width + "px";
    g.style.height = prev[uid].rect.height + "px";
    document.body.appendChild(g);
    setTimeout(() => g.remove(), 700);
  }
}

/* ============================================================
   AUDIO — synthesised on the fly. No files, because the game
   ships as one HTML document with no external assets at all.
   ============================================================ */
let AC = null;
function audioCtx() {
  if (AC === null) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { AC = false; }
  }
  return AC || null;
}

function tone(freq, dur, type, gain, delay) {
  const ac = audioCtx();
  if (!ac) return;
  const t0 = ac.currentTime + (delay || 0);
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = type || "square";
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(ac.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}

function clatter(dur, gain, delay) {
  const ac = audioCtx();
  if (!ac) return;
  const t0 = ac.currentTime + (delay || 0);
  const n = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  src.buffer = buf; f.type = "bandpass"; f.frequency.value = 1800;
  g.gain.setValueAtTime(gain, t0);
  src.connect(f).connect(g).connect(ac.destination);
  src.start(t0);
}

const SFX = {
  select: () => tone(520, 0.05, "square", 0.04),
  move:   () => tone(300, 0.07, "triangle", 0.05),
  turn:   () => tone(220, 0.05, "square", 0.03),
  dice:   () => { clatter(0.16, 0.06); clatter(0.12, 0.04, 0.07); },
  tick:   () => { clatter(0.05, 0.05); tone(760, 0.035, "square", 0.025); },
  hit:    () => { tone(180, 0.09, "sawtooth", 0.07); clatter(0.07, 0.05); },
  kill:   () => { tone(140, 0.22, "sawtooth", 0.08); tone(70, 0.3, "square", 0.05, 0.05); },
  panic:  () => { tone(420, 0.1, "sine", 0.05); tone(300, 0.12, "sine", 0.05, 0.08); tone(200, 0.16, "sine", 0.05, 0.17); },
  victory: () => [0, 0.12, 0.24, 0.42].forEach((d, i) => tone([392, 523, 659, 784][i], 0.3, "triangle", 0.06, d)),
};

function sfx(name) {
  if (UI.muted) return;
  const fn = SFX[name];
  if (fn) { try { fn(); } catch (e) { /* audio is a nicety, never a failure */ } }
}

/* ============================================================
   SPEED & MUTE — both persisted, both reflected in the HUD.
   ============================================================ */
const SPEED_FACTOR = { 1: 1, 2: 0.35, 3: 0 };
const SPEED_NAME = { 1: "Measured", 2: "Brisk", 3: "Instant" };

function applySpeed() { UI.speedFactor = SPEED_FACTOR[UI.speed] != null ? SPEED_FACTOR[UI.speed] : 1; }

function cycleSpeed() {
  UI.speed = (UI.speed % 3) + 1;
  applySpeed();
  try { localStorage.setItem(SPEED_KEY, String(UI.speed)); } catch (e) {}
  announce("Speed: " + SPEED_NAME[UI.speed]);
  updateAll();
}

function toggleMute() {
  UI.muted = !UI.muted;
  try { localStorage.setItem(MUTED_KEY, UI.muted ? "1" : "0"); } catch (e) {}
  announce(UI.muted ? "Muted." : "Sound on.");
  if (!UI.muted) sfx("select");
  updateAll();
}

function loadPrefs() {
  try {
    UI.muted = localStorage.getItem(MUTED_KEY) === "1";
    const sp = parseInt(localStorage.getItem(SPEED_KEY) || "1", 10);
    UI.speed = (sp >= 1 && sp <= 3) ? sp : 1;
  } catch (e) { UI.muted = false; UI.speed = 1; }
  applySpeed();
}

/* ============================================================
   HOUSE RULES
   Each carries its provenance, because "optional rule" and "we
   invented this" are not the same claim. Everything is off by
   default, so the shipped defaults are the printed game.
   ============================================================ */
/* Shown in the menu. The 60-round limit is deliberately NOT here: it is not a
   printed rule at all, it exists only so headless simulations terminate, and
   offering it as a choice invites someone to switch on a rule the game does
   not have. The flag stays in cfg for runSim to set. */
/* Off is the printed game -- the rulebook as written, and where it is silent,
   the most literal reading of what it does say. Every switch here is an
   override: three of ours, and one the rulebook supplies itself. None of them
   is on unless you turn it on, so what ships is Larry Harris's game. */
const HOUSE_RULES = [
  { key: "massiveInfantry", name: "Massive Infantry",
    source: "The rulebook's own option, p.8",
    note: "All 20 Infantry a side, up to 10 on a base, never more than 4 dice. Printed as an option rather than a rule: “if both players agree.”" },
  { key: "partialBases", name: "Bases may be under-filled",
    source: "Our house rule",
    note: "As printed, a base carries its full count. The p.8 table writes “1 or 2” for Heavy Infantry and “up to 4” for Peasants and a bare number for everyone else, and p.6 repeats it: “Put 2 on a base” for Mercenaries. A base holds fewer only once it has taken casualties. This lets you field a 3-man Infantry base or a lone Knight from the start." },
  { key: "freeKing", name: "The King deploys freely",
    source: "Our house rule",
    note: "As printed, p.6: “Your King must start on the royal emblem in the back row”, and nothing may swap onto that square. This frees it to go anywhere on your two ranks like every other base." },
  { key: "peasantDuel", name: "Lone Peasants get the re-roll",
    source: "Our house rule",
    note: "The re-roll that lets a single figure hurt armour is printed for Infantry and Archers and never mentioned for Peasants. This extends it to them, since one die can otherwise never score the two hits armour needs." },
];

function defaultHouseRules() {
  return { massiveInfantry: false, partialBases: false, freeKing: false,
           peasantDuel: false, useRoundCap: false };
}
/* The engine keeps its own polarity -- noPeasantDuel and anchorKing describe
   restrictions, which is what the rules functions want to ask about. This is
   the one place the two vocabularies meet. */
function houseRulesToCfg(hr) {
  return { massiveInfantry: !!hr.massiveInfantry,
           partialBases: !!hr.partialBases,
           noPeasantDuel: !hr.peasantDuel,
           anchorKing: !hr.freeKing,
           roundCap: hr.useRoundCap ? 60 : 0 };
}
